# Publishes the site/ folder to GitHub Pages on every push to main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # a Fazenda Joli Pig é um PWA: o marcador de versão no jogo e no service worker vira o resumo dos arquivos do jogo,
      # para o celular baixar a versão nova (e oferecer atualizar) só quando o jogo muda
      - name: Marcar a versão da Fazenda Joli Pig
        run: |
          d=site/jogos/fazenda-joli-pig
          v=$(cat "$d/index.html" "$d/sw.js" "$d/manifest.webmanifest" | sha256sum | cut -c1-10)
          sed -i "s/__VERSAO__/$v/g" "$d/index.html" "$d/sw.js"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
