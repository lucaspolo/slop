  }

  // ---------- Cena ----------
  const canvas = $('cena');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const cena = new THREE.Scene();

  const camPlanta = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 600);
  camPlanta.up.set(0, 0, -1);
  camPlanta.position.set(0, 200, 0);
  const cam3d = new THREE.PerspectiveCamera(40, 1, 0.1, 3000);
  cam3d.position.set(-8, 14, 24);

  const ctlPlanta = new THREE.OrbitControls(camPlanta, canvas);
  ctlPlanta.enableRotate = false;
  ctlPlanta.screenSpacePanning = true;
  ctlPlanta.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
  ctlPlanta.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
  ctlPlanta.minZoom = 0.08; ctlPlanta.maxZoom = 20;
  const ctl3d = new THREE.OrbitControls(cam3d, canvas);
  ctl3d.maxPolarAngle = Math.PI / 2 - 0.02;
  ctl3d.minDistance = 2; ctl3d.maxDistance = 400;
  ctl3d.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
  ctl3d.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  const cam = () => (est.vista === 'planta' ? camPlanta : cam3d);
  const ctl = () => (est.vista === 'planta' ? ctlPlanta : ctl3d);

  // céu: degradê que acompanha a altura do sol
  const ceuMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      topo: { value: new THREE.Color('#3f86d8') }, horiz: { value: new THREE.Color('#cfe5f5') },
      solDir: { value: new THREE.Vector3(0, 1, 0) }, solCor: { value: new THREE.Color('#fff2d0') },
    },
    vertexShader: 'varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      'uniform vec3 topo; uniform vec3 horiz; uniform vec3 solDir; uniform vec3 solCor; varying vec3 vDir;',
      'void main() {',
      '  vec3 d = normalize(vDir); float h = max(d.y, 0.0);',
      '  vec3 c = mix(horiz, topo, pow(h, 0.55));',
      '  if (d.y < 0.0) c = horiz * 0.8;',
      '  float s = max(dot(d, normalize(solDir)), 0.0);',
      '  c += solCor * (pow(s, 900.0) * 2.0 + pow(s, 14.0) * 0.22);',
      '  gl_FragColor = vec4(c, 1.0);',
      '  #include <tonemapping_fragment>',
      '  #include <encodings_fragment>',
      '}',
    ].join('\n'),
  });
  const ceu = new THREE.Mesh(new THREE.SphereGeometry(1400, 32, 16), ceuMat);
  ceu.renderOrder = -1;
  cena.add(ceu);

  const hemi = new THREE.HemisphereLight(0xdcebff, 0x8c8a6e, 0.55);
  const sol = new THREE.DirectionalLight(0xfff3df, 1.8);
  sol.castShadow = true;
  const tamSombra = toque ? 2048 : 4096;
  sol.shadow.mapSize.set(Math.min(tamSombra, renderer.capabilities.maxTextureSize), Math.min(tamSombra, renderer.capabilities.maxTextureSize));
  sol.shadow.bias = -0.0003;
  sol.shadow.normalBias = 0.03;
  cena.add(hemi, sol, sol.target);

  const chao = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: '#b7c69c', roughness: 1 }));
  chao.receiveShadow = true;
  cena.add(chao);

  const grade = (() => {
    const pos1 = [], pos5 = [], N = 60;
    for (let i = -N; i <= N; i++) {
      const alvo = i % 5 === 0 ? pos5 : pos1;
      alvo.push(i, 0, -N, i, 0, N, -N, 0, i, N, 0, i);
    }
    const g = new THREE.Group();
    const linhas = (pos, op) => {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: '#4d5a3f', transparent: true, opacity: op, depthWrite: false }));
    };
    g.add(linhas(pos1, 0.10), linhas(pos5, 0.22));
    g.position.y = 0.004;
    g.renderOrder = 1;
    cena.add(g);
    return g;
  })();

  const grpCasa = new THREE.Group(), grpPlanta = new THREE.Group(), grpSobre = new THREE.Group(), grpSol = new THREE.Group();
  cena.add(grpCasa, grpPlanta, grpSobre, grpSol);

  const MAT = {
    patio: new THREE.MeshStandardMaterial({ color: '#cbc5b8', roughness: 0.95 }),
    caixilho: new THREE.MeshStandardMaterial({ color: '#3a3e44', roughness: 0.55 }),
    folha: new THREE.MeshStandardMaterial({ color: '#9b6b45', roughness: 0.7 }),
    brise: new THREE.MeshStandardMaterial({ color: '#d9d6cf', roughness: 0.9 }),
    tronco: new THREE.MeshStandardMaterial({ color: '#7a5638', roughness: 0.9 }),
    copa: new THREE.MeshStandardMaterial({ color: '#5d8e43', roughness: 0.9, flatShading: true }),
    fantasma: new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false }),
    contorno: new THREE.LineBasicMaterial({ color: '#2b2f36', transparent: true, opacity: 0.6 }),
    beiral: new THREE.LineDashedMaterial({ color: '#2b2f36', dashSize: 0.25, gapSize: 0.18, transparent: true, opacity: 0.55 }),
    marcaVidro: new THREE.MeshBasicMaterial({ color: '#3d9be0' }),
    marcaPorta: new THREE.MeshBasicMaterial({ color: '#9b6b45' }),
    divisa: new THREE.MeshBasicMaterial({ color: '#7b4fd0' }),
    // o medidor não pega luz da cena, para aparecer também no escuro
    medidorCorpo: new THREE.MeshBasicMaterial({ color: '#1d2128' }),
    medidorSensor: new THREE.MeshBasicMaterial({ color: '#ffd45a' }),
  };
  const cacheMat = new Map();
  function matCor(hex, extra) {
    const k = hex + JSON.stringify(extra || {});
    if (!cacheMat.has(k)) cacheMat.set(k, new THREE.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.92 }, extra || {})));
    return cacheMat.get(k);
  }
  function matVidro(id) {
    const v = S.MATERIAIS[id] || S.MATERIAIS['vidro-simples'];
    return matCor(v.cor, { transparent: true, opacity: 0.3, roughness: 0.08, metalness: 0.1, depthWrite: false, side: THREE.DoubleSide });
  }

  function limpar(grupo) {
    grupo.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    while (grupo.children.length) grupo.remove(grupo.children[0]);
  }

  // ---------- Construção da casa ----------
  let telhados = [];
  let limites = { cx: 0, cz: 0, r: 8, rc: 6 };

  function quadro(w) {
    const L = S.dist(w.a, w.b), dx = (w.b[0] - w.a[0]) / L, dz = (w.b[1] - w.a[1]) / L;
    return { L, dx, dz, nx: -dz, nz: dx, ang: Math.atan2(dz, dx) };
  }

  function caixa(pai, sx, sy, sz, x, y, z, mat, dados, sombra) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
    m.position.set(x, y, z);
    m.castShadow = sombra !== false; m.receiveShadow = true;
    if (dados) m.userData = dados;
    pai.add(m);
    return m;
  }

  // o piso de um cômodo, deitado no chão, com os furos dos pátios
  function geoComodo(c) {
    const forma = new THREE.Shape(c.pontos.map((p) => new THREE.Vector2(p[0], -p[1])));
    for (const f of c.furos) forma.holes.push(new THREE.Path(f.map((p) => new THREE.Vector2(p[0], -p[1]))));
    return new THREE.ShapeGeometry(forma).rotateX(-Math.PI / 2);
  }

  function construir() {
    limpar(grpCasa); limpar(grpPlanta);
    telhados = [];
    const m = est.modelo, d = est.der;
    let xmin = Infinity, xmax = -Infinity, zmin = Infinity, zmax = -Infinity;
    const cresce = (x, z, r) => { xmin = Math.min(xmin, x - r); xmax = Math.max(xmax, x + r); zmin = Math.min(zmin, z - r); zmax = Math.max(zmax, z + r); };
    let casaR = null;

    for (const w of m.paredes) {
      const q = quadro(w), [e0, e1] = d.extensoes[w.id];
      const dados = { tipo: 'parede', id: w.id };
      const g = new THREE.Group();
      g.position.set(w.a[0], 0, w.a[1]);
      g.rotation.y = -q.ang;
      if (S.ehDivisa(w)) {
        // a divisa é só uma faixa fina no chão; a caixa invisível em volta dá onde clicar no 3D
        const faixa = new THREE.Mesh(new THREE.PlaneGeometry(q.L, 0.07).rotateX(-Math.PI / 2), MAT.divisa);
        faixa.position.set(q.L / 2, 0.026, 0);
        faixa.userData = dados;
        g.add(faixa);
        caixa(g, q.L, 0.06, 0.3, q.L / 2, 0.03, 0, MAT.fantasma, dados, false);
        grpCasa.add(g);
        cresce(w.a[0], w.a[1], 0); cresce(w.b[0], w.b[1], 0);
        continue;
      }
      const mat = matCor((S.CORES[w.cor] || S.CORES.branco).hex);
      const abs = m.aberturas.filter((ab) => ab.parede === w.id);
      for (const pc of S.pecasParede(q.L, w.alt, e0, e1, abs)) {
        caixa(g, pc.u1 - pc.u0, pc.v1 - pc.v0, w.esp, (pc.u0 + pc.u1) / 2, (pc.v0 + pc.v1) / 2, 0, mat, dados);
      }
      // contorno do topo, que na planta desenha a parede
      const y = w.alt + 0.003, h = w.esp / 2;
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-e0, y, -h), new THREE.Vector3(q.L + e1, y, -h), new THREE.Vector3(q.L + e1, y, h), new THREE.Vector3(-e0, y, h),
      ]);
      g.add(new THREE.LineLoop(geo, MAT.contorno));
      for (const ab of abs) construirAbertura(g, w, ab, d.lados[w.id]);
      grpCasa.add(g);
      cresce(w.a[0], w.a[1], 0); cresce(w.b[0], w.b[1], 0);
    }

    for (const c of d.comodos) {
      const piso = new THREE.Mesh(geoComodo(c), c.coberto ? matCor(S.PISOS[c.piso].hex, { roughness: 0.85 }) : MAT.patio);
      piso.position.y = 0.01;
      piso.receiveShadow = true;
      piso.userData = { tipo: 'comodo', ponto: c.centro };
      grpCasa.add(piso);
    }

    // a mesma laje serve ao desenho e à conta de luz
    luz.cob = S.cobertura(m, d, ClipperLib);
    if (luz.cob) {
      const cob = m.cobertura, H = luz.cob.H;
      const corTeto = (S.MATERIAIS[cob.mat] || S.MATERIAIS['laje-concreto']).cor;
      for (const pg of luz.cob.poligonos) {
        const forma = new THREE.Shape(pg.contorno.map((p) => new THREE.Vector2(p[0], p[1])));
        for (const f of pg.furos) forma.holes.push(new THREE.Path(f.map((p) => new THREE.Vector2(p[0], p[1]))));
        const geo = new THREE.ExtrudeGeometry(forma, { depth: cob.esp, bevelEnabled: false }).rotateX(Math.PI / 2);
        const teto = new THREE.Mesh(geo, matCor(corTeto));
        teto.position.y = H + cob.esp;
        teto.castShadow = true; teto.receiveShadow = true;
        teto.userData = { tipo: 'teto', corReal: teto.material };
        telhados.push(teto);
        grpCasa.add(teto);
        // contorno tracejado do beiral, para a planta
        for (const anel of [pg.contorno].concat(pg.furos)) {
          const pts = anel.concat([anel[0]]).map((p) => new THREE.Vector3(p[0], H + cob.esp + 0.004, p[1]));
          const linha = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), MAT.beiral);
          linha.computeLineDistances();
          grpPlanta.add(linha);
        }
        for (const p of pg.contorno) cresce(p[0], p[1], 0);
      }
    }

    if (xmin !== Infinity) casaR = { cx: (xmin + xmax) / 2, cz: (zmin + zmax) / 2, r: Math.hypot(xmax - xmin, zmax - zmin) / 2 };
    for (const t of m.arvores) {
      const g = new THREE.Group();
      g.position.set(t.pos[0], 0, t.pos[1]);
      const dados = { tipo: 'arvore', id: t.id }, f = S.formaArvore(t);
      const tronco = new THREE.Mesh(new THREE.CylinderGeometry(f.tronco.r1, f.tronco.r0, f.tronco.alt, 8), MAT.tronco);
      tronco.position.y = f.tronco.alt / 2;
      const copa = new THREE.Mesh(new THREE.IcosahedronGeometry(f.copa.r, 1), MAT.copa);
      copa.scale.y = f.copa.achat;
      copa.position.y = f.copa.y;
      for (const o of [tronco, copa]) { o.castShadow = true; o.receiveShadow = true; o.userData = dados; g.add(o); }
      grpCasa.add(g);
      cresce(t.pos[0], t.pos[1], t.copa);
    }

    // medidores de luz: uma haste com o sensor em cima. Não fazem sombra nem entram na conta de luz
    for (const md of m.medidores) {
      const g = new THREE.Group(), dados = { tipo: 'medidor', id: md.id };
      g.position.set(md.pos[0], 0, md.pos[1]);
      const peca = (geo, mat, y) => { const o = new THREE.Mesh(geo, mat); o.position.y = y; o.userData = dados; g.add(o); };
      if (md.alt > 0.03) peca(new THREE.CylinderGeometry(0.012, 0.012, md.alt, 6), MAT.medidorCorpo, md.alt / 2);
      peca(new THREE.CylinderGeometry(0.11, 0.11, 0.03, 24), MAT.medidorCorpo, md.alt + 0.015);
      peca(new THREE.CylinderGeometry(0.07, 0.07, 0.034, 24), MAT.medidorSensor, md.alt + 0.017);
      // volume invisível em volta, para o clique no 3D não precisar acertar a haste
      peca(new THREE.CylinderGeometry(0.2, 0.2, md.alt + 0.2, 10), MAT.fantasma, (md.alt + 0.2) / 2);
      grpCasa.add(g);
    }
    luz.prep = null; luz.suja = true;
    reiniciarMapa();

    if (xmin === Infinity) limites = { cx: 0, cz: 0, r: 8, rc: 6, ccx: 0, ccz: 0 };
    else {
      limites = { cx: (xmin + xmax) / 2, cz: (zmin + zmax) / 2, r: Math.max(6, Math.hypot(xmax - xmin, zmax - zmin) / 2) };
      // a casa sem as árvores: centro e raio da rosa dos ventos e do enquadramento
      const cr = casaR || { cx: limites.cx, cz: limites.cz, r: 5 };
      limites.ccx = cr.cx; limites.ccz = cr.cz; limites.rc = Math.max(5, cr.r);
    }
    aplicarVisibilidade();
    construirSol();
    destacar();
    pedir();
  }

  function construirAbertura(g, w, ab, lado) {
    const tipo = S.TIPOS_ABERTURA[ab.tipo] || S.TIPOS_ABERTURA.janela;
    const dados = { tipo: 'abertura', id: ab.id };
    const u = ab.pos, v0 = ab.peitoril, v1 = ab.peitoril + ab.alt, f = S.CAIXILHO;
    const prof = S.profCaixilho(w.esp);
    caixa(g, ab.larg, f, prof, u, v1 - f / 2, 0, MAT.caixilho, dados);
    if (v0 > 0.001) caixa(g, ab.larg, f, prof, u, v0 + f / 2, 0, MAT.caixilho, dados);
    caixa(g, f, ab.alt, prof, u - ab.larg / 2 + f / 2, v0 + ab.alt / 2, 0, MAT.caixilho, dados);
    caixa(g, f, ab.alt, prof, u + ab.larg / 2 - f / 2, v0 + ab.alt / 2, 0, MAT.caixilho, dados);
    const vaoAlt = ab.alt - f - (v0 > 0.001 ? f : 0), vaoY = (v0 > 0.001 ? v0 + f : v0) + vaoAlt / 2;
    if (tipo.vidro) {
      const vidro = new THREE.Mesh(new THREE.PlaneGeometry(ab.larg - 2 * f, vaoAlt), matVidro(ab.vidro));
      vidro.position.set(u, vaoY, 0);
      vidro.castShadow = false; vidro.receiveShadow = false;
      vidro.userData = dados;
      g.add(vidro);
      if (ab.larg > 1.05) caixa(g, S.MONTANTE_VIDRO, vaoAlt, prof * 0.8, u, vaoY, 0, MAT.caixilho, dados);
    } else {
      caixa(g, ab.larg - 2 * f, vaoAlt, 0.04, u, vaoY, 0, MAT.folha, dados);
    }
    const aba = S.caixaAba(ab, w.esp, lado);
    if (aba) caixa(g, aba.u1 - aba.u0, aba.v1 - aba.v0, aba.n1 - aba.n0, (aba.u0 + aba.u1) / 2, (aba.v0 + aba.v1) / 2, (aba.n0 + aba.n1) / 2, MAT.brise, dados);
    // marca na planta: a abertura aparece como uma faixa colorida em cima da parede
    const marca = new THREE.Mesh(new THREE.PlaneGeometry(ab.larg, w.esp * 0.55).rotateX(-Math.PI / 2), tipo.vidro ? MAT.marcaVidro : MAT.marcaPorta);
    marca.position.set(u, w.alt + 0.006, 0);
    marca.userData = dados;
    const pl = new THREE.Group();
    pl.position.copy(g.position); pl.rotation.copy(g.rotation);
    pl.add(marca);
    grpPlanta.add(pl);
  }

  function aplicarVisibilidade() {
    const fantasma = est.verDentro;
    for (const t of telhados) {
      t.material = fantasma ? MAT.fantasma : t.userData.corReal;
      t.receiveShadow = !fantasma;
    }
    grpPlanta.visible = est.vista === 'planta';
    grade.visible = est.vista === 'planta';
    pedir();
  }

  // ---------- Sol ----------
  let diaInfo = null;
  const discoSol = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12), new THREE.MeshBasicMaterial({ color: '#ffd45a', toneMapped: false }));
  cena.add(discoSol);

  function raioTraj() { return Math.max(limites.rc * 1.2, 7); }

  function construirSol() {
    limpar(grpSol);
    const loc = est.modelo.local, R = raioTraj(), c = new THREE.Vector3(limites.ccx, 0, limites.ccz);
    diaInfo = S.diaSolar(est.data, loc.lat, loc.lon, loc.fuso);
    luz.diaSujo = true;
    // rosa dos ventos: círculo no chão com marcas a cada 15°
    const pts = [];
    for (let i = 0; i <= 96; i++) { const a = i / 96 * Math.PI * 2; pts.push(new THREE.Vector3(c.x + Math.cos(a) * R, 0.02, c.z + Math.sin(a) * R)); }
    const circ = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: '#2b2f36', transparent: true, opacity: 0.35 }));
    grpSol.add(circ);
    const marcas = [];
    for (let k = 0; k < 24; k++) {
      const b = (k * 15 + loc.norte) * RAD, r0 = k % 6 === 0 ? R * 0.94 : R * 0.97;
      marcas.push(new THREE.Vector3(c.x + Math.sin(b) * r0, 0.02, c.z - Math.cos(b) * r0), new THREE.Vector3(c.x + Math.sin(b) * R, 0.02, c.z - Math.cos(b) * R));
    }
    grpSol.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(marcas), new THREE.LineBasicMaterial({ color: '#2b2f36', transparent: true, opacity: 0.45 })));
    // trajetória do sol no dia
    const arco = [];
    const tr = diaInfo.trajetoria;
    for (let i = 0; i < tr.length; i++) {
      const p = tr[i];
      if (p.altitude < 0) {
        const viz = tr[i + 1] && tr[i + 1].altitude >= 0 ? tr[i + 1] : (tr[i - 1] && tr[i - 1].altitude >= 0 ? tr[i - 1] : null);
        if (!viz) continue;
        const t = p.altitude / (p.altitude - viz.altitude);
        const d = S.direcaoSol(0, p.azimute + (viz.azimute - p.azimute) * t, loc.norte);
        arco.push(new THREE.Vector3(c.x + d[0] * R, 0.03, c.z + d[2] * R));
        continue;
      }
      const d = S.direcaoSol(p.altitude, p.azimute, loc.norte);
      arco.push(new THREE.Vector3(c.x + d[0] * R, d[1] * R, c.z + d[2] * R));
    }
    if (arco.length > 1) {
      grpSol.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arco), new THREE.LineBasicMaterial({ color: '#f29a1b' })));
      const sombraArco = arco.map((v) => new THREE.Vector3(v.x, 0.025, v.z));
      grpSol.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(sombraArco), new THREE.LineDashedMaterial({ color: '#f29a1b', dashSize: 0.3, gapSize: 0.25, transparent: true, opacity: 0.7 })).computeLineDistances());
    }
    horasTraj = [];
    for (let h = 0; h < 24; h++) {
      const p = S.posicaoSol(S.instanteLocal(est.data, h, loc.fuso), loc.lat, loc.lon);
      if (p.altitude < 2 * RAD) continue;
      const d = S.direcaoSol(p.altitude, p.azimute, loc.norte);
      const pos = new THREE.Vector3(c.x + d[0] * R, d[1] * R, c.z + d[2] * R);
      const bola = new THREE.Mesh(new THREE.SphereGeometry(R * 0.012, 10, 6), new THREE.MeshBasicMaterial({ color: '#f29a1b' }));
      bola.position.copy(pos);
      grpSol.add(bola);
      horasTraj.push({ h, pos });
    }
    discoSol.scale.setScalar(R * 0.03);
    grpSol.visible = est.trajetoria;
    estacoes();
    atualizarSol();
    rotulosFixos();
  }
  let horasTraj = [];

  const CORES_CEU = [
    [-12, '#0c1730', '#18264a'], [-4, '#253a6e', '#8d6a6a'], [0, '#4a6fae', '#f0a273'],
    [5, '#5389c9', '#f3c79d'], [15, '#3f86d8', '#cfe5f5'], [90, '#3478cf', '#d6eaf7'],
  ];
  const tmpA = new THREE.Color(), tmpB = new THREE.Color();
  function corCeu(altG, idx) {
    let i = 0;
    while (i < CORES_CEU.length - 2 && altG > CORES_CEU[i + 1][0]) i++;
    const a = CORES_CEU[i], b = CORES_CEU[i + 1];
    const t = Math.max(0, Math.min(1, (altG - a[0]) / (b[0] - a[0])));
    return tmpA.set(a[idx]).lerp(tmpB.set(b[idx]), t).clone();
  }

  const NUVENS = { limpo: 0, parcial: 0.5, encoberto: 1 }; // quanto do sol as nuvens tiram, só no desenho
  let solAgora = null;
  function atualizarSol() {
    const loc = est.modelo.local;
    const ms = S.instanteLocal(est.data, est.hora, loc.fuso);
    const p = S.posicaoSol(ms, loc.lat, loc.lon);
    solAgora = p;
    const altG = p.altitude / RAD;
    const d = S.direcaoSol(p.altitude, p.azimute, loc.norte);
    const c = new THREE.Vector3(limites.cx, 0, limites.cz), Rs = limites.r + 2;
    const dir = new THREE.Vector3(d[0], Math.max(d[1], 0.02), d[2]).normalize();
    sol.position.copy(c).addScaledVector(dir, Rs * 3);
    sol.target.position.copy(c);
    const sc = sol.shadow.camera;
    sc.left = -Rs; sc.right = Rs; sc.top = Rs; sc.bottom = -Rs; sc.near = 0.5; sc.far = Rs * 3 + Rs * 12;
    sc.updateProjectionMatrix();
    // as nuvens tiram força do sol (e das sombras) e deixam o céu mais claro e cinza
    const dia = passo(-8, 6, altG), nuvens = NUVENS[est.ceu] || 0, forte = passo(-0.8, 9, altG) * (1 - nuvens);
    sol.intensity = 2.1 * forte;
    sol.color.set('#ffab62').lerp(tmpB.set('#fff4e4'), passo(0, 28, altG));
    hemi.intensity = (0.2 + 0.58 * dia) * (1 + 0.7 * nuvens);
    hemi.color.set('#46598c').lerp(tmpB.set('#dcebff'), dia);
    hemi.groundColor.set('#26281f').lerp(tmpB.set('#8c8a6e'), dia);
    renderer.toneMappingExposure = 0.85 + 0.2 * dia;
    const topo = corCeu(altG, 1), horiz = corCeu(altG, 2), claro = 0.1 + 0.9 * dia;
    topo.lerp(tmpB.set('#93a0aa').multiplyScalar(claro), nuvens * 0.9);
    horiz.lerp(tmpB.set('#cfd5d9').multiplyScalar(claro), nuvens * 0.9);
    ceuMat.uniforms.topo.value.copy(topo);
    ceuMat.uniforms.horiz.value.copy(horiz);
    ceuMat.uniforms.solDir.value.set(d[0], d[1], d[2]);
    ceuMat.uniforms.solCor.value.set('#ffe2ad').multiplyScalar(forte);
    const R = raioTraj();
    discoSol.position.set(limites.ccx + d[0] * R, d[1] * R, limites.ccz + d[2] * R);
    discoSol.visible = altG > -1 && est.trajetoria;
    luz.ceu = S.ceuEm(loc, est.data, est.hora, est.ceu);
    luz.suja = true;
    atualizarInfoSol();
    pedir();
  }

  function atualizarInfoSol() {
    const p = solAgora, el = $('info-sol');
    if (!p || !diaInfo) return;
    const altG = p.altitude / RAD, azG = p.azimute / RAD;
    const partes = [];
    if (altG > -0.833) partes.push(`sol a <b>${fmt(altG, 0)}°</b> de altura, rumo <b>${fmt(azG, 0)}° ${S.cardeal(azG)}</b>`);
    else partes.push('<b>sol abaixo do horizonte</b>');
    partes.push(`lá fora <b>${fmtLux(luz.ceu.horizontal)}</b>`);
    if (diaInfo.nascer != null) partes.push(`nasce <b>${fmtHora(diaInfo.nascer)}</b>`);
    if (diaInfo.por != null) partes.push(`põe <b>${fmtHora(diaInfo.por)}</b>`);
    partes.push(`meio-dia solar <b>${fmtHora(diaInfo.meio)}</b> a ${fmt(diaInfo.altitudeMaxima / RAD, 0)}°`);
    el.innerHTML = partes.map((x) => `<span>${x}</span>`).join('');
  }

  // ---------- Rótulos em HTML ----------
  const caixaRot = $('rotulos');
  const rotulos = new Map();
  function rotulo(chave, html, pos, classe) {
    let r = rotulos.get(chave);
    if (!r) {
      const el = document.createElement('div');
      caixaRot.appendChild(el);
      r = { el, pos: new THREE.Vector3(), html: null, classe: null };
      rotulos.set(chave, r);
    }
    if (r.html !== html) { r.el.innerHTML = html; r.html = html; }
    if (r.classe !== classe) { r.el.className = 'rot ' + classe; r.classe = classe; }
    r.pos.copy(pos);
    r.vivo = true;
    return r;
  }
  function podar(prefixo) {
    for (const [k, r] of rotulos) {
      if (k.startsWith(prefixo) && !r.vivo) { r.el.remove(); rotulos.delete(k); }
    }
    for (const [k, r] of rotulos) if (k.startsWith(prefixo)) r.vivo = false;
  }
  const vtmp = new THREE.Vector3();
  function posicionarRotulos() {
    const c = cam(), w = canvas.clientWidth, h = canvas.clientHeight;
    for (const [k, r] of rotulos) {
      let vis = true;
      if (k.startsWith('comodo:') && est.vista !== 'planta') vis = false;
      if ((k.startsWith('hora:') || k.startsWith('card:')) && !est.trajetoria) vis = false;
      if (vis) {
        vtmp.copy(r.pos).project(c);
        vis = vtmp.z < 1 && vtmp.z > -1 && Math.abs(vtmp.x) < 1.2 && Math.abs(vtmp.y) < 1.2;
      }
      if (!vis) { if (r.el.style.display !== 'none') r.el.style.display = 'none'; continue; }
      if (r.el.style.display === 'none') r.el.style.display = '';
      const x = (vtmp.x + 1) / 2 * w, y = (1 - vtmp.y) / 2 * h;
      r.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%)`;
    }
    posicionarReguas();
  }

  // nome e área de cada cômodo; com o mapa de luz pronto, também a média dele
  function rotulosComodos() {
    for (const c of est.der.comodos) {
      const r = resumoDoMapa(c);
      rotulo('comodo:' + c.centro.join(','), `${esc(c.nome)}<span>${fmt(c.area, 1)} m²</span>` + (r ? `<span>média ${fmtLux(r.media)}</span>` : ''), new THREE.Vector3(c.centro[0], 0.1, c.centro[1]), 'rot-comodo' + (r ? ' no-mapa' : ''));
    }
    podar('comodo:');
  }

  function rotulosFixos() {
    rotulosComodos();
    const R = raioTraj(), cx = limites.ccx, cz = limites.ccz, norte = est.modelo.local.norte;
    [['N', 0], ['L', 90], ['S', 180], ['O', 270]].forEach(([n, a]) => {
      const b = (a + norte) * RAD;
      rotulo('card:' + n, n, new THREE.Vector3(cx + Math.sin(b) * (R + 0.9), 0.05, cz - Math.cos(b) * (R + 0.9)), 'rot-card' + (n === 'N' ? ' norte' : ''));
    });
    podar('card:');
    for (const t of horasTraj) rotulo('hora:' + t.h, t.h + 'h', t.pos.clone().add(new THREE.Vector3(0, R * 0.045, 0)), 'rot-hora');
    podar('hora:');
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ---------- Medidores de luz ----------
  // cob é a laje e prep o céu que cada medidor enxerga: só mudam com a casa. ceu é a luz do instante.
  // mapa é o mapa de luz dos cômodos; diaSujo avisa que a data, o céu ou a casa mudaram e o que é do dia inteiro
  // (o gráfico, as horas de sol) tem de ser refeito.
  const luz = { cob: null, prep: null, ceu: null, leituras: new Map(), suja: true, mapa: null, diaSujo: true };
  // pedaços do painel que mostram leituras: lista, sel e comodo mudam com a hora; dia() refaz o que é do dia
  // inteiro e hora() move o que marca o instante
  const camposVazios = () => ({ lista: new Map(), sel: null, comodo: null, dia: null, hora: null });
  let campos = camposVazios();

  function prepLuz() {
    if (!luz.prep) luz.prep = S.prepararLuz(est.modelo, est.der, luz.cob);
    return luz.prep;
  }
  function lugarDe(pos) {
    const c = acharComodo(pos);
    return c ? c.nome + (!c.coberto ? ' (descoberta)' : c.externo ? ' (coberta e aberta)' : '') : 'Ao ar livre';
  }

  function atualizarLuz() {
    luz.suja = false;
    const m = est.modelo;
    luz.leituras = new Map(m.medidores.length ? S.lerLuz(prepLuz(), luz.ceu).map((l) => [l.id, l]) : []);
    for (const md of m.medidores) {
      const sel = est.sel && est.sel.tipo === 'medidor' && est.sel.id === md.id, total = luz.leituras.get(md.id).total;
      rotulo('lux:' + md.id, `<em>${esc(md.nome)}</em>${fmtLux(total)}${sinalDaMeta(md, total)}`, new THREE.Vector3(md.pos[0], md.alt, md.pos[1]), 'rot-lux' + (sel ? ' sel' : ''));
    }
    podar('lux:');
    if (est.fantasma && est.fantasma.tipo === 'medidor') { sondar(); rotuloSonda(); }
    if (luz.mapa) pintarMapa();
    preencherLeituras();
    if (luz.diaSujo && !est.arrasto) {
      luz.diaSujo = false;
      if (campos.dia) campos.dia();
    } else if (campos.hora) campos.hora();
  }

  // ✓ se a leitura alcança a meta do medidor, ↓ se fica abaixo; nada se ele não tem meta
  function sinalDaMeta(md, total) {
    if (!md.meta) return '';
    return total >= md.meta ? '<i class="sinal ok">✓</i>' : '<i class="sinal baixo">↓</i>';
  }

  // a sonda: a leitura no ponto debaixo do cursor, antes de pôr o medidor
  function sondar() {
    const f = est.fantasma;
    f.leitura = S.sondarLuz(prepLuz(), est.modelo, est.der, { pos: f.ponto, alt: S.ALT_MEDIDOR }, luz.ceu);
  }
  function rotuloSonda() {
    const f = est.fantasma;
    rotulo('medida:sonda', fmtLux(f.leitura.total), new THREE.Vector3(f.ponto[0], S.ALT_MEDIDOR, f.ponto[1]), 'rot-lux sonda');
  }

  function preencherLeituras() {
    for (const [id, linha] of campos.lista) {
      const l = luz.leituras.get(id);
      if (l) linha.saida.innerHTML = fmtLux(l.total) + sinalDaMeta(linha.md, l.total);
    }
    const rc = campos.comodo;
    if (rc) {
      const r = resumoDoMapa(rc.c);
      rc.media.textContent = r ? fmtLux(r.media) : 'calculando…';
      rc.min.textContent = r ? fmtLux(r.min) : '';
      rc.max.textContent = r ? fmtLux(r.max) : '';
      rc.acima.textContent = r ? fmt(r.acima * 100, 0) + '% da área' : '';
    }
    const c = campos.sel, l = c && luz.leituras.get(c.id);
    if (!l) return;
    const fora = luz.ceu.horizontal;
    c.total.textContent = fmtLux(l.total);
    c.parte.textContent = fora >= 1 ? fmtParte(l.total / fora) + ' da luz lá de fora' : 'sem luz do dia';
    c.sol.textContent = fmtLux(l.sol);
    c.ceu.textContent = fmtLux(l.ceu);
    c.refletida.textContent = fmtLux(l.refletida);
    c.fora.textContent = fmtLux(fora);
    c.estado.hidden = !c.md.meta;
    if (c.md.meta) c.estado.innerHTML = sinalDaMeta(c.md, l.total) + (l.total >= c.md.meta ? 'Alcança a meta de ' : 'Abaixo da meta de ') + fmtLux(c.md.meta);
  }

  // ---------- Luz ao longo do dia ----------
  const SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs, filhos) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
    for (const f of [].concat(filhos || [])) if (f != null) n.append(f);
    return n;
  }
  const LIMIAR_LUX = 300; // referência quando o medidor não tem meta: o que a leitura e o trabalho pedem
  const fmtDuracao = (h) => {
    const min = Math.round(h * 60);
    if (min <= 0) return 'nada';
    return min < 60 ? min + ' min' : Math.floor(min / 60) + 'h' + (min % 60 ? String(min % 60).padStart(2, '0') : '');
  };
  const inicioDe = (estacao) => 'Início d' + (estacao === 'primavera' ? 'a ' : 'o ') + estacao;
  const fmtTrecho = (t) => (t.tempo > 0 ? `, entre ${fmtHora(t.de)} e ${fmtHora(t.ate)}` : '');
  const fmtNum = (x) => Math.round(x).toLocaleString('pt-BR');

  function irParaHora(h) {
    est.hora = Math.max(0, Math.min(23.99, h));
    atualizarSol(); mostrarHora(); salvar();
  }

  // As leituras de um medidor ao longo do dia. A escala dos lux é logarítmica (cada linha vale dez vezes a de
  // baixo), porque o sol direto dá cem vezes a luz de dentro: numa escala comum o resto viraria um risco no chão.
  // aoMirar(k, ir) recebe o passo debaixo do cursor (null ao sair) e ir = true no clique.
  function graficoDoDia(dia, leituras, meta, aoMirar) {
    const W = 272, H = 138, esq = 47, dir = 8, topo = 8, base = 20, w = W - esq - dir, h = H - topo - base;
    const h0 = diaInfo && diaInfo.nascer != null ? Math.max(0, Math.floor(diaInfo.nascer - 0.5)) : 0;
    const h1 = diaInfo && diaInfo.por != null ? Math.min(24, Math.ceil(diaInfo.por + 0.5)) : 24;
    const X = (hr) => esq + (hr - h0) / (h1 - h0) * w;
    const Y = (lx) => topo + h - (Math.log10(Math.max(lx, 10)) - 1) / (Math.log10(200000) - 1) * h;
    const g = svg('svg', { class: 'grafico', viewBox: `0 0 ${W} ${H}`, tabindex: '0', role: 'img', 'aria-label': 'Luz no medidor ao longo do dia, em lux. As setas do teclado mudam a hora.' });
    for (const [lx, nome] of [[10, '10'], [100, '100'], [1000, '1 mil'], [10000, '10 mil'], [100000, '100 mil']]) {
      g.append(svg('line', { class: lx === 10 ? 'eixo' : 'grade', x1: esq, x2: W - dir, y1: Y(lx), y2: Y(lx) }));
      g.append(svg('text', { x: esq - 5, y: Y(lx) + 3, 'text-anchor': 'end' }, nome));
    }
    for (let hr = Math.ceil(h0 / 3) * 3; hr <= h1; hr += 3) g.append(svg('text', { x: X(hr), y: H - 6, 'text-anchor': 'middle' }, hr + 'h'));
    const ks = dia.horas.map((_, k) => k).filter((k) => dia.horas[k] >= h0 - 1e-9 && dia.horas[k] <= h1 + 1e-9);
    const pts = ks.map((k) => X(dia.horas[k]).toFixed(1) + ' ' + Y(leituras[k].total).toFixed(1));
    const chao = topo + h;
    g.append(svg('path', { class: 'area', d: `M${X(dia.horas[ks[0]]).toFixed(1)} ${chao} L${pts.join(' L')} L${X(dia.horas[ks[ks.length - 1]]).toFixed(1)} ${chao} Z` }));
    g.append(svg('path', { class: 'linha', d: 'M' + pts.join(' L') }));
    // faixa junto do eixo nas horas em que o sol bate direto no ponto
    const meio = w / (h1 - h0) * dia.passo / 2;
    for (const k of ks) {
      if (leituras[k].sol > 0) g.append(svg('rect', { class: 'sol', x: (X(dia.horas[k]) - meio).toFixed(1), y: chao - 4, width: (meio * 2 + 0.3).toFixed(1), height: 4 }));
    }
    if (meta >= 10) {
      g.append(svg('line', { class: 'meta', x1: esq, x2: W - dir, y1: Y(meta), y2: Y(meta) }));
      g.append(svg('text', { x: W - dir, y: Y(meta) - 4, 'text-anchor': 'end' }, 'meta'));
    }
    const mira = svg('line', { class: 'mira', y1: topo, y2: chao, visibility: 'hidden' });
    const agora = svg('line', { class: 'agora', y1: topo, y2: chao }), bola = svg('circle', { class: 'ponto', r: 4 });
    g.append(mira, agora, bola);
    // o cursor só precisa acertar a hora, não a linha
    const passoEm = (e) => {
      const r = g.getBoundingClientRect(), hr = h0 + ((e.clientX - r.left) / r.width * W - esq) / w * (h1 - h0);
      return Math.max(ks[0], Math.min(ks[ks.length - 1], Math.round(hr / dia.passo)));
    };
    g.addEventListener('pointermove', (e) => {
      const k = passoEm(e), x = X(dia.horas[k]);
      mira.setAttribute('x1', x); mira.setAttribute('x2', x); mira.setAttribute('visibility', 'visible');
      aoMirar(k, false);
    });
    g.addEventListener('pointerleave', () => { mira.setAttribute('visibility', 'hidden'); aoMirar(null, false); });
    g.addEventListener('click', (e) => aoMirar(passoEm(e), true));
    g.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      aoMirar(Math.round(est.hora / dia.passo) + (e.key === 'ArrowLeft' ? -1 : 1), true);
    });
    return {
      el: g,
      marcar(hora, lx) {
        const vis = hora >= h0 && hora <= h1 ? 'visible' : 'hidden', x = X(hora);
        agora.setAttribute('x1', x); agora.setAttribute('x2', x); agora.setAttribute('visibility', vis);
        bola.setAttribute('cx', x); bola.setAttribute('cy', Y(lx)); bola.setAttribute('visibility', vis);
      },
    };
  }

  // O céu visto de um ponto, deitado como a planta: o zênite no meio e o horizonte na borda. Mostra o que tapa
  // o céu, o que aparece pelo vidro e por onde o sol passa no dia.
  const CORES_VISTA = { 1: '#3d4148', 2: '#7fb6ea', 3: '#cfe6fb' };
  function vistaDoPonto(p) {
    const N = 176, R = N / 2, cv = el('canvas', { width: N, height: N, role: 'img', 'aria-label': 'O céu visto do medidor, com o caminho do sol no dia' });
    const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N), tipos = S.vistaDoCeu(prepLuz().cena, p, N);
    const rgb = {};
    for (const k in CORES_VISTA) rgb[k] = [1, 3, 5].map((q) => parseInt(CORES_VISTA[k].substr(q, 2), 16));
    for (let i = 0; i < tipos.length; i++) {
      const c = rgb[tipos[i]];
      if (c) { img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255; }
    }
    const xy = (d) => { const q = S.naVistaDoCeu(d); return q && [R + q[0] * R, R + q[1] * R]; };
    const escrever = (txt, x, y) => {
      ctx.font = '700 11px Manrope, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(29, 33, 40, 0.85)'; ctx.strokeText(txt, x, y);
      ctx.fillStyle = '#fff'; ctx.fillText(txt, x, y);
    };
    return {
      el: cv,
      desenhar() {
        const loc = est.modelo.local;
        ctx.clearRect(0, 0, N, N);
        ctx.putImageData(img, 0, 0);
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        for (const alt of [30, 60]) { ctx.beginPath(); ctx.arc(R, R, (1 - alt / 90) * R, 0, Math.PI * 2); ctx.stroke(); }
        ctx.strokeStyle = '#2b2f36'; ctx.beginPath(); ctx.arc(R, R, R - 0.5, 0, Math.PI * 2); ctx.stroke();
        // o caminho do sol no dia e as horas cheias
        ctx.strokeStyle = '#f29a1b'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
        let aberto = false;
        for (const t of diaInfo.trajetoria) {
          const q = t.altitude > 0 && xy(S.direcaoSol(t.altitude, t.azimute, loc.norte));
          if (!q) { aberto = false; continue; }
          if (aberto) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
          aberto = true;
        }
        ctx.stroke();
        for (const hr of [9, 12, 15]) {
          const s = S.posicaoSol(S.instanteLocal(est.data, hr, loc.fuso), loc.lat, loc.lon), q = s.altitude > 0 && xy(S.direcaoSol(s.altitude, s.azimute, loc.norte));
          if (!q) continue;
          ctx.fillStyle = '#f29a1b'; ctx.beginPath(); ctx.arc(q[0], q[1], 2.5, 0, Math.PI * 2); ctx.fill();
          escrever(hr + 'h', q[0], q[1] - 10);
        }
        const b = loc.norte * RAD;
        escrever('N', R + Math.sin(b) * (R - 10), R - Math.cos(b) * (R - 10));
        // o sol agora, com um anel claro em volta para não sumir em cima da linha
        const q = solAgora && solAgora.altitude > 0 && xy(S.direcaoSol(solAgora.altitude, solAgora.azimute, loc.norte));
        if (q) {
          ctx.beginPath(); ctx.arc(q[0], q[1], 5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffd45a'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
        }
      },
    };
  }

  // ---------- Mapa de luz ----------
  // O piso de cada cômodo pintado com a luz a 0,75 m do chão, em sete faixas de lux. A rampa é de um matiz só,
  // do escuro (pouca luz) ao claro, em passos iguais de claridade.
  const LUX_FAIXAS = [50, 100, 300, 500, 1000, 5000];
  const LUX_CORES = ['#271605', '#432808', '#613b0b', '#814f0d', '#a3640f', '#c6790f', '#e8911e'];
  const LOG_MAPA = 5; // a textura guarda log10(lux) num byte, de 1 lx a 100 mil lx
  const grpMapa = new THREE.Group();
  cena.add(grpMapa);
  // a cor de cada valor da textura; o sombreador consulta esta rampa, então as faixas têm borda nítida
  // mesmo com o valor interpolado entre os pontos da grade
  const rampaLux = (() => {
    const d = new Uint8Array(256 * 4);
    for (let k = 0; k < 256; k++) {
      const lux = Math.pow(10, k / 255 * LOG_MAPA), cor = LUX_CORES[LUX_FAIXAS.filter((x) => lux >= x).length];
      for (let q = 0; q < 3; q++) d[k * 4 + q] = parseInt(cor.substr(1 + q * 2, 2), 16);
      d[k * 4 + 3] = 255;
    }
    const t = new THREE.DataTexture(d, 256, 1);
    t.needsUpdate = true;
    return t;
  })();
  function matMapa(tex) {
    return new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { mapa: { value: tex }, rampa: { value: rampaLux } },
      vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      // sem as conversões de cor do three.js: as cores da rampa saem na tela como foram escolhidas
      fragmentShader: 'uniform sampler2D mapa; uniform sampler2D rampa; varying vec2 vUv; void main() { vec4 a = texture2D(mapa, vUv); gl_FragColor = vec4(texture2D(rampa, vec2(a.r, 0.5)).rgb, a.a * 0.94); }',
    });
  }

  // recomeça o mapa do zero: a casa mudou, ou ele acabou de ser ligado ou desligado
  function reiniciarMapa() {
    for (const s of luz.mapa ? luz.mapa.salas : []) { s.tex.dispose(); s.malha.material.dispose(); }
    limpar(grpMapa);
    luz.mapa = null;
    if (est.mapa) {
      const comodos = est.der.comodos, passo = comodos.reduce((t, c) => t + c.area, 0) > 110 ? 0.5 : 0.25;
      const salas = comodos.map((c) => {
        const grade = S.gradeDoComodo(est.modelo, c, passo), n = grade.nx * grade.nz;
        const dados = new Uint8Array(n * 4), tex = new THREE.DataTexture(dados, grade.nx, grade.nz);
        tex.magFilter = tex.minFilter = THREE.LinearFilter;
        const geo = geoComodo(c), pos = geo.attributes.position, uv = geo.attributes.uv;
        for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) - grade.x0) / (grade.nx * passo), (pos.getZ(i) - grade.z0) / (grade.nz * passo));
        const malha = new THREE.Mesh(geo, matMapa(tex));
        malha.position.y = 0.02;
        malha.visible = false;
        grpMapa.add(malha);
        // cada quadrinho da textura sem ponto (fora do cômodo, dentro de parede) copia o ponto mais próximo,
        // para a cor não escurecer nas beiradas
        const fonte = new Int32Array(n).fill(-1), fila = [];
        grade.pontos.forEach((p, k) => { fonte[p.j * grade.nx + p.i] = k; fila.push(p.j * grade.nx + p.i); });
        for (let q = 0; q < fila.length; q++) {
          const t = fila[q], i = t % grade.nx, j = (t - i) / grade.nx;
          for (const [a, b] of [[i - 1, j], [i + 1, j], [i, j - 1], [i, j + 1]]) {
            if (a < 0 || b < 0 || a >= grade.nx || b >= grade.nz || fonte[b * grade.nx + a] >= 0) continue;
            fonte[b * grade.nx + a] = fonte[t];
            fila.push(b * grade.nx + a);
          }
        }
        return { c, grade, dados, tex, malha, fonte, feitos: 0, pronta: false, pc: null, valores: new Float32Array(grade.pontos.length), resumo: null };
      });
      luz.mapa = { salas, total: salas.reduce((t, s) => t + s.grade.pontos.length, 0), feitos: 0 };
    }
    atualizarLegenda();
  }

  // prepara mais alguns pontos do mapa a cada quadro, um cômodo de cada vez, sem travar a tela
  function avancarMapa() {
    const mp = luz.mapa;
    if (!mp || mp.feitos >= mp.total || est.arrasto) return;
    const prep = prepLuz(), fim = performance.now() + 12;
    for (const s of mp.salas) {
      if (s.pronta) continue;
      while (s.feitos < s.grade.pontos.length && performance.now() < fim) {
        S.prepararPonto(prep.cena, s.grade.pontos[s.feitos++], S.ALT_MEDIDOR);
        mp.feitos++;
      }
      if (s.feitos < s.grade.pontos.length) break;
      s.pronta = true;
      s.pc = S.comodoDaLuz(prep, est.modelo, est.der, s.c.centro);
      // só o cômodo que ficou pronto pede um desenho novo: enquanto a conta anda, a tela fica parada e sobra
      // tempo para ela
      luz.suja = true;
      pedir();
    }
    atualizarLegenda();
  }

  // a luz de cada ponto na hora escolhida vai para a textura do cômodo, e sai o resumo dele
  function pintarMapa() {
    const barreiras = prepLuz().cena, ceu = luz.ceu, lum = S.luminanciaDosPedacos(ceu);
    for (const s of luz.mapa.salas) {
      const pontos = s.grade.pontos;
      if (!s.pronta || !pontos.length) continue;
      const refletida = s.pc ? S.luzRefletida(barreiras, s.pc, ceu) : 0;
      let soma = 0, min = Infinity, max = 0, acima = 0;
      pontos.forEach((p, k) => {
        const v = S.lerPonto(barreiras, p, ceu, lum) + refletida;
        s.valores[k] = v;
        soma += v; min = Math.min(min, v); max = Math.max(max, v);
        if (v >= LIMIAR_LUX) acima++;
      });
      for (let t = 0; t < s.fonte.length; t++) {
        s.dados[t * 4] = Math.max(0, Math.min(255, Math.round(Math.log10(Math.max(s.valores[s.fonte[t]], 1)) / LOG_MAPA * 255)));
        s.dados[t * 4 + 3] = 255;
      }
      s.tex.needsUpdate = true;
      s.malha.visible = true;
      s.resumo = { media: soma / pontos.length, min, max, acima: acima / pontos.length };
    }
    rotulosComodos();
  }
  function resumoDoMapa(c) {
    const s = luz.mapa && luz.mapa.salas.find((x) => x.c === c);
    return s ? s.resumo : null;
  }

  // legenda: as sete cores com os lux das divisas embaixo
  $('leg-barra').append(...LUX_CORES.map((cor) => el('i', { style: 'background:' + cor })));
  $('leg-marcas').append(...LUX_FAIXAS.map((lx, k) => el('span', { style: `left:${((k + 1) / 7 * 100).toFixed(2)}%` }, lx >= 1000 ? lx / 1000 + ' mil' : String(lx))));
  function atualizarLegenda() {
    const mp = luz.mapa;
    $('legenda').hidden = !mp;
    $('leg-estado').textContent = mp && mp.feitos < mp.total ? `calculando ${Math.round(mp.feitos / mp.total * 100)}%` : '';
  }
  function alternarMapa() {
    est.mapa = !est.mapa;
    $('ver-mapa').setAttribute('aria-pressed', String(est.mapa));
    reiniciarMapa();
    rotulosComodos();
    luz.suja = true;
    montarPainel(); salvar(); pedir();
  }

  // ---------- Modelo: aplicar mudanças e histórico ----------
  function aplicar(novo, op) {
    op = op || {};
    if (op.historico !== false) {
      hist.antes.push(JSON.stringify(est.modelo));
      if (hist.antes.length > 200) hist.antes.shift();
      hist.depois = [];
    }
    est.modelo = S.normalizar(novo);
    est.der = S.derivar(est.modelo);
    // área que acabou de nascer guarda o tipo com que nasceu, para não mudar sozinha depois
    const fixado = S.fixarAreas(est.modelo, est.der);
    if (fixado) { est.modelo = fixado; est.der = S.derivar(fixado); }
    validarSelecao();
    construir();
    salvar();
    if (op.painel !== false) montarPainel();
    atualizarBotoesHist();
  }
  function desfazer() {
    if (!hist.antes.length) return;
    hist.depois.push(JSON.stringify(est.modelo));
    est.modelo = JSON.parse(hist.antes.pop());
    pos_historico();
  }
  function refazer() {
    if (!hist.depois.length) return;
    hist.antes.push(JSON.stringify(est.modelo));
    est.modelo = JSON.parse(hist.depois.pop());
    pos_historico();
  }
  function pos_historico() {
    est.der = S.derivar(est.modelo);
    validarSelecao();
    construir(); salvar(); montarPainel(); atualizarBotoesHist();
  }
  function atualizarBotoesHist() {
    $('desfazer').disabled = !hist.antes.length;
    $('refazer').disabled = !hist.depois.length;
  }

  // ---------- Seleção ----------
  function acharComodo(ponto) { return est.der.comodos.find((c) => S.dentroDoComodo(ponto, c)) || null; }
  function objetoSel(sel) {
    if (!sel) return null;
    const m = est.modelo;
    if (sel.tipo === 'parede') return m.paredes.find((w) => w.id === sel.id) || null;
    if (sel.tipo === 'abertura') return m.aberturas.find((a) => a.id === sel.id) || null;
    if (sel.tipo === 'arvore') return m.arvores.find((t) => t.id === sel.id) || null;
    if (sel.tipo === 'medidor') return m.medidores.find((x) => x.id === sel.id) || null;
    if (sel.tipo === 'regua') return m.reguas.find((x) => x.id === sel.id) || null;
    if (sel.tipo === 'comodo') return acharComodo(sel.ponto);
    return null;
  }
  function validarSelecao() {
    if (est.sel && !objetoSel(est.sel)) est.sel = null;
    if (est.hover && !objetoSel(est.hover)) est.hover = null;
  }
  function selecionar(sel) {
    const mudou = JSON.stringify(sel) !== JSON.stringify(est.sel);
    est.sel = sel;
    if (sel && est.aba !== 'selecao') { est.abaAntes = est.aba; est.aba = 'selecao'; }
    if (!sel && est.aba === 'selecao') est.aba = est.abaAntes || 'casa';
    if (mudou) montarPainel();
    luz.suja = true; // o rótulo do medidor selecionado muda de cor
    destacar();
  }

  const MAT_SEL = new THREE.MeshBasicMaterial({ color: '#2f7de1', transparent: true, opacity: 0.32, depthWrite: false });
  const MAT_HOVER = new THREE.MeshBasicMaterial({ color: '#2f7de1', transparent: true, opacity: 0.14, depthWrite: false });
  const MAT_OK = new THREE.MeshBasicMaterial({ color: '#2fa35a', transparent: true, opacity: 0.45, depthWrite: false });
  const MAT_RUIM = new THREE.MeshBasicMaterial({ color: '#d9482b', transparent: true, opacity: 0.45, depthWrite: false });
  const MAT_NOVA = new THREE.MeshBasicMaterial({ color: '#f29a1b', transparent: true, opacity: 0.45, depthWrite: false });
  const MAT_PONTO = { no: '#f29a1b', parede: '#2f7de1', angulo: '#1d2128', grade: '#666b73', livre: '#666b73', digitado: '#1d2128' };
  const cacheMarca = new Map();
  function matMarca(cor) {
    if (!cacheMarca.has(cor)) cacheMarca.set(cor, new THREE.MeshBasicMaterial({ color: cor, depthTest: false, transparent: true }));
    return cacheMarca.get(cor);
  }

  function realce(sel, mat) {
    const o = objetoSel(sel);
    if (!o) return;
    const m = est.modelo;
    if (sel.tipo === 'parede') {
      const q = quadro(o), [e0, e1] = est.der.extensoes[o.id];
      const g = new THREE.Group();
      g.position.set(o.a[0], 0, o.a[1]); g.rotation.y = -q.ang;
      const alt = S.ehDivisa(o) ? 0.08 : o.alt, esp = S.ehDivisa(o) ? 0.24 : o.esp;
      caixa(g, q.L + e0 + e1 + 0.04, alt + 0.04, esp + 0.06, (q.L + e1 - e0) / 2, alt / 2, 0, mat, null, false);
      grpSobre.add(g);
      if (mat === MAT_SEL) rotulo('medida:sel', fmt(q.L) + ' m', new THREE.Vector3((o.a[0] + o.b[0]) / 2, alt + 0.3, (o.a[1] + o.b[1]) / 2), 'rot-medida sel');
    } else if (sel.tipo === 'abertura') {
      const w = m.paredes.find((x) => x.id === o.parede);
      if (!w) return;
      const q = quadro(w), g = new THREE.Group();
      g.position.set(w.a[0], 0, w.a[1]); g.rotation.y = -q.ang;
      const lado = est.der.lados[w.id], aba = o.aba > 0 && lado ? o.aba : 0;
      caixa(g, o.larg + 0.08, o.alt + 0.08, w.esp + 0.08 + aba, o.pos, o.peitoril + o.alt / 2, lado * aba / 2, mat, null, false);
      grpSobre.add(g);
    } else if (sel.tipo === 'arvore') {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(o.copa + 0.15, o.copa + 0.15, o.alt + 0.2, 24), mat);
      s.position.set(o.pos[0], (o.alt + 0.2) / 2, o.pos[1]);
      grpSobre.add(s);
    } else if (sel.tipo === 'medidor') {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, o.alt + 0.2, 20), mat);
      s.position.set(o.pos[0], (o.alt + 0.2) / 2, o.pos[1]);
      grpSobre.add(s);
    } else if (sel.tipo === 'comodo') {
      const piso = new THREE.Mesh(geoComodo(o), mat);
      piso.position.y = 0.03;
      grpSobre.add(piso);
    }
  }

  function destacar() {
    limpar(grpSobre);
    if (est.hover && JSON.stringify(est.hover) !== JSON.stringify(est.sel)) realce(est.hover, MAT_HOVER);
    if (est.sel) realce(est.sel, MAT_SEL);
    desenharFantasma();
    podar('medida:');
    rotulosReguas();
    pedir();
  }

  // ---------- Réguas ----------
  // Medidas livres. O traço vai num SVG por cima da cena, então ele e as marcas das pontas têm sempre o
  // mesmo tamanho na tela, na planta e no 3D, e nada da casa os esconde.
  const tracos = new Map();
  const ehSel = (sel, tipo, id) => !!sel && sel.tipo === tipo && sel.id === id;
  // ponto do chão em pixels da tela; null se ficou atrás da câmera
  function naTela(p) {
    vtmp.set(p[0], 0.02, p[1]).project(cam());
    return vtmp.z > -1 && vtmp.z < 1 ? [(vtmp.x + 1) / 2 * canvas.clientWidth, (1 - vtmp.y) / 2 * canvas.clientHeight] : null;
  }
  // as réguas do modelo e a que está sendo traçada
  function reguasNaTela() {
    const lista = est.modelo.reguas.map((r) => ({ id: r.id, a: r.a, b: r.b, classe: ehSel(est.sel, 'regua', r.id) ? 'sel' : ehSel(est.hover, 'regua', r.id) ? 'hover' : '' }));
    if (est.ferramenta === 'regua' && est.reguaIni && est.cursor) lista.push({ id: 'nova', a: est.reguaIni, b: est.cursor.ponto, classe: 'nova' });
    return lista;
  }
  function posicionarReguas() {
    const vivos = new Set();
    for (const r of reguasNaTela()) {
      let g = tracos.get(r.id);
      if (!g) {
        g = svg('g', {}, [svg('path', { class: 'halo' }), svg('path', { class: 'traco' })]);
        $('reguas').append(g);
        tracos.set(r.id, g);
      }
      vivos.add(r.id);
      const A = naTela(r.a), B = naTela(r.b);
      g.setAttribute('class', 'regua ' + r.classe);
      g.setAttribute('visibility', A && B ? 'visible' : 'hidden');
      if (!A || !B) continue;
      // o traço e uma marquinha atravessada em cada ponta
      const L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1, nx = -(B[1] - A[1]) / L * 5, ny = (B[0] - A[0]) / L * 5;
      const f = (x, y) => x.toFixed(1) + ' ' + y.toFixed(1);
      const d = `M${f(A[0], A[1])} L${f(B[0], B[1])} M${f(A[0] - nx, A[1] - ny)} L${f(A[0] + nx, A[1] + ny)} M${f(B[0] - nx, B[1] - ny)} L${f(B[0] + nx, B[1] + ny)}`;
      g.firstChild.setAttribute('d', d);
      g.lastChild.setAttribute('d', d);
    }
    for (const [id, g] of tracos) if (!vivos.has(id)) { g.remove(); tracos.delete(id); }
  }
  function rotulosReguas() {
    for (const r of est.modelo.reguas) {
      rotulo('regua:' + r.id, fmt(S.dist(r.a, r.b)) + ' m', new THREE.Vector3((r.a[0] + r.b[0]) / 2, 0.02, (r.a[1] + r.b[1]) / 2), 'rot-medida' + (ehSel(est.sel, 'regua', r.id) ? ' sel' : ''));
    }
    podar('regua:');
  }

  // régua debaixo do ponteiro, medido em pixels da tela: pelo rótulo, por uma ponta ou pelo traço
  function reguaSob(e) {
    const cv = canvas.getBoundingClientRect(), p = [e.clientX - cv.left, e.clientY - cv.top];
    let melhor = null, dmin = 7;
    for (const r of est.modelo.reguas) {
      const rot = rotulos.get('regua:' + r.id), q = rot && rot.el.style.display !== 'none' ? rot.el.getBoundingClientRect() : null;
      if (q && e.clientX >= q.left - 2 && e.clientX <= q.right + 2 && e.clientY >= q.top - 2 && e.clientY <= q.bottom + 2) return { id: r.id, parte: 'rotulo' };
      const A = naTela(r.a), B = naTela(r.b);
      if (!A || !B) continue;
      const d = S.projetar(p, A, B).dist;
      if (d < dmin) { dmin = d; melhor = { id: r.id, parte: S.dist(p, A) < 11 ? 'a' : S.dist(p, B) < 11 ? 'b' : 'meio' }; }
    }
    return melhor;
  }

  // onde as pontas de uma régua grudam: cantos das paredes (no eixo e nas faces), faces das paredes,
  // beiradas das aberturas, árvores, medidores e as pontas das outras réguas
  function encaixeDaRegua(e, de, ignorar) {
    const m = est.modelo, extras = S.cantosDasFaces(m.paredes);
    for (const ab of m.aberturas) {
      const w = m.paredes.find((x) => x.id === ab.parede);
      if (!w) continue;
      const q = quadro(w);
      for (const s of [ab.pos - ab.larg / 2, ab.pos + ab.larg / 2]) for (const lado of [-1, 1]) {
        extras.push([w.a[0] + q.dx * s + q.nx * lado * w.esp / 2, w.a[1] + q.dz * s + q.nz * lado * w.esp / 2]);
      }
    }
    for (const t of m.arvores) extras.push(t.pos);
    for (const md of m.medidores) extras.push(md.pos);
    for (const r of m.reguas) if (r.id !== ignorar) extras.push(r.a, r.b);
    return { paredes: m.paredes, raio: Math.max(unidadesPorPixel() * 12, 0.05), grade: est.grade, de, passoAngulo: 15, livre: e.shiftKey, extras, faces: true };
  }

  // pré-visualização da ferramenta: parede elástica, retângulo, abertura, árvore e o ponto de encaixe
  function desenharFantasma() {
    const m = est.modelo, f = est.fantasma, c = est.cursor;
    const upp = unidadesPorPixel();
    if (c && est.ferramenta !== 'selecionar' && !['janela', 'porta', 'porta-vidro'].includes(est.ferramenta)) {
      const marca = new THREE.Mesh(new THREE.CylinderGeometry(upp * 6, upp * 6, 0.02, 20), matMarca(MAT_PONTO[c.tipo] || '#1d2128'));
      marca.position.set(c.ponto[0], 0.05, c.ponto[1]);
      marca.renderOrder = 5;
      grpSobre.add(marca);
    }
    if (est.ferramenta === 'selecionar' && est.noPerto) {
      const marca = new THREE.Mesh(new THREE.CylinderGeometry(upp * 7, upp * 7, 0.02, 20), matMarca('#2f7de1'));
      marca.position.set(est.noPerto[0], 0.05, est.noPerto[1]);
      marca.renderOrder = 5;
      grpSobre.add(marca);
    }
    const paredeFantasma = (a, b, chave) => {
      const L = S.dist(a, b);
      if (L < 0.01) return;
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), g = new THREE.Group();
      g.position.set(a[0], 0, a[1]); g.rotation.y = -ang;
      // a divisa é rasteira: uma faixa no chão em vez de uma parede em pé
      const divisa = est.ferramenta === 'divisa', alt = divisa ? 0.08 : m.padrao.alt;
      caixa(g, L, alt, divisa ? 0.14 : m.padrao.esp, L / 2, alt / 2, 0, MAT_NOVA, null, false);
      grpSobre.add(g);
      if (chave) {
        let txt = fmt(L) + ' m';
        if (est.digitado) txt = est.digitado.replace('.', ',') + ' m ↵';
        rotulo('medida:' + chave, txt, new THREE.Vector3((a[0] + b[0]) / 2, alt + 0.35, (a[1] + b[1]) / 2), 'rot-medida');
      }
    };
    if (tracando() && est.cadeia && c) {
      paredeFantasma(est.cadeia.pontos[est.cadeia.pontos.length - 1], c.ponto, 'elastico');
    }
    if (est.ferramenta === 'regua' && est.reguaIni && c) {
      const a = est.reguaIni, b = c.ponto;
      rotulo('medida:regua', fmt(S.dist(a, b)) + ' m', new THREE.Vector3((a[0] + b[0]) / 2, 0.02, (a[1] + b[1]) / 2), 'rot-medida');
    }
    if (est.ferramenta === 'retangulo' && est.retIni && c) {
      const a = est.retIni, b = c.ponto, q = [[a[0], a[1]], [b[0], a[1]], [b[0], b[1]], [a[0], b[1]]];
      for (let i = 0; i < 4; i++) paredeFantasma(q[i], q[(i + 1) % 4], null);
      rotulo('medida:ret', `${fmt(Math.abs(b[0] - a[0]))} × ${fmt(Math.abs(b[1] - a[1]))} m`, new THREE.Vector3((a[0] + b[0]) / 2, m.padrao.alt + 0.35, (a[1] + b[1]) / 2), 'rot-medida');
    }
    if (f && f.tipo === 'abertura') {
      const w = m.paredes.find((x) => x.id === f.parede);
      if (w) {
        const q = quadro(w), g = new THREE.Group(), t = S.TIPOS_ABERTURA[f.tipoAb];
        g.position.set(w.a[0], 0, w.a[1]); g.rotation.y = -q.ang;
        caixa(g, t.larg, Math.min(t.alt, w.alt - t.peitoril - 0.05), w.esp + 0.08, f.pos, t.peitoril + Math.min(t.alt, w.alt - t.peitoril - 0.05) / 2, 0, f.ok ? MAT_OK : MAT_RUIM, null, false);
        grpSobre.add(g);
      }
    }
    if (f && f.tipo === 'arvore') {
      const s = new THREE.Mesh(new THREE.IcosahedronGeometry(2.4, 1), MAT_NOVA);
      s.scale.y = 0.85;
      s.position.set(f.ponto[0], 6 - 2.4 * 0.85, f.ponto[1]);
      grpSobre.add(s);
    }
    if (f && f.tipo === 'medidor') {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.03, 24), MAT_NOVA);
      s.position.set(f.ponto[0], S.ALT_MEDIDOR, f.ponto[1]);
      grpSobre.add(s);
      rotuloSonda();
    }
  }

  // ---------- Câmera ----------
  function tamanho() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    const asp = w / h, meia = 10;
    camPlanta.left = -meia * asp; camPlanta.right = meia * asp; camPlanta.top = meia; camPlanta.bottom = -meia;
    camPlanta.updateProjectionMatrix();
    cam3d.aspect = asp; cam3d.updateProjectionMatrix();
    pedir();
  }
  function unidadesPorPixel() {
    const h = canvas.clientHeight || 600;
    if (est.vista === 'planta') return (camPlanta.top - camPlanta.bottom) / camPlanta.zoom / h;
    const d = cam3d.position.distanceTo(ctl3d.target);
    return 2 * d * Math.tan(cam3d.fov * RAD / 2) / h;
  }
  function enquadrar() {
    const c = new THREE.Vector3(limites.ccx, 0, limites.ccz), r = limites.rc, R = raioTraj() + 1.4;
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1, asp = w / h;
    // a rosa dos ventos inteira cabe no pedaço da tela que os painéis deixam livre
    const L = livre();
    camPlanta.zoom = Math.max(0.05, Math.min(L.w, L.h) * 0.96 / (2 * R) * 20 / h);
    camPlanta.updateProjectionMatrix();
    const upp = 20 / camPlanta.zoom / h;
    ctlPlanta.target.set(c.x - (L.cx - w / 2) * upp, 0, c.z - (L.cy - h / 2) * upp);
    camPlanta.position.set(ctlPlanta.target.x, 200, ctlPlanta.target.z);
    ctlPlanta.update();
    ctl3d.target.set(c.x, 0.8, c.z + r * 0.1);
    // distância para a casa caber no campo de visão mais estreito (no celular em pé, o horizontal)
    const meiaV = cam3d.fov * RAD / 2, meiaH = Math.atan(Math.tan(meiaV) * asp);
    const dist = r * 1.15 / Math.sin(Math.min(meiaV, meiaH));
    const dir = new THREE.Vector3(-0.38, 0.78, 0.5).normalize();
    cam3d.position.copy(ctl3d.target).addScaledVector(dir, dist);
    ctl3d.update();
    pedir();
  }
  // retângulo da tela sem os painéis: no computador, entre as ferramentas e o painel lateral; no celular, entre a vista e o relógio
  function livre() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const r = (sel) => { const n = document.querySelector(sel); return n && n.getClientRects().length ? n.getBoundingClientRect() : null; };
    const topo = r('.topo'), vista = r('.vista'), lat = r('.lateral'), tempo = r('.tempo');
    let x0 = 0, x1 = w, y0 = 0, y1 = tempo ? tempo.top - 8 : h;
    if (w <= 560) { y0 = Math.max(topo ? topo.bottom : 0, vista ? vista.bottom : 0) + 8; }
    else {
      if (topo) x0 = topo.right + 8;
      if (lat) x1 = lat.left - 8;
      else if (vista && w > 860) y0 = vista.bottom;
      if (x1 - x0 < w * 0.4) { x0 = 0; x1 = w; }
    }
    return { w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  }

  function mudarVista(v) {
    est.vista = v;
    // na planta, realces e fantasmas ficam por cima de tudo; no 3D respeitam a profundidade
    for (const mt of [MAT_SEL, MAT_HOVER, MAT_OK, MAT_RUIM, MAT_NOVA]) mt.depthTest = v === '3d';
    ctlPlanta.enabled = v === 'planta';
    ctl3d.enabled = v === '3d';
    document.querySelectorAll('[data-vista]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.vista === v)));
    aplicarVisibilidade();
    destacar();
    salvar();
  }

  // ---------- Ponteiro ----------
  const ray = new THREE.Raycaster();
  ray.params.Line.threshold = 0.01;
  ray.params.Points.threshold = 0.01;
  const plano = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const ndc = new THREE.Vector2();
  function raio(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, cam());
    return ray;
  }
  function pontoChao(e) {
    const p = new THREE.Vector3();
    return raio(e).ray.intersectPlane(plano, p) ? [p.x, p.z] : null;
  }
  // ponto no plano vertical da parede (no 3D, o chão fica atrás da parede)
  function pontoNaParede(e, w) {
    if (est.vista === 'planta') return pontoChao(e);
    const q = quadro(w), n = new THREE.Vector3(q.nx, 0, q.nz);
    const pl = new THREE.Plane().setFromNormalAndCoplanarPoint(n, new THREE.Vector3(w.a[0], 0, w.a[1]));
    const p = new THREE.Vector3();
    return raio(e).ray.intersectPlane(pl, p) ? [p.x, p.z] : pontoChao(e);
  }
  // ponto num plano horizontal na altura y (o sensor de um medidor)
  function pontoNaAltura(e, y) {
    const p = new THREE.Vector3();
    return raio(e).ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -y), p) ? [p.x, p.z] : null;
  }
  function dadosDe(obj) {
    for (let o = obj; o; o = o.parent) if (o.userData && o.userData.tipo) return o.userData;
    return null;
  }

  // o que está sob o ponteiro. A régua, que fica por cima de tudo, ganha pelo rótulo; pelo traço ela só
  // ganha do que é grande (o piso de um cômodo, a copa de uma árvore), para uma régua encostada numa parede
  // não impedir de escolher a parede
  function escolher(e) {
    const r = reguaSob(e);
    if (r && r.parte === 'rotulo') return { tipo: 'regua', id: r.id };
    const o = escolherObjeto(e);
    return r && (!o || o.tipo === 'comodo' || o.tipo === 'arvore') ? { tipo: 'regua', id: r.id } : o;
  }
  function escolherObjeto(e) {
    const m = est.modelo;
    if (est.vista === '3d') {
      const hits = raio(e).intersectObjects([grpCasa], true);
      let vidro = null; // um medidor visto através de um vidro ganha do vidro
      for (const h of hits) {
        const d = dadosDe(h.object);
        if (!d || d.tipo === 'teto') continue;
        if (!vidro && d.tipo === 'abertura' && h.object.material.transparent) { vidro = d; continue; }
        if (vidro && d.tipo !== 'medidor') break;
        if (d.tipo === 'comodo') return { tipo: 'comodo', ponto: d.ponto };
        return { tipo: d.tipo, id: d.id };
      }
      return vidro ? { tipo: vidro.tipo, id: vidro.id } : null;
    }
    const p = pontoChao(e);
    if (!p) return null;
    const upp = unidadesPorPixel();
    for (const md of m.medidores) if (S.dist(p, md.pos) <= Math.max(0.15, upp * 9)) return { tipo: 'medidor', id: md.id };
    let melhor = null, dmin = Infinity;
    for (const w of m.paredes) {
      const pr = S.projetar(p, w.a, w.b), tol = Math.max(w.esp / 2, upp * 7);
      if (pr.dist <= tol && pr.dist < dmin) { dmin = pr.dist; melhor = { w, s: pr.tc * S.dist(w.a, w.b) }; }
    }
    if (melhor) {
      const ab = m.aberturas.find((a) => a.parede === melhor.w.id && Math.abs(a.pos - melhor.s) <= a.larg / 2 + upp * 3);
      return ab ? { tipo: 'abertura', id: ab.id } : { tipo: 'parede', id: melhor.w.id };
    }
    for (const t of m.arvores) if (S.dist(p, t.pos) <= t.copa) return { tipo: 'arvore', id: t.id };
    const c = acharComodo(p);
    return c ? { tipo: 'comodo', ponto: c.centro } : null;
  }

  // parede sob o ponteiro, para pôr ou arrastar uma abertura
  function paredeSob(e) {
    const m = est.modelo;
    if (est.vista === '3d') {
      const hits = raio(e).intersectObjects([grpCasa], true);
      for (const h of hits) {
        const d = dadosDe(h.object);
        if (!d || d.tipo === 'teto' || d.tipo === 'arvore' || d.tipo === 'medidor') continue;
        let w = null;
        if (d.tipo === 'parede') w = m.paredes.find((x) => x.id === d.id);
        if (w && S.ehDivisa(w)) continue; // divisa não aceita abertura
        if (d.tipo === 'abertura') { const ab = m.aberturas.find((x) => x.id === d.id); w = ab && m.paredes.find((x) => x.id === ab.parede); }
        if (!w) return null;
        const pr = S.projetar([h.point.x, h.point.z], w.a, w.b);
        return { w, s: pr.tc * S.dist(w.a, w.b) };
      }
      return null;
    }
    const p = pontoChao(e);
    if (!p) return null;
    const upp = unidadesPorPixel();
    let melhor = null, dmin = Infinity;
    for (const w of m.paredes) {
      if (S.ehDivisa(w)) continue;
      const pr = S.projetar(p, w.a, w.b), tol = Math.max(w.esp, upp * 14);
      if (pr.dist <= tol && pr.dist < dmin) { dmin = pr.dist; melhor = { w, s: pr.tc * S.dist(w.a, w.b) }; }
    }
    return melhor;
  }

  function opcoesEncaixe(e, de) {
    const upp = unidadesPorPixel();
    const paredes = est.modelo.paredes;
    const extras = est.cadeia ? est.cadeia.pontos.slice(0, -1) : [];
    return { paredes, raio: Math.max(upp * 12, 0.05), grade: est.grade, de, passoAngulo: 15, livre: e.shiftKey, extras };
  }

  function noPerto(p) {
    const tol = unidadesPorPixel() * 10;
    let melhor = null, dmin = tol;
    for (const n of est.der.nos) { const d = S.dist(n, p); if (d < dmin) { dmin = d; melhor = n; } }
    return melhor;
  }

  const ptrs = new Map();
  let inicio = null;

  function aoApertar(e) {
    if (e.target !== canvas) return;
    ptrs.set(e.pointerId, true);
    if (ptrs.size > 1) { inicio = null; cancelarArrasto(); return; }
    inicio = { x: e.clientX, y: e.clientY, botao: e.button, tipo: e.pointerType };
    if (e.button !== 0 || est.ferramenta !== 'selecionar') return;
    const alvo = alvoArrasto(e);
    if (alvo) {
      est.arrasto = alvo;
      ctl().enabled = false;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* sem captura */ }
    }
  }

  function alvoArrasto(e) {
    const p = pontoChao(e);
    const s = est.sel, o = objetoSel(s);
    if (s && s.tipo === 'abertura' && o) {
      const sob = paredeSob(e);
      if (sob && sob.w.id === o.parede && Math.abs(sob.s - o.pos) <= o.larg / 2 + 0.1) return { tipo: 'abertura', id: o.id, base: S.copia(est.modelo), desloc: sob.s - o.pos };
    }
    if (s && s.tipo === 'arvore' && o && p && S.dist(p, o.pos) <= o.copa) return { tipo: 'arvore', id: o.id, base: S.copia(est.modelo), desloc: [p[0] - o.pos[0], p[1] - o.pos[1]] };
    if (s && s.tipo === 'medidor' && o) {
      const q = pontoNaAltura(e, o.alt);
      if (q && S.dist(q, o.pos) <= Math.max(0.25, unidadesPorPixel() * 12)) return { tipo: 'medidor', id: o.id, base: S.copia(est.modelo), desloc: [q[0] - o.pos[0], q[1] - o.pos[1]] };
    }
    if (s && s.tipo === 'regua' && o && p) {
      // pela ponta, a régua estica; pelo meio (ou pelo rótulo), anda inteira
      const sob = reguaSob(e);
      if (sob && sob.id === o.id) return { tipo: 'regua', id: o.id, base: S.copia(est.modelo), ponta: sob.parte === 'a' || sob.parte === 'b' ? sob.parte : null, de: p };
    }
    if (p) {
      const n = noPerto(p);
      if (n) return { tipo: 'no', de: n.slice(), base: S.copia(est.modelo) };
    }
    return null;
  }

  function aoMover(e) {
    if (ptrs.size > 1) return;
    if (est.arrasto) { arrastar(e); return; }
    if (e.buttons && inicio) return; // a câmera está andando
    if (e.pointerType === 'touch') return;
    pairar(e);
  }

  function pairar(e) {
    const f = est.ferramenta;
    est.fantasma = null; est.noPerto = null;
    if (f === 'selecionar') {
      const p = pontoChao(e);
      est.noPerto = p ? noPerto(p) : null;
      const h = est.noPerto ? null : escolher(e);
      if (JSON.stringify(h) !== JSON.stringify(est.hover)) est.hover = h;
      canvas.style.cursor = est.noPerto ? 'move' : (h ? 'pointer' : 'grab');
      destacar();
      return;
    }
    est.hover = null;
    canvas.style.cursor = 'crosshair';
    if (tracando() || f === 'retangulo') {
      const p = pontoChao(e);
      if (!p) return;
      const de = tracando() && est.cadeia ? est.cadeia.pontos[est.cadeia.pontos.length - 1] : null;
      est.cursor = S.encaixar(p, opcoesEncaixe(e, de));
      if (f === 'retangulo' && est.retIni && est.cursor.tipo !== 'no') {
        est.cursor = { ponto: [S.mm(Math.round(p[0] / est.grade) * est.grade), S.mm(Math.round(p[1] / est.grade) * est.grade)], tipo: 'grade' };
        if (e.shiftKey) est.cursor = { ponto: S.mmP(p), tipo: 'livre' };
      }
    } else if (f === 'janela' || f === 'porta' || f === 'porta-vidro') {
      const sob = paredeSob(e);
      if (sob) {
        const t = S.TIPOS_ABERTURA[f];
        const r = S.encaixarAbertura(est.modelo, sob.w.id, Math.round(sob.s / 0.05) * 0.05, t.larg, null);
        est.fantasma = { tipo: 'abertura', tipoAb: f, parede: sob.w.id, pos: r.pos, ok: r.ok };
      }
    } else if (f === 'arvore') {
      const p = pontoChao(e);
      if (p) est.fantasma = { tipo: 'arvore', ponto: [S.mm(Math.round(p[0] / est.grade) * est.grade), S.mm(Math.round(p[1] / est.grade) * est.grade)] };
    } else if (f === 'medidor') {
      const p = pontoChao(e);
      if (p) {
        est.fantasma = { tipo: 'medidor', ponto: [S.mm(Math.round(p[0] / est.grade) * est.grade), S.mm(Math.round(p[1] / est.grade) * est.grade)] };
        sondar();
      }
    } else if (f === 'regua') {
      const p = pontoChao(e);
      if (p) est.cursor = S.encaixar(p, encaixeDaRegua(e, est.reguaIni, null));
    }
    destacar();
  }

  function arrastar(e) {
    const a = est.arrasto;
    if (a.tipo === 'no') {
      const p = pontoChao(e);
      if (!p) return;
      const op = opcoesEncaixe(e, null);
      op.paredes = a.base.paredes.filter((w) => S.dist(w.a, a.de) > 1e-6 && S.dist(w.b, a.de) > 1e-6);
      op.extras = [];
      const alvo = S.encaixar(p, op).ponto;
      est.modelo = S.moverNo(a.base, a.de, alvo);
      a.ate = alvo;
      est.noPerto = alvo;
    } else if (a.tipo === 'abertura') {
      const ab = a.base.aberturas.find((x) => x.id === a.id), w = a.base.paredes.find((x) => x.id === ab.parede);
      const p = pontoNaParede(e, w);
      if (!p) return;
      const s = S.projetar(p, w.a, w.b).tc * S.dist(w.a, w.b) - a.desloc;
      const r = S.encaixarAbertura(a.base, w.id, Math.round(s / 0.05) * 0.05, ab.larg, ab.id);
      const m = S.copia(a.base);
      m.aberturas.find((x) => x.id === a.id).pos = r.pos;
      est.modelo = m;
      a.ok = r.ok;
    } else if (a.tipo === 'arvore') {
      const p = pontoChao(e);
      if (!p) return;
      const m = S.copia(a.base);
      const t = m.arvores.find((x) => x.id === a.id);
      t.pos = [S.mm(Math.round((p[0] - a.desloc[0]) / est.grade) * est.grade), S.mm(Math.round((p[1] - a.desloc[1]) / est.grade) * est.grade)];
      est.modelo = m;
    } else if (a.tipo === 'medidor') {

      md.pos = [S.mm(Math.round((p[0] - a.desloc[0]) / est.grade) * est.grade), S.mm(Math.round((p[1] - a.desloc[1]) / est.grade) * est.grade)];

  function terminarArrasto() {

    const final = est.modelo;
    est.modelo = a.base;

  function cancelarArrasto() {

  function aoSoltar(e) {

      return;
    }
    if (!inicio || e.target !== canvas) { inicio = null; return; }
    const mov = Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y);

    inicio = null;
    if (mov > (e.pointerType === 'touch' ? 10 : 5)) return;
    clique(e, b);
  }

  function clique(e, botao) {
    const f = est.ferramenta;
    if (botao === 2) { terminarCadeia(); est.retIni = null; est.reguaIni = null; destacar(); return; }
    if (botao !== 0) return;
    if (e.pointerType === 'touch') pairar(e);
    if (f === 'selecionar') { selecionar(escolher(e)); return; }
    if (tracando()) {
      const p = pontoChao(e);
      if (!p) return;
      const de = est.cadeia ? est.cadeia.pontos[est.cadeia.pontos.length - 1] : null;
      cliqueParede(S.encaixar(p, opcoesEncaixe(e, de)));
      return;
    }
    if (f === 'retangulo') {
      const c = est.cursor;
      if (!c) return;
      if (!est.retIni) { est.retIni = c.ponto; destacar(); return; }
      const a = est.retIni, b = c.ponto;
      est.retIni = null;
      if (Math.abs(b[0] - a[0]) < 0.3 || Math.abs(b[1] - a[1]) < 0.3) { destacar(); return; }
      const m = S.copia(est.modelo), q = [[a[0], a[1]], [b[0], a[1]], [b[0], b[1]], [a[0], b[1]]];
      for (let i = 0; i < 4; i++) m.paredes.push(S.novaParede(m, q[i], q[(i + 1) % 4]));
      aplicar(m);
      return;
    }
    if (f === 'janela' || f === 'porta' || f === 'porta-vidro') {
      const fa = est.fantasma;
      if (!fa || fa.tipo !== 'abertura' || !fa.ok) return;
      const m = S.copia(est.modelo), ab = S.novaAbertura(m, fa.parede, fa.pos, f);
      m.aberturas.push(ab);
      est.fantasma = null;
      aplicar(m);

      return;
    }
    if (f === 'arvore') {
      const fa = est.fantasma;
      if (!fa) return;
      const m = S.copia(est.modelo), t = { id: S.novoId(m, 't'), pos: fa.ponto, alt: 6, copa: 2.4 };
      m.arvores.push(t);

    }
    if (f === 'medidor') {

  }

  function cliqueParede(enc) {
    const p = enc.ponto;

    const ult = est.cadeia.pontos[est.cadeia.pontos.length - 1];

    const m = S.copia(est.modelo);

  function terminarCadeia() { est.cadeia = null; est.digitado = ''; podar('medida:'); destacar(); }

  }

  function apagarSelecao() {
    const s = est.sel;
    if (!s || s.tipo === 'comodo') return;
    const m = S.copia(est.modelo);
    if (s.tipo === 'parede') m.paredes = m.paredes.filter((w) => w.id !== s.id);
    if (s.tipo === 'abertura') m.aberturas = m.aberturas.filter((a) => a.id !== s.id);
    if (s.tipo === 'arvore') m.arvores = m.arvores.filter((t) => t.id !== s.id);
    if (s.tipo === 'medidor') m.medidores = m.medidores.filter((x) => x.id !== s.id);

  // ---------- Teclado ----------
  const ATALHOS = { v: 'selecionar', p: 'parede', r: 'retangulo', j: 'janela', o: 'porta', g: 'porta-vidro', a: 'arvore', m: 'medidor', d: 'regua', l: 'divisa' };

    const alvo = e.target;

    if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); refazer(); return; }

    if (k === 't') { mudarVista(est.vista === 'planta' ? '3d' : 'planta'); return; }

  // ---------- Painel ----------

  function numero(rotulo, valor, op, aoMudar) {
    const inp = el('input', { type: 'number', step: op.passo || 0.01, min: op.min, max: op.max, value: +(+valor).toFixed(op.casas == null ? 2 : op.casas) });
    inp.addEventListener('change', () => {
      let v = parseFloat(String(inp.value).replace(',', '.'));
      if (!isFinite(v)) return;
      if (op.min != null) v = Math.max(op.min, v);
      if (op.max != null) v = Math.min(op.max, v);

  }
  function escolha(rotulo, valor, opcoes, aoMudar) {

  }
  function texto(rotulo, valor, aoMudar) {

  function leitura(pares) { return el('dl', { class: 'leitura' }, pares.map(([k, v]) => el('div', {}, [el('dt', {}, k), el('dd', {}, v)]))); }

  const opcoesMat = (tipo) => Object.entries(S.MATERIAIS).filter(([, v]) => v.tipo === tipo).map(([k, v]) => [k, v.nome]);
  const opcoesCor = () => Object.entries(S.CORES).map(([k, v]) => [k, `${v.nome} (absorve ${fmt(v.abs * 100, 0)}%)`]);

  function mudarModelo(f) { const m = S.copia(est.modelo); f(m); aplicar(m); }

  function montarPainel() {

  function painelSelecao() {

    if (s.tipo === 'parede') {

        escolha('Material', o.mat, opcoesMat('parede'), (v) => mudarModelo((n) => { n.paredes.find((w) => w.id === o.id).mat = v; })),
        escolha('Cor', o.cor, opcoesCor(), (v) => mudarModelo((n) => { n.paredes.find((w) => w.id === o.id).cor = v; })),
        el('div', { class: 'botoes' }, [botao('Apagar parede', apagarSelecao, 'perigo')]),
        el('p', { class: 'nota' }, 'Um muro é uma parede com outra altura: mude a altura aqui, ou em Casa, Paredes novas, antes de desenhar. Ele faz sombra e tapa o céu como qualquer parede.'),

      if (vidro && w && est.der.lados[w.id]) {

  function usarLocalizacao() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      mudarModelo((n) => {
        n.local.lat = Math.round(pos.coords.latitude * 100) / 100;
        n.local.lon = Math.round(pos.coords.longitude * 100) / 100;
        n.local.fuso = -new Date().getTimezoneOffset() / 60;
        n.local.cidade = 'Minha localização';
      });
    }, () => {}, { timeout: 10000 });
  }

  function baixar(texto, tipo, nome) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function exportar() { baixar(JSON.stringify(est.modelo, null, 2), 'application/json', 'casa-ao-sol.json'); }

  // planilha com a luz de cada medidor de meia em meia hora. Ponto e vírgula entre as colunas e vírgula
  // nos decimais, que é como as planilhas em português abrem sem perguntar nada.
  function exportarLeituras() {
    const m = est.modelo, loc = m.local, dia = S.luzDoDia(prepLuz(), loc, est.data, est.ceu, 0.5);
    const celula = (v) => (/[;"\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v));
    const linhas = [
      ['Casa ao Sol: luz natural nos medidores, em lux'],
      ['Local', loc.cidade || '', 'latitude', fmt(loc.lat), 'longitude', fmt(loc.lon)],
      ['Data', est.data.split('-').reverse().join('/')],
      ['Céu', S.CEUS[est.ceu].nome],
      [],
      ['Hora', 'Lá fora'].concat(m.medidores.map((md) => md.nome)),
    ];
    // só as horas com luz, e uma de cada lado para marcar o zero
    const claras = dia.horas.map((h, k) => k).filter((k) => dia.fora[k] > 0);
    for (let k = Math.max(0, claras[0] - 1); k <= Math.min(dia.horas.length - 2, claras[claras.length - 1] + 1); k++) {
      linhas.push([fmtHora(dia.horas[k]), Math.round(dia.fora[k])].concat(m.medidores.map((md) => Math.round(dia.medidores.get(md.id)[k].total))));
    }
    // o ﻿ na frente avisa a planilha de que o texto é UTF-8
    baixar('﻿' + linhas.map((l) => l.map(celula).join(';')).join('\r\n') + '\r\n', 'text/csv;charset=utf-8', `casa-ao-sol-leituras-${est.data}.csv`);
  }
  function importar(arq) {
    if (!arq) return;
    arq.text().then((t) => {
      const m = JSON.parse(t);
      if (!m || !Array.isArray(m.paredes)) throw new Error('arquivo sem paredes');
      est.sel = null;
      aplicar(completar(m));
      enquadrar();
    }).catch(() => { $('dica').textContent = 'Não consegui ler esse arquivo. Ele precisa ser um JSON exportado daqui.'; });
  }

  function alternarPlay() {
