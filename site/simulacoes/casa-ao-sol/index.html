    $('play-ico').innerHTML = est.tocando ? '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>' : '<path d="M4 2.5v11l9-5.5z"/>';
    $('play').setAttribute('aria-label', est.tocando ? 'Pausar' : 'Animar o dia');
    if (est.tocando && diaInfo && diaInfo.nascer != null && (est.hora > diaInfo.por + 0.25 || est.hora < diaInfo.nascer - 0.5)) est.hora = diaInfo.nascer - 0.25;
  }

  // ---------- Laço de desenho ----------
  let sujo = true, tAnt = performance.now(), ultimoTexto = 0;
  function pedir() { sujo = true; }
  function laco(t) {
    requestAnimationFrame(laco);
    const dt = Math.min(0.1, (t - tAnt) / 1000);
    tAnt = t;
    if (est.tocando) {
      est.hora += dt * est.vel;
      const fim = diaInfo && diaInfo.por != null ? diaInfo.por + 0.25 : 24;
      const ini = diaInfo && diaInfo.nascer != null ? diaInfo.nascer - 0.25 : 0;
      if (est.hora > fim) est.hora = ini;
      atualizarSol();
      if (t - ultimoTexto > 60) { mostrarHora(); ultimoTexto = t; }
    }
    avancarMapa();
    if (!sujo) return;
    sujo = false;
    if (luz.suja) atualizarLuz();
    renderer.render(cena, cam());
    posicionarRotulos();
  }

  // ---------- Ligações ----------
  document.querySelectorAll('[data-ferr]').forEach((b) => b.addEventListener('click', () => mudarFerramenta(b.dataset.ferr)));
  document.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => mudarVista(b.dataset.vista)));
  document.querySelectorAll('[data-aba]').forEach((b) => b.addEventListener('click', () => { est.aba = b.dataset.aba; montarPainel(); }));
  $('ver-dentro').addEventListener('click', () => {
    est.verDentro = !est.verDentro;
    $('ver-dentro').setAttribute('aria-pressed', String(est.verDentro));
    aplicarVisibilidade(); salvar();
  });
  $('ver-traj').addEventListener('click', () => {
    est.trajetoria = !est.trajetoria;
    $('ver-traj').setAttribute('aria-pressed', String(est.trajetoria));
    grpSol.visible = est.trajetoria;
    discoSol.visible = est.trajetoria && solAgora && solAgora.altitude > -RAD;
    pedir(); salvar();
  });
  $('ver-mapa').addEventListener('click', alternarMapa);
  $('desfazer').addEventListener('click', desfazer);
  $('refazer').addEventListener('click', refazer);
  $('btn-painel').addEventListener('click', () => { document.body.classList.toggle('painel-aberto'); });
  $('play').addEventListener('click', alternarPlay);
  $('vel').addEventListener('change', (e) => { est.vel = parseFloat(e.target.value); });
  inpHora.addEventListener('input', () => { est.hora = +inpHora.value / 60; $('hora-txt').textContent = fmtHora(est.hora); atualizarSol(); salvar(); });
  inpData.addEventListener('change', () => mudarData(inpData.value));
  const selCeu = $('ceu');
  for (const k in S.CEUS) selCeu.append(el('option', { value: k }, S.CEUS[k].nome));
  selCeu.addEventListener('change', () => { est.ceu = selCeu.value; luz.diaSujo = true; atualizarSol(); salvar(); });
  canvas.addEventListener('pointerdown', aoApertar, true);
  canvas.addEventListener('pointermove', aoMover);
  window.addEventListener('pointerup', aoSoltar);
  window.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); cancelarArrasto(); inicio = null; });
  canvas.addEventListener('pointerleave', () => { if (!est.arrasto && (est.hover || est.fantasma || est.noPerto)) { est.hover = null; est.fantasma = null; est.noPerto = null; destacar(); } });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('dblclick', () => { if (est.cadeia) terminarCadeia(); });
  window.addEventListener('keydown', aoTeclar);
  window.addEventListener('resize', tamanho);
  ctlPlanta.addEventListener('change', () => { pedir(); if (est.cursor || est.noPerto) destacar(); });
  ctl3d.addEventListener('change', pedir);

  // alturas dos painéis em variáveis CSS, para o celular empilhar tudo sem sobrepor
  const raiz = document.documentElement.style;
  const medir = () => {
    raiz.setProperty('--topo-h', document.querySelector('.topo').offsetHeight + 'px');
    raiz.setProperty('--vista-h', document.querySelector('.vista').offsetHeight + 'px');
    raiz.setProperty('--tempo-h', document.querySelector('.tempo').offsetHeight + 'px');
  };
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(medir);
    document.querySelectorAll('.topo, .vista, .tempo').forEach((n) => ro.observe(n));
  }
  medir();

  // ---------- Início ----------
  const salvo = carregar();
  if (salvo) {
    est.modelo = S.normalizar(completar(salvo.modelo));
    if (/^\d{4}-\d{2}-\d{2}$/.test(salvo.data || '')) est.data = salvo.data;
    if (typeof salvo.hora === 'number') est.hora = salvo.hora;
    if (S.CEUS[salvo.ceu]) est.ceu = salvo.ceu;
    if (salvo.vista === '3d' || salvo.vista === 'planta') est.vista = salvo.vista;
    if (typeof salvo.verDentro === 'boolean') est.verDentro = salvo.verDentro;
    if (typeof salvo.trajetoria === 'boolean') est.trajetoria = salvo.trajetoria;
    if (typeof salvo.mapa === 'boolean') est.mapa = salvo.mapa;
  } else {
    est.modelo = S.exemplo();
  }
  est.der = S.derivar(est.modelo);
  $('ver-dentro').setAttribute('aria-pressed', String(est.verDentro));
  $('ver-traj').setAttribute('aria-pressed', String(est.trajetoria));
  $('ver-mapa').setAttribute('aria-pressed', String(est.mapa));
  inpData.value = est.data;
  selCeu.value = est.ceu;
  tamanho();
  construir();
  enquadrar();
  mudarVista(est.vista);
  mudarFerramenta('selecionar');
  estacoes();
  mostrarHora();
  montarPainel();
  atualizarBotoesHist();
  requestAnimationFrame(laco);
  window.casaAoSol = { est, S, luz, aplicar, mudarVista, mudarFerramenta, selecionar, construirSol, atualizarSol, enquadrar, pedir, mudarData, mostrarHora, cam, canvas,
    paraTela: (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(cam()); return [(v.x + 1) / 2 * canvas.clientWidth, (1 - v.y) / 2 * canvas.clientHeight]; } };
})();
</script>
</body>
</html>
