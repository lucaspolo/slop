<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">A chihuahua Luma late AU! e espanta os pombos, enquanto o Pombo-Rei de coroa observa do telhado da igreja</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4fd6"/>
      <stop offset="0.6" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="url(#dusk)" stroke="none"/>

    <!-- igreja com o Pombo-Rei -->
    <path d="M300 120 l34 -40 l34 40 v80 h-68 z" fill="#f4e3c1"/>
    <path d="M334 80 v-22 M326 66 h16" fill="none"/>
    <path d="M322 200 v-30 a12 12 0 0 1 24 0 v30" fill="#7a4fd6"/>
    <circle cx="334" cy="132" r="10" fill="#ffd27a"/>
    <g transform="translate(334 40)">
      <ellipse cx="0" cy="8" rx="16" ry="12" fill="#8a8fa3"/>
      <circle cx="2" cy="-8" r="10" fill="#8a8fa3"/>
      <path d="M10 -8 l9 3 l-9 3 z" fill="#ffaa33" stroke-width="2"/>
      <circle cx="4" cy="-10" r="2" fill="#111" stroke="none"/>
      <path d="M-7 -16 l3 -12 l5 7 l4 -9 l4 9 l5 -7 l2 12 z" fill="#ffdd33" stroke-width="2.5"/>
    </g>

    <!-- telhados -->
    <path d="M-4 196 L60 160 L124 196 z" fill="#c4532d"/>
    <path d="M110 206 L180 172 L250 206 z" fill="#d9663a"/>
    <path d="M230 210 L290 184 L350 210 z" fill="#c4532d"/>
    <rect x="-4" y="196" width="408" height="68" fill="#4b3a6e"/>
    <path d="M-4 214 H404" fill="none" stroke-width="2"/>

    <!-- pombos fugindo -->
    <g transform="translate(250 136) rotate(-14)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="#b6bccb"/>
      <circle cx="16" cy="-9" r="8" fill="#b6bccb"/>
      <path d="M23 -10 l8 2 l-8 3 z" fill="#ffaa33" stroke-width="2"/>
      <circle cx="18" cy="-11" r="1.8" fill="#111" stroke="none"/>
      <path d="M-4 -6 q-14 -26 -22 -8 q10 0 22 8" fill="#9aa1b3"/>
    </g>
    <g transform="translate(330 222) rotate(10) scale(0.9)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="#b6bccb"/>
      <circle cx="16" cy="-9" r="8" fill="#b6bccb"/>
      <path d="M23 -10 l8 2 l-8 3 z" fill="#ffaa33" stroke-width="2"/>
      <circle cx="18" cy="-11" r="1.8" fill="#111" stroke="none"/>
      <path d="M-4 -6 q-14 -26 -22 -8 q10 0 22 8" fill="#9aa1b3"/>
    </g>
    <g transform="translate(212 84) rotate(-24) scale(0.8)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="#b6bccb"/>
      <circle cx="16" cy="-9" r="8" fill="#b6bccb"/>
      <path d="M23 -10 l8 2 l-8 3 z" fill="#ffaa33" stroke-width="2"/>
      <circle cx="18" cy="-11" r="1.8" fill="#111" stroke="none"/>
      <path d="M-4 -6 q-14 -26 -22 -8 q10 0 22 8" fill="#9aa1b3"/>
    </g>
    <!-- penas -->
    <g fill="#fff" stroke-width="2">
      <path d="M194 158 q8 -10 14 0 q-6 4 -14 0 z" transform="rotate(30 200 156)"/>
      <path d="M274 190 q8 -10 14 0 q-6 4 -14 0 z" transform="rotate(-20 280 188)"/>
      <path d="M232 112 q8 -10 14 0 q-6 4 -14 0 z"/>
    </g>

    <!-- bolinha roxa -->
    <circle cx="164" cy="224" r="10" fill="#a259ff"/>
    <path d="M158 218 q6 -4 10 2" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- a Luma -->
    <g transform="translate(92 168)">
      <!-- rabo peludo -->
      <path d="M-44 4 q-26 -18 -14 -44 q6 20 22 26 q-4 8 -8 18 z" fill="#d98a3d"/>
      <!-- corpo -->
      <ellipse cx="-12" cy="16" rx="38" ry="24" fill="#e39a4c"/>
      <path d="M-30 30 v18 M-14 34 v14 M6 32 v16 M18 28 v18" fill="none" stroke-width="7"/>
      <path d="M-30 30 v18 M-14 34 v14 M6 32 v16 M18 28 v18" fill="none" stroke="#e39a4c" stroke-width="3"/>
      <!-- peito branco -->
      <path d="M12 0 q16 18 0 34 q-12 -14 0 -34 z" fill="#fbe7cc"/>
      <!-- cabeça -->
      <circle cx="24" cy="-14" r="24" fill="#e39a4c"/>
      <!-- orelhas grandes -->
      <path d="M6 -30 l-10 -30 l24 18 z" fill="#e39a4c"/>
      <path d="M36 -34 l14 -28 l4 30 z" fill="#e39a4c"/>
      <path d="M6 -38 L1 -52 L13 -43 z M42 -37 L49 -53 L51 -37 z" fill="#ffb4a2" stroke-width="2"/>
      <!-- tufos do pelo longo -->
      <path d="M2 -6 l-10 4 l8 4 l-6 8 l10 -2" fill="#e39a4c"/>
      <!-- focinho e boca aberta -->
      <ellipse cx="42" cy="-6" rx="12" ry="9" fill="#fbe7cc"/>
      <circle cx="50" cy="-10" r="4" fill="#111"/>
      <path d="M36 2 q10 10 18 0 z" fill="#c2185b"/>
      <circle cx="24" cy="-20" r="4" fill="#111" stroke="none"/>
      <circle cx="25.5" cy="-21.5" r="1.4" fill="#fff" stroke="none"/>
      <!-- coraçãozinho na testa -->
      <path d="M18 -36 c-3 -4 -8 0 -4 4 l4 3 l4 -3 c4 -4 -1 -8 -4 -4 z" fill="#ff7ac8" stroke-width="1.5"/>
    </g>

    <!-- balão AU! -->
    <path d="M150 112 c0 -30 74 -30 74 0 c0 26 -50 26 -60 18 l-20 10 l8 -16 c-2 -4 -2 -8 -2 -12 z" fill="#fff"/>
    <text x="160" y="124" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="26" fill="#ff3d7f" stroke="none">AU!</text>
    <path d="M150 156 l10 -4 M152 168 l12 0 M150 180 l10 4" fill="none" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
