<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Células 18650 azuis em pé num gabarito laranja, ligadas por uma fita de níquel, enquanto o ferro de solda encosta numa delas e solta fumaça</title>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- parede e tapete de bancada quadriculado -->
    <rect width="400" height="260" fill="#D6EADF" stroke="none"/>
    <rect x="-4" y="196" width="408" height="68" fill="#1D6A46"/>
    <path d="M30 199 V264 M90 199 V264 M150 199 V264 M210 199 V264 M270 199 V264 M330 199 V264 M390 199 V264 M-4 220 H404 M-4 244 H404" fill="none" stroke="#3F8A63" stroke-width="2"/>

    <!-- gabarito laranja -->
    <path d="M70 192 L94 172 H344 L320 192 Z" fill="#F6B56E"/>
    <path d="M320 192 L344 172 V202 L320 222 Z" fill="#D9822F"/>
    <rect x="70" y="192" width="250" height="30" fill="#EE9B45"/>

    <!-- fileira de trás -->
    <g fill="#2F6DB3">
      <path d="M109 80 V178 A20 6 0 0 0 149 178 V80"/>
      <path d="M154 80 V178 A20 6 0 0 0 194 178 V80"/>
      <path d="M199 80 V178 A20 6 0 0 0 239 178 V80"/>
      <path d="M244 80 V178 A20 6 0 0 0 284 178 V80"/>
      <path d="M289 80 V178 A20 6 0 0 0 329 178 V80"/>
    </g>
    <g fill="#3D7CC6">
      <ellipse cx="129" cy="80" rx="20" ry="6"/>
      <ellipse cx="174" cy="80" rx="20" ry="6"/>
      <ellipse cx="219" cy="80" rx="20" ry="6"/>
      <ellipse cx="264" cy="80" rx="20" ry="6"/>
      <ellipse cx="309" cy="80" rx="20" ry="6"/>
    </g>
    <g fill="#C9CED3" stroke-width="2">
      <ellipse cx="129" cy="79" rx="8" ry="2.5"/>
      <ellipse cx="174" cy="79" rx="8" ry="2.5"/>
      <ellipse cx="219" cy="79" rx="8" ry="2.5"/>
      <ellipse cx="264" cy="79" rx="8" ry="2.5"/>
      <ellipse cx="309" cy="79" rx="8" ry="2.5"/>
    </g>

    <!-- fileira da frente, encaixada nos furos -->
    <g fill="#B86A22">
      <ellipse cx="105" cy="190" rx="23" ry="6"/>
      <ellipse cx="150" cy="190" rx="23" ry="6"/>
      <ellipse cx="195" cy="190" rx="23" ry="6"/>
      <ellipse cx="240" cy="190" rx="23" ry="6"/>
      <ellipse cx="285" cy="190" rx="23" ry="6"/>
    </g>
    <g fill="#2F6DB3">
      <path d="M85 96 V188 A20 6 0 0 0 125 188 V96"/>
      <path d="M130 96 V188 A20 6 0 0 0 170 188 V96"/>
      <path d="M175 96 V188 A20 6 0 0 0 215 188 V96"/>
      <path d="M220 96 V188 A20 6 0 0 0 260 188 V96"/>
      <path d="M265 96 V188 A20 6 0 0 0 305 188 V96"/>
    </g>
    <path d="M93 108 V176 M138 108 V176 M183 108 V176 M228 108 V176 M273 108 V176" fill="none" stroke="#6FA3E0" stroke-width="4"/>
    <g fill="#3D7CC6">
      <ellipse cx="105" cy="96" rx="20" ry="6"/>
      <ellipse cx="150" cy="96" rx="20" ry="6"/>
      <ellipse cx="195" cy="96" rx="20" ry="6"/>
      <ellipse cx="240" cy="96" rx="20" ry="6"/>
      <ellipse cx="285" cy="96" rx="20" ry="6"/>
    </g>

    <!-- fita de níquel com os pontos de solda -->
    <rect x="90" y="90" width="210" height="10" rx="2" fill="#D9DDE1"/>
    <g fill="#7D858D" stroke="none">
      <circle cx="101" cy="95" r="1.8"/><circle cx="109" cy="95" r="1.8"/>
      <circle cx="191" cy="95" r="1.8"/><circle cx="199" cy="95" r="1.8"/>
      <circle cx="236" cy="95" r="1.8"/><circle cx="244" cy="95" r="1.8"/>
      <circle cx="281" cy="95" r="1.8"/><circle cx="289" cy="95" r="1.8"/>
    </g>

    <!-- fumaça da solda -->
    <g fill="#FFFFFF" stroke-width="2.5">
      <circle cx="160" cy="70" r="6"/>
      <circle cx="170" cy="54" r="8"/>
      <circle cx="162" cy="34" r="10"/>
    </g>

    <!-- ferro de solda encostando na célula do meio da fita -->
    <g transform="translate(150 90) rotate(-140)">
      <path d="M0 -1.5 L40 -3 V3 L0 1.5 Z" fill="#C9CED3"/>
      <rect x="40" y="-5" width="44" height="10" rx="2" fill="#9AA6B2"/>
      <rect x="84" y="-10" width="10" height="20" rx="3" fill="#2A2D31"/>
      <rect x="94" y="-13" width="110" height="26" rx="13" fill="#D64545"/>
      <path d="M112 -13 V13 M126 -13 V13" fill="none" stroke-width="2.5"/>
    </g>

    <!-- carretel de estanho -->
    <circle cx="372" cy="232" r="20" fill="#9AA6B2"/>
    <circle cx="372" cy="232" r="7" fill="#5A616B"/>
    <path d="M354 224 C338 214 340 206 328 206" fill="none" stroke="#C9CED3" stroke-width="3"/>
  </g>
</svg>
