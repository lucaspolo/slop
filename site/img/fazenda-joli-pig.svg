<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">O porquinho Ed, de macacão amarelo, segura uma cesta de cenouras na horta da Fazenda Joli Pig, com uma galinha ao lado, enquanto o irmão Beto chega no caminhão azul do Joli Market</title>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- céu e morros -->
    <rect width="400" height="260" fill="#A9DCF2" stroke="none"/>
    <path d="M-4 112 C60 88 120 96 170 108 C230 92 300 86 404 104 V264 H-4 Z" fill="#8CCB5E"/>
    <path d="M-4 150 C80 138 200 140 404 150 V264 H-4 Z" fill="#7CC657"/>
    <path d="M300 28 c6 -12 26 -12 30 0 c12 -2 18 10 10 16 h-44 c-8 -4 -4 -16 4 -16 z" fill="#fff"/>

    <!-- celeiro -->
    <path d="M18 132 V80 L60 52 L102 80 V132 Z" fill="#C9483C"/>
    <path d="M10 84 L60 46 L110 84" fill="none" stroke-width="7" stroke="#5F4D47"/>
    <rect x="42" y="96" width="36" height="36" fill="#A93A30"/>
    <path d="M42 96 L78 132 M78 96 L42 132" fill="none" stroke="#FFF4EA" stroke-width="3"/>
    <rect x="50" y="64" width="20" height="14" fill="#4A3328"/>
    <path d="M52 76 h16" stroke="#F0CF63" stroke-width="4"/>

    <!-- cerca -->
    <g fill="#C99A66">
      <rect x="112" y="112" width="6" height="26"/>
      <rect x="146" y="114" width="6" height="26"/>
      <rect x="250" y="112" width="6" height="26"/>
    </g>
    <path d="M112 120 H260 M112 130 H260" fill="none" stroke="#D8B07C" stroke-width="4"/>

    <!-- canteiros com cenouras -->
    <path d="M-4 196 L120 176 L176 196 L52 222 Z" fill="#7A4E2E"/>
    <path d="M-4 226 L110 204 L168 226 L48 252 Z" fill="#7A4E2E"/>
    <g fill="#F08A2C" stroke-width="2.5">
      <path d="M22 202 l8 -2 l-3 10 z"/><path d="M58 196 l8 -2 l-3 10 z"/><path d="M94 190 l8 -2 l-3 10 z"/>
      <path d="M30 232 l8 -2 l-3 10 z"/><path d="M68 226 l8 -2 l-3 10 z"/><path d="M104 220 l8 -2 l-3 10 z"/>
    </g>
    <g fill="none" stroke="#3E8F2C" stroke-width="3">
      <path d="M26 200 l-4 -12 M26 200 l4 -13 M26 200 l9 -9"/>
      <path d="M62 194 l-4 -12 M62 194 l4 -13 M62 194 l9 -9"/>
      <path d="M98 188 l-4 -12 M98 188 l4 -13 M98 188 l9 -9"/>
      <path d="M34 230 l-4 -12 M34 230 l4 -13 M34 230 l9 -9"/>
      <path d="M72 224 l-4 -12 M72 224 l4 -13 M72 224 l9 -9"/>
      <path d="M108 218 l-4 -12 M108 218 l4 -13 M108 218 l9 -9"/>
    </g>

    <!-- galinha -->
    <g transform="translate(118 216)">
      <path d="M-14 12 C-18 -4 -4 -14 8 -8 C10 -18 22 -18 22 -8 C22 0 18 6 12 12 Z" fill="#FBF6EA"/>
      <path d="M12 -20 q3 -6 6 0 q3 -6 5 2" fill="#E3423B" stroke-width="2.5"/>
      <path d="M22 -10 l7 3 l-7 3 z" fill="#F2B43A" stroke-width="2.5"/>
      <circle cx="17" cy="-11" r="1.8" fill="#111" stroke="none"/>
      <path d="M-14 4 l-8 -6 l2 10 z" fill="#EFE6D2" stroke-width="2.5"/>
      <path d="M0 12 v8 M8 12 v8" fill="none" stroke="#F2A43A" stroke-width="3"/>
    </g>

    <!-- o Ed -->
    <g transform="translate(206 150)">
      <!-- pés -->
      <ellipse cx="-18" cy="78" rx="12" ry="7" fill="#F3E0C6"/>
      <ellipse cx="18" cy="78" rx="12" ry="7" fill="#F3E0C6"/>
      <!-- macacão amarelo -->
      <path d="M-40 34 C-42 72 -26 80 0 80 C26 80 42 72 40 34 Z" fill="#F6E27C"/>
      <path d="M-30 34 h60 v14 h-60 z" fill="#F6E27C"/>
      <rect x="-14" y="44" width="28" height="22" rx="3" fill="#FBED9F" stroke-width="2.5"/>
      <path d="M-5 62 V49 h7 a5 5 0 0 1 0 10 h-7" fill="none" stroke="#E0408A" stroke-width="3.5"/>
      <path d="M-26 34 v-8 M26 34 v-8" fill="none" stroke="#F6E27C" stroke-width="7"/>
      <!-- braço e cesta -->
      <path d="M-40 34 C-58 40 -60 52 -50 56" fill="#F3E0C6"/>
      <path d="M36 36 C54 42 60 54 52 60" fill="#F3E0C6"/>
      <path d="M40 54 h40 l-6 26 h-28 z" fill="#B7864E"/>
      <path d="M44 54 C48 34 72 34 76 54" fill="none" stroke="#8A5A36" stroke-width="4"/>
      <path d="M48 54 l6 -12 l5 12 M60 54 l6 -14 l5 14" fill="#F08A2C" stroke-width="2.5"/>
      <path d="M54 42 l-3 -8 M66 40 l2 -9" fill="none" stroke="#3E8F2C" stroke-width="3"/>
      <!-- cabeça -->
      <path d="M-34 -36 L-44 -72 L-14 -54 Z" fill="#F3E0C6"/>
      <path d="M-34 -44 L-39 -63 L-22 -53 Z" fill="#EFC4AB" stroke="none"/>
      <path d="M34 -36 L48 -66 L28 -58 Z" fill="#F3E0C6"/>
      <path d="M44 -66 l8 12 l-14 -6 z" fill="#EFC4AB"/>
      <ellipse cx="0" cy="-10" rx="48" ry="46" fill="#F3E0C6"/>
      <ellipse cx="0" cy="-2" rx="18" ry="14" fill="#F5D4BE"/>
      <path d="M-5 -6 v5 M5 -6 v5" stroke="#E5789E" stroke-width="3"/>
      <circle cx="-20" cy="-22" r="5.5" fill="#1A1414" stroke="none"/>
      <circle cx="20" cy="-22" r="5.5" fill="#1A1414" stroke="none"/>
      <circle cx="-18" cy="-24" r="1.8" fill="#fff" stroke="none"/>
      <circle cx="22" cy="-24" r="1.8" fill="#fff" stroke="none"/>
      <path d="M-28 14 Q0 30 28 14" fill="none" stroke="#6B3A22" stroke-width="3"/>
      <ellipse cx="-32" cy="2" rx="7" ry="4" fill="#F1C2AE" stroke="none"/>
      <ellipse cx="32" cy="2" rx="7" ry="4" fill="#F1C2AE" stroke="none"/>
    </g>

    <!-- caminhão do Joli Market com o Beto -->
    <g transform="translate(284 146)">
      <rect x="0" y="0" width="76" height="56" rx="4" fill="#FDF8EF"/>
      <rect x="0" y="8" width="76" height="6" fill="#A9CFF0" stroke-width="2"/>
      <text x="38" y="38" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#2F6FB3" stroke="none">JOLI</text>
      <text x="38" y="50" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#2F6FB3" stroke="none">MARKET</text>
      <path d="M76 12 h26 l14 22 v22 h-40 z" fill="#A9CFF0"/>
      <path d="M82 18 h18 l10 16 h-28 z" fill="#CFE8F7"/>
      <!-- o Beto na janela -->
      <g transform="translate(94 30)">
        <path d="M-10 -10 l-4 -12 l10 6 z M8 -10 l6 -11 l-2 9 z" fill="#F3E0C6" stroke-width="2"/>
        <circle cx="0" cy="-2" r="11" fill="#F3E0C6" stroke-width="2.5"/>
        <ellipse cx="4" cy="1" rx="5" ry="4" fill="#F5D4BE" stroke-width="2"/>
        <circle cx="-3" cy="-6" r="1.8" fill="#111" stroke="none"/>
        <circle cx="7" cy="-6" r="1.8" fill="#111" stroke="none"/>
      </g>
      <rect x="-2" y="56" width="120" height="8" rx="3" fill="#3E3E44"/>
      <circle cx="20" cy="66" r="11" fill="#222226"/><circle cx="20" cy="66" r="4" fill="#BDBDBD" stroke-width="2"/>
      <circle cx="94" cy="66" r="11" fill="#222226"/><circle cx="94" cy="66" r="4" fill="#BDBDBD" stroke-width="2"/>
    </g>
  </g>
</svg>
