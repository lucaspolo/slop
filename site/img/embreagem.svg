<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">A embreagem em corte, patinando: o pé pisa o pedal até a metade, o garfo empurra a mola diafragma e o disco esquenta entre o volante do motor e a placa de pressão</title>
  <defs>
    <pattern id="pontos" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.6" fill="#b9c1bd"/>
    </pattern>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="#dee3e0" stroke="none"/>
    <rect width="400" height="260" fill="url(#pontos)" stroke="none"/>

    <!-- calor saindo do disco -->
    <g fill="none" stroke="#e0782f" stroke-width="4">
      <path d="M118 34 q-6 -6 0 -12 q6 -6 0 -12"/>
      <path d="M134 36 q-6 -6 0 -12 q6 -6 0 -12"/>
    </g>

    <!-- virabrequim -->
    <rect x="16" y="128" width="62" height="24" rx="4" fill="#9aa1a6"/>
    <rect x="28" y="100" width="16" height="80" rx="5" fill="#666c70"/>

    <!-- eixo piloto e engrenagem do câmbio -->
    <rect x="112" y="132" width="186" height="16" rx="4" fill="#24719b"/>
    <path d="M276 96 h4 v-6 h6 v6 h4 v-6 h6 v6 h2 v88 h-2 v6 h-6 v-6 h-4 v6 h-6 v-6 h-4 z" fill="#24719b"/>
    <path d="M281 112 v56 M291 112 v56" fill="none" stroke="#174f6e" stroke-width="3"/>

    <!-- volante do motor -->
    <rect x="72" y="48" width="30" height="184" rx="6" fill="#bf4e36"/>
    <path d="M82 60 v160" fill="none" stroke="#e2735c" stroke-width="4"/>

    <!-- carcaça do platô -->
    <path d="M102 42 H218 V104 H206 V54 H102 Z" fill="#d3ab3f"/>
    <path d="M102 238 H218 V176 H206 V226 H102 Z" fill="#d3ab3f"/>

    <!-- disco de embreagem: lonas, chapa e cubo -->
    <rect x="109" y="60" width="9" height="46" rx="2" fill="#7b5339"/>
    <rect x="109" y="174" width="9" height="46" rx="2" fill="#7b5339"/>
    <rect x="124" y="60" width="9" height="46" rx="2" fill="#7b5339"/>
    <rect x="124" y="174" width="9" height="46" rx="2" fill="#7b5339"/>
    <rect x="118" y="64" width="6" height="152" fill="#24719b"/>
    <rect x="110" y="116" width="32" height="48" rx="5" fill="#24719b"/>
    <path d="M114 128 h24 M114 140 h24 M114 152 h24" fill="none" stroke="#174f6e" stroke-width="2.5"/>

    <!-- faíscas da patinação -->
    <g fill="#f2c230" stroke-width="2.5">
      <path d="M105 72 l3 -9 l2 8 l7 -3 l-5 7 l6 4 l-8 1 l-1 8 l-4 -7 l-7 3 l4 -7 z"/>
      <path d="M105 196 l3 -9 l2 8 l7 -3 l-5 7 l6 4 l-8 1 l-1 8 l-4 -7 l-7 3 l4 -7 z"/>
    </g>

    <!-- placa de pressão -->
    <rect x="140" y="60" width="22" height="52" rx="3" fill="#bf4e36"/>
    <rect x="140" y="168" width="22" height="52" rx="3" fill="#bf4e36"/>

    <!-- mola diafragma -->
    <path d="M164 70 L204 98 L214 118" fill="none" stroke="#111" stroke-width="11"/>
    <path d="M164 70 L204 98 L214 118" fill="none" stroke="#3a4d63" stroke-width="5"/>
    <path d="M164 210 L204 182 L214 162" fill="none" stroke="#111" stroke-width="11"/>
    <path d="M164 210 L204 182 L214 162" fill="none" stroke="#3a4d63" stroke-width="5"/>

    <!-- bucha guia e rolamento -->
    <rect x="232" y="122" width="34" height="36" rx="3" fill="#b3b9bc"/>
    <rect x="214" y="108" width="20" height="22" rx="3" fill="#dfe3e6"/>
    <rect x="214" y="150" width="20" height="22" rx="3" fill="#dfe3e6"/>

    <!-- garfo -->
    <path d="M226 106 L244 64 L258 30" fill="none" stroke="#111" stroke-width="12"/>
    <path d="M226 106 L244 64 L258 30" fill="none" stroke="#78848a" stroke-width="6"/>
    <circle cx="244" cy="64" r="7" fill="#dfe3e6"/>

    <!-- tubo do fluido até o pedal -->
    <path d="M258 30 C 292 60, 340 80, 366 120" fill="none" stroke="#78848a" stroke-width="4" stroke-dasharray="8 7"/>

    <!-- pedal pisado pela metade -->
    <path d="M372 128 L354 210" fill="none" stroke="#111" stroke-width="12"/>
    <path d="M372 128 L354 210" fill="none" stroke="#78848a" stroke-width="6"/>
    <circle cx="372" cy="128" r="8" fill="#dfe3e6"/>
    <rect x="334" y="206" width="40" height="12" rx="4" fill="#3a4045" transform="rotate(-14 354 212)"/>

    <!-- perna e tênis -->
    <path d="M328 182 L 318 104 C 316 92, 336 88, 340 100 L 352 178" fill="#c9a46a"/>
    <path d="M330 120 l12 -4 M333 140 l12 -4" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M324 182 C 338 170, 370 176, 384 192 C 392 204, 380 212, 364 208 L 330 204 C 314 202, 312 190, 324 182 Z" fill="#ffffff"/>
    <path d="M320 196 C 338 202, 362 206, 384 200" fill="none" stroke="#111" stroke-width="3"/>

    <!-- estado -->
    <g transform="translate(12 12)">
      <rect width="96" height="28" rx="6" fill="#a3650e"/>
      <text x="48" y="19.5" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#fff" stroke="none">PATINANDO</text>
    </g>
  </g>
</svg>
