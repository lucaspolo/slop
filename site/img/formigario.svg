<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Um formigueiro num terreno de terra com morros e uma pedra: as formigas ruivas seguem uma trilha brilhante de feromônio até um monte de comida, e as que voltam carregam um grão amarelo para o ninho, enquanto uma batedora mais clara explora fora da trilha</title>
  <defs>
    <g id="formiga" stroke="#111" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-8 -9 L-4 9 M0 -10 L0 10 M8 -9 L4 9" fill="none" stroke-width="2.5"/>
      <path d="M12 -3 Q18 -9 23 -8 M12 3 Q18 9 23 8" fill="none" stroke-width="2"/>
      <ellipse cx="-10" cy="0" rx="8.5" ry="6.5" fill="currentColor" stroke-width="3"/>
      <circle cx="0" cy="0" r="4" fill="currentColor" stroke-width="3"/>
      <circle cx="9" cy="0" r="5" fill="currentColor" stroke-width="3"/>
    </g>
    <g id="carregando">
      <use href="#formiga"/>
      <circle cx="18" cy="0" r="5.5" fill="#f2e68c" stroke="#111" stroke-width="3"/>
    </g>
  </defs>

  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- terreno e morros -->
    <rect width="400" height="260" fill="#b88a52" stroke="none"/>
    <path d="M-10 70 C 40 40, 110 50, 150 78 C 120 100, 40 104, -10 96 Z" fill="#cba06a" stroke="none"/>
    <path d="M230 230 C 270 200, 360 205, 410 226 L410 270 L230 270 Z" fill="#cba06a" stroke="none"/>
    <path d="M250 18 C 290 4, 360 10, 400 30 L400 -4 L250 -4 Z" fill="#a47643" stroke="none"/>
    <g fill="#9a6d3d" stroke="none">
      <circle cx="40" cy="236" r="3"/><circle cx="182" cy="40" r="2.5"/><circle cx="300" cy="96" r="3"/>
      <circle cx="140" cy="128" r="2.5"/><circle cx="356" cy="214" r="3"/><circle cx="214" cy="236" r="2.5"/>
    </g>

    <!-- pedra que a trilha contorna -->
    <path d="M168 96 C 176 70, 226 64, 240 86 C 252 104, 236 124, 206 124 C 180 124, 162 116, 168 96 Z" fill="#8f8a83"/>
    <path d="M186 90 C 196 80, 214 78, 224 86" fill="none" stroke="#b5b0a8" stroke-width="4"/>

    <!-- trilhas de feromônio: casa (larga) e comida (tracejada) -->
    <path d="M86 176 C 140 196, 190 168, 222 152 S 290 130, 318 136" fill="none" stroke="#ff7a2e" stroke-opacity="0.35" stroke-width="24"/>
    <path d="M86 176 C 140 196, 190 168, 222 152 S 290 130, 318 136" fill="none" stroke="#ffd646" stroke-width="5" stroke-dasharray="2 11"/>

    <!-- formigueiro -->
    <ellipse cx="66" cy="196" rx="56" ry="20" fill="none" stroke="#e2643a" stroke-width="5"/>
    <path d="M18 198 Q 66 118 114 198 Z" fill="#9c7a4f"/>
    <ellipse cx="66" cy="160" rx="11" ry="5" fill="#1a120a"/>

    <!-- monte de comida -->
    <g fill="#c8e070">
      <circle cx="322" cy="140" r="9"/><circle cx="340" cy="132" r="10"/><circle cx="356" cy="144" r="9"/>
      <circle cx="334" cy="152" r="9"/><circle cx="350" cy="158" r="8"/><circle cx="342" cy="118" r="8"/>
      <circle cx="366" cy="128" r="8"/>
    </g>
  </g>

  <!-- formigas na trilha: indo buscar (direita) e voltando com comida (esquerda) -->
  <g color="#e2643a">
    <use href="#carregando" transform="translate(108 184) rotate(196) scale(0.85)"/>
    <use href="#formiga" transform="translate(150 184) rotate(-4) scale(0.85)"/>
    <use href="#carregando" transform="translate(194 166) rotate(152) scale(0.85)"/>
    <use href="#carregando" transform="translate(238 148) rotate(160) scale(0.85)"/>
    <use href="#formiga" transform="translate(276 137) rotate(-10) scale(0.85)"/>
  </g>
  <!-- batedora explorando fora da trilha -->
  <g color="#f5a35a">
    <use href="#formiga" transform="translate(112 66) rotate(-30) scale(0.85)"/>
  </g>
  <path d="M60 94 C 74 74, 86 92, 96 76" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 8"/>
</svg>
