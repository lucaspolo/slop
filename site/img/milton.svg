<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">O porquinho Milton, de capacete e headset, pilota o helicóptero laranja PIG-MTP e resgata um porquinho pela escada, enquanto o dirigível do Lobo atira</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55aaff"/>
      <stop offset="1" stop-color="#aaddff"/>
    </linearGradient>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="url(#sky)" stroke="none"/>

    <!-- sol -->
    <circle cx="346" cy="48" r="26" fill="#ffdd33"/>

    <!-- dirigível do Lobo -->
    <g transform="translate(300 96) rotate(-6)">
      <ellipse cx="0" cy="0" rx="46" ry="20" fill="#888"/>
      <path d="M-46 0 l-14 -14 v28 z" fill="#666"/>
      <rect x="-12" y="18" width="26" height="12" rx="3" fill="#555"/>
      <!-- cara do lobo pintada no balão -->
      <path d="M8 -8 l6 -10 l6 10 M22 -8 l6 -10 l6 10" fill="#555"/>
      <ellipse cx="22" cy="2" rx="14" ry="10" fill="#555"/>
      <circle cx="17" cy="0" r="2" fill="#ff3333" stroke="none"/>
      <circle cx="27" cy="0" r="2" fill="#ff3333" stroke="none"/>
      <path d="M16 7 l3 3 l3 -3 l3 3 l3 -3" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
    <!-- tiro do lobo -->
    <circle cx="262" cy="134" r="5" fill="#ff3333"/>
    <path d="M272 128 l10 -6 M270 140 l10 2" fill="none" stroke-width="2"/>

    <!-- prédios -->
    <rect x="-4" y="168" width="70" height="96" fill="#aa5500"/>
    <rect x="66" y="196" width="56" height="68" fill="#ffaa55"/>
    <rect x="122" y="150" width="62" height="114" fill="#5555aa"/>
    <rect x="184" y="186" width="80" height="78" fill="#aa5555"/>
    <rect x="264" y="160" width="58" height="104" fill="#55aa55"/>
    <rect x="322" y="200" width="82" height="64" fill="#ffaa55"/>
    <g fill="#ffff99" stroke-width="2">
      <rect x="10" y="182" width="14" height="14"/><rect x="38" y="182" width="14" height="14"/>
      <rect x="10" y="210" width="14" height="14"/><rect x="38" y="210" width="14" height="14"/>
      <rect x="136" y="166" width="12" height="16"/><rect x="160" y="166" width="12" height="16"/>
      <rect x="136" y="196" width="12" height="16"/><rect x="160" y="196" width="12" height="16"/>
      <rect x="278" y="176" width="12" height="14"/><rect x="298" y="176" width="12" height="14"/>
      <rect x="278" y="204" width="12" height="14"/><rect x="298" y="204" width="12" height="14"/>
      <rect x="80" y="210" width="12" height="12"/><rect x="200" y="200" width="16" height="12"/>
      <rect x="232" y="200" width="16" height="12"/><rect x="340" y="214" width="14" height="12"/>
    </g>

    <!-- escada -->
    <g stroke-width="2.5">
      <path d="M96 116 L92 196 M110 116 L106 196" fill="none"/>
      <path d="M95 132 h14 M94 148 h14 M93 164 h14 M93 180 h14" fill="none"/>
    </g>

    <!-- porquinho subindo a escada -->
    <g transform="translate(100 186)">
      <ellipse cx="0" cy="8" rx="11" ry="10" fill="#ffaa99"/>
      <circle cx="0" cy="-8" r="11" fill="#ffaa99"/>
      <path d="M-10 -14 q-6 -4 -4 -10 q6 2 8 6 z M10 -14 q6 -4 4 -10 q-6 2 -8 6 z" fill="#ff8877" stroke-width="2"/>
      <ellipse cx="0" cy="-5" rx="5" ry="3.5" fill="#ff8877" stroke-width="2"/>
      <circle cx="-4" cy="-12" r="1.6" fill="#111" stroke="none"/>
      <circle cx="4" cy="-12" r="1.6" fill="#111" stroke="none"/>
      <!-- bracinho acenando -->
      <path d="M-9 2 l-12 -14" fill="none"/>
      <circle cx="-22" cy="-14" r="3.5" fill="#ffaa99" stroke-width="2"/>
    </g>
    <text x="126" y="176" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="14" fill="#fff" stroke="#111" stroke-width="3" paint-order="stroke">SOCORRO!</text>

    <!-- helicóptero -->
    <g transform="translate(150 86) rotate(-5)">
      <!-- borrão do rotor -->
      <ellipse cx="0" cy="-42" rx="92" ry="6" fill="#fff" fill-opacity="0.55" stroke-dasharray="10 8"/>
      <path d="M0 -42 v14" fill="none" stroke-width="5"/>
      <!-- cauda -->
      <path d="M-40 -6 L-122 -14 L-122 2 L-40 14 z" fill="#ff5500"/>
      <path d="M-118 -28 l12 0 l4 26 l-14 0 z" fill="#fff"/>
      <circle cx="-120" cy="-6" r="12" fill="#fff" fill-opacity="0.5" stroke-dasharray="6 5"/>
      <text x="-96" y="6" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="11" fill="#fff" stroke="none">PIG-MTP</text>
      <!-- corpo -->
      <path d="M-50 -2 C-50 -30 -20 -32 10 -32 C42 -32 62 -16 62 6 C62 26 40 32 10 32 L-30 32 C-46 32 -50 20 -50 -2 z" fill="#ff5500"/>
      <path d="M-50 10 C-50 22 -44 32 -30 32 L10 32 C40 32 62 26 62 6 L-50 6 z" fill="#fff"/>
      <!-- janela com o Milton -->
      <path d="M8 -26 C34 -26 52 -14 54 2 L8 2 z" fill="#ddffff"/>
      <g transform="translate(28 -6)">
        <circle cx="0" cy="-2" r="13" fill="#f5cf8a" stroke-width="2.5"/>
        <ellipse cx="3" cy="2" rx="6" ry="4.5" fill="#e8a066" stroke-width="2"/>
        <circle cx="-5" cy="-7" r="1.8" fill="#111" stroke="none"/>
        <circle cx="8" cy="-7" r="1.8" fill="#111" stroke="none"/>
        <path d="M-6 6 q6 5 12 1" fill="none" stroke-width="2"/>
        <!-- capacete de piloto com a viseira levantada e headset com microfone -->
        <path d="M-15 -5 C-15 -24 13 -24 14 -11 z" fill="#f4f4f0" stroke-width="2.5"/>
        <path d="M-6 -19 C0 -22 8 -20 11 -15 L8 -13 C5 -17 0 -18 -5 -16 z" fill="#2a3a5c" stroke-width="1.5"/>
        <circle cx="-9" cy="-1" r="5" fill="#557755" stroke-width="2"/>
        <circle cx="-9" cy="-1" r="2.2" fill="#222" stroke="none"/>
        <path d="M-7 3 q2 7 10 8" fill="none" stroke="#222" stroke-width="1.8"/>
        <circle cx="3" cy="11" r="1.8" fill="#222" stroke="none"/>
        <!-- moletom rosa -->
        <path d="M-12 8 q12 10 24 0 l2 8 h-28 z" fill="#ffaa99" stroke-width="2"/>
      </g>
      <path d="M8 -26 L8 2" fill="none"/>
      <!-- esqui -->
      <path d="M-34 32 v12 M30 32 v12 M-46 44 h92 q8 0 10 -6" fill="none" stroke-width="4"/>
      <!-- giroflex -->
      <circle cx="-30" cy="-30" r="5" fill="#ff2222"/>
    </g>

  </g>
</svg>
