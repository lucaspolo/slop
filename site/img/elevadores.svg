<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Um prédio em corte com três elevadores: as cabines azul, laranja e verde sobem e descem nos poços, presas pelos cabos às polias da casa de máquinas e aos contrapesos, enquanto as pessoas esperam no saguão e o terminal de chamada diz qual elevador pegar</title>
  <defs>
    <pattern id="grade" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#cdd6d1" stroke-width="1"/>
    </pattern>
    <g id="pessoa" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-3 -10 V0 M3 -10 V0" fill="none"/>
      <rect x="-7" y="-23" width="14" height="14" rx="5" fill="currentColor"/>
      <circle cx="0" cy="-28.5" r="5.5" fill="#e3c9ae"/>
    </g>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- céu e chão -->
    <rect width="400" height="260" fill="#e6eae7" stroke="none"/>
    <rect width="400" height="260" fill="url(#grade)" stroke="none"/>
    <rect x="-4" y="252" width="408" height="12" fill="#9aa5a0"/>

    <!-- árvore do lado de fora -->
    <path d="M370 252 V214" fill="none" stroke-width="5"/>
    <circle cx="370" cy="200" r="20" fill="#1baf7a"/>
    <circle cx="358" cy="212" r="11" fill="#1baf7a"/>

    <!-- prédio: paredes, casa de máquinas e lajes -->
    <rect x="20" y="30" width="320" height="222" fill="#cfd6d2"/>
    <rect x="20" y="30" width="320" height="40" fill="#b8c3bd"/>
    <rect x="20" y="70" width="320" height="6" fill="#9aa5a0"/>
    <rect x="20" y="120" width="320" height="6" fill="#9aa5a0"/>
    <rect x="20" y="162" width="320" height="6" fill="#9aa5a0"/>
    <rect x="20" y="204" width="320" height="6" fill="#9aa5a0"/>

    <!-- poços -->
    <rect x="34" y="76" width="60" height="176" fill="#eef1ee"/>
    <rect x="106" y="76" width="60" height="176" fill="#eef1ee"/>
    <rect x="178" y="76" width="60" height="176" fill="#eef1ee"/>
    <g fill="none" stroke="#bfc8c3" stroke-width="2">
      <path d="M38 78 V250 M90 78 V250 M110 78 V250 M162 78 V250 M182 78 V250 M234 78 V250"/>
    </g>

    <!-- cabos: da cabine à polia e da polia ao contrapeso -->
    <g fill="none" stroke="#2c3431" stroke-width="2.5">
      <path d="M60 214 V50 M89 50 V90"/>
      <path d="M132 150 V50 M161 50 V140"/>
      <path d="M204 88 V50 M233 50 V206"/>
    </g>

    <!-- máquinas: motor e polia de tração -->
    <rect x="36" y="38" width="20" height="24" rx="3" fill="#3c7a66"/>
    <circle cx="74.5" cy="50" r="14.5" fill="#55605b"/>
    <circle cx="74.5" cy="50" r="5" fill="#aab4af"/>
    <rect x="108" y="38" width="20" height="24" rx="3" fill="#3c7a66"/>
    <circle cx="146.5" cy="50" r="14.5" fill="#55605b"/>
    <circle cx="146.5" cy="50" r="5" fill="#aab4af"/>
    <rect x="180" y="38" width="20" height="24" rx="3" fill="#3c7a66"/>
    <circle cx="218.5" cy="50" r="14.5" fill="#55605b"/>
    <circle cx="218.5" cy="50" r="5" fill="#aab4af"/>

    <!-- contrapesos -->
    <rect x="84" y="90" width="10" height="32" rx="2" fill="#55605b"/>
    <rect x="156" y="140" width="10" height="32" rx="2" fill="#55605b"/>
    <rect x="228" y="206" width="10" height="32" rx="2" fill="#55605b"/>

    <!-- cabine A, no térreo, de porta aberta e com alguém dentro -->
    <rect x="38" y="214" width="44" height="32" rx="3" fill="#2a78d6"/>
    <rect x="45" y="219" width="30" height="27" fill="#efe9da"/>
    <use href="#pessoa" transform="translate(60 246) scale(.78)" color="#e34948"/>
    <path d="M45 219 V246 M75 219 V246" fill="none" stroke-width="2.5"/>

    <!-- cabine B, subindo entre andares -->
    <rect x="110" y="150" width="44" height="32" rx="3" fill="#eb6834"/>
    <text x="132" y="175" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="20" fill="#fff" stroke="#111" stroke-width="2" paint-order="stroke">B</text>
    <path d="M132 144 l-7 0 7 -9 7 9 Z" fill="#ffb224" stroke-width="2.5"/>

    <!-- cabine C, parada no último andar -->
    <rect x="182" y="88" width="44" height="32" rx="3" fill="#1baf7a"/>
    <text x="204" y="113" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="20" fill="#fff" stroke="#111" stroke-width="2" paint-order="stroke">C</text>

    <!-- saguão do 2º andar: alguém esperando com o botão de subir aceso -->
    <rect x="244" y="138" width="12" height="16" rx="2" fill="#2a3531"/>
    <path d="M250 141 l-4 5 h8 Z" fill="#ffb224" stroke="#ffb224" stroke-width="1.5"/>
    <use href="#pessoa" transform="translate(278 162)" color="#6250d6"/>

    <!-- térreo: fila no terminal de chamada de destino -->
    <use href="#pessoa" transform="translate(262 246)" color="#eda100"/>
    <use href="#pessoa" transform="translate(290 246)" color="#e87ba4"/>
    <path d="M326 246 V226" fill="none" stroke-width="4"/>
    <rect x="310" y="206" width="26" height="22" rx="3" fill="#17130c"/>
    <text x="323" y="223" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="14" fill="#ffb224" stroke="none">B</text>
  </g>
</svg>
