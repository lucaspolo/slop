<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">O eixo traseiro numa curva: o cardã gira o pinhão e a coroa, e os satélites deixam a roda de fora girar mais rápido que a de dentro</title>
  <defs>
    <pattern id="grade" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#c7cfd7" stroke-width="1.5"/>
    </pattern>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="#e8ecf0" stroke="none"/>
    <rect width="400" height="260" fill="url(#grade)" stroke="none"/>

    <!-- a conta das rotações -->
    <g transform="translate(14 14)">
      <rect width="160" height="34" rx="8" fill="#fff"/>
      <text x="12" y="23" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="14" stroke="none"><tspan fill="#1f9584">258</tspan><tspan fill="#111"> + </tspan><tspan fill="#5263d1">386</tspan><tspan fill="#111"> = 2 × </tspan><tspan fill="#c0612a">322</tspan></text>
    </g>

    <!-- semieixos -->
    <rect x="60" y="143" width="120" height="14" rx="4" fill="#1f9584"/>
    <rect x="236" y="143" width="112" height="14" rx="4" fill="#5263d1"/>

    <!-- caixa de satélites -->
    <circle cx="214" cy="150" r="42" fill="#7b8ea3"/>
    <circle cx="214" cy="150" r="30" fill="#5f7187"/>
    <!-- satélites -->
    <ellipse cx="214" cy="126" rx="14" ry="8" fill="#cf4436"/>
    <ellipse cx="214" cy="174" rx="14" ry="8" fill="#cf4436"/>
    <path d="M214 118 v64" fill="none" stroke="#9aa6b2" stroke-width="4"/>
    <!-- planetárias -->
    <ellipse cx="198" cy="150" rx="8" ry="20" fill="#1f9584"/>
    <ellipse cx="230" cy="150" rx="8" ry="20" fill="#5263d1"/>

    <!-- coroa -->
    <ellipse cx="180" cy="150" rx="21" ry="66" fill="none" stroke-width="8" stroke-dasharray="3 6" stroke-linecap="butt"/>
    <ellipse cx="180" cy="150" rx="18" ry="62" fill="#c0612a"/>
    <ellipse cx="184" cy="150" rx="9" ry="34" fill="#a64f1f"/>

    <!-- cardã e pinhão -->
    <path d="M172 192 L118 268" fill="none" stroke="#111" stroke-width="20" stroke-linecap="butt"/>
    <path d="M172 192 L118 268" fill="none" stroke="#9aa6b2" stroke-width="14" stroke-linecap="butt"/>
    <path d="M192 176 l-10 26 l-22 -16 z" fill="#d49a1f"/>
    <path d="M144 236 l14 10 M132 252 l14 10" fill="none" stroke="#d49a1f" stroke-width="4"/>

    <!-- roda de dentro (esquerda): mais devagar -->
    <g transform="translate(52 150)">
      <ellipse cx="0" cy="0" rx="30" ry="62" fill="#24282d"/>
      <ellipse cx="4" cy="0" rx="17" ry="38" fill="#9aa6b2"/>
      <ellipse cx="6" cy="0" rx="6" ry="13" fill="#1f9584"/>
    </g>
    <path d="M28 70 q24 -18 48 0" fill="none" stroke="#1f9584" stroke-width="5"/>
    <path d="M70 60 l8 12 l-14 2" fill="none" stroke="#1f9584" stroke-width="5"/>

    <!-- roda de fora (direita): mais depressa -->
    <g transform="translate(350 150)">
      <ellipse cx="0" cy="0" rx="30" ry="62" fill="#24282d"/>
      <ellipse cx="-4" cy="0" rx="17" ry="38" fill="#9aa6b2"/>
      <ellipse cx="-6" cy="0" rx="6" ry="13" fill="#5263d1"/>
    </g>
    <path d="M284 112 q36 -44 82 -22" fill="none" stroke="#5263d1" stroke-width="5"/>
    <path d="M354 78 l13 12 l-16 5" fill="none" stroke="#5263d1" stroke-width="5"/>
    <path d="M278 98 l-8 -6 M288 88 l-4 -9" fill="none" stroke="#5263d1" stroke-width="3"/>

    <!-- rotações das rodas -->
    <g font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="15" stroke="none">
      <text x="22" y="238" fill="#1f9584">258 rpm</text>
      <text x="312" y="238" fill="#5263d1">386 rpm</text>
    </g>
  </g>
</svg>
