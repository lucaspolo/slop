<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Um guarda de trânsito apita e manda o próximo bloco colorido de uma fila de tarefas entrar em um processador de quatro núcleos, enquanto embaixo uma linha do tempo mostra o que cada núcleo executou</title>
  <defs>
    <g id="tarefa" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-7 15 V24 M7 15 V24" fill="none"/>
      <rect x="-15" y="-15" width="30" height="30" rx="5" fill="currentColor"/>
      <circle cx="-6" cy="-3" r="2.2" fill="#111" stroke="none"/>
      <circle cx="6" cy="-3" r="2.2" fill="#111" stroke="none"/>
      <path d="M-5 6 Q0 10 5 6" fill="none"/>
    </g>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="#f3f0e4" stroke="none"/>
    <path d="M0 0 H400 V30 H0Z M0 60 H400 V90 H0Z M0 120 H400 V150 H0Z" fill="#e0ecd9" stroke="none"/>

    <!-- chão -->
    <rect x="-4" y="166" width="408" height="98" fill="#d3cfbd"/>

    <!-- processador -->
    <g>
      <path d="M262 44 v-10 M284 44 v-10 M306 44 v-10 M328 44 v-10 M350 44 v-10 M262 166 v10 M284 166 v10 M306 166 v10 M328 166 v10 M350 166 v10 M238 66 h-10 M238 90 h-10 M238 114 h-10 M238 138 h-10 M374 66 h10 M374 90 h10 M374 114 h10 M374 138 h10" fill="none"/>
      <rect x="238" y="44" width="136" height="122" rx="8" fill="#0d7555"/>
      <rect x="250" y="56" width="52" height="46" rx="4" fill="#e6efdf"/>
      <rect x="310" y="56" width="52" height="46" rx="4" fill="#e6efdf"/>
      <rect x="250" y="108" width="52" height="46" rx="4" fill="#e6efdf"/>
      <rect x="310" y="108" width="52" height="46" rx="4" fill="#e6efdf"/>
      <rect x="262" y="67" width="28" height="26" rx="4" fill="#eb6834"/>
      <rect x="322" y="119" width="28" height="26" rx="4" fill="#6250d6"/>
      <rect x="262" y="119" width="28" height="26" rx="4" fill="#1baf7a"/>
    </g>

    <!-- fila -->
    <use href="#tarefa" x="28" y="142" color="#e87ba4"/>
    <use href="#tarefa" x="68" y="142" color="#eda100"/>
    <use href="#tarefa" x="108" y="142" color="#2a78d6"/>

    <!-- próxima, entrando -->
    <path d="M178 96 C196 76 212 74 232 80" fill="none" stroke-width="4"/>
    <path d="M222 70 L235 81 L220 90" fill="none" stroke-width="4"/>

    <!-- guarda -->
    <path d="M170 142 V166 M186 142 V166" fill="none" stroke-width="6"/>
    <rect x="160" y="98" width="36" height="50" rx="8" fill="#2a78d6"/>
    <path d="M196 106 L218 92" fill="none" stroke-width="7"/>
    <rect x="212" y="78" width="16" height="16" rx="3" fill="#e34948"/>
    <path d="M160 108 L146 124" fill="none" stroke-width="7"/>
    <circle cx="178" cy="82" r="17" fill="#e3c9ae"/>
    <path d="M158 72 Q178 52 198 72 Z" fill="#111"/>
    <rect x="154" y="70" width="48" height="6" rx="3" fill="#111"/>
    <circle cx="172" cy="82" r="2" fill="#111" stroke="none"/>
    <circle cx="184" cy="82" r="2" fill="#111" stroke="none"/>
    <circle cx="178" cy="93" r="4" fill="#eda100"/>

    <!-- linha do tempo -->
    <rect x="24" y="188" width="352" height="56" rx="5" fill="#fffdf5"/>
    <rect x="36" y="197" width="70" height="16" fill="#eb6834"/>
    <rect x="110" y="197" width="44" height="16" fill="#1baf7a"/>
    <rect x="158" y="197" width="90" height="16" fill="#2a78d6"/>
    <rect x="252" y="197" width="52" height="16" fill="#eb6834"/>
    <rect x="36" y="219" width="40" height="16" fill="#6250d6"/>
    <rect x="80" y="219" width="86" height="16" fill="#e87ba4"/>
    <rect x="170" y="219" width="58" height="16" fill="#eda100"/>
    <rect x="232" y="219" width="72" height="16" fill="#6250d6"/>
    <path d="M314 192 V240" fill="none" stroke="#0d7555"/>
  </g>
</svg>
