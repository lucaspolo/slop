<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Um cilindro em corte no tempo de explosão, com a vela faiscando e o pistão empurrando a biela e o virabrequim, ao lado de um gráfico em que o torque de um cilindro sai em picos e o do V8 é quase contínuo</title>
  <defs>
    <pattern id="pontos" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.6" fill="#c4bfb6"/>
    </pattern>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="#e3e0da" stroke="none"/>
    <rect width="400" height="260" fill="url(#pontos)" stroke="none"/>

    <!-- comandos e molas das válvulas -->
    <circle cx="92" cy="22" r="12" fill="#6c747a"/>
    <circle cx="148" cy="22" r="12" fill="#6c747a"/>
    <path d="M86 38 l12 4 l-12 4 l12 4 M142 38 l12 4 l-12 4 l12 4" fill="none" stroke="#3c5a7a" stroke-width="3"/>

    <!-- cabeçote -->
    <rect x="52" y="54" width="136" height="24" rx="4" fill="#9a958c"/>
    <!-- válvulas fechadas -->
    <path d="M92 34 V74 M148 34 V74" fill="none" stroke="#111" stroke-width="6"/>
    <path d="M92 34 V74 M148 34 V74" fill="none" stroke="#dadee1" stroke-width="2"/>
    <path d="M80 78 h24 l-5 -5 h-14 z M136 78 h24 l-5 -5 h-14 z" fill="#dadee1"/>
    <!-- vela -->
    <rect x="114" y="24" width="12" height="34" rx="3" fill="#f1efe9"/>
    <rect x="111" y="44" width="18" height="10" rx="2" fill="#a7aeb3"/>

    <!-- paredes do cilindro -->
    <rect x="58" y="78" width="18" height="98" fill="#b9b4ab"/>
    <rect x="164" y="78" width="18" height="98" fill="#b9b4ab"/>

    <!-- explosão na câmara -->
    <rect x="76" y="78" width="88" height="30" fill="#ffb52e"/>
    <path d="M120 80 l6 9 l11 -4 l-5 10 l10 5 l-12 2 l2 10 l-9 -7 l-8 7 l1 -10 l-12 -2 l10 -5 l-5 -10 l11 4 z" fill="#fff1a0" stroke-width="2.5"/>

    <!-- biela e virabrequim -->
    <circle cx="120" cy="212" r="30" fill="#858c92"/>
    <path d="M98 196 a30 30 0 0 1 44 0 l-8 8 a18 18 0 0 0 -28 0 z" fill="#5f666c"/>
    <path d="M120 130 L140 222" fill="none" stroke="#111" stroke-width="14"/>
    <path d="M120 130 L140 222" fill="none" stroke="#939ba1" stroke-width="8"/>
    <circle cx="140" cy="222" r="9" fill="#a7aeb3"/>
    <circle cx="120" cy="212" r="5" fill="#3a3e42"/>
    <path d="M78 214 a42 42 0 0 0 30 36" fill="none" stroke="#d9541a" stroke-width="5"/>
    <path d="M100 252 l10 0 l-4 -9" fill="none" stroke="#d9541a" stroke-width="5"/>

    <!-- pistão -->
    <rect x="78" y="108" width="84" height="40" rx="3" fill="#cfd3d6"/>
    <path d="M78 116 h84 M78 123 h84" fill="none" stroke="#3a3e42" stroke-width="2.5"/>
    <circle cx="120" cy="134" r="6" fill="#a7aeb3"/>

    <!-- gráfico: um cilindro em picos, o V8 quase contínuo -->
    <g transform="translate(212 118)">
      <rect width="174" height="122" rx="8" fill="#fff"/>
      <path d="M14 104 H162" fill="none" stroke="#c9c4bb" stroke-width="2"/>
      <path d="M14 104 L20 30 L32 92 L44 104 L162 104" fill="none" stroke="#d9541a" stroke-width="4"/>
      <path d="M14 70 q7 -22 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t12 0" fill="none" stroke="#2449a8" stroke-width="4"/>
      <text x="40" y="34" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#d9541a" stroke="none">1 CIL.</text>
      <text x="126" y="34" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#2449a8" stroke="none">V8</text>
    </g>

    <!-- de onde para onde -->
    <g transform="translate(212 72)">
      <rect width="124" height="30" rx="6" fill="#1d1f21"/>
      <text x="62" y="20.5" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#fff" stroke="none">VAPOR → V8</text>
    </g>
  </g>
</svg>
