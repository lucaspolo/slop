<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">O emoldurador de empadinha, um cone branco com pino, aperta a massa dentro da forminha, ao lado de empadinhas prontas e de uma bola de massa</title>
  <defs>
    <pattern id="toalha" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#F7F1E3"/>
      <rect width="16" height="16" fill="#BFD2EE"/>
      <rect x="16" y="16" width="16" height="16" fill="#BFD2EE"/>
    </pattern>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- parede azul e toalha xadrez -->
    <rect width="400" height="260" fill="#DBE6F5" stroke="none"/>
    <rect x="-4" y="186" width="408" height="78" fill="url(#toalha)"/>

    <!-- empadinhas prontas -->
    <g transform="translate(66 196)">
      <path d="M-30 -14 L-24 16 H24 L30 -14 Z" fill="#E3A857"/>
      <path d="M-24 -10 V12 M-12 -10 V14 M0 -10 V14 M12 -10 V14 M24 -10 V12" fill="none" stroke="#C4893E" stroke-width="2.5"/>
      <path d="M-32 -14 C-30 -34 30 -34 32 -14 Z" fill="#F0C27A"/>
      <path d="M-10 -22 l6 4 M2 -24 l6 4" fill="none" stroke="#C4893E" stroke-width="2.5"/>
    </g>
    <g transform="translate(112 216)">
      <path d="M-26 -12 L-21 14 H21 L26 -12 Z" fill="#E3A857"/>
      <path d="M-20 -8 V11 M-7 -8 V13 M7 -8 V13 M20 -8 V11" fill="none" stroke="#C4893E" stroke-width="2.5"/>
      <path d="M-28 -12 C-26 -30 26 -30 28 -12 Z" fill="#F0C27A"/>
      <path d="M-6 -20 l6 4" fill="none" stroke="#C4893E" stroke-width="2.5"/>
    </g>

    <!-- bola de massa e um montinho de farinha -->
    <path d="M306 216 C300 192 350 184 356 210 C360 226 312 232 306 216 Z" fill="#F0C27A"/>
    <path d="M318 200 q8 -6 18 -2" fill="none" stroke="#FFF8E8" stroke-width="3"/>
    <path d="M352 232 C356 218 384 218 390 232 Z" fill="#FFFFFF"/>
    <g fill="#FFFFFF" stroke="none">
      <circle cx="292" cy="236" r="2.5"/><circle cx="300" cy="244" r="2"/>
      <circle cx="372" cy="246" r="2.5"/><circle cx="344" cy="242" r="2"/>
    </g>

    <!-- forminha de alumínio -->
    <path d="M146 160 L160 208 H240 L254 160 Z" fill="#C9CED3"/>
    <path d="M160 166 L170 206 M176 166 L182 206 M192 166 L194 206 M208 166 L206 206 M224 166 L218 206 M240 166 L230 206" fill="none" stroke="#9AA6B2" stroke-width="2.5"/>
    <ellipse cx="200" cy="160" rx="54" ry="11" fill="#DDE1E5"/>
    <!-- massa forrando a forminha, subindo pelas bordas -->
    <ellipse cx="200" cy="160" rx="46" ry="8" fill="#F0C27A"/>
    <path d="M150 158 q4 -10 12 -4 M238 154 q8 -6 12 4" fill="#F0C27A"/>

    <!-- o emoldurador: cone oco aberto em cima, com o pino saindo do fundo -->
    <path d="M160 112 L168 158 A32 7 0 0 0 232 158 L240 112 Z" fill="#F2EFE8"/>
    <path d="M226 120 L222 152" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <ellipse cx="200" cy="112" rx="40" ry="9" fill="#FBF9F4"/>
    <ellipse cx="200" cy="112" rx="33" ry="6.5" fill="#D8D2C6"/>
    <rect x="191" y="56" width="18" height="58" fill="#F2EFE8"/>
    <circle cx="200" cy="42" r="22" fill="#F2EFE8"/>
    <path d="M188 30 q6 -6 14 -5" fill="none" stroke="#FFFFFF" stroke-width="4"/>

    <!-- tracinhos de "apertando" -->
    <path d="M160 34 q-10 8 -12 20 M146 26 q-14 12 -16 30 M240 34 q10 8 12 20 M254 26 q14 12 16 30" fill="none" stroke-width="3"/>
  </g>
</svg>
