<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Um ciclone transparente em corte: o ar entra pela lateral, desce girando junto à parede e sobe pelo tubo central, enquanto os grãos de poeira batem na parede e caem no reservatório</title>
  <defs>
    <pattern id="pontos" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.6" fill="#b7c7cf"/>
    </pattern>
    <clipPath id="corpo">
      <path d="M140 52 H262 V112 L220 190 H182 L140 112 Z"/>
    </clipPath>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="#e3ebef" stroke="none"/>
    <rect width="400" height="260" fill="url(#pontos)" stroke="none"/>

    <!-- reservatório, com o pó assentado -->
    <path d="M150 192 H252 V236 Q252 246 242 246 H160 Q150 246 150 236 Z" fill="#cfe4ee"/>
    <path d="M153 244 Q156 222 172 222 Q186 214 200 220 Q216 212 230 222 Q248 222 249 244 Z" fill="#c9823f" stroke-width="2.5"/>
    <g stroke="none">
      <circle cx="172" cy="230" r="4" fill="#ffe66b"/>
      <circle cx="190" cy="226" r="3.5" fill="#ff9e4f"/>
      <circle cx="206" cy="232" r="4" fill="#ffe66b"/>
      <circle cx="224" cy="228" r="3.5" fill="#ee6792"/>
      <circle cx="238" cy="236" r="3" fill="#ff9e4f"/>
      <circle cx="182" cy="238" r="3" fill="#ee6792"/>
      <circle cx="216" cy="240" r="3.5" fill="#ffe66b"/>
    </g>
    <path d="M150 204 H252" fill="none" stroke="#ff9e4f" stroke-width="2.5" stroke-dasharray="6 6"/>

    <!-- corpo do ciclone: cilindro e cone de plástico transparente -->
    <path d="M140 52 H262 V112 L220 190 H182 L140 112 Z" fill="#bfe0ee" fill-opacity="0.75"/>

    <g clip-path="url(#corpo)">
      <!-- ar descendo em espiral junto à parede -->
      <path d="M146 70 Q200 92 256 74 M256 74 Q200 58 150 92 Q200 116 254 96 M254 96 Q204 84 156 118 Q200 138 246 120 M246 120 Q204 112 168 144 Q200 158 232 146 M232 146 Q204 140 182 168 Q202 178 220 170"
        fill="none" stroke="#2e9fd6" stroke-width="4"/>
      <!-- ar subindo pelo centro -->
      <path d="M201 176 Q186 168 200 158 Q216 150 200 140 Q184 132 200 122 Q216 114 200 104 Q186 96 200 86"
        fill="none" stroke="#1faf79" stroke-width="4"/>
      <!-- grãos grandes escorrendo pela parede -->
      <g stroke-width="2">
        <circle cx="148" cy="100" r="5" fill="#ffe66b"/>
        <circle cx="156" cy="132" r="4.5" fill="#ff9e4f"/>
        <circle cx="250" cy="118" r="5" fill="#ffe66b"/>
        <circle cx="232" cy="150" r="4.5" fill="#ff9e4f"/>
        <circle cx="178" cy="170" r="4" fill="#ee6792"/>
      </g>
      <!-- fuligem miúda indo embora com o ar -->
      <g stroke="none">
        <circle cx="194" cy="150" r="2.5" fill="#6e63f0"/>
        <circle cx="207" cy="128" r="2.5" fill="#6e63f0"/>
        <circle cx="195" cy="106" r="2.5" fill="#b65ad8"/>
      </g>
    </g>
    <path d="M140 52 H262 V112 L220 190 H182 L140 112 Z" fill="none"/>
    <path d="M140 112 H262" fill="none" stroke-width="2" stroke-opacity="0.35"/>

    <!-- tubo central, saindo para o filtro -->
    <path d="M182 14 H220 V96 H182 Z" fill="#dceef5" fill-opacity="0.85"/>
    <path d="M201 92 V30" fill="none" stroke="#1faf79" stroke-width="4"/>
    <path d="M190 40 L201 24 L212 40" fill="none" stroke="#1faf79" stroke-width="4"/>
    <circle cx="196" cy="70" r="2.5" fill="#6e63f0" stroke="none"/>

    <!-- duto de entrada, encostado na parede -->
    <path d="M30 54 H142 V82 H30 Z" fill="#9fc6d6"/>
    <path d="M44 68 H118" fill="none" stroke="#2e9fd6" stroke-width="4"/>
    <path d="M108 58 L124 68 L108 78" fill="none" stroke="#2e9fd6" stroke-width="4"/>
    <g stroke-width="2">
      <circle cx="58" cy="62" r="4.5" fill="#ffe66b"/>
      <circle cx="76" cy="75" r="4" fill="#ff9e4f"/>
      <circle cx="92" cy="61" r="3.5" fill="#ee6792"/>
    </g>
    <g stroke="none">
      <circle cx="66" cy="72" r="2.5" fill="#6e63f0"/>
      <circle cx="98" cy="74" r="2.5" fill="#b65ad8"/>
    </g>

    <!-- grão caindo da boca do cone -->
    <path d="M201 196 V212" fill="none" stroke-width="2.5" stroke-dasharray="2 6"/>
    <circle cx="201" cy="192" r="4.5" fill="#ffe66b" stroke-width="2"/>

    <!-- legenda -->
    <g font-family="Arial Black, Impact, sans-serif" font-size="13" stroke="none">
      <text x="296" y="152" fill="#0a6a86">ar desce</text>
      <text x="296" y="170" fill="#13835a">ar sobe</text>
      <text x="296" y="188" fill="#ae440d">grão cai</text>
    </g>
    <path d="M278 147 H290" fill="none" stroke="#2e9fd6" stroke-width="5"/>
    <path d="M278 165 H290" fill="none" stroke="#1faf79" stroke-width="5"/>
    <circle cx="284" cy="183" r="5" fill="#ffe66b" stroke-width="2"/>
  </g>
</svg>
