<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">A Luma, com a bolinha roxa aos pés, joga uma cestinha de piquenique no porquinho Rosadinho, que aparece assustado no mato alto</title>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="#9fdcff" stroke="none"/>

    <!-- nuvens -->
    <path d="M300 52 q0 -16 18 -14 q8 -14 24 -4 q16 -4 16 12 q10 6 0 14 h-52 q-12 -2 -6 -8 z" fill="#fff"/>
    <path d="M196 40 q2 -12 16 -10 q8 -10 18 0 q12 0 8 10 z" fill="#fff"/>

    <!-- morros e caminho -->
    <path d="M-4 150 q90 -40 190 -6 q100 -34 218 4 v116 h-408 z" fill="#8fd26b"/>
    <path d="M150 264 q20 -60 70 -88 q30 -16 60 -30" fill="none" stroke="#ecd39d" stroke-width="22"/>

    <!-- caixa de vida do porquinho, como no jogo -->
    <g transform="translate(14 14)">
      <rect width="148" height="48" rx="8" fill="#fff8ef"/>
      <text x="10" y="20" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#3a2430" stroke="none">ROSADINHO</text>
      <text x="108" y="20" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="11" fill="#3a2430" stroke="none">Nv 4</text>
      <text x="10" y="37" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="9" fill="#b94a70" stroke="none">HP</text>
      <rect x="28" y="29" width="108" height="10" rx="5" fill="#5a4752" stroke-width="2.5"/>
      <rect x="29.5" y="30.5" width="40" height="7" rx="3.5" fill="#f0b232" stroke="none"/>
    </g>

    <!-- a Luma -->
    <g transform="translate(96 182) scale(0.88)">
      <path d="M-44 4 q-26 -18 -14 -44 q6 20 22 26 q-4 8 -8 18 z" fill="#d98a3d"/>
      <ellipse cx="-12" cy="16" rx="38" ry="24" fill="#e39a4c"/>
      <path d="M12 0 q16 18 0 34 q-12 -14 0 -34 z" fill="#fbe7cc"/>
      <circle cx="24" cy="-14" r="24" fill="#e39a4c"/>
      <path d="M6 -30 l-10 -30 l24 18 z" fill="#e39a4c"/>
      <path d="M36 -34 l14 -28 l4 30 z" fill="#e39a4c"/>
      <path d="M6 -38 L1 -52 L13 -43 z M42 -37 L49 -53 L51 -37 z" fill="#ffb4a2" stroke-width="2"/>
      <path d="M2 -6 l-10 4 l8 4 l-6 8 l10 -2" fill="#e39a4c"/>
      <ellipse cx="42" cy="-6" rx="12" ry="9" fill="#fbe7cc"/>
      <circle cx="50" cy="-10" r="4" fill="#111"/>
      <path d="M38 2 q8 6 14 0" fill="none" stroke-width="2.5"/>
      <circle cx="26" cy="-20" r="4" fill="#111" stroke="none"/>
      <circle cx="27.5" cy="-21.5" r="1.4" fill="#fff" stroke="none"/>
      <path d="M18 -36 c-3 -4 -8 0 -4 4 l4 3 l4 -3 c4 -4 -1 -8 -4 -4 z" fill="#ff7ac8" stroke-width="1.5"/>
    </g>

    <!-- cestinha voando, com o rastro -->
    <path d="M152 118 q24 -34 52 -34" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 7"/>
    <g transform="translate(222 92) rotate(18)">
      <path d="M-14 -6 q14 -24 28 0" fill="none" stroke="#a8743a" stroke-width="7"/>
      <path d="M-14 -6 q14 -24 28 0" fill="none"/>
      <path d="M-20 -6 h40 l-5 24 h-30 z" fill="#d9a35b"/>
      <path d="M-14 4 h28 M-12 12 h24" fill="none" stroke="#a8743a" stroke-width="2"/>
      <path d="M-20 -6 h40 l-3 7 h-34 z" fill="#ff5a6e"/>
      <path d="M-12 -6 l-2 7 M-2 -6 v7 M8 -6 l1 7" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M-20 -6 h40 l-3 7 h-34 z" fill="none"/>
    </g>

    <!-- o Rosadinho -->
    <g transform="translate(306 186)">
      <path d="M48 -8 q16 -8 10 6 q-6 8 4 12" fill="none"/>
      <ellipse cx="12" cy="6" rx="40" ry="30" fill="#ffb3c9"/>
      <path d="M8 -6 c-2 -3 -6 0 -3 3 l3 2 l3 -2 c3 -3 -1 -6 -3 -3 z M28 8 c-2 -3 -6 0 -3 3 l3 2 l3 -2 c3 -3 -1 -6 -3 -3 z" fill="#ff6f9c" stroke-width="1.5"/>
      <circle cx="-24" cy="-16" r="26" fill="#ffb3c9"/>
      <path d="M-44 -30 l-8 -22 l20 10 z" fill="#ffb3c9"/>
      <path d="M-14 -40 l8 -20 l10 18 z" fill="#ffb3c9"/>
