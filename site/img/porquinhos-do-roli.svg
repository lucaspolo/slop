      <path d="M-6 -50 l-12 -8 v14 z M-6 -50 l12 -8 v14 z" fill="#ff3d7f" stroke-width="2.5"/>
      <circle cx="-6" cy="-50" r="3" fill="#ff3d7f" stroke-width="2"/>
      <ellipse cx="-48" cy="-8" rx="11" ry="9" fill="#ff8fb0"/>
      <ellipse cx="-51" cy="-8" rx="1.8" ry="3" fill="#111" stroke="none"/>
      <ellipse cx="-44" cy="-8" rx="1.8" ry="3" fill="#111" stroke="none"/>
      <circle cx="-30" cy="-24" r="5" fill="#fff" stroke-width="2"/>
      <circle cx="-31" cy="-24" r="2.4" fill="#111" stroke="none"/>
      <ellipse cx="-18" cy="-8" rx="6" ry="3.5" fill="#ff7aa2" stroke="none"/>
      <circle cx="-36" cy="8" r="3.5" fill="#c2185b" stroke-width="2"/>
    </g>

    <!-- susto do porquinho -->
    <path d="M340 140 l-5 -28 h13 z" fill="#ffd23f" stroke-width="2.5"/>
    <circle cx="341" cy="149" r="4" fill="#ffd23f" stroke-width="2.5"/>

    <!-- bolinha roxa -->
    <circle cx="148" cy="214" r="10" fill="#a259ff"/>
    <path d="M142 208 q6 -4 10 2" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- mato alto na frente -->
    <path d="M-4 264 V226 l12 -20 l8 16 l10 -24 l10 22 l10 -18 l8 18 l12 -22 l8 26 h4 V264 z" fill="#4f9f48"/>
    <path d="M244 264 V222 l10 -22 l8 18 l12 -26 l10 24 l10 -20 l8 18 l12 -24 l10 26 l10 -20 l8 20 l12 -24 l10 22 l10 -18 l8 18 l12 -22 v62 z" fill="#4f9f48"/>
    <path d="M-4 264 V246 H404 V264 z" fill="#4f9f48"/>
    <path d="M-4 246 H404" fill="none" stroke="#4f9f48" stroke-width="4"/>
    <path d="M20 236 l4 -8 M64 232 l4 -9 M270 230 l4 -9 M320 228 l4 -9 M372 232 l4 -9" fill="none" stroke="#9fe07a" stroke-width="3"/>
  </g>
</svg>
