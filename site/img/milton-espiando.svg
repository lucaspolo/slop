<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- moletom rosa de estrelinhas, cortado pela borda da tela -->
    <path d="M30 210 C30 150 60 132 100 132 C140 132 170 150 170 210 z" fill="#ffb3a1"/>
    <g fill="#ffe08a" stroke-width="2">
      <path d="M52 172 l4 8 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1 z"/>
      <path d="M150 166 l3 6 l7 1 l-5 4 l1 7 l-6 -4 l-6 4 l1 -7 l-5 -4 l7 -1 z"/>
    </g>
    <!-- P vermelho -->
    <path d="M90 200 v-46 h16 a12 12 0 0 1 0 24 h-16" fill="none" stroke="#e53935" stroke-width="9"/>
    <!-- cordões -->
    <path d="M84 138 q-4 14 -2 24 M116 138 q4 14 2 24" fill="none" stroke="#9fd8c6" stroke-width="5"/>
    <!-- cabeça -->
    <ellipse cx="100" cy="86" rx="54" ry="50" fill="#f5cf8a"/>
    <!-- focinho -->
    <ellipse cx="100" cy="98" rx="20" ry="15" fill="#f0b77a"/>
    <ellipse cx="93" cy="97" rx="3" ry="4.5" fill="#c97b52" stroke="none"/>
    <ellipse cx="107" cy="97" rx="3" ry="4.5" fill="#c97b52" stroke="none"/>
    <!-- olhos -->
    <circle cx="76" cy="76" r="6" fill="#111" stroke="none"/>
    <circle cx="124" cy="76" r="6" fill="#111" stroke="none"/>
    <circle cx="78" cy="74" r="2" fill="#fff" stroke="none"/>
    <circle cx="126" cy="74" r="2" fill="#fff" stroke="none"/>
    <!-- sorriso -->
    <path d="M74 112 q26 20 52 0" fill="none" stroke-width="3.5"/>
    <!-- bochechas -->
    <ellipse cx="62" cy="100" rx="9" ry="6" fill="#ff9a8a" stroke="none" opacity="0.7"/>
    <ellipse cx="138" cy="100" rx="9" ry="6" fill="#ff9a8a" stroke="none" opacity="0.7"/>
    <!-- capacete de piloto com a viseira levantada -->
    <path d="M44 66 C46 10 154 10 156 66 z" fill="#f4f4f0"/>
    <path d="M60 40 C76 22 124 22 140 40 L132 50 C118 36 82 36 68 50 z" fill="#2a3a5c" stroke-width="3"/>
    <path d="M80 34 q12 -6 26 -4" fill="none" stroke="#aaccff" stroke-width="3"/>
    <!-- headset verde com microfone -->
    <circle cx="46" cy="82" r="15" fill="#557755"/>
    <circle cx="154" cy="82" r="15" fill="#557755"/>
    <circle cx="46" cy="82" r="7" fill="#222" stroke="none"/>
    <circle cx="154" cy="82" r="7" fill="#222" stroke="none"/>
    <path d="M150 97 Q144 118 122 116" fill="none" stroke="#222" stroke-width="4"/>
    <circle cx="120" cy="116" r="5" fill="#222" stroke="none"/>
    <!-- joinha -->
    <g transform="translate(170 132) rotate(10)">
      <rect x="-16" y="0" width="32" height="28" rx="11" fill="#f5cf8a"/>
      <rect x="-9" y="-24" width="15" height="28" rx="7.5" fill="#f5cf8a"/>
    </g>
