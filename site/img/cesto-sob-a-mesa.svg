<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Um cesto cinza parafusado embaixo do tampo de madeira da mesa guarda uma régua de tomada e uma fonte, com os cabos saindo pela lateral</title>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- parede e rodapé -->
    <rect width="400" height="260" fill="#E6E0D6" stroke="none"/>
    <rect x="-4" y="234" width="408" height="30" fill="#CFC6B8"/>

    <!-- tampo da mesa, visto de frente, e as pernas -->
    <rect x="-6" y="12" width="412" height="36" fill="#B98D5F"/>
    <path d="M24 24 h70 M140 34 h96 M276 22 h64" fill="none" stroke="#8E6740" stroke-width="2.5"/>
    <rect x="-6" y="48" width="412" height="8" fill="#9C7448"/>
    <rect x="20" y="56" width="26" height="214" fill="#A47A4E"/>
    <rect x="356" y="56" width="26" height="214" fill="#A47A4E"/>

    <!-- parede de trás e lateral do cesto -->
    <rect x="104" y="98" width="230" height="98" fill="#6B7480"/>
    <path d="M320 120 L334 98 V196 L320 208 Z" fill="#5A616B"/>

    <!-- o que mora no cesto: régua de tomada com plugues e uma fonte -->
    <rect x="116" y="108" width="140" height="18" rx="4" fill="#F4F2EE"/>
    <rect x="232" y="111" width="14" height="8" rx="2" fill="#FF3D7F" stroke-width="2"/>
    <g fill="#2A2D31">
      <rect x="132" y="86" width="20" height="24" rx="4"/>
      <rect x="164" y="90" width="20" height="20" rx="4"/>
      <rect x="196" y="84" width="20" height="26" rx="4"/>
    </g>
    <rect x="262" y="92" width="54" height="30" rx="6" fill="#2A2D31"/>
    <circle cx="303" cy="101" r="3.5" fill="#4CD37B" stroke-width="2"/>

    <!-- cabos: saem dos plugues e da fonte e descem pela lateral, longe do chão -->
    <g fill="none">
      <path d="M142 86 C140 62 230 58 300 72 C330 78 342 90 344 120 V270" stroke-width="9"/>
      <path d="M142 86 C140 62 230 58 300 72 C330 78 342 90 344 120 V270" stroke="#4B4F55" stroke-width="3.5"/>
      <path d="M174 90 C174 72 260 70 310 84 C328 90 334 104 336 124 V270" stroke-width="9"/>
      <path d="M174 90 C174 72 260 70 310 84 C328 90 334 104 336 124 V270" stroke="#4B4F55" stroke-width="3.5"/>
      <path d="M206 84 C208 70 250 76 270 92" stroke-width="9"/>
      <path d="M206 84 C208 70 250 76 270 92" stroke="#4B4F55" stroke-width="3.5"/>
    </g>

    <!-- parede da frente com os furos de ventilação e a junção dos dois módulos -->
    <rect x="90" y="120" width="230" height="88" rx="4" fill="#4B525C"/>
    <g fill="#2F3439" stroke-width="2">
      <rect x="106" y="140" width="10" height="44" rx="5"/>
      <rect x="128" y="140" width="10" height="44" rx="5"/>
      <rect x="150" y="140" width="10" height="44" rx="5"/>
      <rect x="172" y="140" width="10" height="44" rx="5"/>
      <rect x="228" y="140" width="10" height="44" rx="5"/>
      <rect x="250" y="140" width="10" height="44" rx="5"/>
      <rect x="272" y="140" width="10" height="44" rx="5"/>
      <rect x="294" y="140" width="10" height="44" rx="5"/>
    </g>
    <rect x="194" y="120" width="22" height="88" fill="#5A616B"/>
    <rect x="190" y="152" width="30" height="9" rx="2" fill="#C98A2A" stroke-width="2.5"/>

    <!-- suportes parafusados no tampo -->
    <g fill="#6B7480">
      <path d="M128 56 H166 L158 126 H136 Z"/>
      <path d="M244 56 H282 L274 126 H252 Z"/>
    </g>
    <path d="M147 62 V118 M263 62 V118" fill="none" stroke-width="2.5"/>
    <g fill="#C9CED3" stroke-width="2">
      <rect x="140" y="56" width="14" height="5" rx="1"/>
      <rect x="256" y="56" width="14" height="5" rx="1"/>
    </g>
  </g>
</svg>
