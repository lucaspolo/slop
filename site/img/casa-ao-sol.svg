<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Uma casa em corte sob o sol da tarde: a luz passa pela janela, por baixo do beiral, e desenha uma mancha amarela no piso da sala, enquanto o sol segue a trajetória tracejada do dia no céu e uma árvore faz sombra do lado de fora</title>
  <defs>
    <pattern id="grade" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#a9cfe4" stroke-width="1"/>
    </pattern>
  </defs>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- céu quadriculado e chão -->
    <rect width="400" height="260" fill="#c7e4f4" stroke="none"/>
    <rect width="400" height="200" fill="url(#grade)" stroke="none"/>
    <rect x="-4" y="198" width="408" height="66" fill="#b7c69c"/>
    <path d="M332 200 H398 L404 212 H332 Z" fill="#8fa477" stroke="none"/>

    <!-- trajetória do sol no dia -->
    <path d="M14 196 Q200 -40 386 196" fill="none" stroke="#e98b12" stroke-width="3" stroke-dasharray="2 10"/>
    <g fill="#e98b12" stroke="none">
      <circle cx="55" cy="146" r="4"/><circle cx="140" cy="94" r="4"/><circle cx="200" cy="79" r="4"/><circle cx="260" cy="94" r="4"/><circle cx="345" cy="146" r="4"/>
    </g>

    <!-- sol -->
    <g transform="translate(95 113)">
      <path d="M0 -38 V-30 M0 30 V38 M-38 0 H-30 M30 0 H38 M-27 -27 L-21 -21 M21 21 L27 27 M-27 27 L-21 21 M21 -21 L27 -27" fill="none" stroke="#e98b12" stroke-width="4"/>
      <circle r="21" fill="#ffc93c"/>
      <path d="M-8 -3 Q-6 -7 -3 -3 M3 -3 Q6 -7 8 -3 M-7 7 Q0 13 7 7" fill="none" stroke-width="2.5"/>
    </g>
    <!-- raios até a janela -->
    <path d="M122 132 L170 150" fill="none" stroke="#e98b12" stroke-width="2.5" stroke-dasharray="6 6"/>

    <!-- interior: parede do fundo e piso -->
    <rect x="180" y="110" width="142" height="88" fill="#efe6d2"/>
    <path d="M180 166 H322" fill="none" stroke="#d8ccb2" stroke-width="2"/>
    <!-- feixe de luz entrando pela janela e a mancha no piso -->
    <path d="M181 130 L272 197 H218 L181 168 Z" fill="#ffe27a" stroke="none" opacity="0.75"/>
    <rect x="216" y="192" width="58" height="8" rx="2" fill="#ffd23f"/>
    <!-- poltrona na sala -->
    <path d="M286 198 V168 Q286 160 294 160 H306 Q314 160 314 168 V198" fill="#e46a4f"/>
    <path d="M282 198 V180 H290 V198 M318 198 V180 H310 V198" fill="#c9533c"/>

    <!-- parede da esquerda com a janela -->
    <path d="M168 110 H181 V130 H168 Z M168 168 H181 V198 H168 Z" fill="#f4f1ea"/>
    <rect x="168" y="130" width="13" height="38" fill="#a8d8f0"/>
    <path d="M174.5 130 V168" fill="none" stroke-width="2"/>
    <!-- parede da direita -->
    <rect x="320" y="110" width="13" height="88" fill="#f4f1ea"/>
    <!-- laje com beiral -->
    <rect x="142" y="96" width="212" height="14" rx="2" fill="#c4c1ba"/>
    <!-- piso -->
    <rect x="162" y="198" width="177" height="7" fill="#9b9890"/>

    <!-- árvore -->
    <path d="M372 198 V150" fill="none" stroke-width="6"/>
    <path d="M372 198 V150" fill="none" stroke="#7a5638" stroke-width="2.5"/>
    <circle cx="372" cy="138" r="24" fill="#5d8e43"/>
    <circle cx="355" cy="154" r="12" fill="#6fa452"/>

    <!-- rosa dos ventos -->
    <g transform="translate(40 228)">
      <circle r="17" fill="#f4f1ea"/>
      <path d="M0 -12 L5 3 L0 0 L-5 3 Z" fill="#d9482b" stroke-width="2"/>
      <path d="M0 12 L5 -3 L0 0 L-5 -3 Z" fill="#f4f1ea" stroke-width="2"/>
    </g>
  </g>
</svg>
