      <rect x="4" y="90" width="14" height="22" fill="#f4a261"/><rect x="22" y="94" width="18" height="18" fill="#6d597a"/><rect x="44" y="90" width="12" height="22" fill="#8ab17d"/><rect x="60" y="94" width="16" height="18" fill="#e63946"/><rect x="80" y="92" width="14" height="20" fill="#2a9d8f"/><rect x="98" y="90" width="18" height="22" fill="#e9c46a"/><rect x="120" y="94" width="12" height="18" fill="#457b9d"/><rect x="136" y="90" width="16" height="22" fill="#f4a261"/><rect x="156" y="92" width="14" height="20" fill="#d62828"/><rect x="174" y="94" width="18" height="18" fill="#8ab17d"/><rect x="196" y="90" width="14" height="22" fill="#6d597a"/><rect x="214" y="92" width="16" height="20" fill="#e9c46a"/><rect x="234" y="94" width="12" height="18" fill="#2a9d8f"/><rect x="250" y="90" width="18" height="22" fill="#e63946"/><rect x="272" y="92" width="14" height="20" fill="#457b9d"/><rect x="290" y="94" width="16" height="18" fill="#f4a261"/><rect x="310" y="90" width="14" height="22" fill="#8ab17d"/><rect x="328" y="92" width="18" height="20" fill="#e9c46a"/><rect x="350" y="94" width="14" height="18" fill="#6d597a"/><rect x="368" y="90" width="16" height="22" fill="#2a9d8f"/><rect x="388" y="92" width="12" height="20" fill="#e63946"/>
