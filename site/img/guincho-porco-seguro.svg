<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">O guincho rosa da Porco Seguro, com um porquinho ao volante e o giroflex aceso, reboca um carro vermelho de motor fervendo enquanto o pager da central mostra o chamado</title>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect width="400" height="260" fill="#9fdcff" stroke="none"/>

    <!-- prédios -->
    <rect x="196" y="70" width="84" height="130" fill="#f2f0eb"/>
    <path d="M210 86 h18 v16 h-18 z M246 86 h18 v16 h-18 z M210 116 h18 v16 h-18 z M246 116 h18 v16 h-18 z M210 146 h18 v16 h-18 z M246 146 h18 v16 h-18 z" fill="#4f6d8a" stroke-width="2.5"/>
    <rect x="290" y="96" width="114" height="104" fill="#ff86b6"/>
    <path d="M304 112 h20 v16 h-20 z M340 112 h20 v16 h-20 z M376 112 h20 v16 h-20 z M304 142 h20 v16 h-20 z M340 142 h20 v16 h-20 z M376 142 h20 v16 h-20 z" fill="#4f6d8a" stroke-width="2.5"/>
    <rect x="-4" y="104" width="64" height="96" fill="#e7e3da"/>
    <rect x="-4" y="104" width="64" height="16" fill="#2f8f5b"/>

    <!-- calçada e rua -->
    <rect x="-4" y="196" width="408" height="12" fill="#cfccc4"/>
    <rect x="-4" y="208" width="408" height="56" fill="#46494f"/>
    <path d="M10 242 h30 M80 242 h30 M150 242 h30 M220 242 h30 M290 242 h30 M360 242 h30" fill="none" stroke="#f2f2ec" stroke-width="5" stroke-linecap="butt"/>

    <!-- pager da central -->
    <g transform="translate(14 14)">
      <rect width="164" height="62" rx="10" fill="#17191e"/>
      <text x="12" y="17" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="9" fill="#ff5c9d" stroke="none">CENTRAL PORCO SEGURO</text>
      <rect x="9" y="24" width="146" height="30" rx="4" fill="#b6c99a" stroke="none"/>
      <text x="16" y="36" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="9.5" fill="#1d2914" stroke="none">DONA ROSINHA  R$ 180</text>
      <text x="16" y="49" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="9.5" fill="#1d2914" stroke="none">MOTOR FERVENDO  2:40</text>
    </g>

    <!-- carro rebocado, de frente levantada -->
    <g transform="translate(302 190) rotate(10)">
      <path d="M-74 -6 v-18 q0 -6 8 -8 l26 -4 l14 -20 h52 l18 20 l22 4 q8 2 8 10 v16 z" fill="#d23a33"/>
      <path d="M-22 -34 l10 -16 h20 v16 z M14 -34 v-16 h12 l14 16 z" fill="#24364a" stroke-width="2.5"/>
      <path d="M-74 -14 h150" fill="none" stroke="#a52822" stroke-width="3"/>
      <rect x="-78" y="-22" width="8" height="8" rx="2" fill="#fff3c4" stroke-width="2"/>
      <circle cx="-44" cy="-4" r="15" fill="#1a1a1c"/>
      <circle cx="-44" cy="-4" r="6" fill="#a3a8ae" stroke-width="2"/>
      <circle cx="46" cy="-4" r="15" fill="#1a1a1c"/>
      <circle cx="46" cy="-4" r="6" fill="#a3a8ae" stroke-width="2"/>
    </g>

    <!-- fumaça do motor -->
    <g fill="#c9ccd1">
      <circle cx="262" cy="140" r="8"/>
      <circle cx="272" cy="122" r="11"/>
      <circle cx="262" cy="100" r="14"/>
    </g>

    <!-- o guincho -->
    <!-- chassi e caçamba -->
    <rect x="34" y="194" width="210" height="10" fill="#3a3d44"/>
    <rect x="110" y="170" width="118" height="26" fill="#f4f1f2"/>
    <text x="116" y="188" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#ff5c9d" stroke="none">PORCO SEGURO</text>
    <!-- lança amarela com o gancho -->
    <rect x="206" y="130" width="14" height="66" fill="#3a3d44"/>
    <path d="M212 134 L258 168 L250 178 L204 144 z" fill="#ffc629"/>
    <path d="M224 144 l-6 8 M238 154 l-6 8" fill="none" stroke-width="4"/>
    <path d="M254 174 v8" fill="none" stroke-width="3"/>
    <path d="M248 182 h14 v6 h-14 z" fill="#3a3d44" stroke-width="2.5"/>
    <!-- cabine -->
    <path d="M34 194 v-62 q0 -12 12 -12 h58 q8 0 8 8 v66 z" fill="#ff5c9d"/>
    <path d="M42 160 v-26 q0 -6 6 -6 h52 v32 z" fill="#24364a" stroke-width="2.5"/>
    <rect x="34" y="168" width="78" height="10" fill="#d63f80"/>
    <rect x="28" y="182" width="12" height="14" rx="2" fill="#2b2c30"/>
    <rect x="30" y="170" width="8" height="8" rx="2" fill="#fff3c4" stroke-width="2"/>
    <!-- giroflex -->
    <rect x="56" y="110" width="22" height="10" rx="3" fill="#ffc629"/>
    <rect x="78" y="110" width="22" height="10" rx="3" fill="#ff6a4d"/>
    <path d="M54 102 l-6 -8 M78 98 v-10 M102 102 l6 -8" fill="none" stroke="#ffc629" stroke-width="3"/>
    <!-- porquinho ao volante -->
    <circle cx="74" cy="148" r="12" fill="#ffb3c9" stroke-width="2.5"/>
    <path d="M66 138 l-4 -8 l9 4 z M80 137 l5 -8 l2 10 z" fill="#ffb3c9" stroke-width="2"/>
    <ellipse cx="64" cy="151" rx="5" ry="4" fill="#ff8fb0" stroke-width="2"/>
    <circle cx="71" cy="144" r="1.8" fill="#111" stroke="none"/>
    <!-- rodas -->
    <circle cx="72" cy="204" r="18" fill="#1a1a1c"/>
    <circle cx="72" cy="204" r="8" fill="#cfd3d8" stroke-width="2.5"/>
    <circle cx="184" cy="204" r="18" fill="#1a1a1c"/>
    <circle cx="184" cy="204" r="8" fill="#cfd3d8" stroke-width="2.5"/>

    <!-- velocidade -->
    <path d="M378 170 h20 M384 182 h16 M374 194 h24" fill="none" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
