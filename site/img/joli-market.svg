      <circle cx="-17" cy="-23" r="1.8" fill="#fff" stroke="none"/>
      <circle cx="21" cy="-23" r="1.8" fill="#fff" stroke="none"/>
      <path d="M-26 14 Q0 30 26 14" fill="none" stroke="#6B3A22" stroke-width="3"/>
      <ellipse cx="-31" cy="2" rx="7" ry="4" fill="#F1C2AE" stroke="none"/>
      <ellipse cx="31" cy="2" rx="7" ry="4" fill="#F1C2AE" stroke="none"/>
      <!-- braço levantado acenando -->
      <path d="M38 36 C58 30 62 10 56 -2" fill="none" stroke="#111" stroke-width="13"/>
      <path d="M38 36 C58 30 62 10 56 -2" fill="none" stroke="#F3E0C6" stroke-width="8"/>
      <circle cx="55" cy="-6" r="7" fill="#F5D4BE" stroke-width="2.5"/>
    </g>

    <!-- balcão do caixa: registradora, esteira e sacolinha -->
    <rect x="244" y="186" width="152" height="10" fill="#3F4650"/>
    <path d="M250 196 H392 V246 H250 Z" fill="#A9CFF0"/>
    <path d="M250 222 H392" fill="none" stroke="#E0408A" stroke-width="6"/>
    <rect x="250" y="244" width="142" height="8" fill="#5A6470"/>
    <path d="M256 186 h52 l-4 -24 h-44 z" fill="#4A4F58"/>
    <rect x="266" y="150" width="34" height="16" rx="2" fill="#2B2B30"/>
    <rect x="270" y="153" width="26" height="10" fill="#7FD6A8" stroke="none"/>
    <path d="M262 176 h8 M276 176 h8 M290 176 h8" fill="none" stroke="#F28FAC" stroke-width="4"/>
    <rect x="316" y="180" width="70" height="6" fill="#2B2B30" stroke-width="2"/>
    <path d="M358 186 l4 -26 h20 l4 26 z" fill="#E0408A"/>
    <path d="M364 160 C364 150 380 150 380 160" fill="none" stroke="#F28FAC" stroke-width="3"/>
    <circle cx="338" cy="174" r="7" fill="#F5D142" stroke-width="2.5"/>
    <text x="338" y="178" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="9" fill="#B5603C" stroke="none">$</text>
  </g>
</svg>
