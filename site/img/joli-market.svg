<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">O porquinho Beto, de macacão azul, atende no caixa do Joli Market enquanto o jacaré Jaca repõe a banca de hortifrúti com um caixote de cenouras, e o caminhão amarelo do Ed aparece pela janela</title>
  <g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
