    <path d="M66 122 q4 -4 8 0 M88 122 q4 -4 8 0" fill="none" stroke="#4C9636" stroke-width="2.5"/>
    <g fill="#F08A2C" stroke-width="2.5"><path d="M116 136 l6 -22 l6 22 z"/><path d="M130 136 l6 -24 l6 24 z"/><path d="M144 136 l5 -20 l5 20 z"/></g>
