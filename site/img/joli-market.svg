      <path d="M-16 0 l-3 -6 M-16 0 l3 -6 M-2 -2 l-3 -6 M-2 -2 l3 -6 M12 1 l-3 -6 M12 1 l3 -6" fill="none" stroke="#3E8F2C" stroke-width="2.5"/>
      <!-- mãozinhas segurando -->
      <circle cx="-31" cy="28" r="6" fill="#74C45C" stroke-width="2.5"/>
      <circle cx="31" cy="28" r="6" fill="#74C45C" stroke-width="2.5"/>
      <!-- cabeça: focinho comprido com sorriso e olhões no alto -->
      <ellipse cx="0" cy="-34" rx="26" ry="22" fill="#74C45C"/>
      <path d="M-10 -34 C-10 -46 40 -44 44 -30 C46 -20 -4 -14 -10 -26 Z" fill="#74C45C"/>
      <path d="M-8 -24 C8 -18 30 -20 42 -28" fill="none" stroke="#2E5A2A" stroke-width="3"/>
      <path d="M4 -21 l2 -5 l2 5 M20 -21 l2 -5 l2 5" fill="#fff" stroke-width="1.5"/>
      <circle cx="36" cy="-38" r="1.8" fill="#4F9A3E" stroke="none"/>
      <ellipse cx="-16" cy="-30" rx="5" ry="3" fill="#F4A3B5" stroke="none"/>
      <circle cx="-12" cy="-56" r="11" fill="#74C45C"/>
      <circle cx="10" cy="-56" r="11" fill="#74C45C"/>
      <ellipse cx="-11" cy="-55" rx="7" ry="7.5" fill="#fff" stroke-width="2"/>
      <ellipse cx="11" cy="-55" rx="7" ry="7.5" fill="#fff" stroke-width="2"/>
      <circle cx="-9" cy="-54" r="4" fill="#1A1414" stroke="none"/>
      <circle cx="13" cy="-54" r="4" fill="#1A1414" stroke="none"/>
      <circle cx="-8" cy="-56" r="1.4" fill="#fff" stroke="none"/>
      <circle cx="14" cy="-56" r="1.4" fill="#fff" stroke="none"/>
    </g>

    <!-- o Beto atrás do caixa -->
    <g transform="translate(310 130)">
      <path d="M-34 -36 L-44 -70 L-14 -54 Z" fill="#F3E0C6"/>
      <path d="M-33 -44 L-38 -62 L-22 -53 Z" fill="#EFC4AB" stroke="none"/>
      <path d="M34 -36 L48 -64 L28 -58 Z" fill="#F3E0C6"/>
      <path d="M44 -64 l8 12 l-14 -6 z" fill="#EFC4AB"/>
      <path d="M-40 34 C-42 60 -26 70 0 70 C26 70 42 60 40 34 Z" fill="#B6D5EE"/>
      <path d="M-30 34 h60 v14 h-60 z" fill="#B6D5EE"/>
      <rect x="-14" y="42" width="28" height="22" rx="3" fill="#CFE3F4" stroke-width="2.5"/>
      <path d="M-5 60 V47 h7 a5 5 0 0 1 0 10 h-7" fill="none" stroke="#E0408A" stroke-width="3.5"/>
      <ellipse cx="0" cy="-10" rx="46" ry="44" fill="#F3E0C6"/>
      <ellipse cx="0" cy="-2" rx="17" ry="13" fill="#F5D4BE"/>
      <path d="M-5 -6 v5 M5 -6 v5" stroke="#E5789E" stroke-width="3"/>
