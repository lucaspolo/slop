      <rect x="0" y="5" width="46" height="4" fill="#F6E27C" stroke-width="2"/>
      <text x="23" y="24" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="7" fill="#E0408A" stroke="none">JOLI PIG</text>
