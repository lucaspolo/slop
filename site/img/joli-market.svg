    <rect width="400" height="260" fill="#FDF6E3" stroke="none"/>
    <rect x="-4" y="104" width="408" height="56" fill="#EAF4FB" stroke="none"/>
    <path d="M0 118 H400 M0 132 H400 M0 146 H400 M20 104 V160 M60 104 V160 M100 104 V160 M140 104 V160 M180 104 V160 M220 104 V160 M260 104 V160 M300 104 V160 M340 104 V160 M380 104 V160" fill="none" stroke="#C6DCEE" stroke-width="2"/>
    <rect x="-4" y="98" width="408" height="7" fill="#E0408A"/>
    <!-- chão quadriculado -->
