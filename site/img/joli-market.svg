      <rect x="0" y="210" width="40" height="25"/><rect x="80" y="210" width="40" height="25"/><rect x="160" y="210" width="40" height="25"/><rect x="240" y="210" width="40" height="25"/><rect x="320" y="210" width="40" height="25"/>
      <rect x="40" y="235" width="40" height="25"/><rect x="120" y="235" width="40" height="25"/><rect x="200" y="235" width="40" height="25"/><rect x="280" y="235" width="40" height="25"/><rect x="360" y="235" width="40" height="25"/>
    </g>
    <path d="M-4 160 H404" fill="none"/>

    <!-- letreiro do mercado -->
    <rect x="16" y="14" width="148" height="62" rx="10" fill="#A9CFF0"/>
    <rect x="24" y="22" width="132" height="46" rx="6" fill="#FDF8EF" stroke-width="2.5"/>
