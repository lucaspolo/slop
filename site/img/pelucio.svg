<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">O porquinho Pelúcio entrega um latte no balcão da Joli Coffee para um cliente coelhinho, ao lado da máquina de espresso e de um pão de queijo</title>
  <defs>
    <pattern id="xadrez" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#FBEEE9"/>
      <rect width="20" height="20" fill="#F0D0C7"/>
      <rect x="20" y="20" width="20" height="20" fill="#F0D0C7"/>
    </pattern>
  </defs>
  <g stroke="#3B2420" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- parede menta e piso xadrez -->
    <rect width="400" height="260" fill="#BFE2D6" stroke="none"/>
    <path d="M0 150 H400" fill="none" stroke="#9FD0C1" stroke-width="8"/>
    <rect x="-4" y="214" width="408" height="50" fill="url(#xadrez)"/>

    <!-- placa da Joli Coffee -->
    <rect x="22" y="18" width="186" height="48" rx="12" fill="#FFF7F4"/>
    <text x="40" y="51" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="22" fill="#D6432E" stroke="none">Joli Coffee</text>
    <path d="M30 18 l-6 -18 M200 18 l6 -18" fill="none" stroke-width="2"/>

    <!-- prateleira com xícaras -->
    <path d="M240 96 H330" fill="none" stroke-width="5"/>
    <g fill="#FFF7F4" stroke-width="2.5">
      <path d="M248 78 h18 v12 a6 6 0 0 1 -6 6 h-6 a6 6 0 0 1 -6 -6 z"/>
      <path d="M276 78 h18 v12 a6 6 0 0 1 -6 6 h-6 a6 6 0 0 1 -6 -6 z" fill="#83C7B5"/>
      <path d="M304 78 h18 v12 a6 6 0 0 1 -6 6 h-6 a6 6 0 0 1 -6 -6 z" fill="#F2A596"/>
    </g>

    <!-- o Pelúcio atrás do balcão -->
    <g transform="translate(150 118)">
      <!-- moletom rosa -->
      <path d="M-46 70 C-46 30 -26 18 0 18 C26 18 46 30 46 70 z" fill="#F7B3A3"/>
      <g fill="#FFE08A" stroke-width="1.5">
        <path d="M-32 44 l3 6 l6 1 l-5 4 l1 6 l-5 -3 l-5 3 l1 -6 l-5 -4 l6 -1 z"/>
        <path d="M30 52 l2 5 l5 1 l-4 3 l1 5 l-4 -3 l-4 3 l1 -5 l-4 -3 l5 -1 z"/>
      </g>
      <path d="M-6 70 v-30 h10 a8 8 0 0 1 0 16 h-10" fill="none" stroke="#D6432E" stroke-width="6"/>
      <path d="M-10 22 q-3 10 -1 18 M10 22 q3 10 1 18" fill="none" stroke="#83C7B5" stroke-width="4"/>
      <!-- orelhas redondas -->
      <circle cx="-30" cy="-44" r="12" fill="#F5CF8A"/>
      <circle cx="30" cy="-44" r="12" fill="#F5CF8A"/>
      <circle cx="-30" cy="-44" r="5" fill="#E8B070" stroke="none"/>
      <circle cx="30" cy="-44" r="5" fill="#E8B070" stroke="none"/>
      <!-- cabeça -->
      <ellipse cx="0" cy="-14" rx="40" ry="37" fill="#F5CF8A"/>
      <ellipse cx="0" cy="-4" rx="15" ry="11" fill="#F0B77A"/>
      <ellipse cx="-5" cy="-5" rx="2.2" ry="3.4" fill="#C97B52" stroke="none"/>
      <ellipse cx="5" cy="-5" rx="2.2" ry="3.4" fill="#C97B52" stroke="none"/>
      <circle cx="-17" cy="-22" r="4.5" fill="#3B2420" stroke="none"/>
      <circle cx="17" cy="-22" r="4.5" fill="#3B2420" stroke="none"/>
      <circle cx="-15.5" cy="-23.5" r="1.5" fill="#fff" stroke="none"/>
      <circle cx="18.5" cy="-23.5" r="1.5" fill="#fff" stroke="none"/>
      <path d="M-16 10 q16 13 32 0" fill="none" stroke-width="2.5"/>
      <ellipse cx="-27" cy="-4" rx="7" ry="4.5" fill="#FF9A8A" stroke="none" opacity="0.7"/>
      <ellipse cx="27" cy="-4" rx="7" ry="4.5" fill="#FF9A8A" stroke="none" opacity="0.7"/>
    </g>

    <!-- balcão -->
    <rect x="-4" y="168" width="408" height="14" fill="#E2C29C"/>
    <rect x="-4" y="182" width="408" height="34" fill="#F2A596"/>
    <path d="M60 186 v26 M140 186 v26 M220 186 v26 M300 186 v26" fill="none" stroke="#D98A7A" stroke-width="2"/>

    <!-- latte que o Pelúcio entrega, com o braço dele -->
    <path d="M176 156 q14 -2 22 6" fill="none" stroke-width="12"/>
    <path d="M176 156 q14 -2 22 6" fill="none" stroke="#F7B3A3" stroke-width="6"/>
    <path d="M196 140 h30 v18 a8 8 0 0 1 -8 8 h-14 a8 8 0 0 1 -8 -8 z" fill="#FFF7F4"/>
    <path d="M226 146 a6 6 0 0 1 0 12" fill="none" stroke-width="2.5"/>
    <ellipse cx="211" cy="140" rx="15" ry="4" fill="#C08A5A" stroke-width="2"/>
    <path d="M211 142 c-2 -3 -6 -1 -3 1.5 l3 2 l3 -2 c3 -2.5 -1 -4.5 -3 -1.5 z" fill="#FFF7F4" stroke="none"/>
    <circle cx="200" cy="162" r="7" fill="#F5CF8A" stroke-width="2.5"/>
    <path d="M204 132 q-6 -8 0 -16 M216 130 q-6 -8 0 -16" fill="none" stroke="#fff" stroke-width="2.5"/>

    <!-- máquina de espresso -->
    <g transform="translate(18 102)">
      <rect x="0" y="0" width="76" height="66" rx="8" fill="#D3D9DD"/>
      <rect x="6" y="-10" width="64" height="12" rx="4" fill="#BFC7CC"/>
      <rect x="8" y="10" width="60" height="16" rx="4" fill="#3E3432"/>
      <circle cx="20" cy="18" r="3" fill="#83C7B5" stroke="none"/>
      <circle cx="32" cy="18" r="3" fill="#D6432E" stroke="none"/>
      <path d="M30 26 v8 h16 v-8" fill="#3E3432" stroke-width="2.5"/>
      <path d="M38 34 v8" fill="none" stroke="#5A321E" stroke-width="3"/>
      <path d="M28 48 h20 v10 a5 5 0 0 1 -5 5 h-10 a5 5 0 0 1 -5 -5 z" fill="#FFF7F4" stroke-width="2.5"/>
    </g>

    <!-- pão de queijo no pratinho -->
    <ellipse cx="270" cy="168" rx="26" ry="5" fill="#FFF7F4" stroke-width="2.5"/>
    <circle cx="260" cy="160" r="9" fill="#E2B24C" stroke-width="2.5"/>
    <circle cx="279" cy="159" r="10" fill="#E9BE5C" stroke-width="2.5"/>
    <path d="M276 154 q3 -2 6 0 M257 156 q3 -2 5 0" fill="none" stroke="#fff" stroke-width="1.5"/>

    <!-- cliente coelhinho do outro lado do balcão -->
    <g transform="translate(346 150)">
      <path d="M-14 -40 q-10 -40 2 -48 q10 4 6 46 z M6 -42 q4 -42 18 -44 q8 10 -6 46 z" fill="#FFFFFF"/>
      <path d="M-10 -46 q-4 -26 2 -34 M12 -48 q4 -26 10 -32" fill="none" stroke="#F7C6D0" stroke-width="4"/>
      <circle cx="0" cy="-16" r="27" fill="#FFFFFF"/>
      <circle cx="-9" cy="-20" r="3.5" fill="#3B2420" stroke="none"/>
      <circle cx="9" cy="-20" r="3.5" fill="#3B2420" stroke="none"/>
      <path d="M-3 -10 l3 3 l3 -3 z" fill="#F7A6B8" stroke-width="2"/>
      <path d="M0 -7 v3 q-4 4 -7 1 M0 -4 q4 4 7 1" fill="none" stroke-width="2"/>
      <ellipse cx="-17" cy="-9" rx="5" ry="3" fill="#F7C6D0" stroke="none"/>
      <ellipse cx="17" cy="-9" rx="5" ry="3" fill="#F7C6D0" stroke="none"/>
      <path d="M-30 18 C-30 10 -16 6 0 6 C16 6 30 10 30 18" fill="#B7D7F0"/>
    </g>
    <!-- coraçõezinhos do cliente feliz -->
    <path d="M318 76 c-3 -4 -8 0 -4 4 l4 3 l4 -3 c4 -4 -1 -8 -4 -4 z" fill="#FF7AC8" stroke-width="1.5"/>
    <path d="M300 92 c-2 -3 -6 0 -3 3 l3 2 l3 -2 c3 -3 -1 -6 -3 -3 z" fill="#FF7AC8" stroke-width="1.5"/>
  </g>
</svg>
