<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Joli Market · slop</title>
<meta name="description" content="Jogo de mercadinho em voxel: o porquinho Beto e o jacaré Jaca cuidam do Joli Market, encomendam da fazenda do Ed, repõem as gôndolas e atendem a freguesia no caixa.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: o mercado em voxel em tela cheia, vista isométrica, com as paredes da frente baixas para ver dentro. Barra com
   nível, dinheiro, estrelas da freguesia e a entrega do Ed em cima; ações embaixo; câmera à direita. Os estilos de base
   são os mesmos da Fazenda Joli Pig. */
[hidden]{display:none !important}
:root{
  --ceu-1:#9fd8f2;
  --ceu-2:#dff3ea;
  --papel:#fff8e9;
  --papel-2:#f6ead0;
  --tinta:#3b2a20;
  --tinta-suave:#7a6352;
  --borda:#3b2a20;
  --sombra:rgba(59,42,32,.32);
  --amarelo:#f7e17a;
  --amarelo-forte:#efc93e;
  --azul:#b5d6f0;
  --azul-forte:#6aa7da;
  --rosa:#e0408a;
  --rosa-claro:#f7c3d6;
  --verde:#5aa83c;
  --verde-escuro:#3e7f2b;
  --vermelho:#d24a3c;
  --madeira:#b8834f;
  --f-titulo:"Bagel Fat One","Arial Black",Impact,sans-serif;
  --f-texto:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;touch-action:manipulation}
body{background:linear-gradient(180deg,var(--ceu-1),var(--ceu-2));color:var(--tinta);font-family:var(--f-texto);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#jogo{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#tela{display:block;width:100%;height:100%;cursor:pointer}

/* painéis */
.painel{background:var(--papel);border:3px solid var(--borda);border-radius:14px;box-shadow:0 4px 0 var(--sombra)}
/* HUD de cima: uma barra só com nível, dinheiro, ração, adubo e a hora, com a estação de selo no relógio. No celular ela
   ocupa a largura toda; na tela larga fica no canto */
.hud-topo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;padding:4px 9px 4px 5px;border-radius:14px;pointer-events:auto;max-width:calc(100% - 24px);box-sizing:border-box}
.seg{flex:none;display:flex;align-items:center;gap:5px;padding:2px 5px 2px 2px;border-radius:999px;font-family:var(--f-titulo);font-size:18px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg img{width:26px;height:26px;flex:none}
.seg.toque{cursor:pointer}
.seg.pulsa{animation:pulsa .35s ease-out}
.sep{flex:none;width:2px;align-self:stretch;margin:3px 0;background:rgba(59,42,32,.18)}
.nivel{gap:6px}
.selo-nivel{flex:none;display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--amarelo);border:2px solid var(--borda);font-family:var(--f-titulo);font-size:15px;line-height:1}
.barra-xp{flex:none;width:60px;height:10px;border:2px solid var(--borda);border-radius:999px;background:var(--papel-2);overflow:hidden}
.barra-xp i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.xp-texto{font-family:var(--f-texto);font-size:12px;font-weight:700;color:var(--tinta-suave);white-space:nowrap;font-variant-numeric:tabular-nums}
/* tela estreita (ajustarBarra): primeiro some a régua entre os pedaços e o xp vira um anel no selo do nível; se ainda
   não couber, tudo diminui um pouco */
.hud-topo.aperto1 .sep,.hud-topo.aperto1 .barra-xp{display:none}
.hud-topo.aperto1{gap:6px}
.hud-topo.aperto1 .selo-nivel{width:26px;min-width:26px;height:26px;padding:0;font-size:12px;background:radial-gradient(circle closest-side,var(--amarelo) 0 74%,transparent 76%),conic-gradient(var(--verde) calc(var(--xp,0) * 1%),#e8dcc0 0)}
.hud-topo.aperto2{gap:4px;padding:4px 5px 4px 4px}
.hud-topo.aperto2 .seg{font-size:12px;gap:2px}
.hud-topo.aperto2 .seg img{width:17px;height:17px}
@keyframes pulsa{40%{transform:scale(1.12)}}

/* barra de baixo */
.hud-base{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:grid;justify-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.acoes{display:flex;gap:8px;pointer-events:auto;padding:6px;flex-wrap:nowrap;max-width:100%}
.acao{all:unset;box-sizing:border-box;display:grid;justify-items:center;gap:2px;min-width:66px;padding:6px 8px 5px;border-radius:10px;cursor:pointer;font-weight:800;font-size:12px;line-height:1.1;text-align:center;white-space:nowrap}
.acao img,.acao svg{width:38px;height:38px;display:block}
.acao:hover{background:var(--papel-2)}
.acao:focus-visible{outline:3px solid var(--rosa);outline-offset:1px}
.acao.destaque{background:var(--azul);animation:chama 1.2s ease-in-out infinite}
@keyframes chama{50%{background:#d8eaf8}}
.acao .bolinha{position:absolute;margin:-4px 0 0 30px;background:var(--rosa);color:#fff;border:2px solid var(--borda);border-radius:999px;font-size:11px;padding:1px 5px}
.acao{position:relative}

.dica{max-width:min(560px,calc(100vw - 32px));padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;line-height:1.3;pointer-events:auto;animation:sobe .3s ease-out}
.dica img{width:34px;height:34px;flex:none}
.dica .x{all:unset;cursor:pointer;flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;font-weight:800;color:var(--tinta-suave)}
.dica .x:hover{background:var(--papel-2)}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}
.modo{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;background:var(--amarelo);font-weight:800;font-size:14px;pointer-events:auto;max-width:calc(100vw - 32px)}
.modo img{width:28px;height:28px;flex:none}
.modo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modo .botao{white-space:nowrap;flex:none}
/* no celular o texto da ação fica numa linha e os botões embaixo */
@media (max-width:560px){ .modo{flex-wrap:wrap;row-gap:6px} .modo span{flex:1 1 calc(100% - 40px);white-space:normal} .modo #modoTodos{margin-left:auto} }

.fila{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 8px;font-weight:800;font-size:13px;white-space:nowrap;pointer-events:auto;max-width:calc(100vw - 32px);border-radius:999px}
.fila img{width:24px;height:24px;flex:none}
.fila span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.fila .botao.mini{border-radius:999px;flex:none}

/* câmera */
.camera-ctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:8px;justify-items:end;pointer-events:auto}
/* girar e zoom num bloco só: girar em cima, zoom embaixo */
.camera-ctl{gap:0;background:var(--papel);border:3px solid var(--borda);border-radius:12px;box-shadow:0 3px 0 var(--sombra);overflow:hidden}
.cam-grupo{display:flex}
.cam-grupo+.cam-grupo{border-top:2px solid rgba(59,42,32,.22)}
.camera-ctl .cam{width:38px;height:38px}
.camera-ctl .cam svg{width:19px;height:19px}
.cam-grupo .cam{border:0;border-radius:0;box-shadow:none;background:transparent}
.cam-grupo .cam+.cam{border-left:2px solid rgba(59,42,32,.22)}
.cam-grupo .cam:active{transform:none;box-shadow:none;background:var(--papel-2)}
.cam{all:unset;box-sizing:border-box;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;background:var(--papel);border:3px solid var(--borda);border-radius:12px;box-shadow:0 3px 0 var(--sombra)}
.cam svg{width:22px;height:22px}
.cam:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sombra)}
.cam:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}

/* botões */
.botao{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--amarelo);border:3px solid var(--borda);box-shadow:0 3px 0 var(--sombra);font-weight:800;font-size:15px;cursor:pointer;text-align:center;line-height:1.15}
.botao:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sombra)}
.botao:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.botao.azul{background:var(--azul)}
.botao.verde{background:#bfe39a}
.botao.rosa{background:var(--rosa-claro)}
.botao.claro{background:var(--papel)}
.botao[disabled],.botao.off{opacity:.45;cursor:default;pointer-events:none}
.botao.mini{padding:5px 10px;font-size:13px;border-width:2px;border-radius:9px;box-shadow:0 2px 0 var(--sombra)}
.botao img{width:24px;height:24px}

/* menu de ação */
.menu{position:absolute;z-index:20;width:250px;max-width:calc(100vw - 24px);padding:10px;pointer-events:auto;animation:abre .14s ease-out;transform-origin:top left}
@keyframes abre{from{transform:scale(.9);opacity:0}}
.menu h3{margin:0 0 2px;font-family:var(--f-titulo);font-weight:400;font-size:19px;line-height:1.1;display:flex;align-items:center;gap:8px}
.menu h3 img{width:32px;height:32px}
.menu .estado{font-size:13px;font-weight:700;color:var(--tinta-suave);margin:2px 0 6px;line-height:1.3}
.menu .estado.alerta{color:var(--vermelho)}
.menu .estado.bom{color:var(--verde-escuro)}
.menu .prog{height:9px;border:2px solid var(--borda);border-radius:999px;background:var(--papel-2);overflow:hidden;margin:0 0 8px}
.menu .prog i{display:block;height:100%;background:var(--verde)}
/* fila das construções: uma caixinha por vaga */
.vagas{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:2px 0 8px}
.vaga{border:2px solid var(--borda);border-radius:10px;background:var(--papel-2);padding:4px 3px 5px;text-align:center;font-weight:800;font-size:11px;line-height:1.15;min-width:0}
.vaga img{width:28px;height:28px;display:block;margin:0 auto 1px}
.vaga .n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vaga .t{display:block;font-weight:700;font-size:10px;color:var(--tinta-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vaga .barra{height:5px;border-radius:999px;background:#fff;border:1px solid var(--borda);margin:3px 2px 0;overflow:hidden}
.vaga .barra i{display:block;height:100%;background:var(--verde)}
.vaga.fazendo{background:#e3f3d4}
.vaga.levando{background:#fff1b8}
.vaga.livre{background:transparent;border-style:dashed;color:var(--tinta-suave)}
.vaga.livre .vazio{width:28px;height:28px;margin:0 auto 1px;border:2px dashed #c9b9a0;border-radius:8px}
.vagas-resumo{display:flex;justify-content:space-between;font-weight:800;font-size:12px;margin:0 0 3px}
.vagas-resumo .pronto{color:var(--verde-escuro)}
.menu .itens{display:grid;gap:5px;max-height:min(340px,calc(100vh - 150px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:1px 3px 1px 1px}
.item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:2px solid var(--borda);background:var(--papel-2);cursor:pointer;font-weight:800;font-size:14px;line-height:1.15}
.item img{width:30px;height:30px;flex:none}
.item span{flex:1;min-width:0}
.item small{display:block;font-weight:700;font-size:12px;color:var(--tinta-suave)}
.item b{flex:none;font-size:13px;white-space:nowrap}
.item:hover{background:var(--amarelo)}
.item:focus-visible{outline:3px solid var(--rosa);outline-offset:1px}
.item.off{opacity:.45;cursor:default;pointer-events:none}
.item.leve{background:transparent;border-style:dashed}
.item.encomenda{background:#dcecf6}
.item i.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#e8d6b0;font-style:normal;font-size:11px;font-weight:800;vertical-align:1px;white-space:nowrap}
.item i.estrela{display:inline-block;margin-left:5px;font-style:normal;font-size:16px;line-height:1;color:#f5b800;-webkit-text-stroke:1px var(--borda);vertical-align:-1px}
.item.perigo{margin-top:8px;background:transparent;border-style:dashed;border-color:#b5584a;color:#8a3a2e}
.item.perigo.confirmar{background:#f8d2c9;border-style:solid}

/* falas e números flutuantes */
.fala{position:absolute;left:0;top:0;z-index:5;max-width:220px;padding:7px 11px;background:#fff;border:3px solid var(--borda);border-radius:14px;font-weight:700;font-size:13px;line-height:1.25;pointer-events:none;transform:translate(-50%,-100%);box-shadow:0 3px 0 var(--sombra);text-align:center}
.fala::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--borda);border-bottom:0}
.fala.beto{background:#e6f1fb}
.fala.jaca{background:#e8f6dc}
.fala.pelucio{background:#fde4e1}
.fala.milton{background:#ffe3d2}
.fala.luma{background:#ffeedd}
.fala.minhoquinha{background:#fde0e8}
.dialogo .quem.minhoquinha{color:#d4607f}
.dialogo .quem.beto{color:#2f6fb3}
.dialogo .quem.jaca{color:#3e8f2c}
.dialogo .quem.milton{color:#d9531e}
.dialogo .quem.lucia{color:#b8860b}
.dialogo .quem.hud{color:#b58a12}
.dialogo .quem.maurinho{color:#8a5a36}
.dialogo .quem.todos{color:#e0408a}
/* cena do Pelúcio: faixas de cinema e caixa de diálogo */
.cine{position:absolute;inset:0;z-index:25;pointer-events:none}
.cine .faixa{position:absolute;left:0;right:0;height:10vh;background:#1d1410;transition:transform .7s ease}
.cine .faixa.topo{top:0;transform:translateY(-100%)}
.cine .faixa.base{bottom:0;transform:translateY(100%)}
.cine.on .faixa{transform:none}
.dialogo{position:absolute;left:50%;bottom:calc(10vh + 16px);transform:translateX(-50%);width:min(620px,calc(100vw - 32px));display:flex;gap:12px;align-items:flex-start;padding:12px 14px 10px;pointer-events:auto;cursor:pointer;animation:sobe .25s ease-out}
.dialogo img{width:62px;height:62px;flex:none;border-radius:12px;background:var(--papel-2);border:2px solid var(--borda)}
.dialogo .quem{font-family:var(--f-titulo);font-size:21px;line-height:1;color:var(--rosa)}
.dialogo .quem.ed{color:#b58a12}
.dialogo p{margin:5px 0 0;font-weight:700;font-size:16px;line-height:1.4;min-height:2.8em}
.dialogo .seguir{display:block;text-align:right;font-size:12px;font-weight:800;color:var(--tinta-suave);margin-top:2px;visibility:hidden}
.dialogo .seguir.pode{visibility:visible;animation:pisca 1s ease-in-out infinite}
@keyframes pisca{50%{opacity:.35}}
.dialogo .escolha{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
/* o pular fica fora da caixa de diálogo, visível a cena toda (também nos trechos sem fala) */
.cine .pular{position:absolute;top:calc(10vh + 12px);right:calc(16px + env(safe-area-inset-right,0px));pointer-events:auto}
#jogo.cinema .hud-topo,#jogo.cinema .hud-base,#jogo.cinema .camera-ctl,#jogo.cinema .menu{display:none !important}
.janela-topo.rosa2{background:#f7c9c3}
.janela-topo.marrom{background:#e3c9a8}
.janela-topo.verde{background:#cdeab0}
.flutua{position:absolute;left:0;top:0;z-index:6;font-family:var(--f-titulo);font-size:17px;color:#fff;-webkit-text-stroke:5px var(--borda);paint-order:stroke fill;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:3px;animation:flutua 1.3s ease-out forwards}
.flutua img{width:24px;height:24px}
.flutua.ouro{color:#ffd84a}
.flutua.xp{color:#9be36a}
@keyframes flutua{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-56px);opacity:0}}

.avisos{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);display:grid;justify-items:center;gap:6px;pointer-events:none;padding:0 16px;z-index:15}
.aviso{padding:7px 14px;font-weight:800;font-size:14px;text-align:center;animation:sobe .25s ease-out;transition:opacity .4s,transform .4s;max-width:min(480px,100%)}
.aviso.grande{font-family:var(--f-titulo);font-weight:400;font-size:clamp(20px,5vw,28px);background:var(--amarelo)}
.aviso.ruim{background:#f8d2c9}
.aviso.sai{opacity:0;transform:translateY(-8px)}

/* janelas */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(40,28,20,.38);pointer-events:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.janela{width:min(560px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;overflow:hidden;animation:abre .16s ease-out;transform-origin:center}
.janela-topo{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;border-bottom:3px solid var(--borda);background:var(--amarelo)}
.janela-topo.azul{background:var(--azul)}
.janela-topo.rosa{background:var(--rosa-claro)}
.janela-topo img{width:46px;height:46px;flex:none}
.janela-topo h2{margin:0;font-family:var(--f-titulo);font-weight:400;font-size:clamp(21px,5vw,27px);line-height:1}
.janela-topo .sub{font-weight:700;font-size:13px;color:var(--tinta-suave);margin-top:3px}
.janela-topo .fechar{all:unset;margin-left:auto;align-self:flex-start;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:2px solid var(--borda);background:var(--papel);font-weight:800;font-size:18px;cursor:pointer;flex:none}
.janela-topo .fechar:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.janela-corpo{padding:12px 14px 16px;overflow:auto;-webkit-overflow-scrolling:touch}
.janela-corpo p{margin:0 0 10px;line-height:1.45;font-weight:500}
.abas{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.aba{all:unset;padding:6px 12px;border-radius:999px;border:2px solid var(--borda);font-weight:800;font-size:14px;cursor:pointer;background:var(--papel)}
.aba[aria-selected="true"]{background:var(--rosa-claro)}
.aba:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cartao{border:2px solid var(--borda);border-radius:12px;background:var(--papel-2);padding:8px;display:grid;gap:4px;align-content:start}
.cartao .cab{display:flex;align-items:center;gap:6px}
.cartao .cab img{width:42px;height:42px;flex:none}
.cartao h4{margin:0;font-weight:800;font-size:15px;line-height:1.1}
.cartao .info{font-size:12px;font-weight:700;color:var(--tinta-suave);line-height:1.35}
.cartao .botoes{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.cartao.bloq{opacity:.55}
.grade.cenas{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.creditos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.credito{border:2px solid var(--borda);border-radius:14px;background:var(--papel-2);padding:10px 8px 12px;text-align:center}
.credito img{width:100%;max-width:200px;aspect-ratio:1;display:block;margin:0 auto}
.credito h4{margin:6px 0 0;font-family:var(--f-titulo);font-weight:400;font-size:18px;line-height:1.1}
.cartao .pergunta{width:42px;height:42px;flex:none;display:grid;place-items:center;border:2px dashed var(--tinta-suave);border-radius:10px;font-family:var(--f-titulo);font-size:26px;color:var(--tinta-suave)}
.cartao.oferta{background:#fff1b8}
.linhas{display:grid;gap:6px}
.linha{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid var(--borda);border-radius:12px;background:var(--papel-2)}
.linha img{width:36px;height:36px;flex:none}
.linha .nome{flex:1;min-width:0;font-weight:800;font-size:14px;line-height:1.2}
.linha .nome small{display:block;font-weight:700;font-size:12px;color:var(--tinta-suave)}
.linha .qtd{font-family:var(--f-titulo);font-size:19px;min-width:34px;text-align:right}
.linha.oferta{background:#fff1b8}
.selo{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--rosa);color:#fff;font-size:11px;font-weight:800;vertical-align:1px;margin-left:4px}
.pedido{border:3px dashed var(--borda);border-radius:14px;padding:10px 12px;background:#fffdf6;margin-bottom:12px}
.pedido h4{margin:0 0 6px;font-family:var(--f-titulo);font-weight:400;font-size:18px}
.pedido ul{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pedido li{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;border:2px solid var(--borda);border-radius:999px;background:var(--papel);font-weight:800;font-size:13px}
.pedido li img{width:24px;height:24px}
.pedido li.ok{background:#d8f0c0}
.pedido .rec{font-weight:800;font-size:14px;margin-bottom:8px}
.rodape-janela{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:12px}
.total{font-family:var(--f-titulo);font-size:20px}
.vazio{padding:14px;text-align:center;font-weight:700;color:var(--tinta-suave);border:2px dashed var(--tinta-suave);border-radius:12px}
.fala-janela{position:relative;background:#fff;border:3px solid var(--borda);border-radius:14px;padding:9px 12px;font-weight:700;margin:0 0 12px;line-height:1.35}
.passos{margin:0 0 12px;padding-left:20px;line-height:1.5;font-weight:500}
.passos li{margin-bottom:4px}
.ajuste{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--papel-2);font-weight:800}
a{color:var(--rosa)}

.erro{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:800;font-size:18px;z-index:40}
.carregando{font-family:var(--f-titulo);font-weight:400;font-size:26px;color:var(--rosa)}

@media (max-width:560px){
  .modal{place-items:end center;padding:0}
  .janela{width:100%;max-height:86vh;border-radius:18px 18px 0 0;border-bottom:0}
  /* no celular a barra ocupa a largura toda e os rótulos quebram em duas linhas em vez de vazar */
  .hud-base{padding:0 10px}
  .acoes{width:100%;gap:2px;padding:5px 4px}
  .acao{flex:1 1 0;min-width:0;padding:5px 2px 4px;font-size:11px;white-space:normal;overflow-wrap:anywhere;align-content:start}
  .acao img,.acao svg{width:30px;height:30px}
  .acao .bolinha{margin-left:22px}
  .camera-ctl{top:calc(env(safe-area-inset-top,0px) + 62px);transform:none}
  .camera-ctl .cam{width:34px;height:34px}
  .camera-ctl .cam svg{width:17px;height:17px}
  .xp-texto{display:none}
  .hud-topo{right:max(12px,env(safe-area-inset-right,0px));justify-content:space-between;gap:4px;padding:4px 7px 4px 5px;border-radius:13px}
  .seg{font-size:14px;gap:3px;padding:2px 3px 2px 2px}
  .seg img{width:20px;height:20px}
  .selo-nivel{min-width:24px;height:24px;font-size:13px;padding:0 4px}
  .barra-xp{width:24px;height:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Joli Market: o mercadinho do Beto e do Jaca, em voxel, com os mesmos desenhos da Fazenda Joli Pig.
// O jogo encomenda da fazenda do Ed, repõe as prateleiras e atende a freguesia no caixa. As regras ficam no AGENTS.md desta pasta.
(function(){
'use strict';
const $ = id => document.getElementById(id);
if (typeof THREE === 'undefined'){ $('carregando').hidden = true; $('erro').hidden = false; return; }

// ================= utilidades (as mesmas da Fazenda Joli Pig)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hash(x, y, z){
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1440662683);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const sorteia = arr => arr[Math.floor(Math.random() * arr.length)];
// sorteia uma fala sem repetir a última que saiu da mesma lista (a chave serve para listas montadas na hora)
const ULTIMA_FALA = new Map();
function variar(lista, chave = lista){
  if (lista.length < 2) return lista[0];
  let f; do f = sorteia(lista); while (f === ULTIMA_FALA.get(chave));
  ULTIMA_FALA.set(chave, f); return f;
}
const reais = n => 'R$ ' + Math.round(n).toLocaleString('pt-BR');
function tempo(s){ s = Math.max(0, Math.ceil(s)); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); }
function anguloPerto(a, b, t){ let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * t; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// ================= voxels
// Cada modelo é um conjunto de cubinhos coloridos. build() só gera as faces que ficam à mostra e escurece os cantos (oclusão de ambiente).
const FACES = [
  { n:[1,0,0],  u:[0,1,0], v:[0,0,1] },
  { n:[-1,0,0], u:[0,0,1], v:[0,1,0] },
  { n:[0,1,0],  u:[0,0,1], v:[1,0,0] },
  { n:[0,-1,0], u:[1,0,0], v:[0,0,1] },
  { n:[0,0,1],  u:[1,0,0], v:[0,1,0] },
  { n:[0,0,-1], u:[0,1,0], v:[1,0,0] },
];
const AO = [0.56, 0.71, 0.86, 1];
const AO_SUAVE = [0.88, 0.93, 0.97, 1];
const CANTOS = [[-1,-1],[1,-1],[1,1],[-1,1]];
class Vox {
  constructor(){ this.m = new Map(); }
  k(x, y, z){ return (x + 512) * 1048576 + (y + 512) * 1024 + (z + 512); }
  set(x, y, z, c){
    if (c == null){ this.m.delete(this.k(x, y, z)); return this; }
    const e = this.m.get(this.k(x, y, z));
    if (e) e.c = c; else this.m.set(this.k(x, y, z), { x, y, z, c });
    return this;
  }
  has(x, y, z){ return this.m.has(this.k(x, y, z)); }
  box(x0, y0, z0, x1, y1, z1, c){
    for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++)
      for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++)
        for (let z = Math.min(z0, z1); z <= Math.max(z0, z1); z++)
          this.set(x, y, z, typeof c === 'function' ? c(x, y, z) : c);
    return this;
  }
  ell(cx, cy, cz, rx, ry, rz, c, cond){
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
        for (let z = Math.floor(cz - rz); z <= Math.ceil(cz + rz); z++){
          const dx = (x - cx) / rx, dy = (y - cy) / ry, dz = (z - cz) / rz;
          if (dx * dx + dy * dy + dz * dz <= 1 && (!cond || cond(x, y, z))) this.set(x, y, z, typeof c === 'function' ? c(x, y, z) : c);
        }
    return this;
  }
  // pinta o cubinho mais à frente (+z) na coluna (x, y)
  frente(x, y, c){ for (let z = 60; z >= -60; z--) if (this.has(x, y, z)){ this.set(x, y, z, c); return this; } return this; }
  build(s, opt = {}){
    const jitter = opt.jitter == null ? 0.045 : opt.jitter, ao = opt.ao || AO;
    let mnx = Infinity, mny = Infinity, mnz = Infinity, mxx = -Infinity, mxz = -Infinity;
    for (const e of this.m.values()){ if (e.x < mnx) mnx = e.x; if (e.y < mny) mny = e.y; if (e.z < mnz) mnz = e.z; if (e.x > mxx) mxx = e.x; if (e.z > mxz) mxz = e.z; }
    const o = opt.origin || [(mnx + mxx + 1) / 2, mny, (mnz + mxz + 1) / 2];
    const pos = [], nor = [], col = [], idx = [];
    const c = new THREE.Color();
    for (const e of this.m.values()){
      // opt.so: monta só os voxels dessas cores (o brilho das janelas e lâmpadas), com a mesma origem do modelo inteiro
      if (opt.so && !opt.so.has(e.c)) continue;
      const { x, y, z } = e;
      c.setHex(e.c);
      const j = 1 + (hash(x, y, z) - 0.5) * 2 * jitter;
      for (const f of FACES){
        const [nx, ny, nz] = f.n;
        if (opt.semFundo && ny === -1) continue;
        if (this.has(x + nx, y + ny, z + nz)) continue;
        const base = pos.length / 3, aos = [];
        for (const [su, sv] of CANTOS){
          pos.push(
            (x + 0.5 + 0.5 * (nx + su * f.u[0] + sv * f.v[0]) - o[0]) * s,
            (y + 0.5 + 0.5 * (ny + su * f.u[1] + sv * f.v[1]) - o[1]) * s,
            (z + 0.5 + 0.5 * (nz + su * f.u[2] + sv * f.v[2]) - o[2]) * s);
          nor.push(nx, ny, nz);
          const ax = x + nx, ay = y + ny, az = z + nz;
          const s1 = this.has(ax + su * f.u[0], ay + su * f.u[1], az + su * f.u[2]);
          const s2 = this.has(ax + sv * f.v[0], ay + sv * f.v[1], az + sv * f.v[2]);
          const cc = this.has(ax + su * f.u[0] + sv * f.v[0], ay + su * f.u[1] + sv * f.v[1], az + su * f.u[2] + sv * f.v[2]);
          const a = (s1 && s2) ? 0 : 3 - (s1 + s2 + cc);
          aos.push(a);
          const b = ao[a] * j;
          col.push(Math.min(1, c.r * b), Math.min(1, c.g * b), Math.min(1, c.b * b));
        }
        if (aos[0] + aos[2] < aos[1] + aos[3]) idx.push(base + 1, base + 2, base + 3, base + 1, base + 3, base);
        else idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    g.computeBoundingSphere(); g.computeBoundingBox();
    return g;
  }
}
const MAT = new THREE.MeshLambertMaterial({ vertexColors: true });
function malha(geo, sombra = true){ const m = new THREE.Mesh(geo, MAT); m.castShadow = sombra; m.receiveShadow = true; return m; }

// ================= paleta
const COR = {
  pele: 0xf3e0c6, focinho: 0xf2cbb3, focinhoFrente: 0xf5d4be, narina: 0xe2558f, olho: 0x1a1414, sorriso: 0x6b3a22, orelha: 0xefc4ab, bochecha: 0xf1c9b4,
  ed: 0xf6e27c, edBolso: 0xfbed9f, beto: 0xb6d5ee, betoBolso: 0xcfe3f4, letra: 0xe0408a,
  verde: 0x6cbf47, verde2: 0x8ad560, verdeE: 0x4c9636, madeira: 0x9c6a40, madeiraClara: 0xc99a66, terra: 0x7a4e2e,
  vermelho: 0xe2442f, laranja: 0xf08a2c, amarelo: 0xf5d142, branco: 0xfbf6ea, preto: 0x2d2a2a,
};


// ================= modelos da Fazenda Joli Pig: Beto, Ed, Jaca e a família, nos mesmos desenhos
// Ed e Beto: a mesma pelúcia (cabeção creme com costura atrás, focinho saliente com disco rosado e narinas bordadas,
// olhos de conta, sorriso marrom, orelhas pontudas em concha) com macacão de cor diferente: alças com botão,
// peitilho com pesponto, bolso com o P rosa bordado, barra nas pernas e cascos fendidos.
// Feitos no triplo da resolução do resto da fazenda.
// estampa do moletom do Pelúcio: estrelinhas azul-claro, amarelas e brancas espalhadas no rosa
const MOLETOM = { rosa: 0xf8c2ba, punho: 0xe6a097, p: 0xc8303a, pBorda: 0x96202a, cordao: 0x9ad8cc, cordaoE: 0x79bfb2 };
function estampaMoletom(x, y, z){
  const cx = Math.floor(x / 7), cy = Math.floor(y / 7), cz = Math.floor(z / 7);
  const h = hash(cx * 7 + 3, cy * 5 + 1, cz * 11 + 2);
  if (h > 0.55) return null;
  const d = Math.abs(x - (cx * 7 + 3)) + Math.abs(y - (cy * 7 + 3)) + Math.abs(z - (cz * 7 + 3));
  return d <= 2 ? [0x7fcdd3, 0xf0ea86, 0xffffff][Math.floor(h * 30) % 3] : null;
}
const panoMoletom = (x, y, z) => estampaMoletom(x, y, z) || MOLETOM.rosa;
function corpoMoletom(v, frenteZ){
  for (const lx of [-7, 7]) for (let y = 2; y <= 8; y++) for (let x = lx - 5; x <= lx + 5; x++) for (let z = -5; z <= 5; z++)
    if ((x - lx) ** 2 + z * z <= 28) v.set(x, y, z, y <= 3 ? MOLETOM.punho : panoMoletom(x, y, z));
  v.ell(0, 15, 0, 17.4, 14.6, 14.4, panoMoletom, (x, y) => y >= 5);
  v.ell(0, 26, 0, 15.8, 8.6, 13.4, panoMoletom);
  // capuz amontoado atrás do pescoço
  v.ell(0, 30, -9, 14, 6, 7, panoMoletom, (x, y, z) => z <= -6);
  for (let x = -12; x <= 12; x++){ const y = 35 - Math.round(x * x / 40); for (let z = -16; z <= -6; z++) if (v.has(x, y, z) && !v.has(x, y + 1, z)) v.set(x, y, z, MOLETOM.punho); }
  // P vermelho aplicado no peito, com a borda mais escura
  const noP = (x, y) => (x >= -6 && x <= -3 && y >= 7 && y <= 21) ||
    ((x / 6.2) ** 2 + ((y - 16.5) / 5) ** 2 <= 1 && !((x / 2.8) ** 2 + ((y - 16.5) / 2) ** 2 <= 1) && x >= -6);
  for (let x = -7; x <= 7; x++) for (let y = 6; y <= 22; y++){
    if (!noP(x, y)) continue;
    const borda = !noP(x + 1, y) || !noP(x - 1, y) || !noP(x, y + 1) || !noP(x, y - 1);

// parede creme; a versão baixa (alto pequeno) é a que fica quando a parede está entre a câmera e a loja
function vParede(comp, alto, vaos = []){
  const v = new Vox(), L = comp * 16;
  const noVao = x => vaos.some(([a, b]) => x >= a * 16 && x < b * 16);
  const cor = (x, y) => {
    if (y <= 1) return 0x5b8fc4;
    if (y <= 12) return (x % 4 === 0 || y % 4 === 1) ? 0xc6dcee : 0xeaf4fb;
    if (y <= 14) return y === 13 ? CM.rosa : CM.rosaC;
    return hash(x >> 2, y >> 2, 3) < 0.5 ? 0xfdf6e3 : 0xf8f0da;
  };
  for (let x = 0; x < L; x++) for (let y = 0; y < alto; y++) for (let z = 0; z <= 1; z++){
    if (noVao(x) && (y < 30 || alto < 30)) continue;
    v.set(x, y, z, y === alto - 1 ? 0xffffff : cor(x, y));
  }
  // batentes azuis em volta de cada vão
  for (const [a, b] of vaos){
    for (const x of [a * 16 - 1, b * 16]) if (x >= 0 && x < L) for (let y = 0; y < alto; y++) for (let z = -1; z <= 2; z++) v.set(x, y, z, CM.azulE);

  }
  return v;
}

function gerarIcones(){

  const sc = new THREE.Scene();

  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
  const dir = new THREE.Vector3(1, 0.85, 1.6).normalize();
  for (const nome of Object.keys(VI)){
    const geo = VI[nome]().build(1 / 16, { jitter: 0.03 });
    const m = new THREE.Mesh(geo, MAT);
    const bb = geo.boundingBox, c = new THREE.Vector3(); bb.getCenter(c);
    m.position.copy(c).multiplyScalar(-1);
    sc.add(m);
    const R = geo.boundingSphere.radius * 1.02;
    cam.left = -R; cam.right = R; cam.top = R; cam.bottom = -R; cam.updateProjectionMatrix();
    cam.position.copy(dir).multiplyScalar(50); cam.lookAt(0, 0, 0);
    r.render(sc, cam);
    const cv = document.createElement('canvas'); cv.width = cv.height = T;
    cv.getContext('2d').drawImage(r.domElement, 0, 0);
    ICONE[nome] = { canvas: cv, url: cv.toDataURL() };
    sc.remove(m); geo.dispose();
  }
  r.dispose(); if (r.forceContextLoss) r.forceContextLoss();
}

const LUZ_DIR = new THREE.Vector3(-6, 14, 9);
function iniciarRender(){
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-10, 10, 10, -10, -100, 300);
  ceuLuz = new THREE.HemisphereLight(0xfffaf0, 0xa89a78, 0.62); scene.add(ceuLuz);
  sol = new THREE.DirectionalLight(0xfff0d8, 0.62);
  sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 80 });
  sol.shadow.bias = -0.0006; sol.shadow.normalBias = 0.02;
  scene.add(sol); scene.add(sol.target);
  const aspecto = innerWidth / innerHeight;
  cam.vista = aspecto > 1.2 ? 12.5 : clamp(18 / Math.max(aspecto, 0.4) * 0.62, 10, 20);
  redimensionar();
}
function redimensionar(){
  renderer.setSize(innerWidth, innerHeight, false);
  posicionarCamera();
}
function posicionarCamera(){
  const d = new THREE.Vector3(Math.sin(cam.az) * Math.cos(cam.el), Math.sin(cam.el), Math.cos(cam.az) * Math.cos(cam.el));
  camera.position.copy(cam.alvo).addScaledVector(d, 60);
  sol.position.set(6 + LUZ_DIR.x, LUZ_DIR.y, 6 + LUZ_DIR.z); sol.target.position.set(6, 0, 6);
  camera.lookAt(cam.alvo);
  const a = innerWidth / innerHeight;
  camera.left = -cam.vista * a / 2; camera.right = cam.vista * a / 2; camera.top = cam.vista / 2; camera.bottom = -cam.vista / 2;
  camera.updateProjectionMatrix();
}

// ================= texturas de texto e bolhas
// linhas: [[texto, peso, cor]]. O tamanho de cada linha encolhe até caber na largura, com margem.
function texturaTexto(linhas, w, h, fundo, moldura){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = fundo; g.fillRect(0, 0, w, h);
  if (moldura){ const m = h * 0.07; g.strokeStyle = moldura; g.lineWidth = h * 0.045; g.strokeRect(m, m, w - 2 * m, h - 2 * m); }
  const fonte = px => `${px}px "Bagel Fat One", "Arial Black", Impact, sans-serif`;
  const pesoTotal = linhas.reduce((a, l) => a + l[1], 0);
  const base = h * 0.74 / pesoTotal;
  const tams = linhas.map(([t, peso]) => {
    let px = base * peso;
    g.font = fonte(px);
    const larg = g.measureText(t).width, max = w * 0.84;
    if (larg > max) px *= max / larg;
    return px;
  });
  const alturaTotal = tams.reduce((a, b) => a + b, 0) + (linhas.length - 1) * h * 0.03;
  let y = (h - alturaTotal) / 2;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  linhas.forEach(([t, , cor], i) => {
    g.font = fonte(tams[i]); g.fillStyle = cor;
    g.fillText(t, w / 2, y + tams[i] / 2 + tams[i] * 0.05);
    y += tams[i] + h * 0.03;
  });
  const tx = new THREE.CanvasTexture(c); tx.anisotropy = 4; return tx;
}
function placaDeTexto(textura, larg, alt){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(larg, alt), new THREE.MeshLambertMaterial({ map: textura }));
  m.receiveShadow = true; return m;
}
const TEX_BOLHA = {};
function texBolha(nome){
  if (TEX_BOLHA[nome]) return TEX_BOLHA[nome];
  const c = document.createElement('canvas'); c.width = 96; c.height = 112;
  const g = c.getContext('2d');
  g.lineWidth = 6; g.strokeStyle = '#3b2a20'; g.fillStyle = '#ffffff';
  g.beginPath(); g.moveTo(16, 6); g.lineTo(80, 6); g.quadraticCurveTo(90, 6, 90, 16); g.lineTo(90, 76); g.quadraticCurveTo(90, 86, 80, 86);
  g.lineTo(58, 86); g.lineTo(48, 104); g.lineTo(38, 86); g.lineTo(16, 86); g.quadraticCurveTo(6, 86, 6, 76); g.lineTo(6, 16); g.quadraticCurveTo(6, 6, 16, 6); g.closePath();
  g.fill(); g.stroke();
  if (ICONE[nome]) g.drawImage(ICONE[nome].canvas, 12, 10, 72, 72);
  const t = new THREE.CanvasTexture(c); TEX_BOLHA[nome] = t; return t;
}
function novaBolha(nome){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texBolha(nome), depthTest: false, transparent: true }));
  s.scale.set(0.52, 0.6, 1); s.renderOrder = 10; s.userData.nome = nome; return s;
}
function trocarBolha(s, nome){ if (s.userData.nome !== nome){ s.material.map = texBolha(nome); s.material.needsUpdate = true; s.userData.nome = nome; } }
function texMarca(cor){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.strokeStyle = cor; g.lineWidth = 10; g.fillStyle = cor + '30';
  g.beginPath(); g.moveTo(26, 8); g.lineTo(102, 8); g.quadraticCurveTo(120, 8, 120, 26); g.lineTo(120, 102); g.quadraticCurveTo(120, 120, 102, 120); g.lineTo(26, 120); g.quadraticCurveTo(8, 120, 8, 102); g.lineTo(8, 26); g.quadraticCurveTo(8, 8, 26, 8); g.closePath();
  g.fill(); g.stroke();
  return new THREE.CanvasTexture(c);
}

function carregar(){
  let novo = false;
  try { S = JSON.parse(localStorage.getItem(CHAVE_SALVO)); } catch (e){ S = null; }

  tom(f, dur, tipoO = 'square', vol = 0.06, f2 = 0, atraso = 0){
    if (!this.ctx || !S || !S.som) return;
    const t = this.ctx.currentTime + atraso, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = tipoO; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);

// ================= mapa e caminhos
// os ladrilhos ocupados por móveis (todos os lugares, comprados ou não) e as paredes, que são arestas entre ladrilhos
const OCUPADO = new Set(), PAREDE = new Set();
const kT = (x, z) => x + ',' + z;
const kA = (a, b, c, d) => (a < c || (a === c && b < d)) ? `${a},${b}|${c},${d}` : `${c},${d}|${a},${b}`;
function montarMapa(){
  for (const s of SLOTS) OCUPADO.add(kT(s.x, s.z));
  OCUPADO.add(kT(8, 8)); OCUPADO.add(kT(8, 9));
  for (const e of ESTANTES) OCUPADO.add(kT(e.x, e.z));
  // parede da frente (porta em x 10 e 11), da direita (porta do depósito em z 1) e as divisórias do depósito (porta em x 10)
  for (let x = 0; x <= 12; x++) if (x !== 10 && x !== 11) PAREDE.add(kA(x, 10, x, 11));
  for (let z = 0; z <= 10; z++) if (z !== 1) PAREDE.add(kA(12, z, 13, z));
  for (let z = 0; z <= 2; z++) PAREDE.add(kA(8, z, 9, z));
  for (let x = 9; x <= 12; x++) if (x !== 10) PAREDE.add(kA(x, 2, x, 3));
}
const ANDAVEL = new Set(['piso', 'deposito', 'calcada', 'beco']);
function andavel(x, z){ return x >= MX0 && x <= MX1 && z >= MZ0 && z <= MZ1 && ANDAVEL.has(tipoChao(x, z)) && !OCUPADO.has(kT(x, z)); }
function passa(x, z, nx, nz){
  if (!andavel(nx, nz)) return false;
  if (x !== nx && z !== nz){
    // na diagonal, os dois vizinhos do lado têm que estar livres e sem parede no meio
    return andavel(nx, z) && andavel(x, nz) && !PAREDE.has(kA(x, z, nx, z)) && !PAREDE.has(kA(x, z, x, nz)) && !PAREDE.has(kA(nx, z, nx, nz)) && !PAREDE.has(kA(x, nz, nx, nz));
  }
  return !PAREDE.has(kA(x, z, nx, nz));
}
// A* em 8 direções; devolve a lista de pontos (sem o ponto de partida), terminando exatamente no destino
function caminho(de, para){
  const sx = Math.floor(de[0]), sz = Math.floor(de[1]), gx = Math.floor(para[0]), gz = Math.floor(para[1]);
  if (sx === gx && sz === gz) return [para];
  const aberto = [[sx, sz]], g = new Map([[kT(sx, sz), 0]]), veio = new Map(), h = (x, z) => Math.hypot(x - gx, z - gz);
  const f = new Map([[kT(sx, sz), h(sx, sz)]]);
  let achou = false, voltas = 0;
  while (aberto.length && voltas++ < 4000){
    let mi = 0; for (let i = 1; i < aberto.length; i++) if (f.get(kT(...aberto[i])) < f.get(kT(...aberto[mi]))) mi = i;
    const [x, z] = aberto.splice(mi, 1)[0];
    if (x === gx && z === gz){ achou = true; break; }
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
      if (!dx && !dz) continue;
      const nx = x + dx, nz = z + dz;
      // o destino pode ser um ladrilho "ocupado" só se for o próprio fim (não acontece: os pontos de uso ficam na frente)
      if (!passa(x, z, nx, nz)) continue;
      const ng = g.get(kT(x, z)) + (dx && dz ? 1.414 : 1), k = kT(nx, nz);
      if (!g.has(k) || ng < g.get(k)){ g.set(k, ng); f.set(k, ng + h(nx, nz)); veio.set(k, [x, z]); if (!aberto.some(a => a[0] === nx && a[1] === nz)) aberto.push([nx, nz]); }
    }
  }
  if (!achou) return null;
  const pts = []; let c = [gx, gz];
  while (c[0] !== sx || c[1] !== sz){ pts.push([c[0] + 0.5, c[1] + 0.5]); c = veio.get(kT(...c)); }
  pts.reverse(); pts[pts.length - 1] = para;
  return alisar(de, pts);
}
// tira os pontos do meio quando dá para ir em linha reta, sem atravessar móvel nem parede
function retaLivre(a, b){
  const d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.ceil(d / 0.12);
  let px = Math.floor(a[0]), pz = Math.floor(a[1]);
  for (let i = 1; i <= n; i++){
    const x = a[0] + (b[0] - a[0]) * i / n, z = a[1] + (b[1] - a[1]) * i / n, tx = Math.floor(x), tz = Math.floor(z);
    if (tx !== px || tz !== pz){ if (!passa(px, pz, tx, tz)) return false; px = tx; pz = tz; }
    // longe do meio do ladrilho, não pode raspar num móvel do lado
    for (const [ox, oz] of [[0.22, 0], [-0.22, 0], [0, 0.22], [0, -0.22]]){ const qx = Math.floor(x + ox), qz = Math.floor(z + oz); if ((qx !== tx || qz !== tz) && !andavel(qx, qz) && !(qx === Math.floor(b[0]) && qz === Math.floor(b[1]))) return false; }
  }
  return true;
}
function alisar(de, pts){
  const r = []; let a = de, i = 0;
  while (i < pts.length){
    let j = pts.length - 1;
    while (j > i && !retaLivre(a, pts[j])) j--;
    r.push(pts[j]); a = pts[j]; i = j + 1;
  }
  return r;
}

// ================= o chão: piso da loja, depósito, calçada, rua e grama, num bloco de cubinhos (8 por ladrilho)
function corChao(t, gx, gz){
  const i = ((gx % 8) + 8) % 8, k = ((gz % 8) + 8) % 8, x = Math.floor(gx / 8), z = Math.floor(gz / 8), r = hash(gx, 1, gz), r2 = hash(gx >> 1, 2, gz >> 1);
  switch (t){
    case 'piso': if (i === 0 || k === 0) return 0xd8d2c4; return (x + z) & 1 ? 0xf7f1e3 : 0xdcebf5;
    case 'deposito': if (z === 2 && k === 7) return ((gx >> 1) & 1) ? 0xf2c230 : 0x3a3a40; return r < 0.5 ? 0xc4c0b8 : 0xbdb8b0;
    case 'beco': return r < 0.5 ? 0xc8c2b6 : 0xc0baae;
    case 'calcada': case 'calcada2':
      if ((t === 'calcada' && z === 12 && k === 7) || (t === 'calcada2' && k === 0)) return 0xb4ada0;
      return ((i >> 1) + (k >> 1)) & 1 ? (r < 0.5 ? 0xded6c6 : 0xd8d0c0) : (r < 0.5 ? 0xcfc6b5 : 0xc9c0ae);
    case 'rua':
      if (((z === 13 && k === 7) || (z === 14 && k === 0)) && ((gx >> 2) & 1)) return 0xf2c230;
      return r < 0.5 ? 0x5a5a60 : 0x55555b;
    default: return r2 < 0.5 ? (r < 0.5 ? 0x7cc657 : 0x76bf52) : (r < 0.5 ? 0x84cc5d : 0x7fc458);
  }
}
function construirChao(){
  const v = new Vox(), R = 8;
  for (let z = MZ0; z <= MZ1; z++) for (let x = MX0; x <= MX1; x++){
    const t = tipoChao(x, z);
    for (let i = 0; i < R; i++) for (let k = 0; k < R; k++){
      const gx = x * R + i, gz = z * R + k;
      v.set(gx, -1, gz, corChao(t, gx, gz));
    }
  }
  // as beiradas do diorama: camadas de terra que afinam para baixo
  const GX0 = MX0 * R, GX1 = (MX1 + 1) * R - 1, GZ0 = MZ0 * R, GZ1 = (MZ1 + 1) * R - 1;
  for (let gz = GZ0; gz <= GZ1; gz++) for (let gx = GX0; gx <= GX1; gx++){
    const b = Math.min(gx - GX0, gz - GZ0, GX1 - gx, GZ1 - gz), n = hash(gx, 0, gz), n2 = hash(gx >> 2, 9, gz >> 2);
    v.set(gx, -2, gz, 0x9a6a43);
    if (b >= 1 + (n < 0.5 ? 0 : 1)) v.set(gx, -3, gz, 0x7a4e33);
    if (b >= 3 + Math.floor(n2 * 3)) v.set(gx, -4, gz, 0x6c4430);
    if (b >= 6 + Math.floor(n2 * 4)) v.set(gx, -5, gz, 0x5e3b2a);
  }
  const chao = new THREE.Mesh(v.build(1 / R, { origin: [0, 0, 0], semFundo: true, jitter: 0 }), MAT);
  chao.receiveShadow = true; scene.add(chao);
  // tufinhos na grama
  const tf = new Vox();
  for (let gz = MZ0 * 16; gz < (MZ1 + 1) * 16; gz++) for (let gx = MX0 * 16; gx < (MX1 + 1) * 16; gx++){
    if (tipoChao(Math.floor(gx / 16), Math.floor(gz / 16)) !== 'grama') continue;
    const r = hash(gx, 5, gz);
    if (r < 0.012){ tf.box(gx, 0, gz, gx, r < 0.005 ? 1 : 0, gz, r < 0.006 ? 0x5ea341 : 0x6db74a); if (r < 0.0012) tf.set(gx, 1, gz, [0xf2d14a, 0xffffff, 0xf27fa4][Math.floor(hash(gx, 7, gz) * 3)]); }
  }
  const tufos = new THREE.Mesh(tf.build(1 / 16, { origin: [0, 0, 0], jitter: 0.02 }), MAT); tufos.receiveShadow = true; scene.add(tufos);
}
function colocar(m, x, y, z, ry = 0){ m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m; }

// ================= paredes: as duas que ficam entre a câmera e a loja abaixam, para dar para ver dentro
// cada parede tem a versão alta e a baixa; normal é o lado de fora dela
const PAREDES = [];
function montarParedes(){
  const ALTO = 36, BAIXO = 5, s = 1 / 16;
  const def = [
    { comp: 13, vaos: [], pos: [0, -2 / 16], ry: 0, normal: [0, -1] },                 // fundo
    { comp: 11, vaos: [], pos: [-2 / 16, 11], ry: Math.PI / 2, normal: [-1, 0] },        // esquerda (vai de z 11 a 0)
    { comp: 13, vaos: [[10, 12]], pos: [13, 11 + 2 / 16], ry: Math.PI, normal: [0, 1] }, // frente (vai de x 13 a 0)
    { comp: 11, vaos: [[1, 2]], pos: [13 + 2 / 16, 0], ry: -Math.PI / 2, normal: [1, 0] }, // direita (vai de z 0 a 11)
  ];
  for (const d of def){
    // na parede da frente o vão é contado a partir do x 13: a porta em x 10..12 vira o trecho 1..3
    const vaos = d.normal[1] === 1 ? [[13 - 12, 13 - 10]] : d.vaos;
    const alta = malha(geo('paredeA' + d.comp + JSON.stringify(vaos), () => vParede(d.comp, ALTO, vaos).build(s, { origin: [0, 0, 0], jitter: 0.01 })));

    const g = new THREE.Group(); g.add(alta); g.add(baixa);

  colocar(malha(div.build(1 / 16, { origin: [0, 0, 0] })), 9 - 1 / 16, 0, 0);
  for (const [a, b] of [[9, 10], [11, 13]]){

  // letreiros pintados nas paredes de dentro

    const m = placaDeTexto(texturaTexto(linhas, w, h, '#ffffff00'), larg, alt);

  letreiro([['MERCEARIA', 1, '#b5603c']], 512, 90, 2.6, 0.46, 1, 0.01, 1.45, 3.6, Math.PI / 2);

  const rel = malha(geo('relogioParede', () => VI.relogio().build(1 / 26)), false); rel.rotation.y = Math.PI / 2; rel.position.set(0.02, 1.62, 5.5); scene.add(rel); PAREDES[1].extras.push(rel);
  const quadro = placaDeTexto(texturaTexto([['DIRETO DA', 0.6, '#7a4a2a'], ['FAZENDA JOLI PIG', 1, '#b58a12']], 512, 200, '#fff3c4', '#b58a12'), 1.5, 0.6);
  quadro.position.set(0.02, 1.62, 9.4); quadro.rotation.y = Math.PI / 2; scene.add(quadro); PAREDES[1].extras.push(quadro);

function atualizarParedes(){
  const cx = Math.sin(cam.az), cz = Math.cos(cam.az);

    g.font = fonte(pp); g.fillStyle = vazio ? '#c8303a' : '#e0408a'; g.fillText(rot, x0, y0 + linhas.length * px * 1.05 + pp / 2 + 2);

// ================= personagens
class Porco {
  // modelo: { corpo, braco, pe, ombro: [x, y, z], quadril: [x, y], mao: [y, z], altura } em cubinhos; sem ele, é um porquinho
  constructor(cor, bolso, nome, modelo){
    this.nome = nome;
    const s = 1 / 57;
    const M = modelo || { corpo: () => vPorco(cor, bolso), braco: vBraco, pe: vPe, ombro: [15.5, 28.5, 1], quadril: [7, 9], mao: [-16, 1.5], altura: 1.32 };
    const op = { origin: [0.5, 0, 0.5], jitter: 0.015, ao: AO_SUAVE };
    this.g = new THREE.Group(); this.corpo = new THREE.Group(); this.g.add(this.corpo);
    const m = malha(geo('corpo' + nome, () => M.corpo().build(s, op)));
    this.corpo.add(m);
    const gb = geo('braco' + (modelo ? nome : ''), () => M.braco().build(s, op)), gp = geo('pe' + (modelo ? nome : ''), () => M.pe().build(s, op));
    const [ox, oy, oz] = M.ombro, [qx, qy] = M.quadril;
    this.bE = new THREE.Group(); this.bE.position.set(-ox * s, oy * s, oz * s); this.bE.add(malha(gb)); this.corpo.add(this.bE);
    this.bD = new THREE.Group(); this.bD.position.set(ox * s, oy * s, oz * s); this.bD.add(malha(gb)); this.corpo.add(this.bD);
    this.pE = new THREE.Group(); this.pE.position.set(-qx * s, qy * s, 0); this.pE.add(malha(gp)); this.g.add(this.pE);
    this.pD = new THREE.Group(); this.pD.position.set(qx * s, qy * s, 0); this.pD.add(malha(gp)); this.g.add(this.pD);
    this.mao = new THREE.Group(); this.mao.position.set(0, M.mao[0] * s, M.mao[1] * s); this.bD.add(this.mao);
    this.altura = M.altura; this.aceno = 0; this.escala = s;
    this.ferramentas = {};
    this.pos = new THREE.Vector2(); this.pontos = []; this.vel = 2.7; this.turbo = 1; this.ang = 0; this.angAlvo = 0; this.fase = 0; this.estado = 'parado';
    this.trab = null; this.aoChegar = null; this.pulo = 0;
    this.sentado = 0; this.quadrilY = M.quadril[1] * s; // sentado: altura do quadril num banquinho (cena do cafezinho)
    this.carga = new THREE.Group(); this.carga.position.set(0, 0.5, 0.36); this.carga.visible = false; this.corpo.add(this.carga);
    if (nome !== 'ed'){ this.g.traverse(o => { o.userData.alvo = { k: nome }; }); pickaveis.push(this.g); }
  }
  colocar(x, z){ this.pos.set(x, z); this.g.position.set(x, 0, z); }
  ir(pontos, aoChegar){ this.pontos = pontos.slice(); this.aoChegar = aoChegar; this.estado = this.pontos.length ? 'andando' : 'parado'; if (!this.pontos.length && aoChegar) aoChegar(); }
  olhar(x, z){ if (Math.hypot(x - this.pos.x, z - this.pos.y) > 0.01) this.angAlvo = Math.atan2(x - this.pos.x, z - this.pos.y); }
  ferramenta(n){
    for (const k in this.ferramentas) this.ferramentas[k].visible = false;
    if (!n) return;
    if (!this.ferramentas[n]){
      const fn = { cesta: vCesta }[n];
      if (!fn) return; // 'comer' e afins: só o gesto, sem ferramenta
      const mm = malha(geo('ferr' + n, () => fn().build(1 / 19, { origin: [0.5, 0, 0.5] })));
      this.mao.add(mm); this.ferramentas[n] = mm;
    }
    this.ferramentas[n].visible = true;
  }
  trabalhar(dur, ferr, aoFim){ this.estado = 'trabalhando'; this.trab = { t: 0, dur, ferr, aoFim }; this.ferramenta(ferr); }
  update(dt, t){
    if (this.estado === 'andando' && this.pontos.length){
      const p = this.pontos[0];
      const dx = p[0] - this.pos.x, dz = p[1] - this.pos.y, d = Math.hypot(dx, dz);
      const passo = this.vel * this.turbo * dt;
      if (d <= passo){ this.pos.set(p[0], p[1]); this.pontos.shift(); if (!this.pontos.length){ this.estado = 'parado'; const cb = this.aoChegar; this.aoChegar = null; if (cb) cb(); } }
      else { this.pos.x += dx / d * passo; this.pos.y += dz / d * passo; if (this.turbo) this.angAlvo = Math.atan2(dx, dz); }
      this.fase += dt * 11 * this.turbo;
    }
    this.ang = anguloPerto(this.ang, this.angAlvo, Math.min(1, dt * 12));
    this.g.position.set(this.pos.x, 0, this.pos.y);
    this.g.rotation.y = this.ang;
    const andando = this.estado === 'andando';
    const sw = andando ? Math.sin(this.fase) : 0;
    this.pE.rotation.x = sw * 0.7; this.pD.rotation.x = -sw * 0.7;
    this.bE.rotation.set(-sw * 0.6, 0, -0.65); this.bD.rotation.set(sw * 0.6, 0, 0.65);
    if (this.sentado){ this.g.position.y = this.sentado; this.pE.rotation.x = this.pD.rotation.x = -1.3; }
    this.corpo.position.y = andando ? Math.abs(Math.sin(this.fase)) * 0.045 : 0;
    this.corpo.rotation.set(0, 0, andando ? Math.sin(this.fase) * 0.06 : 0);
    this.corpo.scale.set(1, 1 + (andando ? 0 : Math.sin(t * 2.4) * 0.015), 1);
    if (this.aceno > 0){ this.aceno -= dt; this.bD.rotation.set(-0.3, 0, 2.5 + Math.sin(t * 11) * 0.35); }
    // carregando caixote: os dois braços para a frente, segurando por baixo
    if (this.carga.visible && this.estado !== 'trabalhando'){ this.bE.rotation.set(-1.15 - sw * 0.08, 0, -0.12); this.bD.rotation.set(-1.15 + sw * 0.08, 0, 0.12); }
    if (this.pulo > 0){ this.pulo -= dt; this.corpo.position.y += Math.sin((1 - this.pulo / 0.45) * Math.PI) * 0.22; }
    if (this.estado === 'trabalhando'){
      const w = this.trab; w.t += dt;
      const k = w.t * 10;
      switch (w.ferr){
        case 'cesta': case null: this.corpo.rotation.x = 0.28 + Math.sin(k) * 0.08; this.bD.rotation.set(-1 + Math.sin(k) * 0.5, 0, 0.3); this.bE.rotation.set(-1 - Math.sin(k) * 0.5, 0, -0.3); break;
        // repor: os braços vão e voltam da prateleira, um de cada vez
        case 'repor': this.corpo.rotation.x = 0.1; this.bD.rotation.set(-1.5 + Math.max(0, Math.sin(k * 0.7)) * -0.5, 0, 0.2); this.bE.rotation.set(-1.5 + Math.max(0, -Math.sin(k * 0.7)) * -0.5, 0, -0.2); break;
        // pegar: abaixa para pegar o caixote no depósito
        case 'pegar': { const p = Math.sin(Math.min(1, w.t / w.dur) * Math.PI); this.corpo.rotation.x = p * 0.35; this.bD.rotation.set(-1.2 - p * 0.3, 0, 0.15); this.bE.rotation.set(-1.2 - p * 0.3, 0, -0.15); break; }
        // caixa: passa as compras no leitor, com a mão direita indo de um lado para o outro
        case 'caixa': this.bD.rotation.set(-1.2, 0, 0.35 + Math.sin(k * 0.9) * 0.45); this.bE.rotation.set(-0.9, 0, -0.3); this.corpo.rotation.x = 0.06; break;
      }
      if (w.t >= w.dur){ this.estado = 'parado'; this.mao.rotation.x = 0; this.ferramenta(null); const cb = w.aoFim; this.trab = null; if (cb) cb(); }
    } else this.mao.rotation.x = 0;
  }
  topo(){ return new THREE.Vector3(this.pos.x, this.altura, this.pos.y); }
  trocarPes(chave, fn){
    const g = geo(chave, () => fn().build(this.escala, { origin: [0.5, 0, 0.5], jitter: 0.015, ao: AO_SUAVE }));
    for (const pe of [this.pE, this.pD]){ pe.clear(); pe.add(malha(g)); }
  }
}

// relógio do jogo: o que acontece "daqui a pouco" conta o tempo de jogo, não o do relógio do aparelho
const TIMERS = [];
function depois(seg, fn){ TIMERS.push({ t: seg, fn }); }
function atualizarTimers(dt){
  for (let i = TIMERS.length - 1; i >= 0; i--){ const x = TIMERS[i]; x.t -= dt; if (x.t <= 0){ TIMERS.splice(i, 1); x.fn(); } }
}

// ================= Beto: tarefas na fila (repor, ir para o caixa, andar). Sem tarefa e com freguês esperando, vai sozinho para o caixa
// quem está repondo cada móvel (fica fora do save)
const RESERVA = {};
const ocupado = q => q.tarefa || q.estado !== 'parado';
function tarefaBeto(t){
  if (t.tipo === 'repor' && (beto.fila.some(f => f.tipo === 'repor' && f.id === t.id) || (beto.tarefa && beto.tarefa.id === t.id))){ aviso('O Beto já vai repor esse.'); return false; }
  if (beto.fila.length >= 12){ aviso('O Beto já tem muita coisa para fazer!', 'ruim'); return false; }
  beto.fila.push(t); atualizarFilaBeto(); return true;
}
function atualizarFilaBeto(){
  const n = beto.fila.length + (beto.tarefa && beto.tarefa.tipo !== 'caixa' ? 1 : 0);
  $('fila').hidden = n < 2;
  $('filaTexto').textContent = `Beto tem ${n} tarefas`;
}
function proximaTarefaBeto(){
  if (cine || beto.atendendo || ocupado(beto)) return;
  const t = beto.fila.shift();
  atualizarFilaBeto();
  if (t){ beto.noCaixa = false; executar(beto, t); return; }
  // ninguém no caixa e freguês na fila: o Beto vai sozinho
  if (!beto.noCaixa && FILA_GENTE.length && !quemNoCaixa() && !(S.jaca === 'caixa' && jaca.tarefa && jaca.tarefa.tipo === 'caixa')) executar(beto, { tipo: 'caixa' });
}
function executar(q, t){
  q.tarefa = t;
  const fim = () => { q.tarefa = null; if (q === beto) atualizarFilaBeto(); };
  if (t.tipo === 'caixa'){
    andar(q, CAIXA.atendente, () => { q.olhar(CAIXA.atendente[0] + 1, CAIXA.atendente[1]); q.noCaixa = true; fim(); });
    return;
  }
  if (t.tipo === 'andar'){ andar(q, t.para, fim); return; }
  if (t.tipo === 'repor') repor(q, t.id, fim);
}
// repor: vai até a estante mais perto, pega o caixote, leva até o móvel e arruma uma unidade de cada vez
function repor(q, id, fim){
  const m = S.modulos[id], s = SLOT[id];
  if (!m || !m.p){ fim(); return; }
  const p = m.p;
  if (!(S.estoque[p] > 0)){ falar(q, variar(FALAS_SEM_ESTOQUE(p), 'semEstoque'), 3); Som.erro(); fim(); return; }
  if (m.n >= CAP){ fim(); return; }
  RESERVA[id] = q;
  const est = ESTANTES.reduce((a, e) => Math.hypot(frenteEstante(e)[0] - q.pos.x, frenteEstante(e)[1] - q.pos.y) < Math.hypot(frenteEstante(a)[0] - q.pos.x, frenteEstante(a)[1] - q.pos.y) ? e : a);
  andar(q, frenteEstante(est), () => {
    q.olhar(est.x + 0.5, est.z);
    q.trabalhar(0.55, 'pegar', () => {
      const leva = Math.min(CAP - m.n, S.estoque[p] || 0);
      if (leva <= 0 || m.p !== p){ delete RESERVA[id]; fim(); return; }
      S.estoque[p] -= leva; if (!S.estoque[p]) delete S.estoque[p];
      atualizarDeposito(); Som.caixote();
      segurar(q, p);
      andar(q, frenteDe(s), () => {
        q.olhar(...centroDe(s));
        let falta = leva;
        const umaUnidade = () => {
          if (falta <= 0 || m.p !== p || !S.modulos[id]){
            // se trocaram o produto no meio, o que sobrou volta para o estoque
            if (falta > 0){ S.estoque[p] = (S.estoque[p] || 0) + falta; atualizarDeposito(); }
            segurar(q, null); delete RESERVA[id];
            if (q === beto && Math.random() < 0.35) falar(beto, variar(FALAS_REPOS), 2);
            ganharXp(1); salvar(); fim(); return;
          }
          const passo = (S.melhorias.carrinho ? 0.14 : 0.28) * (q === jaca ? 1.5 : 1);
          q.trabalhar(passo, 'repor', () => { m.n = Math.min(CAP, m.n + 1); falta--; atualizarMovel(id); Som.clique(); umaUnidade(); });
        };
        umaUnidade();
      });
    });
  });
}

// ================= Jaca, o gerente: recepção, caixa ou reposição (escolhida pelo jogador)
let jacaEspera = 0;
function atualizarJaca(dt){
  if (cine || ocupado(jaca) || jaca.atendendo) return;
  const f = S.jaca;
  if (f === 'caixa'){
    if (!jaca.noCaixa){
      // se o Beto está no caixa, ele sai para o Jaca entrar
      if (beto.noCaixa && !beto.atendendo){ beto.noCaixa = false; if (!ocupado(beto) && !beto.fila.length) executar(beto, { tipo: 'andar', para: [6.5, 8.6] }); }
      if (beto.atendendo) return;
      executar(jaca, { tipo: 'caixa' });
    }
    return;
  }
  if (jaca.noCaixa){ jaca.noCaixa = false; }
  if (f === 'porta'){
    if (Math.hypot(jaca.pos.x - LUGAR_JACA_PORTA[0], jaca.pos.y - LUGAR_JACA_PORTA[1]) > 0.05) executar(jaca, { tipo: 'andar', para: LUGAR_JACA_PORTA });
    else jaca.olhar(PORTA[0], PORTA[1] + 0.3);
    return;
  }
  if (f === 'repor'){
    jacaEspera -= dt; if (jacaEspera > 0) return; jacaEspera = 1.5;
    // o que estiver mais vazio (abaixo da metade), que tenha no depósito e que o Beto não vá repor
    let melhor = null, menor = 0.5;
    for (const id in S.modulos){
      const m = S.modulos[id];
      if (!m.p || RESERVA[id] || !(S.estoque[m.p] > 0) || beto.fila.some(t => t.id === id) || (beto.tarefa && beto.tarefa.id === id)) continue;
      const r = m.n / CAP; if (r < menor){ menor = r; melhor = id; }
    }
    if (melhor) executar(jaca, { tipo: 'repor', id: melhor });
    else if (Math.hypot(jaca.pos.x - 7.5, jaca.pos.y - 5.5) > 0.6) executar(jaca, { tipo: 'andar', para: [7.5, 5.5] });
  }
}
function trocarFuncaoJaca(f){
  S.jaca = f; salvar();
  if (jaca.noCaixa && f !== 'caixa') jaca.noCaixa = false;
  falar(jaca, { porta: 'Deixa comigo a recepção!', caixa: 'Tô indo pro caixa, sócio!', repor: 'Vou ficar de olho nas prateleiras!' }[f], 2.5);
  Som.jaca();
}
const quemNoCaixa = () => (beto.noCaixa && !ocupado(beto)) ? beto : (jaca.noCaixa && !ocupado(jaca)) ? jaca : null;

// ================= fregueses
const FREGUESES = [], FILA_GENTE = [];
let nFregues = 0, proxFregues = 6;
const FAMILIA = [

class Fregues {

    this.estado = 'chegando'; this.cb = null; this.espera = 0; this.paciencia = (S.melhorias.radio ? 70 : 48) * rnd(0.85, 1.2); this.levou = []; this.faltou = [];
    const lado = Math.random() < 0.5 ? -1 : 1;

  colocar(x, z){ this.pos.set(x, z); this.g.position.set(x, 0, z); }

  andarAte(para, cb){ this.ir(caminho([this.pos.x, this.pos.y], para) || [para], cb); }
  olhar(x, z){ if (Math.hypot(x - this.pos.x, z - this.pos.y) > 0.01) this.angAlvo = Math.atan2(x - this.pos.x, z - this.pos.y); }

  update(dt, t){

      else { this.pos.x += dx / d * passo; this.pos.y += dz / d * passo; this.angAlvo = Math.atan2(dx, dz); }

    this.ang = anguloPerto(this.ang, this.angAlvo, Math.min(1, dt * 10));
    this.g.position.set(this.pos.x, 0, this.pos.y);

      this.p.pos.set(0, 0); this.p.ang = this.p.angAlvo = 0; this.p.update(dt, t); this.p.g.position.set(0, 0, 0);

      this.corpo.rotation.z = andando ? Math.sin(this.fase) * 0.05 : 0;
      this.corpo.rotation.x = this.pegando > 0 ? 0.25 : 0;
    }
    if (this.pegando > 0) this.pegando -= dt;

// a lista de compras: quase sempre coisas que estão à venda; às vezes algo que o mercado ainda não vende
function montarLista(){
  const nv = nivel(), vendidos = [];
  for (const id in S.modulos){ const m = S.modulos[id]; if (m.p) vendidos.push(m.p); }
  const liberados = ORDEM_PROD.filter(p => PROD[p].nivel <= nv);
  const fora = liberados.filter(p => !vendidos.includes(p));
  const nItens = Math.min(5, 1 + Math.floor(Math.random() * Math.min(4, 1 + vendidos.length / 2)) + (S.melhorias.cestas && Math.random() < 0.6 ? 1 : 0));
  const lista = [];
  for (let i = 0; i < nItens; i++){
    let p;
    if (fora.length && Math.random() < 0.08) p = sorteia(fora);
    else if (vendidos.length){
      // o barato sai mais: peso menor para o que custa caro
      const pesos = vendidos.map(q => 1 / Math.sqrt(PROD[q].custo)), tot = pesos.reduce((a, b) => a + b, 0);
      let r = Math.random() * tot; p = vendidos[pesos.findIndex(w => (r -= w) <= 0)] || vendidos[0];
    }
    if (!p || lista.some(l => l.p === p)) continue;
    const barato = PROD[p].custo < 20;
    lista.push({ p, q: 1 + (Math.random() < (barato ? 0.6 : 0.25) ? 1 : 0) + (barato && Math.random() < 0.25 ? 1 : 0) + (S.melhorias.cestas && Math.random() < 0.5 ? 1 : 0) });
  }
  return lista;
}
// o móvel com o produto, de preferência um que tenha unidade
function moduloCom(p){
  let melhor = null;
  for (const id in S.modulos){ const m = S.modulos[id]; if (m.p !== p) continue; if (!melhor || m.n > S.modulos[melhor].n) melhor = id; }
  return melhor;
}
function soltarFregues(){
  const f = new Fregues(); FREGUESES.push(f);
  f.estado = 'chegando';
  f.ir([[PORTA_FORA[0] + rnd(-0.15, 0.15), CALCADA_Z + rnd(-0.1, 0.1)], PORTA_FORA], () => {
    Som.porta();
    f.ir([PORTA, [PORTA[0] - 0.2, 9.6]], () => {
      if (S.jaca === 'porta' && !ocupado(jaca) && Math.random() < 0.7){ jaca.aceno = 1.2; falar(jaca, variar(FALAS_BOAS_VINDAS), 2.2); }
      if (f.fam) falar(f, sorteia(f.fam.fala), 3.5);
      else if (Math.random() < 0.3 && f.lista.length) falar(f, variar(FALAS_FREGUES_QUER(f.lista.map(l => l.p)), 'quer'), 3);
      proximoItem(f);
    });
  });
}
function proximoItem(f){
  const it = f.lista.find(l => !l.feito);
  if (!it){ irParaFila(f); return; }
  f.estado = 'comprando';
  const id = moduloCom(it.p);
  f.bolha.visible = true; trocarBolha(f.bolha, it.p);
  if (!id){ it.feito = true; faltou(f, it.p, false, true); depois(0.9, () => proximoItem(f)); return; }
  const s = SLOT[id];
  f.andarAte(frenteDe(s), () => {
    f.olhar(...centroDe(s));
    f.pegando = 0.9; if (f.p) f.p.trabalhar(0.9, 'cesta');
    depois(0.9, () => {
      if (!FREGUESES.includes(f)) return;
      const m = S.modulos[id];
      const pega = m && m.p === it.p ? Math.min(it.q, m.n) : 0;
      if (pega){ m.n -= pega; atualizarMovel(id); f.levou.push({ p: it.p, q: pega }); }
      if (pega < it.q) faltou(f, it.p, pega > 0);
      it.feito = true;
      proximoItem(f);
    });
  });
}
// fora: o mercado nem vende (pesa menos que a prateleira vazia de algo que vende)
function faltou(f, p, parcial, fora){
  f.faltou.push(p);
  if (!parcial){ mudarRep(fora ? -1 : -2); trocarBolha(f.bolha, 'nuvem'); falar(f, variar(FALAS_FALTOU(p), 'faltou'), 2.6); Som.triste(); }
}
function irParaFila(f){
  if (!f.levou.length){ sair(f, false); return; }
  f.estado = 'fila'; f.bolha.visible = false; f.espera = 0;
  FILA_GENTE.push(f);
  andarNaFila(f);
}
function andarNaFila(f){
  const i = FILA_GENTE.indexOf(f);
  if (i < 0) return;
  // quem não cabe na fila espera perto do último lugar
  const ponto = i < FILA.length ? FILA[i] : [FILA[FILA.length - 1][0] - 0.9, FILA[FILA.length - 1][1] - 0.3 + (i - FILA.length) * 0.5];
  f.chegouFila = false;
  f.andarAte(ponto, () => { f.chegouFila = true; f.olhar(f.pos.x, f.pos.y + 1); if (i === 0) f.olhar(CAIXA.atendente[0], f.pos.y); });
}
function sair(f, feliz){
  f.estado = 'saindo';
  const k = FILA_GENTE.indexOf(f); if (k >= 0){ FILA_GENTE.splice(k, 1); FILA_GENTE.forEach(andarNaFila); }
  if (!feliz && f.levou.length){
    // desistiu com a cestinha: o Jaca devolve tudo para o depósito
    for (const l of f.levou) S.estoque[l.p] = (S.estoque[l.p] || 0) + l.q;
    atualizarDeposito();
  }
  if (feliz){ f.bolha.visible = true; trocarBolha(f.bolha, f.faltou.length ? 'sacola' : 'coracao'); depois(1.6, () => { f.bolha.visible = false; }); }
  else { f.bolha.visible = true; trocarBolha(f.bolha, 'nuvem'); }
  const fim = Math.random() < 0.5 ? MX0 + 0.5 : MX1 + 0.5;
  f.andarAte(PORTA, () => f.ir([PORTA_FORA, [fim, CALCADA_Z + rnd(-0.2, 0.25)]], () => tirarFregues(f)));
}
function tirarFregues(f){
  scene.remove(f.g); const i = FREGUESES.indexOf(f); if (i >= 0) FREGUESES.splice(i, 1);
  const k = pickaveis.indexOf(f.g); if (k >= 0) pickaveis.splice(k, 1);
  const j = FALAS.findIndex(x => x.quem === f); if (j >= 0){ FALAS[j].el.remove(); FALAS.splice(j, 1); }
}
// o caixa: quem estiver nele passa as compras do primeiro da fila, uma unidade de cada vez
function atualizarCaixa(dt){
  const f = FILA_GENTE[0];
  for (const g of FILA_GENTE){
    if (g === f && g.atendido) continue;
    g.espera += dt;
    if (g.espera > g.paciencia * 0.6 && g.bolha && !g.bolha.visible){ g.bolha.visible = true; trocarBolha(g.bolha, 'relogio'); }
    if (g.espera > g.paciencia){ falar(g, variar(FALAS_DESISTE), 2.6); mudarRep(-5); Som.triste(); sair(g, false); return; }
  }
  if (!f || !f.chegouFila) return;
  const q = quemNoCaixa();
  if (!q) return;
  if (!f.atendido){
    f.atendido = true; f.bolha.visible = false; q.atendendo = f;
    f.olhar(q.pos.x, q.pos.y);
    const unidades = f.levou.reduce((a, l) => a + l.q, 0);
    const porUnidade = 0.55 * (S.melhorias.leitor ? 0.6 : 1) * (q === jaca ? 1.4 : 1);
    let i = 0;
    const passar = () => {
      if (i >= unidades){ pagar(f, q); return; }
      q.trabalhar(porUnidade, 'caixa', () => { Som.bip(); i++; passar(); });
    };
    passar();
  }
}
function pagar(f, q){
  let total = 0, xp = 0;
  for (const l of f.levou){ total += preco(l.p) * l.q; xp += xpVenda(l.p) * l.q; S.vendidos += l.q; }
  S.dinheiro += total; chipPulsa('chipDinheiro');
  Som.registradora();
  flutuar(new THREE.Vector3(CAIXA.x + 0.5, 1.2, CAIXA.z + 1), '+' + reais(total), 'ouro', 'moeda');
  ganharXp(xp + 2);
  mudarRep(f.faltou.length ? 0.5 : 2);
  q.atendendo = null;
  falar(f, f.fam ? `Valeu, ${q === jaca ? 'Jaca' : 'maninho'}!` : variar(q === jaca ? FALAS_PAGOU_JACA : FALAS_PAGOU), 2.4);
  sair(f, true);

}
function atualizarFregueses(dt, t){
  for (const f of FREGUESES.slice()) f.update(dt, t);
  if (cine) return;
  proxFregues -= dt;
  const temAlgo = Object.values(S.modulos).some(m => m.p && m.n > 0);
  const max = Math.min(10, 3 + nivel());
  if (proxFregues <= 0){
    if (temAlgo && FREGUESES.length < max) soltarFregues();
    const base = 12 - 6 * S.rep / 100;

function mudarRep(d){ S.rep = clamp(S.rep + d, 0, 100); atualizarHud(); }
const estrelas = () => 1 + S.rep / 25;

// ================= a entrega do Ed: o caminhão chega pela rua, o Ed leva os caixotes pelo beco até o depósito e vai embora
const entrega = { estado: 'longe', x: CAMINHAO.de, fila: [] };
function encomendar(itens){
  const n = Object.values(itens).reduce((a, b) => a + b, 0);
  const custo = Object.entries(itens).reduce((a, [p, c]) => a + c * PROD[p].caixa * PROD[p].custo, 0);
  if (!n || S.pedido || S.dinheiro < custo) return false;
  S.dinheiro -= custo;
  S.pedido = { itens, chega: Date.now() + tempoEntrega(n) * 1000, total: n, feitos: 0 };
  S.ultimoPedido = itens;
  Som.telefone();
  aviso(`Pedido feito! O Ed chega em ${tempo(tempoEntrega(n))}.`);

}
// socorro: se o mercado ficou sem nada para vender, sem estoque e sem dinheiro para um caixote, o Ed manda umas caixas
// por conta dele (senão o jogo travava)
let semNadaDesde = 0;
function verificarSocorro(){
  const barato = Math.min(...ORDEM_PROD.filter(p => PROD[p].nivel <= nivel()).map(p => PROD[p].custo * PROD[p].caixa));
  const travado = !S.pedido && entrega.estado === 'longe' && !cine && estoqueTotal() === 0 && S.dinheiro < barato && Object.values(S.modulos).every(m => !m.n) && !FILA_GENTE.length;
  if (!travado){ semNadaDesde = 0; return; }
  if (!semNadaDesde){ semNadaDesde = Date.now(); return; }
  if (Date.now() - semNadaDesde < 6000) return;

function atualizarEntrega(dt){
  const e = entrega;

    if (!S.pedido || cine || Date.now() < S.pedido.chega) return;
    // monta a lista de caixotes que faltam descarregar
    e.fila = [];
    for (const p of ORDEM_PROD) for (let i = 0; i < (S.pedido.itens[p] || 0); i++) e.fila.push(p);
    e.fila = e.fila.slice(S.pedido.feitos || 0);
    e.estado = 'chegando'; e.x = CAMINHAO.de; caminhaoM.visible = true;
  }
  if (e.estado === 'chegando'){
    const falta = CAMINHAO.para - e.x;
    e.x += Math.max(1.2, Math.min(7, falta * 1.6)) * dt;
    if (e.x >= CAMINHAO.para){
      e.x = CAMINHAO.para; e.estado = 'aqui'; Som.buzina();
      ed.g.visible = true; ed.colocar(...DESCIDA_ED); ed.olhar(DESCIDA_ED[0] - 1, DESCIDA_ED[1] - 1);

      else { falar(ed, variar(FALAS_ED_CHEGA), 3); Som.oinc(); depois(0.9, descarregar); }
    }
  }
  if (e.estado === 'indo'){
    e.x += Math.min(8, (e.x - CAMINHAO.para) * 1.8 + 1.2) * dt;
    if (e.x > CAMINHAO.ate){ e.estado = 'longe'; caminhaoM.visible = false; }

    andar(ed, DESCIDA_ED, () => {

      depois(1.6, () => { ed.g.visible = false; e.estado = 'indo'; Som.buzina(); });
    });
    return;
  }
  ed.olhar(DESCIDA_ED[0] + 1, DESCIDA_ED[1] + 0.8);
  ed.trabalhar(0.5, 'pegar', () => {
    // leva até três caixotes do mesmo produto por viagem
    const p = e.fila[0]; let n = 1; while (n < 3 && e.fila[n] === p) n++;
    segurar(ed, p, n);
    if (Math.random() < 0.3) falar(ed, variar(FALAS_ED_CARREGA), 2);
    const est = ESTANTES[rodadaEstante++ % ESTANTES.length];
    andar(ed, frenteEstante(est), () => {

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), planoChao = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ptChao = new THREE.Vector3();
function alvoNaTela(cx, cy){
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickaveis.filter(o => o.visible !== false), true);
  // personagens primeiro: são pequenos e ficam na frente dos móveis
  for (const pref of [true, false]) for (const h of hits){
    let vis = true; for (let p = h.object; p; p = p.parent) if (p.visible === false) vis = false;
    const a = h.object.userData.alvo;
    if (!vis || !a) continue;
    const pessoa = ['beto', 'jaca', 'ed', 'fregues'].includes(a.k);
    if (pref === pessoa) return a;
  }
  if (ray.ray.intersectPlane(planoChao, ptChao)){
    const x = Math.floor(ptChao.x), z = Math.floor(ptChao.z);
    if (andavel(x, z)) return { k: 'chao', x, z };
  }
  return null;
}
