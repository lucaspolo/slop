  if (alvo.k === 'caminhao' || alvo.k === 'ed'){ if (ed.g.visible){ falar(ed, variar(['Oinc! Tô levando tudo pro depósito!', 'Já já termino, maninho!', 'Tudo fresquinho!', 'Oi, Beto! Oi, Jaca!', 'Esse caminhão é meu xodó!', 'Aoooa! Que mercado bonito!', 'Cuidado que eu passo com caixote!', 'A horta mandou lembranças!', 'Oinc oinc!', 'Mais um pouquinho e acabo!', 'Vende tudo, hein?']), 2.4); Som.oinc(); } else abrirPedido(); return; }
  if (alvo.k === 'fregues'){
    const f = alvo.f, falta = f.lista.filter(l => !l.feito).map(l => l.p);
    if (f.estado === 'fila') falar(f, f.atendido ? 'Passando as compras!' : 'Tô na fila!', 1.8);
    else if (falta.length) falar(f, variar(FALAS_FREGUES_QUER(falta), 'quer'), 2.6);
    else falar(f, 'Tchau!', 1.4);
    return;
  }
  if (alvo.k === 'chao'){
    if (!beto.fila.length && !beto.atendendo){ beto.noCaixa = false; tarefaBeto({ tipo: 'andar', para: [alvo.x + 0.5, alvo.z + 0.5] }); Som.clique(); }
    return;
  }
  // atalhos: tocar num móvel vazio com estoque já manda repor; tocar no caixa sem ninguém já chama o Beto
  if (alvo.k === 'slot'){
    const m = S.modulos[alvo.id];
    if (m && m.p && m.n < CAP && S.estoque[m.p] > 0 && !naFilaDoBeto(alvo.id) && !RESERVA[alvo.id]){
      if (tarefaBeto({ tipo: 'repor', id: alvo.id })){ Som.oinc(); falar(beto, variar(['Já vou!', 'Deixa comigo!', 'Oinc! Tô indo!', 'Vou buscar no depósito!', 'Pode deixar!', 'É pra já!', 'Vou arrumar!', 'Já já fica cheia!', 'Oinc oinc!', 'Correndo!', 'Bora repor!'], 'jaVou'), 1.6); marcar(SLOT[alvo.id]); }
      return;
    }
  }
  if (alvo.k === 'caixa' && S.jaca !== 'caixa' && !beto.noCaixa && !(beto.tarefa && beto.tarefa.tipo === 'caixa') && !beto.fila.some(t => t.tipo === 'caixa')){
    if (tarefaBeto({ tipo: 'caixa' })){ Som.oinc(); falar(beto, 'Tô indo pro caixa!', 1.6); }
    return;
  }
  Som.clique();
  abrirMenu(alvo, cx, cy);
}
// um piscar da marca amarela no chão do móvel, para mostrar que o toque valeu
let marcaAte = 0;
function marcar(s){ if (!marcaSel.material.map) marcaSel.material.map = texMarca('#ffe066'); marcaSel.position.set(s.x + 0.5, 0.015, s.z + 0.5); marcaSel.visible = true; marcaAte = performance.now() + 600; }
const ponteiros = new Map();
let arrastou = false, pinca = 0, inicio = null;
function eventos(){
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    ponteiros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ponteiros.size === 1){ arrastou = false; inicio = { x: e.clientX, y: e.clientY }; }
    if (ponteiros.size === 2){ const [a, b] = [...ponteiros.values()]; pinca = Math.hypot(a.x - b.x, a.y - b.y); arrastou = true; }
  });
  canvas.addEventListener('pointermove', e => {
    const p = ponteiros.get(e.pointerId);
    if (!p) return;
    if (ponteiros.size === 1){
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (!arrastou && Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 7) arrastou = true;
      if (arrastou && !cine) arrastar(dx, dy);
    } else if (ponteiros.size === 2){
      if (!cine) arrastar((e.clientX - p.x) / 2, (e.clientY - p.y) / 2);
      p.x = e.clientX; p.y = e.clientY;
      const [a, b] = [...ponteiros.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinca > 0) zoom(pinca / d);
      pinca = d; return;
    }
    p.x = e.clientX; p.y = e.clientY;
  });
  const solta = e => {
    if (!ponteiros.has(e.pointerId)) return;
    ponteiros.delete(e.pointerId);
    if (e.type === 'pointerup' && !arrastou && ponteiros.size === 0) tocou(e.clientX, e.clientY);
    if (ponteiros.size === 0) pinca = 0;
  };
  canvas.addEventListener('pointerup', solta);
  canvas.addEventListener('pointercancel', solta);
  canvas.addEventListener('wheel', e => { e.preventDefault(); if (cine) return; zoom(Math.exp(e.deltaY * 0.0012)); fecharMenu(); }, { passive: false });
  $('cineDialogo').addEventListener('click', e => { e.stopPropagation(); avancarCine(); });
  $('cinePular').addEventListener('click', e => { e.stopPropagation(); pularCine(); });
  addEventListener('resize', () => { redimensionar(); fecharMenu(); barraChave = ''; ajustarCameraCtl(); });
  $('girarE').addEventListener('click', () => girar(-1));
  $('girarD').addEventListener('click', () => girar(1));
  $('zoomMais').addEventListener('click', () => zoom(0.8));
  $('zoomMenos').addEventListener('click', () => zoom(1.25));
  $('btnEd').addEventListener('click', () => { Som.ligar(); Som.clique(); abrirPedido(); });
  $('btnDeposito').addEventListener('click', () => { Som.ligar(); Som.clique(); abrirDeposito(); });
  $('btnMelhorias').addEventListener('click', () => { Som.ligar(); Som.clique(); abrirMelhorias(); });
  $('btnAjustes').addEventListener('click', () => { Som.ligar(); Som.clique(); abrirAjustes(); });
  $('chipEntrega').addEventListener('click', () => { Som.ligar(); Som.clique(); abrirPedido(); });
  $('filaLimpar').addEventListener('click', () => { Som.clique(); limparFilaBeto(); });
  $('dicaFechar').addEventListener('click', () => { S.dicas = false; salvar(); $('dica').hidden = true; dicaTexto = ''; });
  $('modal').addEventListener('pointerdown', e => { if (e.target === $('modal')) fecharJanela(); });
  document.addEventListener('pointerdown', e => { if (menuAberto && !$('menu').contains(e.target) && e.target !== canvas) fecharMenu(); });
  addEventListener('keydown', e => {
    if (e.key === 'Escape'){ if (cine) pularCine(); else if (algumaJanela()) fecharJanela(); else fecharMenu(); }
    if (algumaJanela() || cine) return;
    if (e.key === 'q' || e.key === 'Q') girar(-1);
    if (e.key === 'e' || e.key === 'E') girar(1);
    if (e.key === '+' || e.key === '=') zoom(0.8);
    if (e.key === '-') zoom(1.25);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S) salvar(); });
}
function pularCine(){
  if (!cine) return;
  // pular vale como assistir: roda o que cada fala ainda faria
  while (cine && cine.i < cine.passos.length - 1){ cine.i++; const p = cine.passos[cine.i]; if (p.antes) p.antes(); }
  terminarCine();
}
function arrastar(dx, dy){
  camVolta = null;
  const k = cam.vista / innerHeight;
  const rx = Math.cos(cam.az), rz = -Math.sin(cam.az), fx = -Math.sin(cam.az), fz = -Math.cos(cam.az);
  cam.alvo.x += -rx * dx * k + fx * dy * k / Math.sin(cam.el);
  cam.alvo.z += -rz * dx * k + fz * dy * k / Math.sin(cam.el);
  cam.alvo.x = clamp(cam.alvo.x, -3, 17); cam.alvo.z = clamp(cam.alvo.z, -1, 15);
  if (menuAberto) fecharMenu();
}
function zoom(f){ cam.vista = clamp(cam.vista * f, 5, 24); }
function girar(s){ cam.azAlvo += s * Math.PI / 2; fecharMenu(); Som.clique(); }

// ================= laço principal
let ultimoQuadro = performance.now(), tSalvo = 0, tHud = 0, ACELERA = 1, tJogo = 0, quadros = 0;
// a lógica de um passo do jogo, separada do desenho (os testes rodam vários passos sem desenhar)
function passo(dt, t){
  tJogo += dt;
  atualizarTimers(dt);
  proximaTarefaBeto();
  atualizarJaca(dt);
  beto.update(dt, t); jaca.update(dt, t);
  if (ed.g.visible) ed.update(dt, t);
  atualizarEntrega(dt);
  atualizarFregueses(dt, t);
  atualizarCaixa(dt);
}
function quadro(agoraP){
  requestAnimationFrame(quadro); quadros++;
  const dt = Math.min(0.1, (agoraP - ultimoQuadro) / 1000) * ACELERA; ultimoQuadro = agoraP;
  const t = agoraP / 1000;
  cam.az = lerp(cam.az, cam.azAlvo, Math.min(1, dt * 9));
  atualizarCine(dt);
  atualizarParedes();
  posicionarCamera();
  passo(dt, t);
  for (const b of BOLHAS) b.position.y = b.userData.base + Math.sin(t * 3 + (b.userData.fase || 0)) * 0.04;
  atualizarParticulas(dt);
  atualizarFalas();
  Musica.atualizar();
  if (marcaAte && performance.now() > marcaAte && !menuAberto){ marcaAte = 0; marcaSel.visible = false; }
  tHud += dt; if (tHud > 0.5){ tHud = 0; atualizarHud(); atualizarDica(); atualizarMenuAberto(); verificarSocorro(); }
  tSalvo += dt; if (tSalvo > 6){ tSalvo = 0; salvar(); }
  renderer.render(scene, camera);
}

// ================= início
async function iniciar(){
  try {
    if (document.fonts && document.fonts.load) await Promise.race([Promise.all([document.fonts.load('40px "Bagel Fat One"'), document.fonts.load('700 14px Rubik')]), new Promise(r => setTimeout(r, 1500))]);
  } catch (e){}
  try { iniciarRender(); }
  catch (e){ $('carregando').hidden = true; $('erro').textContent = 'Seu navegador não conseguiu abrir o WebGL, que o jogo usa para desenhar o mercado.'; $('erro').hidden = false; return; }
  carregar();
  gerarIcones();
  document.querySelectorAll('img[data-icone]').forEach(i => { i.src = icone(i.dataset.icone); });
  montarMapa();
  construirChao(); montarParedes(); montarCenario();
  for (const s of SLOTS) montarMovel(s);
  montarDeposito(); montarCaixa();
  construirPersonagens();
  scene.add(marcaSel);
  eventos();
  atualizarHud(); ajustarCameraCtl();
  $('carregando').hidden = true;
  // pedido que estava a caminho com o jogo fechado: o Ed chega logo
  if (S.pedido && S.pedido.chega < Date.now() + 3000) S.pedido.chega = Date.now() + 3000;
  if (!S.viuAbertura) iniciarCine(CENA_ABERTURA, () => { S.viuAbertura = true; if (!S.presente) presenteDoEd(); salvar(); });
  else if (!S.presente) presenteDoEd();
  requestAnimationFrame(quadro);
  // para testar sem tela: forçar coisas e olhar o estado
  window.__market = {
    get S(){ return S; }, beto, jaca, ed, entrega, FREGUESES, FILA_GENTE, cam,
    fregues: () => soltarFregues(), xp: n => ganharXp(n), dinheiro: n => { S.dinheiro += n; atualizarHud(); },
    pular: () => pularCine(), cine: () => cine, caminho, tela: (x, y, z) => tela(new THREE.Vector3(x, y, z)),
    chegarJa: () => { if (S.pedido) S.pedido.chega = Date.now(); },
    // só para os testes: o navegador sem tela desenha poucos quadros por segundo
    acelerar: k => { ACELERA = k; },
    encomendar, nivel, comprarSlot, escolherProduto, tarefaBeto, trocarFuncaoJaca, comprarMelhoria, produtosDe,
    precoCaixa: p => PROD[p].caixa * PROD[p].custo, slotInfo: id => SLOT[id], melhoriaInfo: k => MELHORIAS[k],
    // roda o jogo sem desenhar, de 0,1 em 0,1 s (com Date.now adiantado junto, por causa dos prazos do pedido)
    simular: seg => { if (!Date.now.desvio){ const real = Date.now; const f = () => real() + f.desvio * 1000; f.desvio = 1e-9; Date.now = f; } for (let i = 0; i < seg * 10; i++){ Date.now.desvio += 0.1; passo(0.1, tJogo); } }, get tJogo(){ return tJogo; }, get quadros(){ return quadros; },
  };
}
iniciar();
})();
