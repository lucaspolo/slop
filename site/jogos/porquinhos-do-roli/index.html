<style>
/* Layout: a pig-pink pocket console. Phones: screen on top, d-pad and A/B below. Wide landscape screens: d-pad and A/B at the sides of the screen. */
:root {
  --night: #2a1f3d;
  --night-dot: #3a2c52;
  --shell: #f4a9c0;
  --shell-hi: #ffd3e0;
  --shell-lo: #d47f9c;
  --bezel: #3a2a4c;
  --bezel-lo: #22172e;
  --ball: #8c63e6;
  --ball-lo: #5f3db5;
  --rose: #e8678f;
  --rose-lo: #b94a70;
  --paper: #fff8ef;
  --paper-line: #f7c6d6;
  --sel: #ffe3ec;
  --ink: #3a2430;
  --ink-soft: #7b5c6c;
  --hp-ok: #45c068;
  --hp-mid: #f0b232;
  --hp-low: #e8504f;
  --f-pixel: "Pixelify Sans", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --pad: clamp(90px, 30vw, 122px);
  --btn-a: clamp(46px, 15vw, 60px);
  --btn-b: clamp(40px, 13vw, 52px);
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background-color: var(--night);
  background-image: radial-gradient(var(--night-dot) 1.6px, transparent 1.8px);
  background-size: 22px 22px;
  color: var(--paper); font-family: var(--f-pixel);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}
.app {
  height: 100%; display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.console {
  width: min(100%, 520px, calc((100dvh - 290px) * 1.5 + 48px));
  max-width: 100%;
  display: grid;
  grid-template-areas: "top top top" "screen screen screen" "dpad midctl ab";
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px 8px;
  padding: 12px 14px 20px;
  background: var(--shell);
  border-radius: 20px 20px 46px 20px;
  box-shadow: inset 0 3px 0 var(--shell-hi), inset 0 -6px 0 var(--shell-lo), 0 20px 50px rgba(10, 4, 20, .55);
  position: relative;
}
.console::after {
  content: ""; position: absolute; right: 26px; bottom: 16px; width: 34px; height: 14px;
  background: repeating-linear-gradient(115deg, var(--shell-lo) 0 3px, transparent 3px 8px);
  border-radius: 4px; opacity: .8; pointer-events: none;
}
.top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--shell-lo); text-shadow: 0 1px 0 var(--shell-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nose { flex: none; width: 22px; height: 14px; border-radius: 50%; background: var(--rose); box-shadow: inset 0 -2px 0 var(--rose-lo), 0 0 0 2px var(--shell-lo); position: relative; }
.nose::before, .nose::after { content: ""; position: absolute; top: 4px; width: 4px; height: 6px; border-radius: 50%; background: var(--rose-lo); }
.nose::before { left: 5px; } .nose::after { right: 5px; }
.screenWrap { grid-area: screen; background: var(--bezel); padding: 10px 10px 9px; border-radius: 12px 12px 12px 28px; box-shadow: inset 0 2px 0 rgba(255,255,255,.07), 0 2px 0 var(--shell-hi); min-width: 0; }
.screen { position: relative; width: 100%; aspect-ratio: 3 / 2; container-type: inline-size; overflow: hidden; border-radius: 3px; background: #1c1426; font-size: 16px; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* controls */
.dpad { grid-area: dpad; position: relative; width: var(--pad); height: var(--pad); touch-action: none; cursor: pointer; }
.dpad .arm { position: absolute; background: var(--bezel); border-radius: 9px; box-shadow: 0 5px 0 var(--bezel-lo), inset 0 2px 0 rgba(255,255,255,.08); }
.dpad .h { left: 0; right: 0; top: 50%; height: 38%; transform: translateY(-50%); }
.dpad .v { top: 0; bottom: 0; left: 50%; width: 38%; transform: translateX(-50%); }
.dpad .dim { position: absolute; left: 50%; top: 50%; width: 22%; height: 22%; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2c203b, #463659); }
.ar { position: absolute; width: 0; height: 0; border: 8px solid transparent; transition: border-color .05s; }
.ar.up { left: 50%; top: 9%; transform: translateX(-50%); border-bottom-color: #6b5a7d; border-top-width: 0; }
.ar.down { left: 50%; bottom: 9%; transform: translateX(-50%); border-top-color: #6b5a7d; border-bottom-width: 0; }
.ar.left { top: 50%; left: 9%; transform: translateY(-50%); border-right-color: #6b5a7d; border-left-width: 0; }
.ar.right { top: 50%; right: 9%; transform: translateY(-50%); border-left-color: #6b5a7d; border-right-width: 0; }
.dpad.p-up .ar.up { border-bottom-color: var(--rose); }
.dpad.p-down .ar.down { border-top-color: var(--rose); }
.dpad.p-left .ar.left { border-right-color: var(--rose); }
.dpad.p-right .ar.right { border-left-color: var(--rose); }
.midctl { grid-area: midctl; justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ab { grid-area: ab; display: flex; align-items: center; gap: clamp(8px, 2.6vw, 12px); transform: rotate(-20deg); padding-inline: 2px; }
.round {
  touch-action: none; cursor: pointer; border: 0; border-radius: 50%; color: #fff;
  font: 700 22px/1 var(--f-pixel); display: grid; place-items: center; padding: 0;
  width: var(--btn-a); height: var(--btn-a); background: var(--ball);
  box-shadow: 0 5px 0 var(--ball-lo), inset 0 3px 0 rgba(255,255,255,.28);
  text-shadow: 0 2px 0 var(--ball-lo);
}
.round.b { width: var(--btn-b); height: var(--btn-b); margin-top: calc(var(--btn-b) * .5); background: var(--rose); box-shadow: 0 5px 0 var(--rose-lo), inset 0 3px 0 rgba(255,255,255,.28); text-shadow: 0 2px 0 var(--rose-lo); }
.round.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--ball-lo), inset 0 3px 0 rgba(255,255,255,.2); }
.round.b.down { box-shadow: 0 1px 0 var(--rose-lo), inset 0 3px 0 rgba(255,255,255,.2); }
.pill {
  border: 0; cursor: pointer; border-radius: 999px; padding: 8px 14px;
  font: 600 12px/1 var(--f-pixel); letter-spacing: .1em; text-transform: uppercase;
  background: var(--bezel); color: var(--shell-hi); box-shadow: 0 3px 0 var(--bezel-lo);
  touch-action: none; white-space: nowrap;
}
.pill.ghost { background: transparent; color: var(--bezel); box-shadow: inset 0 0 0 2px var(--shell-lo); padding: 6px 10px; font-size: 11px; }
.pill.ghost[aria-pressed="false"] { color: var(--shell-lo); }
button:focus-visible { outline: 3px solid var(--ball); outline-offset: 3px; }
.hint { display: none; margin: 0; font-size: 12px; line-height: 1.35; color: var(--bezel); text-align: center; max-width: 30ch; }
@media (hover: hover) and (pointer: fine) { .hint { display: block; } }

@media (max-width: 359px) {
  :root { --pad: 84px; --btn-a: 44px; --btn-b: 38px; }
  .console { padding: 10px 10px 18px; gap: 10px 4px; }
  .pill { padding: 7px 10px; font-size: 11px; }
  .brand { font-size: 13px; }
}
@media (orientation: landscape) and (min-width: 700px), (orientation: landscape) and (max-height: 560px) {
  :root { --pad: 122px; --btn-a: 60px; --btn-b: 52px; }
  .console {
    width: min(100%, 1040px, calc((100dvh - 92px) * 1.5 + 330px));
    grid-template-areas: "top top top" "dpad screen ab" "midctl screen ab";
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 140px minmax(0, 1fr) 150px;
    gap: 10px 16px;
    padding: 12px 18px 18px;
    border-radius: 26px 26px 54px 26px;
  }
  .dpad { justify-self: center; align-self: center; }
  .midctl { align-self: start; }
  .ab { justify-self: center; align-self: center; }
}

/* ---------- inside the screen ---------- */
.box, .cmd, .choice, .moves, .mvinfo, .hud, .panel { color: var(--ink); font-family: var(--f-pixel); }
.box {
  position: absolute; left: 2%; right: 2%; bottom: 2.6%; height: 29%; z-index: 30;

}

@keyframes bob { 50% { transform: translateY(.8cqw); } }

.opt {

.moves em { font-style: normal; font-weight: 600; }
.moves em.eup { color: #c0392b; }
.moves em.edn { color: var(--ink-soft); }
.choice {
  position: absolute; right: 3%; bottom: 34%; min-width: 34%; max-width: 70%; max-height: 63%; z-index: 40;
  overflow: auto; display: flex; flex-direction: column; gap: .3cqw;
  padding: 1.2cqw; background: var(--paper); border: .9cqw solid var(--ink); border-radius: 1.8cqw;

.hud .hp small { font-size: .7em; font-weight: 700; color: var(--rose-lo); }
.bar { flex: 1; height: 1.9cqw; border-radius: 1cqw; background: #5a4752; border: .4cqw solid var(--ink); overflow: hidden; }
.bar i, .hp i { display: block; height: 100%; transition: background-color .2s; }
.hp-ok { background: var(--hp-ok); } .hp-mid { background: var(--hp-mid); } .hp-low { background: var(--hp-low); }
.hpn { font-variant-numeric: tabular-nums; }

.xp { height: 1cqw; margin-top: .6cqw; background: #eadfe6; border-radius: 1cqw; overflow: hidden; }
.xp i { display: block; height: 100%; width: 0; background: var(--ball); }

.panel { position: absolute; inset: 0; z-index: 25; background: var(--paper); display: flex; flex-direction: column; font-size: 3.9cqw; }

.panel h2 { margin: 0; font-size: 5.2cqw; font-weight: 700; text-wrap: balance; }

.pbody { flex: 1; min-height: 0; overflow: auto; padding: 1.2cqw 1.6cqw; position: relative; }

.plist.rows .opt.hdr { display: block; padding: 1.4cqw 1.6cqw .4cqw; }

.plist .mid small { font-size: .72em; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plist .hp { display: block; height: 1.7cqw; border-radius: 1cqw; background: #e9dde4; overflow: hidden; }
.plist .qty { font-variant-numeric: tabular-nums; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.plist .qty small { font-size: .7em; color: var(--ink-soft); }
.tag { font-size: .85em; color: var(--hp-low); }
.tag.on { color: var(--ball-lo); font-size: .7em; }

.plist.cards .nm { font-size: .92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.plist.cards .ok { font-size: .7em; color: var(--hp-ok); }
.plist.cards .ok.seen { color: var(--ink-soft); }
.sheet { padding: .6cqw 1.4cqw; }
.sh-top { display: flex; gap: 3cqw; align-items: center; }

.xpline { margin: 1cqw 0 0; font-size: .8em; color: var(--ink-soft); }

  margin: 0; font-size: 11cqw; line-height: .9; font-weight: 700; color: #fff; letter-spacing: .02em;
  text-shadow: .7cqw 0 0 var(--ink), -.7cqw 0 0 var(--ink), 0 .7cqw 0 var(--ink), 0 -.7cqw 0 var(--ink), .6cqw .6cqw 0 var(--ink), -.6cqw .6cqw 0 var(--ink), .6cqw -.6cqw 0 var(--ink), -.6cqw -.6cqw 0 var(--ink), 0 1.8cqw 0 var(--rose-lo);

<body>

<div class="app">
  <main class="console" aria-label="Porquinhos do Roli">
    <header class="top">
      <span class="brand"><span class="nose" aria-hidden="true"></span>Porquinhos do Roli</span>
      <button class="pill ghost" id="btnSom" type="button" aria-pressed="true">Som ligado</button>
    </header>
    <div class="screenWrap">
      <div class="screen" id="screen">
        <canvas id="view" width="240" height="160" aria-label="Tela do jogo"></canvas>
        <p class="boot" id="boot">Carregando o jogo...</p>
        <div class="oops" id="oops" role="alert" hidden><b>Ops, o jogo travou.</b><span></span><small>Recarregue a página para tentar de novo.</small></div>
        <div class="hud foe" id="hudFoe" hidden>
          <div class="row"><b class="nm"></b><span class="lv"></span></div>
          <div class="hp"><small>HP</small><span class="bar"><i></i></span></div>
          <div class="row s"><span class="tp chip"></span><span class="got" hidden>no caderninho</span></div>
        </div>
        <div class="hud me" id="hudMe" hidden>
          <div class="row"><b class="nm"></b><span class="lv"></span></div>
          <div class="hp"><small>HP</small><span class="bar"><i></i></span></div>
          <div class="row s"><span class="tp chip"></span><span class="hpn"></span></div>
          <div class="xp"><i></i></div>
        </div>
        <div class="box" id="box" hidden><span class="who" id="boxWho" hidden></span><p id="boxText"></p><span class="more" id="boxMore" hidden></span></div>
        <div class="cmd" id="cmd" data-base="cmd" hidden></div>
        <div class="moves" id="moves" data-base="moves" hidden></div>
        <section class="panel" id="panel" hidden>
          <header><h2 id="pTitle"></h2><span id="pInfo"></span></header>
          <div class="pbody" id="pBody"><div id="pList" class="plist" data-base="plist"></div><div id="pSheet" class="sheet" hidden></div></div>
          <footer id="pFoot"></footer>
        </section>
        <div class="choice" id="choice" data-base="choice" hidden></div>
        <div class="title" id="title" hidden>
          <h1>Porquinhos<br><span>do Roli</span></h1>
          <p>Pegue os 10 porquinhos da região com a Luma</p>
          <div id="titleMenu" class="tmenu" data-base="tmenu"></div>
        </div>
        <div class="toast" id="toast" role="status" hidden></div>
      </div>
    </div>
    <div class="dpad" id="dpad" role="group" aria-label="Direcional">
      <span class="arm h"></span><span class="arm v"></span><span class="dim"></span>
      <span class="ar up"></span><span class="ar down"></span><span class="ar left"></span><span class="ar right"></span>
    </div>
    <div class="midctl">
      <button class="pill" id="btnMenu" type="button">Menu</button>
      <p class="hint">Setas andam. Z confirma. X volta e, segurado, corre. Esc abre o menu.</p>
    </div>
    <div class="ab">
      <button class="round b" id="btnB" type="button" aria-label="Botão B: voltar ou correr">B</button>
      <button class="round" id="btnA" type="button" aria-label="Botão A: confirmar ou falar">A</button>
    </div>
  </main>
</div>

<script>
(function () {
  var shown = false;
  function show(m) {
    if (shown) return;
    shown = true;
    var o = document.getElementById("oops");
    if (!o) return;
    o.hidden = false;
    o.querySelector("span").textContent = String(m || "erro desconhecido").slice(0, 200);
    var b = document.getElementById("boot");
    if (b) b.hidden = true;
  }
  window.__oops = show;
  window.addEventListener("error", function (e) { show((e.error && e.error.message) || e.message); });
  window.addEventListener("unhandledrejection", function (e) { var r = e.reason; show((r && (r.message || r.code)) || String(r)); });
})();
</script>
<script>
/* js/px.js */
/* Porquinhos do Roli: pixel canvas helper. Every sprite in the game is drawn here, pixel by pixel. */
(function () {
  "use strict";
  const G = (window.G = window.G || {});
  const colCache = new Map();

  function col(hex) {
    if (hex == null || hex === 0) return 0;
    if (typeof hex === "number") return hex;
    let c = colCache.get(hex);
    if (c !== undefined) return c;
    let h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map((x) => x + x).join("");
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    const a = h.length >= 8 ? parseInt(h.slice(6, 8), 16) : 255;
    c = ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
    colCache.set(hex, c);
    return c;
  }

  // Tiny 3x5 font, only for painted signs (PIG-MTP, H, numbers)
  const FONT = {
    P: "111101111100100", Y: "101101010010010", G: "111100101101111", "-": "000000111000000", 2: "111001111100111", M: "101111111101101",
    T: "111010010010010", H: "101101111101101", J: "001001001101111", O: "111101101101111",
    L: "100100100100111", I: "111010010010111", C: "111100100100111", F: "111100110100100",
    E: "111100110100111", 1: "010110010010111", 0: "111101101101111", 3: "111001011001111",
    4: "101101111001001", 5: "111100111001111", R: "110101110101101", A: "010101111101101",
    S: "111100111001111", " ": "000000000000000",
  };

  class Px {
    constructor(w, h) {
      this.w = w;
      this.h = h;
      this.d = new Uint32Array(w * h);
    }
    inb(x, y) {
      return x >= 0 && y >= 0 && x < this.w && y < this.h;
    }
    set(x, y, c) {
      x = Math.floor(x);
      y = Math.floor(y);
      if (this.inb(x, y)) this.d[y * this.w + x] = col(c);
      return this;
    }
    get(x, y) {
      return this.inb(x, y) ? this.d[y * this.w + x] : 0;
    }
    rect(x, y, w, h, c) {
      const v = col(c);
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, v);
      return this;
    }
    ell(cx, cy, rx, ry, c, mask) {
      const v = col(c);
      for (let y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry); y++)
        for (let x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx); x++) {
          const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
          if (dx * dx + dy * dy <= 1 && (!mask || mask(x, y))) this.set(x, y, v);
        }
      return this;
    }
    // Shaded ellipse: light toward the top left, shadow toward the bottom right.
    sell(cx, cy, rx, ry, base, light, dark, opt = {}) {
      const vb = col(base), vl = col(light), vd = col(dark);
      const lt = opt.lt ?? 0.42, dk = opt.dk ?? -0.36;
      for (let y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry); y++)
        for (let x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx); x++) {
          const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
          const r2 = dx * dx + dy * dy;
          if (r2 > 1) continue;
          if (opt.mask && !opt.mask(x, y)) continue;
          const dot = -dx * 0.62 - dy * 0.78;
          const edge = r2 > 0.62 ? dot : dot + 0.2;
          this.set(x, y, edge > lt + (r2 < 0.3 ? 0.3 : 0) ? vl : edge < dk ? vd : vb);
        }
      return this;
    }
    poly(pts, c) {
      const v = col(c);
      let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
      pts.forEach(([x, y]) => {
        minx = Math.min(minx, x); miny = Math.min(miny, y);
        maxx = Math.max(maxx, x); maxy = Math.max(maxy, y);
      });
      for (let y = Math.floor(miny); y <= Math.ceil(maxy); y++)
        for (let x = Math.floor(minx); x <= Math.ceil(maxx); x++) {
          const px = x + 0.5, py = y + 0.5;
          let inside = false;
          for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            const [xi, yi] = pts[i], [xj, yj] = pts[j];
            if (yi > py !== yj > py && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
          }
          if (inside) this.set(x, y, v);
        }
      return this;
    }
    line(x0, y0, x1, y1, c) {
      const v = col(c);
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) {
        this.set(x0, y0, v);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
      return this;
    }
    // Paint a 1px border around every opaque shape.
    outline(c, diag = false) {
      const v = col(c), src = this.d.slice(), w = this.w, h = this.h;
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          if (src[y * w + x]) continue;
          const n = (i, j) => i >= 0 && j >= 0 && i < w && j < h && src[j * w + i];
          if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1) ||
              (diag && (n(x - 1, y - 1) || n(x + 1, y - 1) || n(x - 1, y + 1) || n(x + 1, y + 1))))
            this.d[y * w + x] = v;
        }
      return this;
    }
    // Recolor every pixel of one color.
    swap(a, b) {
      const va = col(a), vb = col(b);
      for (let i = 0; i < this.d.length; i++) if (this.d[i] === va) this.d[i] = vb;
      return this;
    }
    text(str, x, y, c) {
      String(str).toUpperCase().split("").forEach((ch, k) => {
        const g = FONT[ch];
        if (!g) return;
        for (let i = 0; i < 15; i++) if (g[i] === "1") this.set(x + k * 4 + (i % 3), y + Math.floor(i / 3), c);
      });
      return this;
    }
    stamp(o, ox, oy) {
      for (let y = 0; y < o.h; y++)
        for (let x = 0; x < o.w; x++) {
          const v = o.d[y * o.w + x];
          if (v) this.set(ox + x, oy + y, v);
        }
      return this;
    }
    mirror() {
      const m = new Px(this.w, this.h);
      for (let y = 0; y < this.h; y++)
        for (let x = 0; x < this.w; x++) m.d[y * this.w + (this.w - 1 - x)] = this.d[y * this.w + x];
      return m;
    }
    canvas() {
      const cv = document.createElement("canvas");
      cv.width = this.w;
      cv.height = this.h;
      const ctx = cv.getContext("2d");
      const id = ctx.createImageData(this.w, this.h);
      new Uint32Array(id.data.buffer).set(this.d);
      ctx.putImageData(id, 0, 0);
      return cv;
    }
  }

  // Seeded random, so tiles look the same every time
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return () => {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5; s >>>= 0;
      return (s >>> 0) / 4294967296;
    };
  }

  G.Px = Px;
  G.col = col;
  G.rng = rng;
})();

</script>
<script>
/* js/art.js */
/* Porquinhos do Roli: all the art. Tiles, buildings, people, Luma, the porquinhos and the pigeons. */
(function () {
  "use strict";
  const G = window.G;
  const { Px, rng } = G;

  const C = {
    ink: "#3a2430",
    grass: "#8fd26b", grassD: "#6bb552", grassL: "#b4e68c", grassS: "#5a9c45",
    tall: "#4f9f48", tallD: "#2f6c37", tallL: "#78c95a", tallLL: "#9fe07a",
    path: "#ecd39d", pathD: "#d2b077", pathL: "#f8e6bd", pebble: "#b8935d",
    water: "#5aa7e8", waterD: "#3d86cb", waterL: "#a7d8fb", foam: "#eaf7ff",
    leaf: "#3f8d4a", leafL: "#62b65a", leafD: "#2a6438", leafO: "#1d4429", trunk: "#8a5a3a", trunkD: "#5e3a24",
    wood: "#c48a52", woodD: "#8d5c32", woodL: "#e2b07a",
    mud: "#93633f", mudD: "#71482b", mudL: "#b5855a",
    skin: "#f4cdb0", skinD: "#e0a989", skinL: "#ffe4cf",
    blush: "#ff9aac", eye: "#2a1a22",
    purple: "#9a6ef0", purpleD: "#6d45c4", purpleL: "#c7aefa",
  };
  G.C = C;

  /* ---------------- tiles ---------------- */
  function grassBase(p, seed) {
    p.rect(0, 0, 16, 16, C.grass);
    const r = rng(seed);
    for (let i = 0; i < 5; i++) {
      const x = Math.floor(r() * 13) + 1, y = Math.floor(r() * 13) + 2;
      p.set(x, y, C.grassD); p.set(x + 1, y - 1, C.grassD); p.set(x + 2, y, C.grassD);
    }
    for (let i = 0; i < 5; i++) p.set(Math.floor(r() * 16), Math.floor(r() * 16), C.grassL);
    return p;
  }

  function tallTile(frame) {
    const p = new Px(16, 16);
    p.rect(0, 0, 16, 16, C.tall);
    const clump = (cx, cy, sh) => {
      const x = cx + sh;
      p.poly([[x - 4, cy + 4], [x - 3, cy - 3], [x - 1, cy + 1], [x, cy - 5], [x + 1, cy + 1], [x + 3, cy - 3], [x + 4, cy + 4]], C.tallL);
      p.set(x, cy - 4, C.tallLL); p.set(x - 3, cy - 2, C.tallLL); p.set(x + 3, cy - 2, C.tallLL);
      p.line(x - 4, cy + 4, x + 4, cy + 4, C.tallD);
      p.line(x - 4, cy + 4, x - 3, cy - 3, C.tallD);
      p.line(x + 4, cy + 4, x + 3, cy - 3, C.tallD);
      p.set(x - 1, cy + 2, C.tallD); p.set(x + 1, cy + 2, C.tallD);
    };
    const s = frame ? 1 : 0;
    clump(4, 5, s); clump(12, 5, -s); clump(8, 12, s); clump(0, 12, -s); clump(16, 12, -s);
    return p;
  }

  function flowerTile(seed, frame) {
    const p = grassBase(new Px(16, 16), seed);
    const r = rng(seed * 7 + 3);
    const cols = ["#ff8fb8", "#ffd84a", "#ffffff", "#c7aefa"];
    for (let i = 0; i < 3; i++) {
      const x = 2 + Math.floor(r() * 11), y = 3 + Math.floor(r() * 10) + (frame && i === 1 ? -1 : 0);
      const c = cols[Math.floor(r() * cols.length)];
      p.set(x, y + 2, C.grassS);
      p.set(x - 1, y, c); p.set(x + 1, y, c); p.set(x, y - 1, c); p.set(x, y + 1, c);
      p.set(x, y, c === "#ffd84a" ? "#ff9a3c" : "#ffd84a");
    }
    return p;
  }

  function pathTile(seed) {
    const p = new Px(16, 16);
    p.rect(0, 0, 16, 16, C.path);
    const r = rng(seed);
    for (let i = 0; i < 4; i++) {
      const x = Math.floor(r() * 15), y = Math.floor(r() * 15);
      p.set(x, y, C.pebble); p.set(x + 1, y, C.pathD);
    }
    for (let i = 0; i < 6; i++) p.set(Math.floor(r() * 16), Math.floor(r() * 16), C.pathL);
    return p;
  }

  function waterTile(frame) {
    const p = new Px(16, 16);
    p.rect(0, 0, 16, 16, C.water);
    const waves = [[2, 3], [9, 7], [4, 11], [11, 14]];
    waves.forEach(([x, y], i) => {
      const xx = (x + frame * 2 + (i % 2)) % 16;
      p.set(xx, y, C.waterL); p.set((xx + 1) % 16, y, C.waterL); p.set((xx + 2) % 16, y - 1, C.waterL); p.set((xx + 3) % 16, y - 1, C.waterL);
      p.set((xx + 1) % 16, y + 1, C.waterD); p.set((xx + 2) % 16, y + 1, C.waterD);
    });
    return p;
  }

  function foamEdge(side, frame) {
    const p = new Px(16, 16);
    for (let i = 0; i < 16; i++) {
      const w = (i + frame) % 4 === 0 ? 2 : 1;
      for (let k = 0; k < w; k++) {
        if (side === "n") p.set(i, k, C.foam);
        if (side === "s") p.set(i, 15 - k, C.foam);
        if (side === "w") p.set(k, i, C.foam);
        if (side === "e") p.set(15 - k, i, C.foam);
      }
    }
    return p;
  }

  function treeTile(v) {
    const p = new Px(16, 16);
    grassBase(p, 91 + v);
    const t = new Px(16, 16);
    t.rect(7, 11, 2, 5, C.trunk); t.set(8, 11, C.trunkD); t.set(8, 13, C.trunkD);
    t.sell(8, 6.5, 7, 6, C.leaf, C.leafL, C.leafD);
    t.sell(4.2, 8.6, 3.6, 3.2, C.leaf, C.leafL, C.leafD);
    t.sell(11.8, 8.6, 3.6, 3.2, C.leaf, C.leafL, C.leafD);
    if (v) { t.set(5, 4, C.leafL); t.set(10, 3, "#ff8fb8"); t.set(4, 8, "#ff8fb8"); }
    else { t.set(6, 3, C.leafL); t.set(7, 3, C.leafL); }
    t.outline(C.leafO);
    p.stamp(t, 0, 0);
    return p;
  }

  function fenceTile() {
    const p = grassBase(new Px(16, 16), 55);
    const f = new Px(16, 16);
    f.rect(0, 5, 16, 2, C.woodL); f.rect(0, 9, 16, 2, C.wood);
    f.rect(2, 3, 3, 11, C.woodL); f.rect(11, 3, 3, 11, C.woodL);
    f.set(4, 4, C.wood); f.set(13, 4, C.wood);
    f.rect(4, 3, 1, 11, C.wood); f.rect(13, 3, 1, 11, C.wood);
    f.outline(C.woodD);
    p.stamp(f, 0, 0);
    return p;
  }

  function mudTile(seed) {
    const p = new Px(16, 16);
    p.rect(0, 0, 16, 16, C.mud);
    const r = rng(seed);
    for (let i = 0; i < 3; i++) p.ell(2 + r() * 12, 2 + r() * 12, 2 + r() * 2, 1.4 + r(), C.mudD);
    p.set(4, 3, C.mudL); p.set(5, 3, C.mudL); p.set(11, 9, C.mudL); p.set(12, 9, "#d6a87c");
    p.set(Math.floor(r() * 16), Math.floor(r() * 16), C.mudL);
    return p;
  }

  function mudEdge(side) {
    const p = new Px(16, 16);
    for (let i = 0; i < 16; i++) {
      const d = 1 + ((i * 7) % 3 === 0 ? 1 : 0) + (i % 5 === 0 ? 1 : 0);
      for (let k = 0; k < d + 1; k++) {
        const c = k < d ? (k === d - 1 && i % 4 === 0 ? C.grassD : C.grass) : C.mudD;
        if (side === "n") p.set(i, k, c);
        if (side === "s") p.set(i, 15 - k, c);
        if (side === "w") p.set(k, i, c);
        if (side === "e") p.set(15 - k, i, c);
      }
    }
    return p;
  }

  function bridgeTile() {
    const p = new Px(16, 16);
    p.rect(0, 0, 16, 16, C.wood);
    for (let y = 3; y < 16; y += 4) p.rect(2, y, 12, 1, C.woodD);
    p.rect(2, 0, 12, 1, C.woodL);
    p.rect(0, 0, 2, 16, C.woodD); p.rect(14, 0, 2, 16, C.woodD);
    p.rect(0, 2, 2, 3, C.woodL); p.rect(14, 10, 2, 3, C.woodL);
    return p;
  }

  // interior tiles
  function floorTile(x, y) {
    const p = new Px(16, 16);
    const a = "#f6eefb", b = "#ebdff6";
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) p.rect(i * 8, j * 8, 8, 8, (i + j + x + y) % 2 ? a : b);
    return p;
  }
  function wallTile(row) {
    const p = new Px(16, 16);
    p.rect(0, 0, 16, 16, "#f7c7d7");
    for (let x = 1; x < 16; x += 4) p.rect(x, 0, 1, 16, "#f0b0c6");
    if (row === 0) p.rect(0, 0, 16, 3, "#c97a99");
    if (row === 1) { p.rect(0, 12, 16, 3, "#fbe3ec"); p.rect(0, 15, 16, 1, "#b8708c"); }
    return p;
  }
  function counterTile() {
    const p = new Px(16, 16);
    p.rect(0, 0, 16, 16, "#c78a52");
    p.rect(0, 0, 16, 5, "#f1c48a"); p.rect(0, 5, 16, 1, "#9b6438");
    for (let x = 3; x < 16; x += 6) p.rect(x, 7, 1, 9, "#ad7444");
    p.rect(0, 15, 16, 1, "#7d4f2c");
    return p;
  }
  function matTile() {
    const p = floorTile(0, 0);
    p.rect(1, 3, 14, 10, "#e98aaa"); p.rect(2, 4, 12, 8, "#f6a9c2");
    for (let x = 3; x < 14; x += 3) p.rect(x, 5, 1, 6, "#e98aaa");
    return p;
  }

  /* ---------------- buildings and props ---------------- */
  function casa() {
    const p = new Px(80, 64);
    p.rect(4, 30, 72, 34, "#fff3dc");
    p.rect(4, 58, 72, 6, "#efd9b1");
    for (let x = 4; x < 76; x += 8) p.rect(x, 30, 1, 28, "#f3e3c3");
    p.rect(58, 0, 9, 12, "#c96a5a"); p.rect(58, 0, 9, 2, "#e08a76");
    p.poly([[0, 34], [9, 3], [71, 3], [80, 34]], "#f08aa8");
    for (let y = 9; y < 34; y += 6) {
      p.rect(2, y, 76, 1, "#cf6688");

  /* ---------------- people (16x16, four directions, three frames) ---------------- */
  function folk(o, dir, frame) {
    const p = new Px(16, 18);
    const bob = frame ? -1 : 0;
    const oy = 2 + bob + (o.short ? 1 : 0);
    const side = dir === "left";
    // feet
    const foot = (x, up) => p.rect(x, 15 + 2 - (up ? 1 : 0) - 0, 2, 1, o.shoes || "#4a3040");
    if (dir === "down" || dir === "up") {
      foot(5, frame === 1); foot(9, frame === 2);
    } else {
      foot(frame === 1 ? 5 : 6, false); foot(frame === 2 ? 10 : 9, false);
    }
    // legs / bottom
    const by = 12 + oy;
    if (o.bottom === "skirt" || o.bottom === "dress") {
      const c = o.bottom === "dress" ? o.shirt : o.bottomColor;
      p.poly([[5, by - 1], [11, by - 1], [12.5, by + 3], [3.5, by + 3]], c);
      p.rect(6, by + 3, 1, 1, C.skin); p.rect(9, by + 3, 1, 1, C.skin);
    } else {
      p.rect(5, by, 6, 2, o.bottomColor || "#5a7bd8");
      if (o.bottom === "pants") p.rect(5, by + 2, 6, 1, o.bottomColor);
    }
    // body
    if (side) p.ell(8, 11.2 + oy, 3.6, 2.8, o.shirt);
    else p.ell(8, 11.2 + oy, 4.3, 2.8, o.shirt);
    if (o.collar) { p.set(7, 9 + oy, o.collar); p.set(8, 9 + oy, o.collar); }
    // arms
    if (dir === "down" || dir === "up") {
      const swing = frame === 1 ? 1 : frame === 2 ? -1 : 0;
      p.rect(3, 10 + oy + swing, 1, 2, o.sleeve || o.shirt); p.set(3, 12 + oy + swing, C.skin);
      p.rect(12, 10 + oy - swing, 1, 2, o.sleeve || o.shirt); p.set(12, 12 + oy - swing, C.skin);
    } else {
      const swing = frame === 1 ? -1 : frame === 2 ? 1 : 0;
      p.rect(8 + swing, 10 + oy, 1, 2, o.sleeve || o.shirt); p.set(8 + swing, 12 + oy, C.skin);
    }
    if (o.cane) p.rect(dir === "left" ? 3 : 13, 9 + oy, 1, 6, C.woodD);
    // head
    const hy = 3.6 + oy;
    const H = o.hair;
    if (dir === "up") {
      p.ell(8, hy + 1, 5.2, 4.6, H);
      if (o.hairStyle === "bob") p.rect(3, hy + 1, 10, 4, H);
      if (o.hairStyle === "bun") p.ell(8, hy - 3.6, 2, 1.6, H);
      if (o.hairStyle === "tail") p.ell(8, hy + 5.5, 1.6, 2, H);
    } else if (dir === "down") {
      p.ell(8, hy + 1.4, 5.3, 4.8, C.skin);
      p.ell(8, hy - 1.2, 5.6, 3.2, H);
      if (o.hairStyle === "bob") { p.rect(2.6, hy - 1, 2, 6, H); p.rect(11.4, hy - 1, 2, 6, H); }
      if (o.hairStyle === "bun") p.ell(8, hy - 4.4, 2, 1.6, H);
      if (o.hairStyle === "short") { p.set(8, hy - 5, H); p.set(9, hy - 5.2, H); }
      // fringe
      for (let x = 4; x <= 11; x++) if ((x * 3) % 5 < 3) p.set(x, Math.floor(hy + 2), H);
      const ey = Math.floor(hy + 2.6);
      p.rect(5, ey, 1, 2, C.eye); p.rect(10, ey, 1, 2, C.eye);
      if (o.glasses) {
        [[4, 6], [9, 11]].forEach(([a, b]) => { p.rect(a, ey - 1, b - a + 1, 1, o.glasses); p.rect(a, ey + 2, b - a + 1, 1, o.glasses); p.set(a, ey, o.glasses); p.set(a, ey + 1, o.glasses); p.set(b, ey, o.glasses); p.set(b, ey + 1, o.glasses); });
        p.rect(7, ey, 2, 1, o.glasses);
      }
      p.set(4, ey + 2, C.blush); p.set(11, ey + 2, C.blush);
      if (o.glasses) { p.set(3, ey + 2, C.blush); p.set(12, ey + 2, C.blush); }
      if (o.smile) { p.set(7, ey + 3, "#c45a6a"); p.set(8, ey + 3, "#c45a6a"); if (o.smile > 1) { p.set(6, ey + 2, "#c45a6a"); p.set(9, ey + 2, "#c45a6a"); } }
    } else {
      p.ell(7.6, hy + 1.4, 4.9, 4.8, C.skin);
      p.ell(8.8, hy - 1.2, 5.2, 3.2, H);
      p.ell(11.2, hy + 1.2, 2.6, 3.6, H);
      if (o.hairStyle === "bob") p.rect(9, hy, 4, 6, H);
      if (o.hairStyle === "bun") p.ell(10, hy - 4.2, 2, 1.6, H);
      if (o.hairStyle === "tail") p.ell(13, hy + 3, 1.6, 2, H);
      if (o.hairStyle === "short") p.set(10, hy - 5, H);
      for (let x = 3; x <= 7; x++) if (x % 2) p.set(x, Math.floor(hy + 2), H);
      p.set(9, hy + 3, C.skin); p.set(9, hy + 4, C.skinD);
      const ey = Math.floor(hy + 2.6);
      p.rect(4, ey, 1, 2, C.eye);
      if (o.glasses) { p.rect(3, ey - 1, 3, 1, o.glasses); p.rect(3, ey + 2, 3, 1, o.glasses); p.set(5, ey, o.glasses); p.set(5, ey + 1, o.glasses); p.rect(6, ey, 3, 1, o.glasses); }
      p.set(5, ey + 2, C.blush);
      p.set(2, ey + 1, C.skin);
      if (o.smile) p.set(4, ey + 3, "#c45a6a");
    }
    p.outline(C.ink);
    return dir === "right" ? p.mirror() : p;
  }

  function folkSet(o) {
    const out = {};
    ["down", "up", "left"].forEach((d) => (out[d] = [0, 1, 2].map((f) => folk(o, d, f).canvas())));
    out.right = [0, 1, 2].map((f) => folk(o, "left", f).mirror().canvas());
    return out;
  }

  /* Luma, overworld */
  function lumaWalk(dir, frame) {
    const F = "#d8873f", FL = "#eba65b", FD = "#ad5f27", CR = "#fce6c4";
    const HEART = "#e46fc0";
    const p = new Px(16, 16);
    if (dir === "down" || dir === "up") {
      const l = frame === 1 ? 1 : 0, r = frame === 2 ? 1 : 0;
      p.rect(5, 14 - l, 2, 2, FD); p.rect(9, 14 - r, 2, 2, FD);
      p.sell(8, 11.5, 4.2, 3.2, F, FL, FD);
      if (dir === "down") {
        p.ell(8, 12, 2, 2, CR);
        p.poly([[3.5, 7], [1.5, 0.5], [7, 4]], F); p.poly([[12.5, 7], [14.5, 0.5], [9, 4]], F);
        p.poly([[4, 5.5], [2.8, 2], [6, 4.2]], "#f6a9b4"); p.poly([[12, 5.5], [13.2, 2], [10, 4.2]], "#f6a9b4");
        p.set(1, 3, FL); p.set(1, 5, FL); p.set(14, 3, FL); p.set(14, 5, FL);
        p.sell(8, 7, 4.4, 3.8, F, FL, FD);
        p.ell(8, 9, 2, 1.5, CR);
        p.set(8, 8, C.eye);
        p.rect(5, 6, 1, 2, C.eye); p.rect(10, 6, 1, 2, C.eye);
        p.rect(6, 10, 4, 2, FL); p.set(8, 11, CR);

    }

  /* mini porquinhos for the cercadinho */
  function miniPig(key, v) {

  /* ---------------- items and effects ---------------- */
  function cestinha(open) {
    const p = new Px(14, 14);
    p.poly([[1, 6], [13, 6], [11.5, 13], [2.5, 13]], "#d9a35b");
    for (let y = 8; y < 13; y += 2) p.rect(2, y, 10, 1, "#b47b3e");
    for (let x = 3; x < 12; x += 3) p.rect(x, 7, 1, 6, "#c48a47");

    if (open) {
      p.poly([[1, 5], [3, 1], [12, -1], [12, 2]], "#e4b06a"); p.set(7, 2, "#ff6f9c");
    } else {
      p.ell(7, 4.6, 6.2, 2.4, "#e4b06a"); p.rect(1, 4, 12, 2, "#e4b06a"); p.rect(6, 5, 2, 2, "#ff6f9c");

  }
  function pad(top, side) {
    const p = new Px(84, 20);
    p.ell(42, 10, 41, 9, side);

    for (let i = 0; i < 9; i++) p.set(18 + i * 6, 7 + (i % 3), side);
    return p;
  }

  /* ---------------- battle backdrops (240x160) ---------------- */
  function backdrop(zone) {
    const Z = {
      rota: { sky: ["#bfe6ff", "#d6f0ff", "#ecf8ff"], hill: "#9fd98a", hillD: "#7fc06e", ground: "#c7eaa4", pad: ["#a8dc84", "#7fbf62"] },
      campo: { sky: ["#ffd9e8", "#ffe8f1", "#fff4f8"], hill: "#b8e3a0", hillD: "#93cf7e", ground: "#d6f0bd", pad: ["#b6e597", "#8ccd70"] },
      lago: { sky: ["#c9ecff", "#dcf4ff", "#effaff"], hill: "#7cc7e8", hillD: "#5fb0d6", ground: "#c4ebf2", pad: ["#a8e0e2", "#7cc1c8"] },
      lama: { sky: ["#ffe4c4", "#fff0db", "#fff8ee"], hill: "#c9a77c", hillD: "#b08a60", ground: "#e8d3b0", pad: ["#c9a477", "#a6835a"] },
      ponte: { sky: ["#d4cdf7", "#e4dffb", "#f3f0fd"], hill: "#a9c7e8", hillD: "#8aaed6", ground: "#d9e7f2", pad: ["#c7b48d", "#a8946d"] },
      heli: { sky: ["#ffe6b3", "#fff1d1", "#fff8e8"], hill: "#b9d2a0", hillD: "#9cbc84", ground: "#dfe3ea", pad: ["#cfd3dd", "#b0b5c3"] },

    }[zone] || {};

    p.rect(0, 0, 240, 30, sky[0]); p.rect(0, 30, 240, 22, sky[1]); p.rect(0, 52, 240, 30, sky[2]);
    const r = rng(zone.length * 31 + 7);
    for (let i = 0; i < 4; i++) { const x = r() * 220, y = 8 + r() * 30; p.ell(x, y, 12 + r() * 10, 4, "#ffffff"); p.ell(x + 8, y - 3, 8, 4, "#ffffff"); }
    p.ell(40, 92, 90, 30, Z.hillD); p.ell(200, 88, 100, 32, Z.hill); p.ell(120, 98, 110, 26, Z.hillD);
    p.rect(0, 82, 240, 78, Z.ground);
    for (let i = 0; i < 40; i++) { const x = r() * 240, y = 86 + r() * 70; p.set(x, y, Z.hillD); p.set(x + 1, y - 1, Z.hillD); }
    if (zone === "lago") for (let i = 0; i < 8; i++) p.rect(r() * 220, 60 + r() * 20, 10, 1, "#ffffff");
    if (zone === "ponte") { p.rect(0, 74, 240, 6, "#5aa7e8"); p.rect(0, 74, 240, 1, "#a7d8fb"); }
    const top = pad(Z.pad[0], Z.pad[1]);
    p.stamp(top, 134, 64);

    return p;
  }

  function titleScene() {

  /* ---------------- build everything ---------------- */
  G.buildArt = function () {
    const A = {};

      grass: [0, 1, 2, 3].map((i) => grassBase(new Px(16, 16), 11 + i * 17).canvas()),

    };
    A.folk = {

      roliMenina: folkSet({ hair: "#7a4a2e", hairStyle: "bob", glasses: "#8a3f74", shirt: "#ff8fb8", bottom: "dress", smile: 1 }),
      avo: folkSet({ hair: "#f4f4f4", hairStyle: "bun", shirt: "#b48ef0", sleeve: "#ffffff", bottom: "skirt", bottomColor: "#6b5b7b", short: true, cane: true, smile: 1 }),
      mimi: folkSet({ hair: "#f3d36b", hairStyle: "bob", shirt: "#7fd6c2", bottom: "pants", bottomColor: "#3f5f9a", smile: 1 }),
      pai: folkSet({ hair: "#f2f2f2", hairStyle: "short", shirt: "#4f8fdc", collar: "#ffffff", bottom: "pants", bottomColor: "#6a5a4a", smile: 2 }),
    };
    A.luma = {};
    ["down", "up", "left", "right"].forEach((d) => (A.luma[d] = [0, 1, 2].map((f) => lumaWalk(d, f).canvas())));
    A.pombao = pombaoWalk().canvas();
    A.milton = plushWalk("milton").canvas();
    A.pelucio = plushWalk("pelucio").canvas();
    A.mon = {};
    A.monPx = {};
    Object.keys(SPRITES).forEach((k) => {
      if (k === "mijaozinho") {
        A.mon[k] = [0, 1, 2].map((v) => SPRITES[k](v).canvas());
        A.monPx[k] = [0, 1, 2].map((v) => SPRITES[k](v));
      } else {
        const px = SPRITES[k]();
        A.mon[k] = [px.canvas()];
        A.monPx[k] = [px];

    A.monBack = {};

    A.mini = {};
    Object.keys(SPRITES).forEach((k) => (A.mini[k] = [0, 1, 2].map((v) => [miniPig(k, v).canvas(), miniPig(k, v).mirror().canvas()])));
    A.cestinha = [cestinha(false).canvas(), cestinha(true).canvas()];
    A.bolinha = bolinha().canvas();
    A.icons = { petisco: icon("petisco").canvas(), petiscao: icon("petiscao").canvas(), perfume: icon("perfume").canvas(), cestinha: cestinha(false).canvas(), cestao: icon("cestao").canvas() };
    A.backdrops = {};
    ["rota", "campo", "lago", "lama", "ponte", "heli", "cafe"].forEach((z) => (A.backdrops[z] = backdrop(z).canvas()));
    A.title = titleScene().canvas();
    // data URLs for the menus
    A.monURL = {};
    Object.keys(A.mon).forEach((k) => (A.monURL[k] = A.mon[k].map((c) => c.toDataURL())));
    A.iconURL = {};
    Object.keys(A.icons).forEach((k) => (A.iconURL[k] = A.icons[k].toDataURL()));
    A.portrait = {
      roliMenina: A.folk.roliMenina.down[0].toDataURL(), avo: A.folk.avo.down[0].toDataURL(), roli: A.folk.roli.down[0].toDataURL(),
    };
    return A;
  };
})();
