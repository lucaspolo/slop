  async function run(key, n) {
    W.locked = true;
    try { await TALK[key](n); } finally {
      G.ui.hideBox();
      W.locked = false;
    }
  }

  W.interact = function () {
    if (W.locked || player.moving || G.ui.busy) return;
    const [dx, dy] = DIRS[player.dir];
    let tx = player.x + dx, ty = player.y + dy;
    if (tileAt(tx, ty) === "c") { tx += dx; ty += dy; }
    const n = npcAt(tx, ty);
    if (n) {
      n.dir = OPP[player.dir];
      return run(n.def.talk, n);
    }
    if (luma.x === tx && luma.y === ty) { luma.dir = OPP[player.dir]; return run("luma"); }
    const o = objAt(tx, ty);
    if (o && o.talk) return run(o.talk, o);
    if (tileAt(tx, ty) === "~") return run("agua");
  };
  TALK.agua = async () => say("A água está fresquinha. O Bolhudo adora nadar por aqui.");

  W.openMenu = async function () {
    if (W.locked || player.moving || G.ui.busy) return;
    W.locked = true;
    G.audio.sfx("ok");
    try { await G.ui.startMenu(); } finally { W.locked = false; }
  };

  /* ---------------- update ---------------- */
  function advance(e, dt) {
    if (!e.moving) return false;
    e.t += dt / e.dur;
    if (e.t >= 1) {
      e.t = 1; e.moving = false;
      e.px = e.x * 16; e.py = e.y * 16;
      return true;
    }
    e.px = (e.fx + (e.x - e.fx) * e.t) * 16;
    e.py = (e.fy + (e.y - e.fy) * e.t) * 16;
    return false;
  }

  W.update = function (dt) {
    if (!map) return;
    bumpT -= dt;
    if (turnT > 0) turnT -= dt;
    const free = !W.locked && !G.ui.busy;
    if (free && !player.moving) {
      const d = G.input.dir();
      if (d) {
        if (d !== player.dir && G.input.fresh(d)) { player.dir = d; turnT = 0.09; }
        else if (turnT <= 0) tryMove(d);
      }
    }
    const arrived = advance(player, dt);
    advance(luma, dt);
    if (!luma.moving && !player.moving) {
      const ddx = player.x - luma.x, ddy = player.y - luma.y;
      if (Math.abs(ddx) + Math.abs(ddy) === 1) luma.dir = dirTo(luma, player.x, player.y);
    }
    npcs.forEach((n) => {
      advance(n, dt);
      if (!n.def.wander || !free) return;
      n.wt -= dt;
      if (n.wt > 0 || n.moving) return;
      n.wt = 2 + Math.random() * 3;
      const dirs = Object.keys(DIRS);
      const d = dirs[Math.floor(Math.random() * 4)];
      const [dx, dy] = DIRS[d];
      const nx = n.x + dx, ny = n.y + dy;
      if (Math.random() < 0.5 || Math.abs(nx - n.home.x) + Math.abs(ny - n.home.y) > 1 || blocked(nx, ny, n)) n.dir = d;
      else startMove(n, d, 0.3);
    });
    for (let i = leaves.length - 1; i >= 0; i--) {
      const p = leaves[i];
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt;
      if (p.age > p.life) leaves.splice(i, 1);
    }
    if (arrived) onStep();
  };

  /* ---------------- render ---------------- */
  function tileImg(c, x, y, time) {
    const T = G.A.tiles, h = hash(x, y);
    switch (c) {
      case ".": return T.grass[h % 4];
      case ",": return T.tall[rustles.has(x + "," + y) && time - rustles.get(x + "," + y) < 0.25 ? 1 : 0];
      case "f": return T.flower[h % 3][Math.floor(time * 1.4 + (h % 7)) % 2];
      case ":": return T.path[h % 3];
      case "~": return T.water[Math.floor(time * 2.5) % 4];
      case "T": return T.tree[h % 5 === 0 ? 1 : 0];
      case "F": return T.fence;
      case "m": return T.mud[h % 2];
      case "=": return T.bridge;
      case "W": return T.wall0;
      case "w": return T.wall1;
      case "o": return T.floor[(x + y) % 2];
      case "c": return T.counter;
      case "d": return T.mat;
      default: return T.grass[0];
    }
  }

  function folkImg(key, e) {
    const set = G.A.folk[key];
    const f = e.moving ? (e.t < 0.5 ? 1 + e.foot : 0) : 0;
    return set[e.dir][f];
  }

  W.render = function (ctx, time) {
    if (!map) return;
    const mw = map.w * 16, mh = map.h * 16;
    let cx = Math.round(player.px + 8 - 120), cy = Math.round(player.py + 8 - 80);
    cx = mw <= 240 ? Math.round((mw - 240) / 2) : Math.max(0, Math.min(mw - 240, cx));
    cy = mh <= 160 ? Math.round((mh - 160) / 2) : Math.max(0, Math.min(mh - 160, cy));
    ctx.fillStyle = map.id === "vila" ? "#2a6438" : "#2b1f3e";
    ctx.fillRect(0, 0, 240, 160);
    const x0 = Math.max(0, Math.floor(cx / 16)), y0 = Math.max(0, Math.floor(cy / 16));
    const x1 = Math.min(map.w - 1, Math.floor((cx + 239) / 16)), y1 = Math.min(map.h - 1, Math.floor((cy + 159) / 16));
    const foamF = Math.floor(time * 2) % 2;
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) {
        const c = map.t[y][x];
        ctx.drawImage(tileImg(c, x, y, time), x * 16 - cx, y * 16 - cy);
        if (c === "m") {
          const E = G.A.tiles.mudEdge, X = x * 16 - cx, Y = y * 16 - cy;
          if (tileAt(x, y - 1) !== "m") ctx.drawImage(E.n, X, Y);
          if (tileAt(x, y + 1) !== "m") ctx.drawImage(E.s, X, Y);
          if (tileAt(x - 1, y) !== "m") ctx.drawImage(E.w, X, Y);
          if (tileAt(x + 1, y) !== "m") ctx.drawImage(E.e, X, Y);
        }
        if (c === "~") {
          const land = (xx, yy) => { const k = tileAt(xx, yy); return k !== "~" && k !== "="; };
          const F = G.A.tiles.foam;
          if (y > 0 && land(x, y - 1)) ctx.drawImage(F.n[foamF], x * 16 - cx, y * 16 - cy);
          if (land(x, y + 1)) ctx.drawImage(F.s[foamF], x * 16 - cx, y * 16 - cy);
          if (land(x - 1, y)) ctx.drawImage(F.w[foamF], x * 16 - cx, y * 16 - cy);
          if (land(x + 1, y)) ctx.drawImage(F.e[foamF], x * 16 - cx, y * 16 - cy);
        }
      }
    const P = G.A.props;
    const propImg = (o) => {
      const p = P[o.sprite];
      if (o.sprite === "penteadeira") return p[W.bulbs || 0];
      if (Array.isArray(p)) return p[Math.floor(time * 2) % p.length];
      return p;
    };
    map.objects.filter((o) => o.ground).forEach((o) => {
      const img = propImg(o);
      ctx.drawImage(img, o.x * 16 - cx + Math.round((o.w * 16 - img.width) / 2), (o.y + o.h) * 16 - img.height - cy + (o.oy || 0));
    });
    const list = [];
    map.objects.filter((o) => !o.ground).forEach((o) => {
      const img = propImg(o);
      list.push({ y: (o.y + o.h) * 16, draw: () => ctx.drawImage(img, o.x * 16 - cx + Math.round((o.w * 16 - img.width) / 2), (o.y + o.h) * 16 - img.height - cy + (o.oy || 0)) });
      if (o.pen) penPigs(o, list, ctx, cx, cy, time);
    });
    npcs.forEach((n) => {
      let img;
      const key = n.def.sprite;
      if (G.A.folk[key]) img = folkImg(key, n);
      else img = G.A[key];
      list.push({ y: n.py + 16, ent: n, draw: () => {
        ctx.globalAlpha = n.alpha;
        const bob = key === "pombao" ? (Math.floor(time * 3) % 2) : key === "milton" || key === "pelucio" ? (Math.floor(time * 2) % 2) : 0;
        ctx.drawImage(img, Math.round(n.px - cx), Math.round(n.py + 16 - img.height - cy - n.lift - bob));
        ctx.globalAlpha = 1;
      } });
    });
    const lf = luma.moving ? (luma.t < 0.5 ? 1 + luma.foot : 0) : 0;
    const limg = G.A.luma[luma.dir][lf];
    list.push({ y: luma.py + 16 - 0.5, ent: luma, draw: () => ctx.drawImage(limg, Math.round(luma.px - cx), Math.round(luma.py - cy)) });
    const pimg = folkImg("roli", player);
    list.push({ y: player.py + 16, ent: player, draw: () => ctx.drawImage(pimg, Math.round(player.px - cx), Math.round(player.py + 16 - pimg.height - cy)) });
    list.sort((a, b) => a.y - b.y);
    list.forEach((d) => {
      d.draw();
      const e = d.ent;
      if (!e) return;
      const tx = Math.round(e.px / 16), ty = Math.round(e.py / 16);
      if (tileAt(tx, ty) === ",") {
        const img = tileImg(",", tx, ty, time);
        ctx.drawImage(img, 0, 10, 16, 6, tx * 16 - cx, ty * 16 + 10 - cy, 16, 6);
      }
    });
    leaves.forEach((p) => { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x - cx), Math.round(p.y - cy), 2, 2); });
  };

  function penPigs(o, list, ctx, cx, cy, time) {
    const box = G.state.box.slice(0, 6);
    box.forEach((m, i) => {
      const w = o.w * 16 - 34, h = o.h * 16 - 34;
      const ph = i * 1.7 + 0.5;
      const sx = Math.sin(time * 0.45 + ph), sy = Math.sin(time * 0.33 + ph * 1.3);
      const x = o.x * 16 + 9 + ((sx + 1) / 2) * w, y = o.y * 16 + 14 + ((sy + 1) / 2) * h;
      const facingRight = Math.cos(time * 0.45 + ph) > 0;
      const img = G.A.mini[m.sp][(m.v || 0) % 3][facingRight ? 1 : 0];
      const hop = Math.floor(time * 4 + i) % 4 === 0 ? 1 : 0;
      list.push({ y: y + 14, draw: () => ctx.drawImage(img, Math.round(x - cx), Math.round(y - cy - hop)) });
    });
  }
})();

</script>
<script>
/* js/main.js */
/* Porquinhos do Roli: input, game loop, transitions, saving and the title screen. */
(function () {
  "use strict";
  const G = window.G;
  const KEY = "porquinhos-do-roli-v1";
  G.speed = 1;
  G.time = 0;
  G.scene = "boot";
  G.cover = 1;

  /* ---------------- tweens ---------------- */
  const tweens = [];
  G.tween = (ms, fn) => new Promise((res) => { fn(0); tweens.push({ t: 0, dur: Math.max(0.001, ms / 1000), fn, res }); });
  G.wait = (ms) => G.tween(ms, () => {});
  function stepTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const w = tweens[i];
      w.t += dt;
      const k = Math.min(1, w.t / w.dur);
      w.fn(k);
      if (k >= 1) { tweens.splice(i, 1); w.res(); }
    }
  }

  /* ---------------- transitions ---------------- */
  let trans = null;
  const DUR = { battleIn: 0.95, open: 0.35, fadeOut: 0.3, fadeIn: 0.3 };
  G.transition = (kind) => new Promise((res) => { trans = { kind, t: 0, dur: DUR[kind], res }; });
  function stepTrans(dt, real) {
    if (!trans) return;
    trans.t += dt;
    trans.real = (trans.real || 0) + (real || 0);
    if (trans.t >= trans.dur || trans.real > trans.dur + 2) {
      G.cover = trans.kind === "battleIn" || trans.kind === "fadeOut" ? 1 : 0;
      const r = trans.res;
      trans = null;
      r();
    }
  }
  function drawBars(ctx, p) {
    ctx.fillStyle = "#1c1426";
    for (let i = 0; i < 10; i++) {
      const w = Math.round(240 * p);
      if (i % 2) ctx.fillRect(240 - w, i * 16, w, 16); else ctx.fillRect(0, i * 16, w, 16);
    }
  }
  function drawTrans(ctx) {
    if (!trans) {
      if (G.cover > 0) { ctx.fillStyle = "#1c1426"; ctx.fillRect(0, 0, 240, 160); }
      return;
    }
    const p = Math.min(1, trans.t / trans.dur);
    if (trans.kind === "battleIn") {
      if (trans.t < 0.48) {
        if (Math.floor(trans.t / 0.08) % 2 === 0) { ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillRect(0, 0, 240, 160); }
      } else drawBars(ctx, (trans.t - 0.48) / (trans.dur - 0.48));
    } else if (trans.kind === "open") drawBars(ctx, 1 - p);
    else {
      ctx.fillStyle = "rgba(28,20,38," + (trans.kind === "fadeOut" ? p : 1 - p).toFixed(3) + ")";
      ctx.fillRect(0, 0, 240, 160);
    }
  }

  /* ---------------- input ---------------- */
  const held = new Set();
  const order = [];
  const pressedAt = {};
  let lastRepeat = 0;
  const isDir = (k) => k === "up" || k === "down" || k === "left" || k === "right";
  function emit(k) {
    G.audio.init();
    if (G.ui.key(k)) return;
    if (G.scene === "world") {
      if (k === "a") G.W.interact();
      if (k === "menu") G.W.openMenu();
    }
  }
  function down(k) {
    if (held.has(k)) return;
    held.add(k);
    pressedAt[k] = performance.now();
    if (isDir(k)) { order.push(k); lastRepeat = performance.now(); }
    emit(k);
    paintButtons();
  }
  function up(k) {
    held.delete(k);
    const i = order.indexOf(k);
    if (i >= 0) order.splice(i, 1);
    paintButtons();
  }
  function releaseAll() { [...held].forEach(up); }
  G.input = {
    held,
    dir() { for (let i = order.length - 1; i >= 0; i--) if (held.has(order[i])) return order[i]; return null; },
    fresh(d) { return performance.now() - (pressedAt[d] || 0) < 110; },
    press(k) { down(k); up(k); },
    down, up,
  };
  function repeatDirs() {
    const d = G.input.dir();
    if (!d || !G.ui.busy) return;
    const now = performance.now();
    if (now - pressedAt[d] > 300 && now - lastRepeat > 110) { lastRepeat = now; G.ui.key(d); }
  }

  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
    z: "a", Z: "a", Enter: "a", " ": "a", x: "b", X: "b", Backspace: "b", Escape: "menu", m: "menu", M: "menu",
  };
  window.addEventListener("keydown", (e) => {
    const k = KEYS[e.key];
    if (!k) return;
    e.preventDefault();
    if (e.repeat) return;
    down(k);
  });
  window.addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) up(k); });
  window.addEventListener("blur", releaseAll);

  function bindButton(id, k) {
    const el = document.getElementById(id);
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); down(k); });
    const rel = () => up(k);
    el.addEventListener("pointerup", rel);
    el.addEventListener("pointercancel", rel);
    el.addEventListener("lostpointercapture", rel);
    el.addEventListener("click", (e) => e.preventDefault());
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.stopPropagation(); } });
  }
  function bindPad() {
    const pad = document.getElementById("dpad");
    let cur = null, pid = null;
    const set = (d) => { if (d === cur) return; if (cur) up(cur); cur = d; if (d) down(d); };
    const dirAt = (e) => {
      const r = pad.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * 0.1) return cur;
      return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up";
    };
    pad.addEventListener("pointerdown", (e) => { e.preventDefault(); pid = e.pointerId; pad.setPointerCapture(pid); set(dirAt(e)); });
    pad.addEventListener("pointermove", (e) => { if (e.pointerId === pid) set(dirAt(e)); });
    const end = (e) => { if (e.pointerId === pid) { set(null); pid = null; } };
    pad.addEventListener("pointerup", end);
    pad.addEventListener("pointercancel", end);
    pad.addEventListener("lostpointercapture", end);
  }
  function paintButtons() {
    ["up", "down", "left", "right"].forEach((d) => document.getElementById("dpad").classList.toggle("p-" + d, held.has(d)));
    document.getElementById("btnA").classList.toggle("down", held.has("a"));
    document.getElementById("btnB").classList.toggle("down", held.has("b"));
  }

  G.syncSoundButton = function () {
    const b = document.getElementById("btnSom");
    b.textContent = G.audio.on ? "Som ligado" : "Som desligado";
    b.setAttribute("aria-pressed", G.audio.on ? "true" : "false");
  };

  /* ---------------- canvas ---------------- */
  const view = document.getElementById("view");
  const vctx = view.getContext("2d");
  const buf = document.createElement("canvas");
  buf.width = 240; buf.height = 160;
  const ctx = buf.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  function fit() {
    const r = view.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const s = Math.max(1, Math.round((r.width * dpr) / 240));
    if (view.width !== 240 * s) { view.width = 240 * s; view.height = 160 * s; }
    vctx.imageSmoothingEnabled = false;
  }
  new ResizeObserver(fit).observe(view);

  /* ---------------- title ---------------- */
  function renderTitle(ctx, t) {
    ctx.drawImage(G.A.title, 0, 0);
    const f = Math.floor(t * 6) % 3;
    const walk = [0, 1, 0, 2][Math.floor(t * 6) % 4];
    ctx.drawImage(G.A.folk.roli.right[walk], 98, 104);
    ctx.drawImage(G.A.luma.right[walk], 78, 108);
    const pigs = ["rosadinho", "florzinha", "bolhudo", "pintadinho"];
    pigs.forEach((k, i) => {
      const hop = Math.abs(Math.sin(t * 3 + i)) * 6;
      ctx.drawImage(G.A.mini[k][0][0], 130 + i * 20, 112 - hop);
    });
    void f;
  }

  /* ---------------- save ---------------- */
  function newState() {
    return {
      team: [G.makeMon("luma", 5, { v: 0 })], box: [],
      bag: { cestinha: 5, petisco: 3 }, moedas: 100,
      dex: { seen: {}, caught: {} }, flags: {}, stats: { batalhas: 0, passos: 0 },
      pos: { map: "vila", x: 6, y: 39, dir: "down" },
    };
  }
  function normalize(s) {
    const n = newState();
    s = Object.assign(n, s || {});
    s.dex = Object.assign({ seen: {}, caught: {} }, s.dex);
    s.flags = s.flags || {};
    s.stats = Object.assign({ batalhas: 0, passos: 0 }, s.stats);
    s.bag = s.bag || {};
    if (!s.team || !s.team.length) s.team = [G.makeMon("luma", 5, { v: 0 })];
    return s;
  }
  G.save = function () {
    if (!G.state) return false;
    if (G.W.map()) G.state.pos = G.W.pos();
    G.state.savedAt = Date.now();
    const snap = JSON.parse(JSON.stringify(G.state));
    let ok = false;
    try { localStorage.setItem(KEY, JSON.stringify(snap)); ok = true; } catch (e) {}
    return ok;
  };
  function loadSave() {
    try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }

  async function begin(state, intro) {
    G.state = normalize(state);
    const p = G.state.pos;
    G.W.load(p.map, p.x, p.y, p.dir);
    G.scene = "world";
    G.cover = 1;
    await G.transition("fadeIn");
    if (intro) {
      G.W.locked = true;
      const say = G.ui.say;
      await say("Domingo na Vila dos Rolis.");
      await say("O Roli Menino acordou com uma missão: encher o caderninho com os 10 porquinhos da região.");
      await say("A Luma já está pronta, com a bolinha roxa na boca. Ela é a primeira da equipe!");
      await say("Na mochila: 5 cestinhas e 3 petiscos. Os porquinhos se escondem no mato alto, logo ao norte da vila.");
      await say("Se a equipe cansar, a Roli Menina cuida de todo mundo no Posto de Cura.");
      G.ui.hideBox();
      G.W.locked = false;
    }
  }

  async function title() {
    G.scene = "title";
    G.cover = 0;
    const saved = loadSave();
    for (;;) {
      const choice = await G.ui.title(!!saved);
      if (choice === "continuar") return begin(saved, false);
      if (saved) {
        const i = await G.ui.ask("Começar de novo? O jogo salvo será substituído.", ["Começar de novo", "Voltar"]);
        G.ui.hideBox();
        if (i !== 0) continue;
      }
      return begin(newState(), true);
    }
  }

  /* ---------------- loop ---------------- */
  // The loop keeps its own clock and keeps running even if one frame fails.
  let last = performance.now();
  function frame() {
    const now = performance.now();
    let real = (now - last) / 1000;
    last = now;
    if (!(real > 0)) real = 0;
    if (real > 0.05) real = 0.05;
    try {
      const dt = real * G.speed;
      G.time += real;
      repeatDirs();
      stepTweens(dt);
      stepTrans(dt, real);
      G.ui.tick(real);
      if (G.scene === "world") G.W.update(dt);
      if (G.scene === "battle") G.updateBattle(dt);
      ctx.clearRect(0, 0, 240, 160);
      if (G.scene === "title") renderTitle(ctx, G.time);
      else if (G.scene === "world") G.W.render(ctx, G.time);
      else if (G.scene === "battle") G.renderBattle(ctx);
      else { ctx.fillStyle = "#1c1426"; ctx.fillRect(0, 0, 240, 160); }
      if (G.scene !== "title") drawTrans(ctx);
      if (view.width < 240) fit();
      vctx.drawImage(buf, 0, 0, view.width, view.height);
    } catch (e) {
      if (window.__oops) window.__oops(e && e.message);
    }
    requestAnimationFrame(frame);
  }

  function start() {
    G.A = G.buildArt();
    G.A.silURL = {};
    Object.keys(G.A.mon).forEach((k) => (G.A.silURL[k] = G.sil(G.A.mon[k][0], "#3a2430").toDataURL()));
    G.W.init();
    bindPad();
    bindButton("btnA", "a");
    bindButton("btnB", "b");
    bindButton("btnMenu", "menu");
    document.getElementById("btnSom").addEventListener("click", () => { G.audio.init(); G.audio.toggle(); G.syncSoundButton(); });
    // tapping the dialog box advances the text, like pressing A
    document.getElementById("box").addEventListener("pointerdown", (e) => {
      if (!G.ui.waitingText) return;
      e.preventDefault();
      G.audio.init();
      G.ui.key("a");
    });
    G.syncSoundButton();
    fit();
    const bootNote = document.getElementById("boot");
    if (bootNote) bootNote.hidden = true;
    requestAnimationFrame(frame);
    title();
  }

  try { start(); }
  catch (e) { if (window.__oops) window.__oops(e && e.message); }
})();

</script>
