<script>
/* js/audio.js */
/* Porquinhos do Roli: chiptune sound effects and three small looping tunes, all made with WebAudio. */
(function () {
  "use strict";
  const G = window.G;
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let on = true;
  try { on = localStorage.getItem("porquinhos-som") !== "0"; } catch (e) {}
  let song = null, songName = null, nextTime = 0, step = 0, timer = null;

  const NOTE = { C: 0, "C#": 1, D: 2, "D#": 3, E: 4, F: 5, "F#": 6, G: 7, "G#": 8, A: 9, "A#": 10, B: 11 };
  function hz(n) {
    if (!n || n === "-") return 0;
    const m = /^([A-G]#?)(\d)$/.exec(n);
    if (!m) return 0;
    return 440 * Math.pow(2, (NOTE[m[1]] + (+m[2] - 4) * 12 - 9) / 12);
  }

  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume().catch(() => {}); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = on ? 1 : 0; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.055; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.16; sfxBus.connect(master);
      if (songName) startSong(songName);
    } catch (e) { ctx = null; }
  }

  function tone(f, t0, dur, type = "square", vol = 1, bus = sfxBus, f2) {
    if (!ctx || !f) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(bus);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(t0, dur, vol = 0.6, freq = 1800) {
    if (!ctx) return;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(sfxBus);
    s.start(t0);
  }
  function seq(notes, gap, type = "square", vol = 0.8) {
    if (!ctx) return;
    const t = ctx.currentTime + 0.01;
    notes.forEach((n, i) => tone(hz(n), t + i * gap, gap * 1.6, type, vol));
  }

  const SFX = {
    blip() { if (ctx) tone(1320, ctx.currentTime, 0.04, "square", 0.35); },
    ok() { seq(["E6", "A6"], 0.05, "square", 0.4); },
    no() { if (ctx) tone(220, ctx.currentTime, 0.09, "square", 0.4); },
    bump() { if (ctx) tone(110, ctx.currentTime, 0.08, "triangle", 0.8); },
    door() { if (ctx) { noise(ctx.currentTime, 0.12, 0.4, 900); tone(330, ctx.currentTime + 0.05, 0.12, "triangle", 0.5); } },
    rustle() { if (ctx) noise(ctx.currentTime, 0.08, 0.25, 3500); },
    encounter() { seq(["C5", "G5", "C6", "G5", "C6", "E6"], 0.055, "square", 0.6); },
    hit() { if (ctx) { const t = ctx.currentTime; noise(t, 0.14, 0.8, 1200); tone(160, t, 0.12, "square", 0.6, sfxBus, 70); } },
    superHit() { if (ctx) { const t = ctx.currentTime; noise(t, 0.2, 1, 900); tone(200, t, 0.08, "square", 0.7, sfxBus, 90); tone(260, t + 0.1, 0.12, "square", 0.7, sfxBus, 80); } },
    weak() { if (ctx) { const t = ctx.currentTime; noise(t, 0.08, 0.4, 2400); } },
    faint() { if (ctx) tone(520, ctx.currentTime, 0.6, "square", 0.5, sfxBus, 90); },
    throwIt() { if (ctx) { const t = ctx.currentTime; noise(t, 0.3, 0.35, 2500); tone(500, t, 0.3, "triangle", 0.3, sfxBus, 900); } },
    shake() { if (ctx) { const t = ctx.currentTime; tone(240, t, 0.05, "square", 0.5); tone(180, t + 0.08, 0.05, "square", 0.5); } },
    pop() { if (ctx) tone(600, ctx.currentTime, 0.12, "square", 0.5, sfxBus, 1400); },
    caught() { seq(["C5", "E5", "G5", "C6", "-", "G5", "C6", "E6"], 0.09, "square", 0.6); },
    heal() { seq(["C5", "E5", "G5", "E5", "G5", "C6", "-", "C6"], 0.12, "triangle", 0.9); },
    levelUp() { seq(["G5", "B5", "D6", "G6"], 0.08, "square", 0.6); },
    buy() { seq(["B5", "E6"], 0.06, "square", 0.5); },
    up() { seq(["C5", "E5", "G5", "C6"], 0.05, "triangle", 0.8); },
    down() { seq(["C6", "G5", "E5", "C5"], 0.05, "triangle", 0.8); },
    win() { seq(["G5", "G5", "G5", "C6", "-", "A5", "B5", "C6", "-", "-", "E6"], 0.1, "square", 0.6); },
    fanfare() { seq(["C5", "E5", "G5", "C6", "G5", "C6", "E6", "-", "D6", "E6", "G6", "-", "C6"], 0.11, "square", 0.6); },
    bark() { if (ctx) { const t = ctx.currentTime; tone(620, t, 0.09, "square", 0.6, sfxBus, 380); tone(660, t + 0.13, 0.09, "square", 0.6, sfxBus, 400); } },
    cry(sp) {
      if (!ctx) return;
      const c = (G.SPECIES[sp] && G.SPECIES[sp].cry) || [500, 700];
      const t = ctx.currentTime;
      if (sp === "luma") return SFX.bark();
      tone(c[0], t, 0.12, "square", 0.5, sfxBus, c[1]);
      tone(c[1], t + 0.13, 0.16, "square", 0.45, sfxBus, c[0] * 0.8);
    },
  };

  /* tunes: [lead, bass, beat seconds] written as 8th-note steps */
  const SONGS = {
    vila: {
      beat: 0.15, type: "square",
      lead: "E5 - G5 - C6 - G5 - A5 - G5 E5 C5 - D5 E5 F5 - A5 - G5 - - - - - E5 - G5 - C6 - G5 - A5 - C6 B5 A5 - G5 E5 D5 - E5 - C5 - - - - -".split(" "),
      bass: "C3 - G3 - C3 - G3 - F3 - C4 - F3 - C4 - D3 - A3 - G3 - D4 - C3 - G3 - C3 - G3 - F3 - C4 - F3 - C4 - G3 - D4 - C3 - G3 - C3 - - -".split(" "),
    },
    batalha: {
      beat: 0.12, type: "square",
      lead: "A4 C5 E5 A5 G5 E5 C5 E5 F4 A4 C5 F5 E5 C5 A4 C5 G4 B4 D5 G5 F5 D5 B4 D5 E5 E5 - E5 G#5 - E5 - A4 C5 E5 A5 B5 A5 G5 E5 F5 E5 D5 C5 B4 C5 D5 - E5 D5 C5 B4 A4 B4 C5 D5 E5 - A5 - E5 - - -".split(" "),
      bass: "A2 - A3 - A2 - A3 - F2 - F3 - F2 - F3 - G2 - G3 - G2 - G3 - E2 - E3 - E2 - G#2 - A2 - A3 - A2 - A3 - F2 - F3 - F2 - F3 - G2 - G3 - E2 - E3 - A2 - E3 - A2 - - -".split(" "),
    },
    posto: {
      beat: 0.2, type: "triangle",
      lead: "F5 A5 C6 A5 G5 E5 C5 E5 D5 F5 A5 F5 C5 - - - F5 A5 C6 D6 C6 A5 G5 A5 F5 G5 A5 G5 F5 - - -".split(" "),
      bass: "F3 - C4 - C3 - G3 - D3 - A3 - C3 - G3 - F3 - C4 - A2 - E3 - D3 - C3 - F3 - - -".split(" "),
    },
  };

  function startSong(name) {
    songName = name;
    if (!ctx) return;
    clearInterval(timer);
    song = SONGS[name];
    if (!song) return;
    step = 0;
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 60);
  }
  function schedule() {
    if (!ctx || !song) return;
    while (nextTime < ctx.currentTime + 0.25) {
      const L = song.lead[step % song.lead.length], Bn = song.bass[step % song.bass.length];
      if (L && L !== "-") tone(hz(L), nextTime, song.beat * 1.7, song.type, 0.9, musicBus);
      if (Bn && Bn !== "-") tone(hz(Bn), nextTime, song.beat * 1.9, "triangle", 1.2, musicBus);
      nextTime += song.beat;
      step++;
    }
  }

  G.audio = {
    init,
    sfx: (name, arg) => { try { if (ctx && SFX[name]) SFX[name](arg); } catch (e) {} },
    music: (name) => { if (name === songName && timer) return; startSong(name); },
    stopMusic: () => { clearInterval(timer); timer = null; song = null; songName = null; },
    get on() { return on; },
    toggle() {
      on = !on;
      try { localStorage.setItem("porquinhos-som", on ? "1" : "0"); } catch (e) {}
      if (master) master.gain.value = on ? 1 : 0;
      return on;
    },
  };
})();

</script>
<script>
/* js/ui.js */
/* Porquinhos do Roli: dialog box, menus and full-screen panels (DOM over the game screen). */
(function () {
  "use strict";
  const G = window.G;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const FEM = new Set(["luma", "florzinha", "trufinha"]);
  G.art = (sp) => (FEM.has(sp) ? "a" : "o");
  G.Art = (sp) => (FEM.has(sp) ? "A" : "O");
  G.monImg = (m) => { const u = G.A.monURL[m.sp]; return u[(m.v || 0) % u.length]; };

  const SPEAKERS = new Set(["Roli Menina", "Avó", "Mimi", "Pai da Roli Menina", "Pombão", "Milton", "Pelúcio", "Lúcia", "Múcia", "Roli Menino"]);
  const CPS = 62;
  const stack = [];
  const push = (h) => stack.push(h);
  const pop = (h) => { const i = stack.lastIndexOf(h); if (i >= 0) stack.splice(i, 1); };
  let typing = null;

  function key(k) {
    const h = stack[stack.length - 1];
    if (!h) return false;
    h.key(k);
    return true;
  }

  function say(text, o = {}) {
    return new Promise((res) => {
      const box = $("box");
      box.hidden = false;
      box.classList.toggle("narrow", !!o.narrow);
      const m = /^([A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-Za-zÀ-ÿ ]{0,22}): /.exec(text);
      let body = text, who = "";
      if (m && SPEAKERS.has(m[1])) { who = m[1]; body = text.slice(m[0].length); }
      const wEl = $("boxWho");
      wEl.textContent = who; wEl.hidden = !who;
      const el = $("boxText");
      const more = $("boxMore");
      more.hidden = true;
      // Split the text into pages that fit the box, measured with the real font and width.
      const pages = paginate(body, box, el);
      let page = 0;
      const T = { chars: [...pages[0]], i: 0, acc: 0, el, finished: false, autoT: null };
      el.textContent = "";
      let closed = false;
      const last = () => page >= pages.length - 1;
      const close = () => { if (closed) return; closed = true; if (typing === T) typing = null; pop(h); more.hidden = true; res(); };
      const nextPage = () => {
        page++;
        T.chars = [...pages[page]]; T.i = 0; T.acc = 0; T.finished = false; T.autoT = null;
        el.textContent = "";
        more.hidden = true;
      };
      T.onFinish = () => {
        if (!last()) {
          if (o.auto != null) T.autoT = o.auto / 1000;
          else more.hidden = false;
          return;
        }
        if (o.noWait) return close();
        if (o.auto != null) T.autoT = o.auto / 1000;
        else more.hidden = false;
      };
      T.onAuto = () => (last() ? close() : nextPage());
      T.finish = () => { T.i = T.chars.length; el.textContent = pages[page]; if (!T.finished) { T.finished = true; T.onFinish(); } };
      const h = {
        key(k) {
          if (k !== "a" && k !== "b") return;
          if (!T.finished) T.finish();
          else if (!last()) nextPage();
          else close();
        },
      };
      T.h = h;
      typing = T;
      push(h);
    });
  }

  function paginate(text, box, el) {
    const cs = getComputedStyle(box);
    const avail = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const fits = (t) => { el.textContent = t; return el.scrollHeight <= avail + 1; };
    if (!(avail > 0) || fits(text)) { el.textContent = ""; return [text]; }
    const words = text.split(" ");
    const pages = [];
    let cur = "";
    for (const w of words) {
      const next = cur ? cur + " " + w : w;
      if (cur && !fits(next)) { pages.push(cur); cur = w; }
      else cur = next;
    }
    if (cur) pages.push(cur);
    el.textContent = "";
    return pages;
  }
  function hideBox() { $("box").hidden = true; }

  function tick(dt) {
    const T = typing;
    if (!T) return;
    if (!T.finished) {
      T.acc += dt * CPS * G.speed;
      const n = Math.floor(T.acc);
      if (n > 0) {
        T.acc -= n;
        T.i = Math.min(T.chars.length, T.i + n);
        T.el.textContent = T.chars.slice(0, T.i).join("");
        if (T.i >= T.chars.length) { T.finished = true; T.onFinish(); }
      }
    } else if (T.autoT != null) {
      T.autoT -= dt * G.speed;
      if (T.autoT <= 0) { T.autoT = null; T.onAuto(); }
    }
  }

  // Scroll the list just enough to show the selected row, measured on screen.
  function ensureVisible(el, sc) {
    if (!sc || sc.scrollHeight <= sc.clientHeight) return;
    const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect();
    if (r.top < s.top) sc.scrollTop -= s.top - r.top + 4;
    else if (r.bottom > s.bottom) sc.scrollTop += r.bottom - s.bottom + 4;
  }

  function choose(items, o = {}) {
    return new Promise((res) => {
      const host = typeof o.where === "string" ? $(o.where) : o.where;
      host.hidden = false;
      host.innerHTML = "";
      host.className = host.dataset.base + (o.cls ? " " + o.cls : "");
      const cols = o.cols || 1;
      let sel = Math.max(0, Math.min(o.initial || 0, items.length - 1));
      let closed = false;
      const btns = items.map((it, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        if (typeof it === "string") b.textContent = it;
        else {
          if (it.html != null) b.innerHTML = it.html; else b.textContent = it.label;
          if (it.disabled) b.classList.add("off");
          if (it.header) { b.classList.add("hdr"); b.tabIndex = -1; }
        }
        b.addEventListener("click", (e) => {
          e.preventDefault();
          if (closed || (it && it.header)) return;
          G.audio.init();
          sel = i; paint(); pick();
        });
        host.appendChild(b);
        return b;
      });
      const isHeader = (i) => items[i] && items[i].header;
      if (isHeader(sel)) sel = items.findIndex((it) => !(it && it.header));
      const usable = (it) => !(it && (it.header || it.disabled));
      if (!usable(items[sel])) { const f = items.findIndex(usable); if (f >= 0) sel = f; }
      const paint = () => {
        btns.forEach((b, i) => b.classList.toggle("sel", i === sel));
        if (btns[sel]) ensureVisible(btns[sel], o.scroller || host);
      };
      const move = (d) => {
        if (!d) return;
        let n = sel;
        for (let tries = 0; tries < items.length; tries++) {
          n += d;
          if (n < 0 || n >= items.length) {
            if (cols === 1) n = (n + items.length) % items.length; else return;
          }
          if (!isHeader(n)) break;
        }
        sel = n;
        G.audio.sfx("blip");
        paint();
        if (o.onMove) o.onMove(sel);
      };
      const pick = () => {
        const it = items[sel];
        if (it && it.disabled) { G.audio.sfx("no"); return; }
        G.audio.sfx("ok");
        done(sel);
      };
      const done = (v) => {
        closed = true;
        pop(h);
        if (!o.keep) host.hidden = true;
        res(v);
      };
      const h = {
        key(k) {
          if (k === "up") move(-cols);
          else if (k === "down") move(cols);
          else if (k === "left" && cols > 1) move(-1);
          else if (k === "right" && cols > 1) move(1);
          else if (k === "a") pick();
          else if (k === "b" && o.cancel !== false) { G.audio.sfx("blip"); done(-1); }
        },
      };
      push(h);
      paint();
      if (o.onMove) o.onMove(sel);
    });
  }

  async function ask(text, options = ["Sim", "Não"]) {
    await say(text, { noWait: true });
    const i = await choose(options, { where: "choice" });
    return i;
  }

  function waitKey() {
    return new Promise((res) => {
      const h = { key(k) { if (k === "a" || k === "b") { pop(h); res(k); } } };
      push(h);
    });
  }

  let toastT = null;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => (t.hidden = true), 1800);
  }

  /* ---------------- battle HUD ---------------- */
  function hpClass(p) { return p > 0.5 ? "hp-ok" : p > 0.2 ? "hp-mid" : "hp-low"; }
  function hud(which, mon) {
    const el = $(which === "foe" ? "hudFoe" : "hudMe");
    el.hidden = false;
    el.querySelector(".nm").textContent = G.monName(mon);
    el.querySelector(".lv").textContent = "Nv " + mon.lv;
    const t = el.querySelector(".tp");
    const T = G.TYPES[G.SPECIES[mon.sp].tipo];
    t.textContent = T.nome; t.style.setProperty("--c", T.cor);
    const caught = el.querySelector(".got");
    if (caught) caught.hidden = !(which === "foe" && G.state.dex.caught[mon.sp]);
    setHp(which, mon.hp, G.stats(mon).hp);
    if (which === "me") setXp(mon);
  }
  function setHp(which, hp, max) {
    const el = $(which === "foe" ? "hudFoe" : "hudMe");
    const p = Math.max(0, Math.min(1, hp / max));
    const bar = el.querySelector(".hp i");
    bar.style.width = (p * 100).toFixed(1) + "%";
    bar.className = hpClass(p);
    const n = el.querySelector(".hpn");
    if (n) n.textContent = Math.max(0, Math.ceil(hp)) + "/" + max;
  }
  function setXp(mon, override) {
    const a = G.xpFor(mon.lv), b = G.xpFor(mon.lv + 1);
    const p = override != null ? override : Math.max(0, Math.min(1, (mon.xp - a) / (b - a)));
    $("hudMe").querySelector(".xp i").style.width = (p * 100).toFixed(1) + "%";
  }
  function hideHud() { $("hudFoe").hidden = true; $("hudMe").hidden = true; }

  /* ---------------- panels ---------------- */
  function showPanel(title, info = "") {
    // a leftover prompt (like "E agora, Luma?") would cover the list, so it goes away
    if (!typing) hideBox();
    $("panel").hidden = false;
    $("pTitle").textContent = title;
    $("pInfo").textContent = info;
    $("pFoot").textContent = "";
  }
  function hidePanel() { $("panel").hidden = true; $("pList").innerHTML = ""; $("pList").hidden = false; $("pSheet").innerHTML = ""; $("pSheet").hidden = true; }

  function chip(tipo) {
    const T = G.TYPES[tipo];
    return `<span class="chip" style="--c:${T.cor}">${T.nome}</span>`;
  }
  function hpBar(m) {
    const max = G.stats(m).hp, p = Math.max(0, m.hp / max);
    return `<span class="hp"><i class="${hpClass(p)}" style="width:${(p * 100).toFixed(0)}%"></i></span>`;
  }
  function monRow(m, extra = "") {
    const max = G.stats(m).hp;
    const out = m.hp <= 0 ? '<span class="tag">sem forças</span>' : "";
    return `<img src="${G.monImg(m)}" alt=""><span class="nm">${esc(G.monName(m))}<small>Nv ${m.lv}</small></span><span class="mid">${hpBar(m)}<small>${Math.max(0, m.hp)}/${max} ${out}</small></span>${extra}`;
  }

  async function party(mode, opts = {}) {
    const st = G.state;
    let initial = 0;
    for (;;) {
      showPanel("Equipe", st.team.length + " de 6");
      $("pFoot").textContent = mode === "view" ? "A abre a ficha. B volta." : mode === "item" ? "Em quem usar?" : "Quem entra na briga?";
      const items = st.team.map((m, i) => ({
        html: monRow(m, i === opts.active ? '<span class="tag on">na briga</span>' : ""),
        disabled: (mode === "battle" || mode === "force") && (m.hp <= 0 || i === opts.active),
      }));
      const i = await choose(items, { where: "pList", cls: "rows", cancel: mode !== "force", keep: true, initial, scroller: $("pBody") });
      initial = Math.max(0, i);
      if (i < 0) { hidePanel(); return -1; }
      if (mode !== "view") { hidePanel(); return i; }
      const j = await choose(["Ver ficha", "Pôr na frente", "Voltar"], { where: "choice" });
      if (j === 0) await summary(st.team[i]);
      if (j === 1 && i > 0) { const [m] = st.team.splice(i, 1); st.team.unshift(m); initial = 0; G.audio.sfx("ok"); }
    }
  }

  function statLine(label, v, max) {
    return `<div class="st"><span>${label}</span><b>${v}</b><span class="sb"><i style="width:${Math.min(100, (v / max) * 100).toFixed(0)}%"></i></span></div>`;
  }

  async function summary(m) {
    const S = G.SPECIES[m.sp], st = G.stats(m);
    const a = G.xpFor(m.lv), b = G.xpFor(m.lv + 1);
    showPanel("Ficha", S.n ? "Nº " + String(S.n).padStart(2, "0") : "");
    $("pList").hidden = true;
    const top = Math.max(st.hp, st.atk * 2, 60);
    $("pSheet").hidden = false;
    $("pSheet").innerHTML = `
      <div class="sh-top"><img src="${G.monImg(m)}" alt="${esc(S.nome)}"><div>
        <h3>${esc(S.nome)} <small>Nv ${m.lv}</small></h3>${chip(S.tipo)}
        <p class="xpline">Falta ${Math.max(0, b - m.xp)} de experiência para o nível ${m.lv + 1}</p>
      </div></div>
      <div class="stats">${statLine("Vida", st.hp, top)}${statLine("Ataque", st.atk, top / 2)}${statLine("Defesa", st.def, top / 2)}${statLine("Velocidade", st.spd, top / 2)}</div>
      <ul class="mv">${m.moves.map((k) => { const M = G.MOVES[k]; return `<li>${chip(M.tipo)}<b>${esc(M.nome)}</b><span>${M.poder ? "Poder " + M.poder * (M.golpes || 1) : "Efeito"}</span></li>`; }).join("")}</ul>
      <p class="desc">${esc(S.desc)}</p>`;
    $("pFoot").textContent = "B volta.";
    await waitKey();
    $("pSheet").hidden = true;
    $("pList").hidden = false;
  }

  async function bag(mode) {
    const st = G.state;
    let initial = 0;
    for (;;) {
      showPanel("Mochila", st.moedas + " moedas");
      const keys = G.ITEM_ORDER.filter((k) => st.bag[k] > 0);
      if (!keys.length) {
        $("pFoot").textContent = "";
        await say("A mochila está vazia. A barraquinha da Avó vende de tudo.");
        hideBox(); hidePanel();
        return null;
      }
      const items = keys.map((k) => ({ html: `<img src="${G.A.iconURL[k]}" alt=""><span class="nm">${G.ITEMS[k].nome}<small>${esc(G.ITEMS[k].desc)}</small></span><span class="qty">x${st.bag[k]}</span>` }));
      $("pFoot").textContent = "A usa. B volta.";
      const i = await choose(items, { where: "pList", cls: "rows", keep: true, initial, scroller: $("pBody") });
      initial = Math.max(0, i);
      if (i < 0) { hidePanel(); return null; }
      const k = keys[i], I = G.ITEMS[k];
      if (I.captura) {
        if (mode === "battle") { hidePanel(); return { item: k }; }
        await say("Cestinha é para usar no mato, quando aparecer um porquinho."); hideBox();
        continue;
      }
      const t = await party("item");
      if (t < 0) continue;
      const m = st.team[t];
      const max = G.stats(m).hp;
      if (I.reanima) {
        if (m.hp > 0) { await say(`${G.Art(m.sp)} ${G.monName(m)} não precisa de perfume agora.`); hideBox(); continue; }
        if (mode === "battle") return { item: k, target: t };
        m.hp = Math.floor(max * I.reanima); st.bag[k]--;
        G.audio.sfx("heal");
        await say(`Uma borrifada de perfume e ${G.art(m.sp)} ${G.monName(m)} acordou!`); hideBox();
        continue;
      }
      if (m.hp <= 0) { await say(`${G.Art(m.sp)} ${G.monName(m)} está sem forças. Só perfume resolve.`); hideBox(); continue; }
      if (m.hp >= max) { await say(`A vida d${G.art(m.sp)} ${G.monName(m)} já está cheia.`); hideBox(); continue; }
      if (mode === "battle") return { item: k, target: t };
      const before = m.hp;
      m.hp = Math.min(max, m.hp + I.cura); st.bag[k]--;
      G.audio.sfx("heal");
      await say(`${G.Art(m.sp)} ${G.monName(m)} comeu o ${I.nome.toLowerCase()} e recuperou ${m.hp - before} de vida.`); hideBox();
    }
  }

  async function dex() {
    const st = G.state;
    const caught = G.DEX.filter((k) => st.dex.caught[k]).length;
    const seen = G.DEX.filter((k) => st.dex.seen[k]).length;
    let initial = 0;
    for (;;) {
      showPanel("Caderninho", `${caught} de 10 pegos · ${seen} vistos`);
      $("pFoot").textContent = "A abre a página. B volta.";
      const items = G.DEX.map((k) => {
        const S = G.SPECIES[k];
        const got = st.dex.caught[k], saw = st.dex.seen[k];
        const img = got ? G.A.monURL[k][0] : saw ? G.A.silURL[k] : "";
        return { html: `<span class="no">${String(S.n).padStart(2, "0")}</span>${img ? `<img src="${img}" alt="">` : '<span class="q">?</span>'}<span class="txt"><span class="nm">${saw ? esc(S.nome) : "???"}</span>${got ? '<span class="ok">pego</span>' : saw ? '<span class="ok seen">visto</span>' : ""}</span>`, disabled: !saw };
      });
      const i = await choose(items, { where: "pList", cls: "cards", cols: 2, keep: true, initial, scroller: $("pBody") });
      initial = Math.max(0, i);
      if (i < 0) { hidePanel(); return; }
      const k = G.DEX[i], S = G.SPECIES[k], got = st.dex.caught[k];
      showPanel("Caderninho", "Nº " + String(S.n).padStart(2, "0"));
      $("pList").hidden = true;
      $("pSheet").hidden = false;
      $("pSheet").innerHTML = `<div class="sh-top"><img src="${got ? G.A.monURL[k][0] : G.A.silURL[k]}" alt="${esc(S.nome)}"><div><h3>${esc(S.nome)}</h3>${chip(S.tipo)}${S.raro ? ' <span class="chip" style="--c:#c89a1e">Raro</span>' : ""}<p class="xpline">${got ? "Já está com você." : "Visto, mas ainda não pego."}</p></div></div><p class="desc">${esc(S.desc)}</p><p class="where">${esc(WHERE[k])}</p>`;
      $("pFoot").textContent = "B volta.";
      await waitKey();
      $("pSheet").hidden = true;
      $("pList").hidden = false;
    }
  }
  const WHERE = {
    rosadinho: "Onde achar: mato alto da Rota do Ipê.",
    mijaozinho: "Onde achar: mato alto da Rota do Ipê e beira do lago.",
    lameirao: "Onde achar: lamaçal da Rota do Ipê e clareira da rota.",
    toicinho: "Onde achar: clareira da Rota do Ipê e Campo das Flores.",
    pintadinho: "Onde achar: Campo das Flores, depois da ponte.",
    florzinha: "Onde achar: canteiro de mato alto do Campo das Flores.",
    bolhudo: "Onde achar: mato alto na beira do lago.",
    trufinha: "Onde achar: lamaçal do Campo das Flores.",
    milton: "Onde achar: no heliponto, quando o PIG-MTP pousa.",
    pelucio: "Onde achar: na Joli Coffee, do lado do lago.",
  };

  async function boxPanel() {
    const st = G.state;
    let initial = 0;
    for (;;) {
      showPanel("Cercadinho", `${st.team.length} na equipe · ${st.box.length} no cercadinho`);
      $("pFoot").textContent = "A troca de lugar. B volta.";
      const items = [{ header: true, html: "Equipe" }];
      st.team.forEach((m) => items.push({ html: monRow(m) }));
      items.push({ header: true, html: "No cercadinho" });
      if (!st.box.length) items.push({ header: true, html: '<span class="empty">Nenhum porquinho por aqui ainda.</span>' });
      st.box.forEach((m) => items.push({ html: monRow(m) }));
      const i = await choose(items, { where: "pList", cls: "rows", keep: true, initial, scroller: $("pBody") });
      initial = Math.max(1, i);
      if (i < 0) { hidePanel(); return; }
      const ti = i - 1, bi = i - 2 - st.team.length - (st.box.length ? 0 : 1);
      if (ti >= 0 && ti < st.team.length) {
        if (st.team.length <= 1) { await say("A equipe precisa de pelo menos um."); hideBox(); continue; }
        const m = st.team[ti];
        if (m.sp === "luma") { await say("A Luma não larga o Roli Menino. Ela fica na equipe."); hideBox(); continue; }
        st.team.splice(ti, 1); st.box.push(m);
        G.audio.sfx("ok");
      } else if (bi >= 0 && bi < st.box.length) {
        if (st.team.length >= 6) { await say("A equipe já tem 6. Mande alguém para o cercadinho antes."); hideBox(); continue; }
        const [m] = st.box.splice(bi, 1); st.team.push(m);
        G.audio.sfx("ok");
      }
    }
  }

  async function shop() {
    const st = G.state;
    let initial = 0;
    for (;;) {
      showPanel("Barraquinha da Avó", st.moedas + " moedas");
      $("pFoot").textContent = "A compra um. B sai.";
      const items = G.ITEM_ORDER.map((k) => ({ html: `<img src="${G.A.iconURL[k]}" alt=""><span class="nm">${G.ITEMS[k].nome}<small>${esc(G.ITEMS[k].desc)}</small></span><span class="qty">${G.ITEMS[k].preco}<small>tem ${st.bag[k] || 0}</small></span>`, disabled: st.moedas < G.ITEMS[k].preco }));
      const i = await choose(items, { where: "pList", cls: "rows", keep: true, initial, scroller: $("pBody") });
      initial = Math.max(0, i);
      if (i < 0) { hidePanel(); return; }
      const k = G.ITEM_ORDER[i], I = G.ITEMS[k];
      st.moedas -= I.preco;
      st.bag[k] = (st.bag[k] || 0) + 1;
      G.audio.sfx("buy");
      if (k === "perfume" && !st.flags.avoPerfume) {
        st.flags.avoPerfume = true;
        await say("Avó: Esse aqui é importado. Não conta pra Roli Menina, viu?");
        hideBox();
      } else toast(`${I.nome} comprado. Agora tem ${st.bag[k]}.`);
    }
  }

  async function startMenu() {
    const opts = () => ["Equipe", "Mochila", "Caderninho", "Salvar", "Som: " + (G.audio.on ? "ligado" : "desligado"), "Fechar"];
    let initial = 0;
    for (;;) {
      const i = await choose(opts(), { where: "choice", cls: "menu", initial });
      initial = Math.max(0, i);
      if (i < 0 || i === 5) return;
      if (i === 0) await party("view");
      if (i === 1) await bag("world");
      if (i === 2) await dex();
      if (i === 3) { G.save(); toast("Jogo salvo."); return; }
      if (i === 4) { G.audio.toggle(); G.syncSoundButton && G.syncSoundButton(); }
    }
  }

  function celebrate() {
    const st = G.state;
    showPanel("Caderninho completo!", "10 de 10");
    $("pList").hidden = true;
    $("pSheet").hidden = false;
    $("pSheet").innerHTML = `<div class="party-end">${G.DEX.map((k) => `<figure><img src="${G.A.monURL[k][0]}" alt=""><figcaption>${esc(G.SPECIES[k].nome)}</figcaption></figure>`).join("")}</div><p class="desc">${st.stats.passos} passos e ${st.stats.batalhas} batalhas até aqui.</p>`;
    $("pFoot").textContent = "";
    return Promise.resolve();
  }
  function endCelebrate() { $("pSheet").hidden = true; $("pList").hidden = false; hidePanel(); }

  function title(hasSave) {
    const el = $("title");
    el.hidden = false;
    const opts = hasSave ? ["Continuar", "Novo jogo"] : ["Novo jogo"];
    return choose(opts, { where: "titleMenu", cancel: false, keep: true }).then((i) => {
      el.hidden = true;
      return hasSave && i === 0 ? "continuar" : "novo";
    });
  }

  G.ui = {
    key, say, hideBox, ask, choose, waitKey, tick, toast,
    hud, setHp, setXp, hideHud,
    party, bag, dex, summary, boxPanel, shop, startMenu, title, celebrate, endCelebrate,
    get busy() { return stack.length > 0; },
    get waitingText() { return !!typing && stack[stack.length - 1] === typing.h; },
  };
})();

</script>
<script>
/* js/battle.js */
/* Porquinhos do Roli: turn based battles, cestinhas, experience and move effects. */
(function () {
  "use strict";
  const G = window.G;
  const B = (G.B = { on: false, fx: [] });
  const say = (t, o) => G.ui.say(t, o);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  const AUTO = 1100;

  function side(cx, fy) {
    return { mon: null, cx, fy, ox: 0, oy: 0, scale: 1, alpha: 1, vis: false, white: false, flash: 0, st: { atk: 0, def: 0, spd: 0 } };
  }
  const stageMul = (s) => (s >= 0 ? (2 + s) / 2 : 2 / (2 - s));
  const stat = (S, k) => Math.max(1, Math.floor(G.stats(S.mon)[k] * stageMul(S.st[k] || 0)));
  const isMe = (S) => S === B.me;

  function name(S) { return G.monName(S.mon) + (isMe(S) ? "" : B.tag(S.mon) ? " " + B.tag(S.mon) : ""); }
  function The(S) { return G.Art(S.mon.sp) + " " + name(S); }
  function the(S) { return G.art(S.mon.sp) + " " + name(S); }
  function ofThe(S) { return "d" + G.art(S.mon.sp) + " " + name(S); }

  function effOf(M, def) {
    const dt = G.SPECIES[def.sp].tipo;
    let e = (G.CHART[M.tipo] || {})[dt] ?? 1;
    if (M.espanta && dt === "ar") e *= 2;
    return e;
  }

  /* ---------------- drawing ---------------- */
  const silCache = new Map();
  function sil(img, color = "#ffffff") {
    let k = silCache.get(img);
    if (k) return k;
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0);
    x.globalCompositeOperation = "source-in";
    x.fillStyle = color;
    x.fillRect(0, 0, c.width, c.height);
    silCache.set(img, c);
    return c;
  }
  G.sil = sil;

  function spriteOf(S) {
    const set = isMe(S) ? G.A.monBack[S.mon.sp] : G.A.mon[S.mon.sp];
    return set[(S.mon.v || 0) % set.length];
  }
  function drawSide(ctx, S) {
    if (!S.mon || !S.vis) return;
    let img = spriteOf(S);
    if (S.white || (S.flash > 0 && Math.floor(S.flash * 14) % 2 === 0)) img = sil(img);
    const sc = S.scale;
    if (sc <= 0.01) return;
    const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
    const x = Math.round(S.cx + S.ox - w / 2), y = Math.round(S.fy + S.oy - (img.height - 4) * sc);
    ctx.globalAlpha = Math.max(0, Math.min(1, S.alpha));
    ctx.drawImage(img, x, y, w, h);
    ctx.globalAlpha = 1;
  }
  G.renderBattle = function (ctx) {
    ctx.drawImage(G.A.backdrops[B.bg] || G.A.backdrops.rota, 0, 0);
    drawSide(ctx, B.foe);
    drawSide(ctx, B.me);
    if (B.ball && B.ball.vis) {
      const img = G.A.cestinha[B.ball.open ? 1 : 0];
      ctx.save();
      ctx.translate(Math.round(B.ball.x), Math.round(B.ball.y));
      ctx.rotate(B.ball.rot || 0);
      ctx.drawImage(img, -7, -7);
      ctx.restore();
    }
    B.fx.forEach((p) => p.draw(ctx, p));
    if (B.flashScreen > 0) {
      ctx.fillStyle = "rgba(255,255,255," + Math.min(1, B.flashScreen * 3).toFixed(2) + ")";
      ctx.fillRect(0, 0, 240, 160);
    }
  };
  G.updateBattle = function (dt) {
    [B.foe, B.me].forEach((S) => { if (S && S.flash > 0) S.flash = Math.max(0, S.flash - dt); });
    if (B.flashScreen > 0) B.flashScreen = Math.max(0, B.flashScreen - dt);
    for (let i = B.fx.length - 1; i >= 0; i--) {
      const p = B.fx[i];
      p.age += dt;
      if (p.update) p.update(p, dt);
      else { p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt; p.vy = (p.vy || 0) + (p.ay || 0) * dt; }
      if (p.age >= p.life) B.fx.splice(i, 1);
    }
  };

  /* ---------------- particles ---------------- */
  const PX = (ctx, x, y, c, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  const SHAPES = {
    dot: (ctx, p) => PX(ctx, p.x - 1, p.y - 1, p.c, 2, 2),
    star: (ctx, p) => { PX(ctx, p.x, p.y - 2, p.c, 1, 5); PX(ctx, p.x - 2, p.y, p.c, 5, 1); PX(ctx, p.x, p.y, "#ffffff"); },
    heart: (ctx, p) => { [[1, 0], [3, 0], [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [1, 2], [2, 2], [3, 2], [2, 3]].forEach(([i, j]) => PX(ctx, p.x - 2 + i, p.y - 2 + j, p.c)); },
    petal: (ctx, p) => { PX(ctx, p.x, p.y, p.c, 2, 2); PX(ctx, p.x + 2, p.y + 1, p.c); },
    bubble: (ctx, p) => { ctx.strokeStyle = p.c; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(Math.round(p.x) + 0.5, Math.round(p.y) + 0.5, p.r || 3, 0, Math.PI * 2); ctx.stroke(); PX(ctx, p.x - 1, p.y - 1, "#ffffff"); },
    blob: (ctx, p) => { PX(ctx, p.x - 2, p.y - 1, p.c, 5, 3); PX(ctx, p.x - 1, p.y - 2, p.c, 3, 5); PX(ctx, p.x - 1, p.y - 1, "#c9976a"); },
    streak: (ctx, p) => PX(ctx, p.x, p.y, p.c, 9, 1),
    ring: (ctx, p) => {
      const r = 4 + p.age * 70;
      ctx.strokeStyle = p.c; ctx.lineWidth = 2;
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, p.a0, p.a1); ctx.stroke();
      ctx.globalAlpha = 1;
    },
    zee: (ctx, p) => { PX(ctx, p.x, p.y, p.c, 4, 1); PX(ctx, p.x + 2, p.y + 1, p.c); PX(ctx, p.x + 1, p.y + 2, p.c); PX(ctx, p.x, p.y + 3, p.c, 4, 1); },
    note: (ctx, p) => { PX(ctx, p.x, p.y + 3, p.c, 3, 2); PX(ctx, p.x + 2, p.y - 2, p.c, 1, 5); PX(ctx, p.x + 3, p.y - 2, p.c, 2, 1); },
    up: (ctx, p) => { PX(ctx, p.x, p.y, p.c, 1, 5); PX(ctx, p.x - 1, p.y + 1, p.c); PX(ctx, p.x + 1, p.y + 1, p.c); },
    down: (ctx, p) => { PX(ctx, p.x, p.y, p.c, 1, 5); PX(ctx, p.x - 1, p.y + 3, p.c); PX(ctx, p.x + 1, p.y + 3, p.c); },
    drop: (ctx, p) => { PX(ctx, p.x, p.y, p.c, 2, 3); PX(ctx, p.x, p.y - 1, p.c, 1, 1); },
    ball: (ctx, p) => ctx.drawImage(G.A.bolinha, Math.round(p.x - 4), Math.round(p.y - 4)),
    au: (ctx, p) => { if (!SHAPES._au) SHAPES._au = auSprite(); ctx.drawImage(SHAPES._au, Math.round(p.x), Math.round(p.y)); },
  };
  function auSprite() {
    const P = new G.Px(26, 13);
    P.rect(0, 0, 26, 11, "#ffffff"); P.poly([[4, 10], [9, 10], [3, 13]], "#ffffff");
    const glyph = { A: "010101111101101", U: "101101101101111", "!": "010010010000010" };
    "AU!".split("").forEach((ch, k) => { const g = glyph[ch]; for (let i = 0; i < 15; i++) if (g[i] === "1") P.rect(3 + k * 7 + (i % 3) * 2, 1 + Math.floor(i / 3) * 2, 2, 2, "#3a2430"); });
    P.outline("#3a2430");
    return P.canvas();
  }
  function fx(o) { B.fx.push(Object.assign({ age: 0, life: 0.6, x: 0, y: 0, c: "#ffffff", draw: SHAPES[o.shape || "dot"] }, o)); }
  const center = (S) => ({ x: S.cx + S.ox, y: S.fy + S.oy - 26 });
  const mouth = (S) => (isMe(S) ? { x: S.cx + 22, y: S.fy - 26 } : { x: S.cx - 22, y: S.fy - 24 });
  function burst(S, shape, colors, n = 8, spread = 60) {
    const c = center(S);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
      fx({ shape, x: c.x, y: c.y, vx: Math.cos(a) * spread, vy: Math.sin(a) * spread, c: colors[i % colors.length], life: 0.5 });
    }
  }
  function stream(a, d, shape, colors, n, dur, opt = {}) {
    const f = mouth(a), t = center(d);
    for (let i = 0; i < n; i++) {
      const delay = (i / n) * dur * 0.6;
      const wob = opt.wobble ?? 6, ph = Math.random() * 6;
      fx({
        shape, c: colors[i % colors.length], life: dur * 0.55 + delay, r: opt.r,
        update(p) {
          const k = Math.max(0, Math.min(1, (p.age - delay) / (dur * 0.55)));
          p.x = lerp(f.x, t.x + (Math.random() - 0.5) * 6, k);
          p.y = lerp(f.y, t.y, k) - Math.sin(k * Math.PI) * (opt.arc || 0) + Math.sin(k * 9 + ph) * wob;
          p.hidden = p.age < delay;
        },
        draw(ctx, p) { if (!p.hidden) SHAPES[shape](ctx, p); },
      });
    }
    return G.wait(dur * 1000);
  }
  function rise(S, shape, colors, n = 6) {
    const c = center(S);
    for (let i = 0; i < n; i++) fx({ shape, x: c.x - 18 + Math.random() * 36, y: c.y + 10 - Math.random() * 12, vy: -36 - Math.random() * 20, c: colors[i % colors.length], life: 0.8 + Math.random() * 0.3 });
  }

  async function lunge(a, dist = 16) {
    const dx = isMe(a) ? dist : -dist, dy = isMe(a) ? -dist * 0.4 : dist * 0.4;
    await G.tween(110, (t) => { a.ox = dx * t; a.oy = dy * t; });
    await G.tween(150, (t) => { a.ox = dx * (1 - t); a.oy = dy * (1 - t); });
  }
  async function jump(a) {
    const dx = isMe(a) ? 26 : -26;
    await G.tween(300, (t) => { a.oy = -28 * Math.sin(Math.PI * t); a.ox = dx * t; });
    await G.tween(160, (t) => { a.ox = dx * (1 - t); a.oy = 0; });
  }
  async function hitShake(d, strong) {
    G.audio.sfx(strong ? "superHit" : "hit");
    d.flash = 0.45;
    await G.tween(260, (t) => { d.ox = Math.sin(t * Math.PI * 6) * 3 * (1 - t); });
    d.ox = 0;
  }

  async function playFx(a, d, M, h) {
    switch (M.fx) {
      case "latido": {
        G.audio.sfx("bark");
        const m = mouth(a);
        fx({ shape: "au", x: m.x - (isMe(a) ? 4 : 22), y: m.y - 22, life: 0.7 });
        const t = center(d);
        const ang = Math.atan2(t.y - m.y, t.x - m.x);
        for (let i = 0; i < 3; i++) setTimeout(() => fx({ shape: "ring", x: m.x, y: m.y, c: "#ffffff", life: 0.55, a0: ang - 0.7, a1: ang + 0.7, update(p, dt) { p.x += Math.cos(ang) * 110 * dt; p.y += Math.sin(ang) * 110 * dt; } }), (i * 120) / G.speed);
        await G.wait(560);
        break;
      }
      case "bolinha": {
        const f = mouth(a), t = center(d);
        if (h === 0) {
          B.fx.push({ age: 0, life: 99, x: f.x, y: f.y, draw: SHAPES.ball, update() {} });
          B.bola = B.fx[B.fx.length - 1];
          await G.tween(300, (k) => { B.bola.x = lerp(f.x, t.x, k); B.bola.y = lerp(f.y, t.y, k) - Math.sin(k * Math.PI) * 22; });
        } else if (B.bola) {
          await G.tween(170, (k) => { B.bola.y = t.y - Math.sin(k * Math.PI) * 12; B.bola.x = t.x + 6 * k; });
        }
        break;
      }
      case "pulo": await jump(a); break;
      case "lama": await stream(a, d, "blob", ["#93633f", "#71482b", "#b5855a"], 4, 0.6, { arc: 26, wobble: 0 }); burst(d, "dot", ["#93633f", "#71482b"], 10); break;
      case "petalas": await stream(a, d, "petal", ["#ff8fb8", "#ffc4df", "#ffffff", "#ff6f9c"], 12, 0.7, { wobble: 8 }); break;
      case "bolhas": await stream(a, d, "bubble", ["#7fd3ff", "#bfefff"], 7, 0.7, { wobble: 5, r: 3 }); burst(d, "dot", ["#bfefff", "#ffffff"], 8); break;
      case "vento": await stream(a, d, "streak", ["#ffffff", "#e8eef8"], 8, 0.5, { wobble: 3 }); break;
      case "coracao": if (M.poder) { await lunge(a, 20); burst(d, "heart", ["#ff6f9c", "#ff9ab8"], 6, 50); } else await stream(a, d, "heart", ["#ff6f9c", "#ff9ab8"], 5, 0.7, { wobble: 4 }); break;
      case "nota": await stream(a, d, "note", ["#3a2430", "#6d45c4"], 4, 0.7, { wobble: 4 }); break;
      case "lagrima": rise(a, "drop", ["#7fd3ff", "#bfefff"], 6); await G.wait(500); break;
      case "rosnado": await G.tween(400, (t) => { a.ox = Math.sin(t * 40) * 1.5; }); a.ox = 0; break;
      case "zzz": rise(a, "zee", ["#ffffff", "#c7aefa"], 4); await G.wait(700); break;
      case "cafe": rise(a, "dot", ["#ffffff", "#e8d6c6"], 8); await G.wait(500); break;
      case "lamaSelf": rise(a, "blob", ["#93633f", "#71482b"], 5); await G.wait(500); break;
      case "bolhasSelf": rise(a, "bubble", ["#7fd3ff", "#bfefff"], 6); await G.wait(600); break;
      case "cura": rise(a, "star", ["#ffe680", "#ffffff", "#b4e68c"], 8); G.audio.sfx("up"); await G.wait(600); break;
      case "buff": rise(a, "up", ["#ff9a3c", "#ffd23f"], 8); G.audio.sfx("up"); await G.wait(600); break;
      default: await lunge(a); break;
    }
  }

  /* ---------------- flow helpers ---------------- */
  async function drainHp(S, dmg) {
    const from = S.mon.hp, to = Math.max(0, from - dmg), max = G.stats(S.mon).hp;
    const which = isMe(S) ? "me" : "foe";
    const dur = Math.min(700, 150 + Math.abs(from - to) * 14);
    await G.tween(dur, (t) => G.ui.setHp(which, lerp(from, to, t), max));
    S.mon.hp = to;
    G.ui.setHp(which, to, max);
  }
  async function healHp(S, amount) {
    const max = G.stats(S.mon).hp, from = S.mon.hp, to = Math.min(max, from + amount);
    const which = isMe(S) ? "me" : "foe";
    await G.tween(450, (t) => G.ui.setHp(which, lerp(from, to, t), max));
    S.mon.hp = to;
    G.ui.setHp(which, to, max);
    return to - from;
  }

  function calc(a, d, M) {
    const A = stat(a, "atk"), D = stat(d, "def");
    const base = (((2 * a.mon.lv) / 5 + 2) * M.poder * A) / D / 50 + 2;
    const stab = M.tipo === G.SPECIES[a.mon.sp].tipo ? 1.5 : 1;
    const eff = effOf(M, d.mon);
    const crit = Math.random() < 1 / 16;
    const rnd = 0.85 + Math.random() * 0.15;
    return { dmg: Math.max(1, Math.floor(base * stab * eff * (crit ? 1.5 : 1) * rnd)), eff, crit };
  }

  const STATNAME = { atk: "O ataque", def: "A defesa", spd: "A velocidade" };
  async function applyStages(target, eff) {
    for (const k of ["atk", "def", "spd"]) {
      const v = eff[k];
      if (!v) continue;
      const before = target.st[k];
      target.st[k] = Math.max(-6, Math.min(6, before + v));
      if (target.st[k] === before) { await say(`${STATNAME[k]} ${ofThe(target)} não ${v > 0 ? "sobe" : "cai"} mais!`, { auto: AUTO }); continue; }
      if (v > 0) { rise(target, "up", ["#ff9a3c", "#ffd23f"], 8); G.audio.sfx("up"); }
      else { rise(target, "down", ["#6aa7ff", "#bfe6ff"], 8); G.audio.sfx("down"); }
      await G.wait(350);
      await say(`${STATNAME[k]} ${ofThe(target)} ${v > 0 ? (v > 1 ? "subiu muito" : "subiu") : v < -1 ? "caiu muito" : "caiu"}!`, { auto: AUTO });
    }
  }

  async function attack(a, d, key) {
    const M = G.MOVES[key];
    await say(`${The(a)} usou ${M.nome}!`, { auto: 380 });
    if (M.prec < 100 && Math.random() * 100 >= M.prec) {
      if (M.poder) await lunge(a, 8);
      await say("Mas errou!", { auto: AUTO });
      return;
    }
    if (M.poder > 0) {
      const hits = M.golpes || 1;
      let landed = 0, eff = 1, crit = false;
      for (let h = 0; h < hits; h++) {
        await playFx(a, d, M, h);
        const r = calc(a, d, M);
        eff = r.eff; crit = crit || r.crit;
        await hitShake(d, r.eff > 1);
        await drainHp(d, r.dmg);
        landed++;
        if (d.mon.hp <= 0) break;
      }
      if (B.bola) {
        const f = mouth(a), s = { x: B.bola.x, y: B.bola.y };
        await G.tween(300, (k) => { B.bola.x = lerp(s.x, f.x, k); B.bola.y = lerp(s.y, f.y, k) - Math.sin(k * Math.PI) * 22; });
        B.bola.life = 0; B.bola = null;
      }
      if (crit) await say("Um golpe certeiro!", { auto: AUTO });
      if (M.espanta && G.SPECIES[d.mon.sp].tipo === "ar") await say("Pombo morre de medo de latido! É super eficaz!", { auto: AUTO + 300 });
      else if (eff > 1) await say("É super eficaz!", { auto: AUTO });
      else if (eff < 1) await say("Não foi muito eficaz...", { auto: AUTO });
      if (hits > 1) await say(`Acertou ${landed} ${landed > 1 ? "vezes" : "vez"}!`, { auto: AUTO });
      return;
    }
    await playFx(a, d, M, 0);
    if (M.cura) {
      const max = G.stats(a.mon).hp;
      if (a.mon.hp >= max) { await say(`Mas a vida ${ofThe(a)} já está cheia!`, { auto: AUTO }); return; }
      await healHp(a, Math.ceil(max * M.cura));
      await say(`${The(a)} recuperou vida!`, { auto: AUTO });
      return;
    }
    if (M.efeito) {
      const target = M.efeito.alvo === "self" ? a : d;
      await applyStages(target, M.efeito);
    }
  }

  function pickFoeMove() {
    const m = B.foe.mon, max = G.stats(m).hp;
    const opts = m.moves.map((k) => {
      const M = G.MOVES[k];
      let w;
      if (M.cura) w = m.hp >= max ? 0 : m.hp < max * 0.4 ? 3 : 0.25;
      else if (M.poder) w = B.trainer ? (M.poder / 40) * effOf(M, B.me.mon) : 1;
      else w = B.foe.st.atk >= 2 ? 0.2 : 0.55;
      return [k, w];
    });
    const total = opts.reduce((s, [, w]) => s + w, 0);
    let r = Math.random() * total;
    for (const [k, w] of opts) { r -= w; if (r <= 0) return k; }
    return opts[0][0];
  }

  async function popOut(S) {
    S.vis = true; S.white = true; S.scale = 0; S.alpha = 1; S.ox = 0; S.oy = 0;
    G.audio.sfx("pop");
    await G.tween(260, (t) => (S.scale = ease(t)));
    S.white = false;
    G.audio.sfx("cry", S.mon.sp);
  }
  async function sendOut(i, first) {
    const st = G.state;
    B.meIdx = i;
    B.me.mon = st.team[i];
    B.me.st = { atk: 0, def: 0, spd: 0 };
    B.me.down = false;
    await say(first ? `Vai, ${G.monName(B.me.mon)}!` : `Sua vez, ${G.monName(B.me.mon)}!`, { auto: 300 });
    await popOut(B.me);
    G.ui.hud("me", B.me.mon);
    await G.wait(200);
  }
  async function withdraw() {
    await say(`Volta, ${G.monName(B.me.mon)}!`, { auto: 300 });
    B.me.white = true;
    await G.tween(220, (t) => (B.me.scale = 1 - t));
    B.me.vis = false; B.me.white = false; B.me.scale = 1;
  }
  async function faint(S) {
    G.audio.sfx("faint");
    await G.tween(480, (t) => { S.oy = 40 * t; S.alpha = 1 - t; });
    S.vis = false; S.oy = 0; S.alpha = 1;
    await say(`${The(S)} ficou sem forças!`);
  }

  async function learn(m, k) {
    const M = G.MOVES[k], nm = `${G.Art(m.sp)} ${G.monName(m)}`;
    if (m.moves.includes(k)) return;
    if (m.moves.length < 4) {
      m.moves.push(k);
      G.audio.sfx("levelUp");
      await say(`${nm} aprendeu ${M.nome}!`);
      return;
    }
    await say(`${nm} quer aprender ${M.nome}, mas já sabe 4 golpes.`);
    const yes = await G.ui.ask(`Esquecer um golpe para aprender ${M.nome}?`);
    if (yes === 0) {
      await say("Esquecer qual?", { noWait: true });
      const j = await G.ui.choose([...m.moves.map((x) => G.MOVES[x].nome), "Não aprender"], { where: "choice" });
      if (j >= 0 && j < 4) {
        const old = G.MOVES[m.moves[j]].nome;
        m.moves[j] = k;
        G.audio.sfx("levelUp");
        await say(`1, 2 e... pronto! ${nm} esqueceu ${old} e aprendeu ${M.nome}!`);
        return;
      }
    }
    await say(`${nm} não aprendeu ${M.nome}.`);
  }
  G.learn = learn;

  async function gainXp(foeMon) {
    const me = B.me.mon;
    if (!me || me.hp <= 0) return;
    const S = G.SPECIES[foeMon.sp];
    const xp = Math.max(1, Math.floor(((S.xp * foeMon.lv) / 7) * (B.trainer ? 1.5 : 1)));
    await say(`${G.Art(me.sp)} ${G.monName(me)} ganhou ${xp} de experiência!`, { auto: AUTO });
    let left = xp;
    while (left > 0) {
      const need = G.xpFor(me.lv + 1) - me.xp;
      const take = Math.min(need, left);
      const a = G.xpFor(me.lv), b = G.xpFor(me.lv + 1);
      const p0 = (me.xp - a) / (b - a), p1 = (me.xp + take - a) / (b - a);
      await G.tween(Math.max(200, 600 * (p1 - p0)), (t) => G.ui.setXp(me, lerp(p0, p1, t)));
      me.xp += take; left -= take;
      if (me.xp >= b && me.lv < 50) {
        const oldMax = G.stats(me).hp;
        me.lv++;
        const newMax = G.stats(me).hp;
        me.hp = Math.min(newMax, me.hp + (newMax - oldMax));
        G.audio.sfx("levelUp");
        B.me.flash = 0.4;
        G.ui.hud("me", me);
        G.ui.setXp(me, 0);
        await say(`${G.Art(me.sp)} ${G.monName(me)} subiu para o nível ${me.lv}!`);
        for (const [l, k] of G.SPECIES[me.sp].moves) if (l === me.lv) await learn(me, k);
      } else break;
    }
    G.ui.setXp(me);
  }

  /* ---------------- cestinhas ---------------- */
  async function throwBasket(item) {
    const st = G.state, foe = B.foe;
    if (!B.canCatch) {
      await say(B.trainer ? "Não dá para pegar o pombo dos outros. E nem quer!" : "Esse aí não entra em cestinha.");
      return "cancel";
    }
    st.bag[item]--;
    const I = G.ITEMS[item];
    await say(`Roli Menino jogou ${item === "cestao" ? "um Cestão" : "uma Cestinha"}!`, { auto: 250 });
    G.audio.sfx("throwIt");
    const top = foe.fy - 34;
    B.ball = { x: 24, y: 130, rot: 0, open: false, vis: true };
    await G.tween(620, (t) => { B.ball.x = lerp(24, foe.cx, t); B.ball.y = lerp(130, top, t) - Math.sin(t * Math.PI) * 46; B.ball.rot = t * 10; });
    B.ball.rot = 0; B.ball.open = true;
    G.audio.sfx("pop");
    foe.white = true;
    await G.tween(320, (t) => { foe.scale = 1 - t; foe.oy = -26 * t; });
    foe.vis = false; foe.white = false; foe.scale = 1; foe.oy = 0;
    B.ball.open = false;
    const ground = foe.fy - 7;
    await G.tween(280, (t) => (B.ball.y = lerp(top, ground, t * t)));
    await G.tween(160, (t) => (B.ball.y = ground - Math.sin(t * Math.PI) * 6));
    const max = G.stats(foe.mon).hp;
    const rate = G.SPECIES[foe.mon.sp].taxa * I.captura;
    const p = Math.max(0.03, Math.min(1, ((3 * max - 2 * foe.mon.hp) * rate) / (3 * max * 255)));
    const q = Math.pow(p, 1 / 3);
    let shakes = 0;
    while (shakes < 3 && Math.random() < q) shakes++;
    const n = shakes === 3 ? 3 : shakes;
    for (let s = 0; s < n; s++) {
      await G.wait(320);
      G.audio.sfx("shake");
      await G.tween(320, (t) => (B.ball.rot = Math.sin(t * Math.PI * 2) * 0.45));
      B.ball.rot = 0;
    }
    await G.wait(300);
    if (shakes === 3) {
      G.audio.sfx("caught");
      for (let i = 0; i < 6; i++) fx({ shape: "star", x: B.ball.x, y: B.ball.y - 4, vx: (i - 2.5) * 16, vy: -40 - (i % 2) * 14, ay: 60, c: i % 2 ? "#ffd23f" : "#ffffff", life: 0.8 });
      await G.wait(500);
      const m = foe.mon, sp = m.sp;
      const first = !st.dex.caught[sp];
      st.dex.caught[sp] = true; st.dex.seen[sp] = true;
      await say(`Oba! ${G.Art(sp)} ${G.monName(m)} entrou na cestinha!`);
      if (first) {
        const c = G.DEX.filter((k) => st.dex.caught[k]).length;
        await say(`${G.Art(sp)} ${G.monName(m)} foi anotad${G.art(sp)} no caderninho. Já são ${c} de 10!`);
      }
      m.v = m.v || 0;
      if (st.team.length < 6) { st.team.push(m); await say(`${G.Art(sp)} ${G.monName(m)} entrou para a equipe.`); }
      else { st.box.push(m); await say(`A equipe está cheia. ${G.Art(sp)} ${G.monName(m)} foi para o cercadinho da vila.`); }
      B.caughtNew = first;
      return "caught";
    }
    B.ball.open = true;
    G.audio.sfx("pop");
    foe.vis = true; foe.white = true; foe.scale = 0;
    await G.tween(240, (t) => (foe.scale = t));
    foe.white = false; foe.scale = 1;
    B.ball = null;
    const FAIL = ["Ah, nem entrou na cestinha!", "Quase! Pulou para fora.", "Puxa, faltou pouco!", "Por um focinho! Escapou."];
    await say(FAIL[shakes]);
    return "fail";
  }

  async function useItem(act) {
    const st = G.state, I = G.ITEMS[act.item];
    const m = st.team[act.target];
    const max = G.stats(m).hp;
    st.bag[act.item]--;
    G.audio.sfx("heal");
    if (I.reanima) {
      m.hp = Math.floor(max * I.reanima);
      await say(`Uma borrifada de perfume e ${G.art(m.sp)} ${G.monName(m)} acordou!`);
      return;
    }
    if (act.target === B.meIdx) {
      rise(B.me, "star", ["#ffe680", "#ffffff"], 8);
      const got = await healHp(B.me, I.cura);
      await say(`${G.Art(m.sp)} ${G.monName(m)} comeu o ${I.nome.toLowerCase()} e recuperou ${got} de vida.`);
    } else {
      const before = m.hp;
      m.hp = Math.min(max, m.hp + I.cura);
      await say(`${G.Art(m.sp)} ${G.monName(m)} comeu o ${I.nome.toLowerCase()} e recuperou ${m.hp - before} de vida.`);
    }
  }

  /* ---------------- choosing ---------------- */
  async function chooseMove() {
    const me = B.me.mon;
    const items = me.moves.map((k) => {
      const M = G.MOVES[k], T = G.TYPES[M.tipo];
      const e = M.poder ? effOf(M, B.foe.mon) : 1;
      const what = M.poder ? "Poder " + M.poder * (M.golpes || 1) : M.cura ? "Cura" : "Efeito";
      const hint = e > 1 ? ' <em class="eup">forte</em>' : e < 1 ? ' <em class="edn">fraco</em>' : "";
      return { html: `<b>${M.nome}</b><span class="sub"><i style="--c:${T.cor}"></i>${T.nome} · ${what}${hint}</span>` };
    });
    const i = await G.ui.choose(items, { where: "moves", cols: 2, initial: B.lastMove || 0 });
    if (i < 0) return null;
    B.lastMove = i;
    return me.moves[i];
  }

  async function chooseAction() {
    for (;;) {
      const me = B.me.mon;
      say(`E agora, ${G.monName(me)}?`, { narrow: true, noWait: true });
      const i = await G.ui.choose(["Lutar", "Mochila", "Equipe", "Fugir"], { where: "cmd", cols: 2, cancel: false, initial: B.lastCmd || 0 });
      B.lastCmd = i;
      document.getElementById("box").classList.remove("narrow");
      if (i === 0) { const mv = await chooseMove(); if (mv) return { t: "fight", mv }; }
      if (i === 1) { const r = await G.ui.bag("battle"); if (r) return Object.assign({ t: "item" }, r); }
      if (i === 2) {
        const j = await G.ui.party("battle", { active: B.meIdx });
        if (j >= 0) return { t: "switch", i: j };
      }
      if (i === 3) return { t: "run" };
    }
  }

  async function checkFaints() {
    const st = G.state;
    if (B.foe.mon.hp <= 0 && !B.foe.down) {
      B.foe.down = true;
      await faint(B.foe);
      await gainXp(B.foe.mon);
      if (B.trainer && B.foeIdx < B.foes.length - 1) {
        B.foeIdx++;
        await nextFoe();
        return "replaced";
      }
      return "win";
    }
    if (B.me.mon.hp <= 0 && !B.me.down) {
      B.me.down = true;
      await faint(B.me);
      if (!st.team.some((m) => m.hp > 0)) return "lose";
      G.ui.hideBox();
      const i = await G.ui.party("force", { active: B.meIdx });
      await sendOut(i);
      return "replaced";
    }
    return null;
  }

  async function nextFoe() {
    B.foe.mon = B.foes[B.foeIdx];
    B.foe.st = { atk: 0, def: 0, spd: 0 };
    B.foe.down = false;
    const sp = B.foe.mon.sp;
    G.state.dex.seen[sp] = G.state.dex.seen[sp] || !!G.SPECIES[sp].n;
    if (sp === "pombao") await say("Pombão: Pruu! Então eu mesmo vou!");
    else await say(`${B.trainer.nome} mandou ${G.art(sp)} ${G.monName(B.foe.mon)}!`);
    await popOut(B.foe);
    G.ui.hud("foe", B.foe.mon);
  }

  async function turn(act) {
    const me = B.me, foe = B.foe, st = G.state;
    if (act.t === "run") {
      if (!B.canRun) { await say("Não dá para fugir de uma briga com o Pombão!"); return null; }
      B.runs++;
      const a = stat(me, "spd"), b = stat(foe, "spd");
      const ok = a >= b || Math.random() * 256 < (a * 128) / b + 30 * B.runs;
      if (ok) { G.audio.sfx("door"); await say("Fugiu sem problemas!"); return "run"; }
      await say("Não deu para fugir!", { auto: AUTO });
      await attack(foe, me, pickFoeMove());
      return checkFaints();
    }
    if (act.t === "switch") {
      await withdraw();
      await sendOut(act.i);
      await attack(foe, me, pickFoeMove());
      return checkFaints();
    }
    if (act.t === "item") {
      if (G.ITEMS[act.item].captura) {
        const r = await throwBasket(act.item);
        if (r === "caught") return "caught";
        if (r === "cancel") return null;
      } else await useItem(act);
      G.ui.hud("me", me.mon);
      await attack(foe, me, pickFoeMove());
      return checkFaints();
    }
    const fm = pickFoeMove();
    const sa = stat(me, "spd"), sb = stat(foe, "spd");
    const meFirst = sa > sb || (sa === sb && Math.random() < 0.5);
    const order = meFirst ? [[me, foe, act.mv], [foe, me, fm]] : [[foe, me, fm], [me, foe, act.mv]];
    for (const [a, d, mv] of order) {
      if (a.mon.hp <= 0 || d.mon.hp <= 0) break;
      await attack(a, d, mv);
      const r = await checkFaints();
      if (r) return r === "replaced" ? null : r;
    }
    return null;
  }

  /* ---------------- the battle ---------------- */
  G.battle = async function (opts) {
    const st = G.state;
    Object.assign(B, {
      on: true, bg: opts.bg || "rota", fx: [], ball: null, flashScreen: 0,
      trainer: opts.trainer || null, foes: opts.foes, foeIdx: 0, runs: 0,
      canCatch: !opts.trainer && opts.canCatch !== false, canRun: !opts.trainer,
      lastCmd: 0, lastMove: 0, caughtNew: false,
      tag: (m) => (opts.tag ? opts.tag(m) : ""),
    });
    B.foe = side(176, 60);
    B.me = side(56, 104);
    B.foe.mon = B.foes[0];
    G.audio.music("batalha");
    G.audio.sfx("encounter");
    await G.transition("battleIn");
    G.scene = "battle";
    await G.transition("open");
    const sp = B.foe.mon.sp;
    if (G.SPECIES[sp].n) st.dex.seen[sp] = true;
    if (B.trainer) {
      await say(opts.intro || `${B.trainer.nome} quer brigar!`);
      await say(`${B.trainer.nome} mandou ${G.art(sp)} ${G.monName(B.foe.mon)}!`, { auto: 300 });
      await popOut(B.foe);
    } else {
      B.foe.vis = true; B.foe.ox = 160;
      await G.tween(520, (t) => (B.foe.ox = 160 * (1 - ease(t))));
      G.audio.sfx("cry", sp);
    }
    G.ui.hud("foe", B.foe.mon);
    if (!B.trainer) await say(opts.intro || `${G.Art(sp)} ${G.monName(B.foe.mon)} apareceu ${opts.where || "no mato"}!`);
    await sendOut(st.team.findIndex((m) => m.hp > 0), true);

    let result = null;
    while (!result) {
      const act = await chooseAction();
      result = await turn(act);
    }
    if (result === "win") {
      const coins = B.trainer ? B.trainer.moedas : 3 * B.foe.mon.lv + 5;
      st.moedas += coins;
      if (B.trainer) {
        G.audio.music(null);
        G.audio.stopMusic();
        G.audio.sfx("win");
        await say(`Você venceu ${opts.trainerThe || B.trainer.nome}!`);
        if (opts.outro) for (const line of opts.outro) await say(line);
      }
      await say(`Roli Menino ganhou ${coins} moedas!`, { auto: AUTO });
    }
    st.stats.batalhas++;
    G.ui.hideBox();
    await G.transition("fadeOut");
    G.ui.hideHud();
    B.on = false; B.fx = []; B.ball = null;
    G.scene = "world";
    return { result, caughtNew: B.caughtNew };
  };
})();

</script>
<script>
/* js/world.js */
/* Porquinhos do Roli: the overworld. Grid walking, Luma following, tall grass, doors and everyone's lines. */
(function () {
  "use strict";
  const G = window.G;
  const W = (G.W = { locked: false, bulbs: 0 });
  const say = (t, o) => G.ui.say(t, o);
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPP = { up: "down", down: "up", left: "right", right: "left" };
  const WALK = 0.22, RUN = 0.12;
  let maps, map, player, luma, npcs = [];
  let turnT = 0, bumpT = 0;
  const rustles = new Map();
  const leaves = [];

  function mk(x, y, dir, def) {
    return { x, y, dir, px: x * 16, py: y * 16, moving: false, t: 0, fx: x, fy: y, foot: 0, dur: WALK, def, home: { x, y }, wt: 2 + Math.random() * 3, lift: 0, alpha: 1 };
  }
  const hash = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;

  W.init = function () { maps = G.buildMaps(); };
  W.map = () => map;
  W.player = () => player;
  W.pos = () => ({ map: map.id, x: player.x, y: player.y, dir: player.dir });

  W.load = function (id, x, y, dir) {
    map = maps[id];
    player = mk(x, y, dir);
    // Luma starts behind the Roli Menino, or beside him when that tile is taken.
    const [dx, dy] = DIRS[dir];
    const spots = [[x - dx, y - dy], [x + dy, y + dx], [x - dy, y - dx], [x + dx, y + dy]];
    const spot = spots.find(([a, b]) => !blockedTile(a, b) && !map.npcs.some((n) => n.x === a && n.y === b));
    luma = spot ? mk(spot[0], spot[1], dir) : mk(x, y, dir);
    npcs = map.npcs.filter((n) => !(n.hideIf && G.state.flags[n.hideIf])).map((n) => mk(n.x, n.y, n.dir, n));
    G.state.pos = W.pos();
    G.audio.music(map.music);
  };

  function tileAt(x, y) {
    if (!map || x < 0 || y < 0 || x >= map.w || y >= map.h) return "T";
    return map.t[y][x];
  }
  function objAt(x, y) {
    return map.objects.find((o) => !o.ground && x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h);
  }
  function npcAt(x, y) {
    return npcs.find((n) => n.x === x && n.y === y);
  }
  const solidTile = (c) => c === "T" || c === "~" || c === "F" || c === "W" || c === "w" || c === "c";
  function isWarp(x, y) {
    const o = objAt(x, y);
    return !!(o && o.warp && o.warp.some((w) => w.x === x && w.y === y));
  }
  function blockedTile(x, y) {
    if (solidTile(tileAt(x, y))) return true;
    const o = objAt(x, y);
    if (o && o.solid && !isWarp(x, y)) return true;
    return false;
  }
  function blocked(x, y, who) {
    if (blockedTile(x, y)) return true;
    if (npcAt(x, y)) return true;
    if (who !== player && player.x === x && player.y === y) return true;
    if (who !== player && who !== luma && luma.x === x && luma.y === y) return true;
    return false;
  }

  function startMove(e, dir, dur) {
    const [dx, dy] = DIRS[dir];
    e.fx = e.x; e.fy = e.y;
    e.x += dx; e.y += dy;
    e.dir = dir; e.moving = true; e.t = 0; e.dur = dur; e.foot ^= 1;
  }
  function dirTo(a, bx, by) {
    if (bx > a.x) return "right";
    if (bx < a.x) return "left";
    if (by > a.y) return "down";
    return "up";
  }

  function tryMove(dir) {
    const [dx, dy] = DIRS[dir];
    const nx = player.x + dx, ny = player.y + dy;
    if (blocked(nx, ny, player)) {
      player.dir = dir;
      if (bumpT <= 0) { G.audio.sfx("bump"); bumpT = 0.3; }
      return;
    }
    const ox = player.x, oy = player.y;
    const dur = G.input.held.has("b") ? RUN : WALK;
    startMove(player, dir, dur);
    if (luma.x !== ox || luma.y !== oy) {
      const d = Math.abs(luma.x - ox) + Math.abs(luma.y - oy);
      if (d === 1) startMove(luma, dirTo(luma, ox, oy), dur);
      else { luma.x = ox; luma.y = oy; luma.px = ox * 16; luma.py = oy * 16; }
    }
    G.state.stats.passos++;
  }

  async function onStep() {
    const x = player.x, y = player.y, c = tileAt(x, y);
    if (c === "," || c === "m") {
      rustles.set(x + "," + y, G.time);
      G.audio.sfx("rustle");
      for (let i = 0; i < 4; i++) leaves.push({ x: x * 16 + 4 + Math.random() * 8, y: y * 16 + 8, vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 20, life: 0.5, age: 0, c: c === "m" ? "#71482b" : i % 2 ? "#78c95a" : "#2f6c37" });
    }
    if (map.id === "vila" && isWarp(x, y)) {
      const o = objAt(x, y);
      return warpTo(o.to);
    }
    if (map.exit && x === map.exit.x && y === map.exit.y) return warpTo(map.exit.to);
    const zone = G.zoneAt(map.id, x, y, c);
    if (zone && G.state.team.some((m) => m.hp > 0) && Math.random() < 0.12 * (G.encounterBoost ?? 1)) {
      await wild(zone);
    }
  }

  async function warpTo(to) {
    W.locked = true;

  function pick(table) {
    const total = table.reduce((s, [, w]) => s + w, 0);
    let r = Math.random() * total;
    for (const [k, w] of table) { r -= w; if (r <= 0) return k; }
    return table[0][0];
  }

  async function wild(zone) {
    W.locked = true;
    const sp = pick(zone.table);
    const lv = zone.lv[0] + Math.floor(Math.random() * (zone.lv[1] - zone.lv[0] + 1));
    const m = G.makeMon(sp, lv);
