<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fazenda Joli Pig · slop</title>
<meta name="description" content="Jogo de fazenda em voxel com mapa isométrico: o porquinho Ed planta, cuida das galinhas e das vacas e chama o irmão Beto para vender tudo no Joli Market.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gochi+Hand&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: fazenda em voxel em tela cheia, vista isométrica. Placa com nível no canto superior esquerdo, dinheiro e ração no direito,
   barra de ações embaixo, controles de câmera à direita. Menus de ação abrem perto de onde se tocou. */
[hidden]{display:none !important}
:root{
  --ceu-1:#9fd8f2;
  --ceu-2:#dff3ea;
  --papel:#fff8e9;
  --papel-2:#f6ead0;
  --tinta:#3b2a20;
  --tinta-suave:#7a6352;
  --borda:#3b2a20;
  --sombra:rgba(59,42,32,.32);
  --amarelo:#f7e17a;
  --amarelo-forte:#efc93e;
  --azul:#b5d6f0;
  --azul-forte:#6aa7da;
  --rosa:#e0408a;
  --rosa-claro:#f7c3d6;
  --verde:#5aa83c;
  --verde-escuro:#3e7f2b;
  --vermelho:#d24a3c;
  --madeira:#b8834f;
  --f-titulo:"Bagel Fat One","Arial Black",Impact,sans-serif;
  --f-texto:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;touch-action:manipulation}
body{background:linear-gradient(180deg,var(--ceu-1),var(--ceu-2));color:var(--tinta);font-family:var(--f-texto);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#jogo{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#tela{display:block;width:100%;height:100%;cursor:pointer}

/* painéis */
.painel{background:var(--papel);border:3px solid var(--borda);border-radius:14px;box-shadow:0 4px 0 var(--sombra)}
.hud-topo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.placa{padding:7px 12px 8px;min-width:0;pointer-events:auto}
.marca{font-family:var(--f-titulo);font-size:clamp(17px,4.4vw,24px);line-height:1;color:var(--rosa);white-space:nowrap;letter-spacing:.01em}
.nivel{display:flex;align-items:center;gap:7px;margin-top:6px}
.selo-nivel{flex:none;display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--amarelo);border:2px solid var(--borda);font-family:var(--f-titulo);font-size:15px;line-height:1}
.barra-xp{flex:1;min-width:70px;height:10px;border:2px solid var(--borda);border-radius:999px;background:var(--papel-2);overflow:hidden}
.barra-xp i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.xp-texto{font-size:12px;font-weight:700;color:var(--tinta-suave);white-space:nowrap;font-variant-numeric:tabular-nums}
.recursos{display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;font-family:var(--f-titulo);font-size:clamp(16px,4vw,21px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip img{width:30px;height:30px}
.chip.estacao{font-family:var(--f-texto);font-weight:800;font-size:13px;padding:5px 11px;cursor:pointer}
.chip.estacao.chuva{background:#d6e9f8}
.chip.hora.tarde{background:#ffe1b8}
.chip.hora.noite{background:#2c3a6a;color:#fff8e9}
/* estrelas atrás do mapa, que aparecem à noite */
#estrelas{position:fixed;inset:0;pointer-events:none;opacity:0}
.chip.pulsa{animation:pulsa .35s ease-out}
/* ração acabando: amarelo quando dá para menos de 10 minutos, vermelho quando não dá para alimentar ninguém */
#chipRacao{cursor:pointer}
#chipRacao.pouca{background:var(--amarelo)}
#chipRacao.acabou{background:#f6b3a8;animation:alertaRacao 1.2s ease-in-out infinite}
@keyframes alertaRacao{50%{transform:scale(1.06)}}
@keyframes pulsa{40%{transform:scale(1.12)}}

/* barra de baixo */
.hud-base{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:grid;justify-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.acoes{display:flex;gap:8px;pointer-events:auto;padding:6px;flex-wrap:nowrap;max-width:100%}
.acao{all:unset;box-sizing:border-box;display:grid;justify-items:center;gap:2px;min-width:66px;padding:6px 8px 5px;border-radius:10px;cursor:pointer;font-weight:800;font-size:12px;line-height:1.1;text-align:center;white-space:nowrap}
.acao img,.acao svg{width:38px;height:38px;display:block}
.acao:hover{background:var(--papel-2)}
.acao:focus-visible{outline:3px solid var(--rosa);outline-offset:1px}
.acao.destaque{background:var(--azul);animation:chama 1.2s ease-in-out infinite}
@keyframes chama{50%{background:#d8eaf8}}
.acao .bolinha{position:absolute;margin:-4px 0 0 30px;background:var(--rosa);color:#fff;border:2px solid var(--borda);border-radius:999px;font-size:11px;padding:1px 5px}
.acao{position:relative}

.dica{max-width:min(560px,calc(100vw - 32px));padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;line-height:1.3;pointer-events:auto;animation:sobe .3s ease-out}
.dica img{width:34px;height:34px;flex:none}
.dica .x{all:unset;cursor:pointer;flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;font-weight:800;color:var(--tinta-suave)}
.dica .x:hover{background:var(--papel-2)}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}
.modo{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;background:var(--amarelo);font-weight:800;font-size:14px;pointer-events:auto;max-width:calc(100vw - 32px)}
.modo img{width:28px;height:28px;flex:none}
.modo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fila{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 8px;font-weight:800;font-size:13px;white-space:nowrap;pointer-events:auto;max-width:calc(100vw - 32px);border-radius:999px}
.fila img{width:24px;height:24px;flex:none}
.fila span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.fila .botao.mini{border-radius:999px;flex:none}

/* câmera */
.camera-ctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:6px;pointer-events:auto}
.cam{all:unset;box-sizing:border-box;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;background:var(--papel);border:3px solid var(--borda);border-radius:12px;box-shadow:0 3px 0 var(--sombra)}
.cam svg{width:22px;height:22px}
.cam:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sombra)}
.cam:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}

/* botões */
.botao{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--amarelo);border:3px solid var(--borda);box-shadow:0 3px 0 var(--sombra);font-weight:800;font-size:15px;cursor:pointer;text-align:center;line-height:1.15}
.botao:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sombra)}
.botao:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.botao.azul{background:var(--azul)}
.botao.verde{background:#bfe39a}
.botao.rosa{background:var(--rosa-claro)}
.botao.claro{background:var(--papel)}
.botao[disabled],.botao.off{opacity:.45;cursor:default;pointer-events:none}
.botao.mini{padding:5px 10px;font-size:13px;border-width:2px;border-radius:9px;box-shadow:0 2px 0 var(--sombra)}
.botao img{width:24px;height:24px}

/* menu de ação */
.menu{position:absolute;z-index:20;width:250px;max-width:calc(100vw - 24px);padding:10px;pointer-events:auto;animation:abre .14s ease-out;transform-origin:top left}
@keyframes abre{from{transform:scale(.9);opacity:0}}
.menu h3{margin:0 0 2px;font-family:var(--f-titulo);font-weight:400;font-size:19px;line-height:1.1;display:flex;align-items:center;gap:8px}
.menu h3 img{width:32px;height:32px}
.menu .estado{font-size:13px;font-weight:700;color:var(--tinta-suave);margin:2px 0 6px;line-height:1.3}
.menu .estado.alerta{color:var(--vermelho)}
.menu .estado.bom{color:var(--verde-escuro)}
.menu .prog{height:9px;border:2px solid var(--borda);border-radius:999px;background:var(--papel-2);overflow:hidden;margin:0 0 8px}
.menu .prog i{display:block;height:100%;background:var(--verde)}
/* fila das construções: uma caixinha por vaga */
.vagas{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:2px 0 8px}
.vaga{border:2px solid var(--borda);border-radius:10px;background:var(--papel-2);padding:4px 3px 5px;text-align:center;font-weight:800;font-size:11px;line-height:1.15;min-width:0}
.vaga img{width:28px;height:28px;display:block;margin:0 auto 1px}
.vaga .n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vaga .t{display:block;font-weight:700;font-size:10px;color:var(--tinta-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vaga .barra{height:5px;border-radius:999px;background:#fff;border:1px solid var(--borda);margin:3px 2px 0;overflow:hidden}
.vaga .barra i{display:block;height:100%;background:var(--verde)}
.vaga.fazendo{background:#e3f3d4}
.vaga.levando{background:#fff1b8}
.vaga.livre{background:transparent;border-style:dashed;color:var(--tinta-suave)}
.vaga.livre .vazio{width:28px;height:28px;margin:0 auto 1px;border:2px dashed #c9b9a0;border-radius:8px}
.vagas-resumo{display:flex;justify-content:space-between;font-weight:800;font-size:12px;margin:0 0 3px}
.vagas-resumo .pronto{color:var(--verde-escuro)}
.menu .itens{display:grid;gap:5px;max-height:min(340px,calc(100vh - 150px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:1px 3px 1px 1px}
.item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:2px solid var(--borda);background:var(--papel-2);cursor:pointer;font-weight:800;font-size:14px;line-height:1.15}
.item img{width:30px;height:30px;flex:none}
.item span{flex:1;min-width:0}
.item small{display:block;font-weight:700;font-size:12px;color:var(--tinta-suave)}
.item b{flex:none;font-size:13px;white-space:nowrap}
.item:hover{background:var(--amarelo)}
.item:focus-visible{outline:3px solid var(--rosa);outline-offset:1px}
.item.off{opacity:.45;cursor:default;pointer-events:none}
.item.leve{background:transparent;border-style:dashed}
.item.encomenda{background:#dcecf6}
.item i.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#e8d6b0;font-style:normal;font-size:11px;font-weight:800;vertical-align:1px;white-space:nowrap}
.item i.estrela{display:inline-block;margin-left:5px;font-style:normal;font-size:16px;line-height:1;color:#f5b800;-webkit-text-stroke:1px var(--borda);vertical-align:-1px}
.item.perigo{margin-top:8px;background:transparent;border-style:dashed;border-color:#b5584a;color:#8a3a2e}
.item.perigo.confirmar{background:#f8d2c9;border-style:solid}

/* falas e números flutuantes */
.fala{position:absolute;left:0;top:0;z-index:5;max-width:220px;padding:7px 11px;background:#fff;border:3px solid var(--borda);border-radius:14px;font-weight:700;font-size:13px;line-height:1.25;pointer-events:none;transform:translate(-50%,-100%);box-shadow:0 3px 0 var(--sombra);text-align:center}
.fala::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--borda);border-bottom:0}
.fala.beto{background:#e6f1fb}
.fala.jaca{background:#e8f6dc}
.fala.pelucio{background:#fde4e1}
.fala.milton{background:#ffe3d2}
.fala.luma{background:#ffeedd}
.fala.minhoquinha{background:#fde0e8}
.dialogo .quem.minhoquinha{color:#d4607f}
.dialogo .quem.beto{color:#2f6fb3}
.dialogo .quem.jaca{color:#3e8f2c}
.dialogo .quem.milton{color:#d9531e}
.dialogo .quem.lucia{color:#b8860b}
.dialogo .quem.hud{color:#b58a12}
.dialogo .quem.todos{color:#e0408a}
/* cena do Pelúcio: faixas de cinema e caixa de diálogo */
.cine{position:absolute;inset:0;z-index:25;pointer-events:none}
.cine .faixa{position:absolute;left:0;right:0;height:10vh;background:#1d1410;transition:transform .7s ease}
.cine .faixa.topo{top:0;transform:translateY(-100%)}
.cine .faixa.base{bottom:0;transform:translateY(100%)}
.cine.on .faixa{transform:none}
.dialogo{position:absolute;left:50%;bottom:calc(10vh + 16px);transform:translateX(-50%);width:min(620px,calc(100vw - 32px));display:flex;gap:12px;align-items:flex-start;padding:12px 14px 10px;pointer-events:auto;cursor:pointer;animation:sobe .25s ease-out}
.dialogo img{width:62px;height:62px;flex:none;border-radius:12px;background:var(--papel-2);border:2px solid var(--borda)}
.dialogo .quem{font-family:var(--f-titulo);font-size:21px;line-height:1;color:var(--rosa)}
.dialogo .quem.ed{color:#b58a12}
.dialogo p{margin:5px 0 0;font-weight:700;font-size:16px;line-height:1.4;min-height:2.8em}
.dialogo .seguir{display:block;text-align:right;font-size:12px;font-weight:800;color:var(--tinta-suave);margin-top:2px;visibility:hidden}
.dialogo .seguir.pode{visibility:visible;animation:pisca 1s ease-in-out infinite}
@keyframes pisca{50%{opacity:.35}}
/* o pular fica fora da caixa de diálogo, visível a cena toda (também nos trechos sem fala) */
.cine .pular{position:absolute;top:calc(10vh + 12px);right:calc(16px + env(safe-area-inset-right,0px));pointer-events:auto}
#jogo.cinema .hud-topo,#jogo.cinema .hud-base,#jogo.cinema .camera-ctl,#jogo.cinema .menu{display:none !important}
.janela-topo.rosa2{background:#f7c9c3}
.janela-topo.marrom{background:#e3c9a8}
.janela-topo.verde{background:#cdeab0}
.flutua{position:absolute;left:0;top:0;z-index:6;font-family:var(--f-titulo);font-size:17px;color:#fff;-webkit-text-stroke:5px var(--borda);paint-order:stroke fill;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:3px;animation:flutua 1.3s ease-out forwards}
.flutua img{width:24px;height:24px}
.flutua.ouro{color:#ffd84a}
.flutua.xp{color:#9be36a}
@keyframes flutua{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-56px);opacity:0}}

.avisos{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);display:grid;justify-items:center;gap:6px;pointer-events:none;padding:0 16px;z-index:15}
.aviso{padding:7px 14px;font-weight:800;font-size:14px;text-align:center;animation:sobe .25s ease-out;transition:opacity .4s,transform .4s;max-width:min(480px,100%)}
.aviso.grande{font-family:var(--f-titulo);font-weight:400;font-size:clamp(20px,5vw,28px);background:var(--amarelo)}
.aviso.ruim{background:#f8d2c9}
.aviso.sai{opacity:0;transform:translateY(-8px)}

/* janelas */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(40,28,20,.38);pointer-events:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.janela{width:min(560px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;overflow:hidden;animation:abre .16s ease-out;transform-origin:center}
.janela-topo{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;border-bottom:3px solid var(--borda);background:var(--amarelo)}
.janela-topo.azul{background:var(--azul)}
.janela-topo.rosa{background:var(--rosa-claro)}
.janela-topo img{width:46px;height:46px;flex:none}
.janela-topo h2{margin:0;font-family:var(--f-titulo);font-weight:400;font-size:clamp(21px,5vw,27px);line-height:1}
.janela-topo .sub{font-weight:700;font-size:13px;color:var(--tinta-suave);margin-top:3px}
.janela-topo .fechar{all:unset;margin-left:auto;align-self:flex-start;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:2px solid var(--borda);background:var(--papel);font-weight:800;font-size:18px;cursor:pointer;flex:none}
.janela-topo .fechar:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.janela-corpo{padding:12px 14px 16px;overflow:auto;-webkit-overflow-scrolling:touch}
.janela-corpo p{margin:0 0 10px;line-height:1.45;font-weight:500}
.abas{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.aba{all:unset;padding:6px 12px;border-radius:999px;border:2px solid var(--borda);font-weight:800;font-size:14px;cursor:pointer;background:var(--papel)}
.aba[aria-selected="true"]{background:var(--rosa-claro)}
.aba:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cartao{border:2px solid var(--borda);border-radius:12px;background:var(--papel-2);padding:8px;display:grid;gap:4px;align-content:start}
.cartao .cab{display:flex;align-items:center;gap:6px}
.cartao .cab img{width:42px;height:42px;flex:none}
.cartao h4{margin:0;font-weight:800;font-size:15px;line-height:1.1}
.cartao .info{font-size:12px;font-weight:700;color:var(--tinta-suave);line-height:1.35}
.cartao .botoes{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.cartao.bloq{opacity:.55}
.grade.cenas{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.creditos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.credito{border:2px solid var(--borda);border-radius:14px;background:var(--papel-2);padding:10px 8px 12px;text-align:center}
.credito img{width:100%;max-width:200px;aspect-ratio:1;display:block;margin:0 auto}
.credito h4{margin:6px 0 0;font-family:var(--f-titulo);font-weight:400;font-size:18px;line-height:1.1}
.cartao .pergunta{width:42px;height:42px;flex:none;display:grid;place-items:center;border:2px dashed var(--tinta-suave);border-radius:10px;font-family:var(--f-titulo);font-size:26px;color:var(--tinta-suave)}
.cartao.oferta{background:#fff1b8}
.linhas{display:grid;gap:6px}
.linha{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid var(--borda);border-radius:12px;background:var(--papel-2)}
.linha img{width:36px;height:36px;flex:none}
.linha .nome{flex:1;min-width:0;font-weight:800;font-size:14px;line-height:1.2}
.linha .nome small{display:block;font-weight:700;font-size:12px;color:var(--tinta-suave)}
.linha .qtd{font-family:var(--f-titulo);font-size:19px;min-width:34px;text-align:right}
.linha.oferta{background:#fff1b8}
.selo{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--rosa);color:#fff;font-size:11px;font-weight:800;vertical-align:1px;margin-left:4px}
.pedido{border:3px dashed var(--borda);border-radius:14px;padding:10px 12px;background:#fffdf6;margin-bottom:12px}
.pedido h4{margin:0 0 6px;font-family:var(--f-titulo);font-weight:400;font-size:18px}
.pedido ul{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pedido li{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;border:2px solid var(--borda);border-radius:999px;background:var(--papel);font-weight:800;font-size:13px}
.pedido li img{width:24px;height:24px}

.caderno h2,.caderno h3{font-family:inherit;font-weight:400;margin:0;line-height:30px}

.abas.do-caderno{margin:0;padding:10px 14px 0}
.linha-tempo{margin-top:30px}
.marco{position:relative;padding:0 0 30px 44px}
.marco::before{content:"";position:absolute;left:13px;top:4px;bottom:-4px;width:4px;background:#cfcfe4}

// ================= voxels
// Cada modelo é um conjunto de cubinhos coloridos. build() só gera as faces que ficam à mostra e escurece os cantos (oclusão de ambiente).
const FACES = [
  { n:[1,0,0],  u:[0,1,0], v:[0,0,1] },
  { n:[-1,0,0], u:[0,0,1], v:[0,1,0] },
  { n:[0,1,0],  u:[0,0,1], v:[1,0,0] },
  { n:[0,-1,0], u:[1,0,0], v:[0,0,1] },
  { n:[0,0,1],  u:[1,0,0], v:[0,1,0] },
  { n:[0,0,-1], u:[0,1,0], v:[1,0,0] },
];
const AO = [0.56, 0.71, 0.86, 1];
const AO_SUAVE = [0.88, 0.93, 0.97, 1];
const CANTOS = [[-1,-1],[1,-1],[1,1],[-1,1]];
class Vox {
  constructor(){ this.m = new Map(); }
  k(x, y, z){ return (x + 512) * 1048576 + (y + 512) * 1024 + (z + 512); }
  set(x, y, z, c){
    if (c == null){ this.m.delete(this.k(x, y, z)); return this; }
    const e = this.m.get(this.k(x, y, z));
    if (e) e.c = c; else this.m.set(this.k(x, y, z), { x, y, z, c });
    return this;
  }
  has(x, y, z){ return this.m.has(this.k(x, y, z)); }
  box(x0, y0, z0, x1, y1, z1, c){
    for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++)
      for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++)
        for (let z = Math.min(z0, z1); z <= Math.max(z0, z1); z++)
          this.set(x, y, z, typeof c === 'function' ? c(x, y, z) : c);
    return this;
  }
  ell(cx, cy, cz, rx, ry, rz, c, cond){
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
        for (let z = Math.floor(cz - rz); z <= Math.ceil(cz + rz); z++){
          const dx = (x - cx) / rx, dy = (y - cy) / ry, dz = (z - cz) / rz;
          if (dx * dx + dy * dy + dz * dz <= 1 && (!cond || cond(x, y, z))) this.set(x, y, z, typeof c === 'function' ? c(x, y, z) : c);
        }
    return this;
  }
  // pinta o cubinho mais à frente (+z) na coluna (x, y)
  frente(x, y, c){ for (let z = 60; z >= -60; z--) if (this.has(x, y, z)){ this.set(x, y, z, c); return this; } return this; }
  build(s, opt = {}){
    const jitter = opt.jitter == null ? 0.045 : opt.jitter, ao = opt.ao || AO;
    let mnx = Infinity, mny = Infinity, mnz = Infinity, mxx = -Infinity, mxz = -Infinity;
    for (const e of this.m.values()){ if (e.x < mnx) mnx = e.x; if (e.y < mny) mny = e.y; if (e.z < mnz) mnz = e.z; if (e.x > mxx) mxx = e.x; if (e.z > mxz) mxz = e.z; }
    const o = opt.origin || [(mnx + mxx + 1) / 2, mny, (mnz + mxz + 1) / 2];
    const pos = [], nor = [], col = [], idx = [];
    const c = new THREE.Color();
    for (const e of this.m.values()){
      // opt.so: monta só os voxels dessas cores (o brilho das janelas e lâmpadas), com a mesma origem do modelo inteiro
      if (opt.so && !opt.so.has(e.c)) continue;
      const { x, y, z } = e;
      c.setHex(e.c);
      const j = 1 + (hash(x, y, z) - 0.5) * 2 * jitter;
      for (const f of FACES){
        const [nx, ny, nz] = f.n;
        if (opt.semFundo && ny === -1) continue;
        if (this.has(x + nx, y + ny, z + nz)) continue;
        const base = pos.length / 3, aos = [];
        for (const [su, sv] of CANTOS){
          pos.push(
            (x + 0.5 + 0.5 * (nx + su * f.u[0] + sv * f.v[0]) - o[0]) * s,
            (y + 0.5 + 0.5 * (ny + su * f.u[1] + sv * f.v[1]) - o[1]) * s,
            (z + 0.5 + 0.5 * (nz + su * f.u[2] + sv * f.v[2]) - o[2]) * s);
          nor.push(nx, ny, nz);
          const ax = x + nx, ay = y + ny, az = z + nz;
          const s1 = this.has(ax + su * f.u[0], ay + su * f.u[1], az + su * f.u[2]);
          const s2 = this.has(ax + sv * f.v[0], ay + sv * f.v[1], az + sv * f.v[2]);
          const cc = this.has(ax + su * f.u[0] + sv * f.v[0], ay + su * f.u[1] + sv * f.v[1], az + su * f.u[2] + sv * f.v[2]);
          const a = (s1 && s2) ? 0 : 3 - (s1 + s2 + cc);
          aos.push(a);
          const b = ao[a] * j;
          col.push(Math.min(1, c.r * b), Math.min(1, c.g * b), Math.min(1, c.b * b));
        }
        if (aos[0] + aos[2] < aos[1] + aos[3]) idx.push(base + 1, base + 2, base + 3, base + 1, base + 3, base);
        else idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    g.computeBoundingSphere(); g.computeBoundingBox();
    return g;
  }
}

  const frenteZ = (x, y) => { for (let z = 60; z >= -60; z--) if (v.has(x, y, z)) return z; return null; };
  // cabeça de maçã, grande para o corpo, com as bochechas fofas abertas para os lados
  v.ell(0, 10, 4, 11.5, 10.5, 10, peloLuma);
  for (const lado of [-1, 1]) v.ell(lado * 9.5, 6, 4, 4, 4.5, 5, peloLuma);
  tufosLuma(v, 0, 8, 4, e => Math.abs(e.x) > 10 && e.y < 9, 0.4);
  // focinho curto e creme, com o nariz escuro na ponta
  v.ell(0, 6, 13, 4.8, 3.8, 3.8, CL.focinho);
  v.ell(0, 7.6, 16.6, 2, 1.4, 1, CL.nariz);
  v.set(0, 9, frenteZ(0, 9), CL.narizBrilho);
  // boquinha
  for (const [x, y] of [[0, 5], [-1, 4], [1, 4]]) v.frente(x, y, CL.boca);
  // olhos grandes e redondos, saltados, com brilho
  for (const lado of [-1, 1]){
    const ex = lado * 5, ey = 12;
    for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++){
      if (dx * dx / 3.4 + dy * dy / 4.6 > 1) continue;
      const z = frenteZ(ex + dx, ey + dy); v.set(ex + dx, ey + dy, z + 1, CL.olho);
    }
    v.set(ex + 1, ey + 1, frenteZ(ex + 1, ey + 1), 0xffffff);
  }
  // coraçãozinho rosa na testa
  for (const [x, y] of [[-2, 17], [-1, 17], [1, 17], [2, 17], [-2, 16], [-1, 16], [0, 16], [1, 16], [2, 16], [-1, 15], [0, 15], [1, 15], [0, 14]]){ const z = frenteZ(x, y); v.set(x, y, z + 1, CL.coracao); }
  // orelhonas em pé, abertas para os lados, com o dentro rosa e franja de pelo na borda de fora
  for (const lado of [-1, 1]){
    const H = 13;
    for (let k = 0; k <= H; k++){
      const t = k / H, y = 16 + k, cx = 6 + t * 6.5, w = 4.6 * (1 - t) + 0.6;
      for (let x = Math.round(cx - w); x <= Math.round(cx + w); x++){
        const dentro = t < 0.82 && x > cx - w + 1 && x < cx + w - 1;
        v.set(lado * x, y, 1, peloLuma(lado * x, y, 1)); v.set(lado * x, y, 2, peloLuma(lado * x, y, 2));
        v.set(lado * x, y, 3, dentro ? (t < 0.15 ? CL.creme : CL.orelha) : peloLuma(lado * x, y, 3));
      }
      const xf = Math.round(cx + w) + 1;
      if (t > 0.1 && t < 0.9 && hash(lado, y, 4) > 0.35) for (let z = 1; z <= 2; z++) v.set(lado * xf, y, z, t > 0.5 ? CL.claro : CL.creme);
    }
  }
  return v;
}
function vLumaRabo(){
  const v = new Vox();
  // rabo de pluma que sobe e se enrola por cima das costas, creme por baixo e na ponta
  let y = 0, z = 0;
  const N = 15;
  for (let i = 0; i <= N; i++){
    const t = i / N, a = Math.PI * (0.42 + 0.72 * t);
    y += Math.sin(a) * 1.25; z -= Math.cos(a) * 1.25;
    const r = 1.8 + 2.8 * Math.sin(Math.PI * Math.min(1, t * 1.1)), cy = y;
    v.ell(0, y, z, r * 1.1, r, r, (X, Y, Z) => t > 0.85 ? CL.claro : Y < cy - r * 0.35 ? CL.creme : peloLuma(X, Y, Z));
  }
  tufosLuma(v, 0, 6, -2, e => e.y > 4, 0.12);
  return v;
}
// a bolinha roxa, com a costura curva clarinha de bolinha de tênis
function vBolinha(cor = CL.bola, cor2 = CL.bola2){
  const v = new Vox();
  v.ell(0, 4.9, 0, 4.9, 4.9, 4.9, (x, y, z) => Math.abs((y - 4.9) - Math.sin(2 * Math.atan2(z, x)) * 2.2) < 0.8 ? cor2 : cor);
  return v;
}
// a bolinha com o centro na origem, para rolar girando em volta de si mesma; R_BOLA é o raio na escala da Luma
const malhaBolinha = () => { const vb = vBolinha(), m = malha(vb.build(1 / 57, { origin: [0.5, 5.4, 0.5], jitter: 0.015, ao: AO_SUAVE })); m.userData.cubos = vb.m.size; return m; };
const R_BOLA = 5.4 / 57 * LUMA.escala, BOCA_LUMA = [0, 3.4 / 57, 17.5 / 57];
function montarLuma(comBola){
  const s = 1 / 57, op = { origin: [0.5, 0, 0.5], jitter: 0.015, ao: AO_SUAVE }, Q = LUMA.quadril;
  const g = new THREE.Group(), corpo = new THREE.Group();
  g.add(corpo); g.scale.setScalar(LUMA.escala);
  const parte = (vox, [x, y, z], pai = corpo) => {
    const p = new THREE.Group(), m = malha(vox.build(s, op)); m.userData.cubos = vox.m.size;
    p.position.set((x - Q[0]) * s, (y - Q[1]) * s, (z - Q[2]) * s); p.add(m); pai.add(p); return p;
  };
  const tronco = parte(vLumaTronco(), Q); tronco.position.set(-Q[0] * s, -Q[1] * s, -Q[2] * s);
  const cabeca = parte(vLumaCabeca(), LUMA.pescoco), rabo = parte(vLumaRabo(), LUMA.rabo);
  const pernas = LUMA.pernas.map(([x, z], i) => parte(vLumaPerna(i < 2), [x, Q[1], z]));
  let bola = null;
  if (comBola){ bola = malhaBolinha(); bola.position.set(...BOCA_LUMA); cabeca.add(bola); }
  return { g, corpo, cabeca, rabo, pernas, bola };
}
// poses do catálogo: parada, andando (trote em diagonal), sentada com a cabeça de lado e brincando com a bolinha na boca
function animarLuma(L, modo, t){
  const { corpo, cabeca, rabo, pernas } = L, s = 1 / 57, Q = LUMA.quadril, sentada = modo === 'Sentada';
  corpo.position.set(Q[0] * s, (Q[1] - (sentada ? 7 : 0)) * s, Q[2] * s);
  corpo.rotation.set(sentada ? -0.52 : 0, 0, 0);
  for (const p of pernas) p.rotation.set(0, 0, 0);
  cabeca.rotation.set(sentada ? 0.42 : 0, 0, 0); rabo.rotation.set(0, 0, 0); L.g.position.y = 0;
  if (modo === 'Andando'){
    const f = t * 10;
    pernas.forEach((p, i) => { p.rotation.x = Math.sin(f + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.55; });
    corpo.position.y += Math.abs(Math.sin(f)) * 0.012;
    cabeca.rotation.x = Math.sin(f * 2) * 0.04;
    rabo.rotation.z = Math.sin(t * 12) * 0.3;
  } else if (sentada){
    pernas[0].rotation.x = pernas[1].rotation.x = 0.52;
    pernas[2].rotation.x = pernas[3].rotation.x = -0.78;
    cabeca.rotation.z = Math.sin(t * 0.9) * 0.22;
    rabo.rotation.z = Math.sin(t * 4) * 0.2;
  } else if (modo === 'Com a bolinha'){
    L.g.position.y = Math.max(0, Math.sin(t * 6)) * 0.03;
    rabo.rotation.z = Math.sin(t * 16) * 0.4;
    cabeca.rotation.y = Math.sin(t * 3) * 0.3;
  } else {
    rabo.rotation.z = Math.sin(t * 5) * 0.25;
    cabeca.rotation.y = Math.sin(t * 0.45) * 0.25;
    cabeca.rotation.z = Math.sin(t * 0.7) * 0.1;
  }
}

// ================= a Luma na fazenda: de vez em quando sai pela portinha da casa e brinca com a bolinha em volta do chafariz
// (sem chafariz, no caminho e na grama da frente da casa). Se o Ed estiver por perto e parado, larga a bolinha e vai dar
// uma mordidinha no rabicó dele. Não mexe no save: os tempos contam só com o jogo aberto e recomeçam ao abrir.
const LUMA_JOGO = { primeira: [60, 150], intervalo: [240, 480], fora: [70, 110], vel: 2.1, corre: 3.1, perto: 4 };
// a portinha fica embaixo da porta da casa (x 4,75 a 5,25); a Luma nasce lá dentro, escondida pela parede, e o chão da casa e o degrau ficam a 0,25
const PORTINHA = { x: 5, y: 0.875, z: 4.6875, dentro: 4.25, fora: 5.35 };
let luma = null, portinha = null;
function criarLuma(){
  const L = montarLuma(false), raiz = new THREE.Group();
  raiz.add(L.g); raiz.visible = false; scene.add(raiz);
  luma = { nome: 'luma', L, g: raiz, pos: new THREE.Vector2(PORTINHA.x, PORTINHA.dentro), ang: 0, angAlvo: 0, pontos: [], vel: LUMA_JOGO.vel,
    estado: 'dentro', acao: '', ta: 0, prox: rnd(...LUMA_JOGO.primeira), fora: 0, limite: 0, mordeu: false, mordido: false, forcarMordida: false, lugares: null,
    bola: { m: malhaBolinha(), boca: true, pos: new THREE.Vector2(), v: new THREE.Vector2(), y: 0, vy: 0 },
    topo(){ return new THREE.Vector3(this.pos.x, 0.8 + this.g.position.y, this.pos.y); } };
  bolaNaBoca();
  const vp = new Vox(); vp.box(-2, -5, 0, 1, -1, 0, (x, y) => corPortinha(x + 16, y + 7));
  portinha = { m: new THREE.Group(), ang: 0, v: 0 };
  const pm = malha(vp.build(1 / 8, { origin: [0, 0, 0.5] }));
  // tocar na portinha é tocar na casa
  pm.userData.alvo = { k: 'predio', p: PREDIOS.find(p => p.id === 'casa') }; pickaveis.push(pm);
  portinha.m.add(pm);
  portinha.m.position.set(PORTINHA.x, PORTINHA.y, PORTINHA.z); scene.add(portinha.m);
}
function bolaNaBoca(){ const b = luma.bola; b.boca = true; b.v.set(0, 0); b.m.scale.setScalar(1); b.m.rotation.set(0, 0, 0); b.m.position.set(...BOCA_LUMA); luma.L.cabeca.add(b.m); }
// a bolinha sai da boca: com força, ela é jogada para um canto da brincadeira; sem, só cai no chão
function soltarBola(forca){
  const b = luma.bola, w = new THREE.Vector3(); b.m.getWorldPosition(w);
  b.boca = false; scene.add(b.m); b.m.scale.setScalar(LUMA.escala);
  b.pos.set(w.x, w.z); b.y = Math.max(R_BOLA, w.y); b.vy = forca ? 1.4 : 0;
  let a = luma.ang;
  if (forca){ const [x, z] = pontoLuma(); a = Math.atan2(x - w.x, z - w.z) + rnd(-0.35, 0.35); }
  b.v.set(Math.sin(a) * forca, Math.cos(a) * forca);
}
// onde a Luma e a bolinha andam: grama e caminho, nunca canteiro, construção, cerca nem enfeite
const chaoLuma = (x, z) => { const t = tipo(x, z); return t === 'grama' || t === 'caminho'; };
function atualizarBola(dt){
  const b = luma.bola;
  if (b.boca) return;
  const nx = b.pos.x + b.v.x * dt, nz = b.pos.y + b.v.y * dt;
  if (chaoLuma(Math.floor(nx), Math.floor(nz))) b.pos.set(nx, nz);
  else if (chaoLuma(Math.floor(nx), Math.floor(b.pos.y))){ b.pos.x = nx; b.v.y *= -0.5; }
  else if (chaoLuma(Math.floor(b.pos.x), Math.floor(nz))){ b.pos.y = nz; b.v.x *= -0.5; }
  else b.v.multiplyScalar(-0.5);
  b.v.multiplyScalar(Math.exp(-dt * 2.2)); if (b.v.lengthSq() < 0.0004) b.v.set(0, 0);
  b.vy -= 9 * dt; b.y += b.vy * dt;
  if (b.y < R_BOLA){ b.y = R_BOLA; b.vy = b.vy < -0.6 ? -b.vy * 0.45 : 0; }
  b.m.position.set(b.pos.x, b.y, b.pos.y);
  b.m.rotation.x += b.v.y * dt / R_BOLA; b.m.rotation.z -= b.v.x * dt / R_BOLA;
}
// os ladrilhos da brincadeira: em volta do chafariz mais perto da casa, se houver espaço; senão, na frente da casa
function lugaresLuma(){
  const fontes = (S.enfeites || []).filter(e => e.tipo === 'fonte').sort((a, b) => Math.hypot(a.x - 5, a.z - 5) - Math.hypot(b.x - 5, b.z - 5));
  for (const f of fontes){
    const l = [];
    for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) if ((dx || dz) && chaoLuma(f.x + dx, f.z + dz) && rota(5, 5, f.x + dx, f.z + dz)) l.push([f.x + dx, f.z + dz]);
    if (l.length >= 4) return { tiles: l, fonte: f };
  }
  const l = [];
  for (let x = 2; x <= 9; x++) for (const z of [5, 6]) if (chaoLuma(x, z)) l.push([x, z]);
  return { tiles: l, fonte: null };
}
function pontoLuma(){ const [x, z] = sorteia(luma.lugares.tiles); return [x + rnd(0.25, 0.75), z + rnd(0.25, 0.75)]; }
// anda até (x, z) pela rota dos ladrilhos, com o último trecho direto
function lumaIr(x, z, vel){
  const L = luma, sx = Math.floor(L.pos.x), sz = Math.floor(L.pos.y), gx = Math.floor(x), gz = Math.floor(z);
  const pts = sx === gx && sz === gz ? [] : rota(sx, sz, gx, gz);
  if (!pts) return false;
  pts.pop(); pts.push([x, z]);
  L.pontos = pts; L.vel = vel;
  return true;
}
// vai até a bolinha e para com a boca nela
function lumaAteBola(){
  const L = luma, b = L.bola, dx = b.pos.x - L.pos.x, dz = b.pos.y - L.pos.y, d = Math.hypot(dx, dz);
  if (d < 0.36) return true;
  return lumaIr(b.pos.x - dx / d * 0.3, b.pos.y - dz / d * 0.3, LUMA_JOGO.corre);
}
const edPertoDaLuma = () => ed.g.visible && ed.estado !== 'andando' && !ed.sentado && Math.hypot(ed.pos.x - luma.pos.x, ed.pos.y - luma.pos.y) < LUMA_JOGO.perto;
// atrás do Ed, de frente para o rabicó: a boca dela alcança uns 0,35 à frente do corpo, e o rabicó fica uns 0,28 atrás do Ed
function atrasDoEd(){ const x = ed.pos.x - Math.sin(ed.ang) * 0.62, z = ed.pos.y - Math.cos(ed.ang) * 0.62; return andavel(Math.floor(x), Math.floor(z)) ? [x, z] : null; }
function lumaSair(){
  const L = luma, lug = lugaresLuma();
  if (!lug.tiles.length){ L.prox = rnd(...LUMA_JOGO.intervalo); return; }
  Object.assign(L, { lugares: lug, estado: 'fora', acao: 'saindo', ta: 0, fora: 0, limite: rnd(...LUMA_JOGO.fora), mordeu: false, ang: 0, angAlvo: 0, pontos: [[PORTINHA.x, PORTINHA.fora]], vel: 1.3 });
  L.pos.set(PORTINHA.x, PORTINHA.dentro);
  // com a bola de borracha da oficina, às vezes ela sai com a bolinha nova, laranja
  { const b = L.bola; if (!b.roxa) b.roxa = b.m.geometry; if (S.bolaLuma && !b.laranja) b.laranja = vBolinha(0xf27a1a, 0xe8d6a8).build(1 / 57, { origin: [0.5, 5.4, 0.5], jitter: 0.015, ao: AO_SUAVE }); b.m.geometry = S.bolaLuma && Math.random() < 0.5 ? b.laranja : b.roxa; }
  bolaNaBoca(); L.g.visible = true; Musica.vinheta('luma');
}
// as cenas usam a frente da casa: a Luma some na hora e volta mais tarde
function lumaRecolher(){
  const L = luma;
  Object.assign(L, { estado: 'dentro', acao: '', pontos: [], prox: rnd(60, 180) });
  L.g.visible = false; if (!L.bola.boca) bolaNaBoca();
}
function lumaVoltar(){
  const L = luma;
  if (!L.bola.boca){ L.acao = 'buscarVolta'; L.ta = 0; if (!lumaAteBola()) lumaRecolher(); return; }
  if (lumaIr(PORTINHA.x, PORTINHA.fora, LUMA_JOGO.vel)) L.acao = 'voltar'; else lumaRecolher();
}
function lumaLevar(){ const [x, z] = pontoLuma(); if (lumaIr(x, z, LUMA_JOGO.vel)){ luma.acao = 'levar'; luma.ta = 0; } else lumaVoltar(); }
// depois de pegar a bolinha: hora de voltar, mordidinha no Ed, festinha ou mais uma jogada
function lumaDecidir(){
  const L = luma;
  if (L.fora > L.limite){ lumaVoltar(); return; }
  if (!L.mordeu && edPertoDaLuma() && (L.forcarMordida || Math.random() < 0.6)){
    const b = atrasDoEd();
    if (b && lumaIr(b[0], b[1], LUMA_JOGO.corre)){ L.forcarMordida = false; soltarBola(0); L.acao = 'morder'; L.ta = 0; return; }
  }
  if (Math.random() < 0.35){ L.acao = 'festa'; L.ta = 0; return; }
  lumaLevar();
}
function mordidinha(){
  ed.pulo = 0.45; Som.oinc(); Som.au();
  if (ed.estado === 'parado' && !tarefaAtual) ed.olhar(luma.pos.x, luma.pos.y);
  falar(ed, variar(FALAS_LUMA_MORDE), 2);
  const x = ed.pos.x - Math.sin(ed.ang) * 0.3, z = ed.pos.y - Math.cos(ed.ang) * 0.3;
  for (let i = 0; i < 6; i++) particula(x, 0.3, z, 0xff7ac8, 0.7);
}
function atualizarPortinha(dt){
  // a portinha abre para o lado em que a Luma está indo e volta balançando
  let alvo = 0;
  if (luma && luma.g.visible && Math.abs(luma.pos.x - PORTINHA.x) < 0.3){
    const saindo = Math.cos(luma.ang) > 0, lo = luma.pos.y - (saindo ? 0.22 : 0.35), hi = luma.pos.y + (saindo ? 0.35 : 0.22);
    if (lo < PORTINHA.z && hi > PORTINHA.z) alvo = saindo ? -1.25 : 1.25;
  }
  portinha.v += ((alvo - portinha.ang) * 90 - portinha.v * 8) * dt;
  portinha.ang += portinha.v * dt;
  portinha.m.rotation.x = portinha.ang;
}
function atualizarLuma(dt, t){
  if (!luma) return;
  const L = luma;
  atualizarPortinha(dt);
  if (L.estado === 'dentro'){
    if (!cine && S.viuCineInicio){ L.prox -= dt; if (L.prox <= 0) lumaSair(); }
    if (L.estado === 'dentro') return;
  }
  if (cine){ lumaRecolher(); return; }
  L.fora += dt; L.ta += dt;
  // anda
  if (L.pontos.length){
    const p = L.pontos[0], dx = p[0] - L.pos.x, dz = p[1] - L.pos.y, d = Math.hypot(dx, dz), passo = L.vel * dt;
    if (d <= passo){ L.pos.set(p[0], p[1]); L.pontos.shift(); }
    else { L.pos.x += dx / d * passo; L.pos.y += dz / d * passo; L.angAlvo = Math.atan2(dx, dz); }
  }
  const chegou = !L.pontos.length, b = L.bola;
  switch (L.acao){
    case 'saindo': if (chegou) lumaLevar(); break;
    case 'levar': if (chegou){ soltarBola(rnd(1.4, 2.4)); L.acao = 'olhar'; L.ta = 0; } break;
    case 'olhar':
      L.angAlvo = Math.atan2(b.pos.x - L.pos.x, b.pos.y - L.pos.y);
      if (L.ta > 0.8 && b.v.lengthSq() < 0.25){ L.acao = 'buscar'; L.ta = 0; if (!lumaAteBola()){ bolaNaBoca(); lumaDecidir(); } }
      break;
    case 'buscar': case 'buscarVolta': {
      const d = Math.hypot(b.pos.x - L.pos.x, b.pos.y - L.pos.y);
      if (d < 0.42 && b.v.lengthSq() < 0.09){ L.pontos = []; L.angAlvo = Math.atan2(b.pos.x - L.pos.x, b.pos.y - L.pos.y); L.acao = L.acao === 'buscar' ? 'pegar' : 'pegarVolta'; L.ta = 0; }
      // a bolinha ainda rola: corrige o rumo de tempos em tempos
      else if (chegou || L.ta > 0.5){ L.ta = 0; if (!lumaAteBola()){ bolaNaBoca(); if (L.acao === 'buscarVolta') lumaVoltar(); else lumaDecidir(); } }
      break;
    }
    case 'pegar': case 'pegarVolta': if (L.ta > 0.35){ bolaNaBoca(); if (L.acao === 'pegarVolta') lumaVoltar(); else lumaDecidir(); } break;
    case 'festa': if (L.ta > 1.4) lumaLevar(); break;
    case 'morder':
      // o Ed saiu andando: desiste e volta para a bolinha
      if (ed.estado === 'andando' || !ed.g.visible){ L.acao = 'buscar'; L.ta = 0; if (!lumaAteBola()) lumaVoltar(); break; }
      if (chegou){ L.acao = 'mordendo'; L.ta = 0; L.mordido = false; }
      break;
    case 'mordendo':
      L.angAlvo = Math.atan2(ed.pos.x - L.pos.x, ed.pos.y - L.pos.y);
      if (!L.mordido && L.ta > 0.45){ L.mordido = L.mordeu = true; mordidinha(); }
      if (L.ta > 1.3){ falar(L, 'Au! Au!', 1.3); L.acao = 'buscar'; L.ta = 0; if (!lumaAteBola()) lumaVoltar(); }
      break;
    case 'voltar': if (chegou){ L.acao = 'entrando'; L.pontos = [[PORTINHA.x, PORTINHA.dentro]]; L.vel = 1.3; } break;
    case 'entrando': if (chegou){ L.g.visible = false; L.estado = 'dentro'; L.acao = ''; L.prox = rnd(...LUMA_JOGO.intervalo); } break;
  }
  atualizarBola(dt);
  // pose: trota quando anda, festinha com a bolinha, cabeça baixa para pegar e mordiscar
  L.ang = anguloPerto(L.ang, L.angAlvo, Math.min(1, dt * 10));
  const a = L.acao, anda = L.pontos.length > 0;
  animarLuma(L.L, anda ? 'Andando' : a === 'festa' ? 'Com a bolinha' : 'Parada', t * (anda && L.vel > 2.5 ? 1.4 : 1));
  const C = L.L.cabeca, R = L.L.rabo;
  if (a === 'olhar'){ C.rotation.set(0.1, 0, 0.18); R.rotation.z = Math.sin(t * 16) * 0.4; }
  else if (a === 'pegar' || a === 'pegarVolta') C.rotation.set(0.55, 0, 0);
  else if (a === 'mordendo'){ C.rotation.set(0.5 + Math.sin(t * 28) * 0.12, 0, 0); R.rotation.z = Math.sin(t * 18) * 0.45; }
  // degrau da porta: o chão da casa e o degrau ficam a 0,25; na frente dele ela desce para a grama
  const naPorta = Math.abs(L.pos.x - PORTINHA.x) < 0.6, z = L.pos.y;
  L.g.position.set(L.pos.x, naPorta && z < 5 ? 0.25 : naPorta && z < 5.2 ? 0.25 * (5.2 - z) / 0.2 : 0, z);

// ================= disco voador: por enquanto só no catálogo de modelos (um dia ele passa pela fazenda)
// casco prateado que gira, borda com luzes que acendem em sequência, janelinhas, domo de vidro com um ETzinho dentro
const CDV = { casco: 0xd6dde4, cascoE: 0xb4bfca, borda: 0x7c8fa3, topo: 0xeef2f5, janela: 0x8fe0ff, base: 0xfff3a0, vidro: 0x9fe3ff, et: 0x7ed957, etE: 0x5cb83c, olho: 0x1a1414, antena: 0xff7ac8, luzes: [0xffd84d, 0xff7ac8, 0x6fe3ff] };
const DISCO = { luzes: 12, borda: 24.5, domo: 12 };
function vDiscoCasco(){
  const v = new Vox();
  const disco = (y, r, c) => { for (let x = -Math.ceil(r); x <= Math.ceil(r); x++) for (let z = -Math.ceil(r); z <= Math.ceil(r); z++) if (x * x + z * z <= r * r) v.set(x, y, z, typeof c === 'function' ? c(x, y, z) : c); };
  // embaixo, um prato raso que abre até a borda, com anéis um pouco mais escuros
  v.ell(0, 6, 0, 23.5, 7, 23.5, (x, y, z) => Math.round(Math.hypot(x, z)) % 4 === 0 ? CDV.cascoE : CDV.casco, (x, y) => y >= 0 && y <= 5);
  // a base no meio, que acende
  disco(0, 6, CDV.base);
  // a borda larga das luzes
  for (let y = 6; y <= 7; y++) disco(y, DISCO.borda, CDV.borda);
  // em cima, o casco convexo até o aro do domo
  v.ell(0, 7, 0, 23, 6, 23, CDV.topo, (x, y) => y >= 8 && y < DISCO.domo);
  for (let x = -13; x <= 13; x++) for (let z = -13; z <= 13; z++){ const d = Math.hypot(x, z); if (d >= 10.5 && d <= 12.8) v.set(x, DISCO.domo, z, CDV.borda); }
  // janelinhas redondas em volta do casco de cima
  for (let k = 0; k < 8; k++){
    const a = (k + 0.5) * Math.PI / 4, ex = Math.cos(a), ez = Math.sin(a);
    for (const y of [9, 10]) for (const dl of [-0.5, 0.5]) for (let r = 24; r > 5; r -= 0.5){
      const px = Math.round(ex * r - ez * dl), pz = Math.round(ez * r + ex * dl);
      if (v.has(px, y, pz)){ v.set(px, y, pz, CDV.janela); break; }
    }
  }
  return v;
}
function vDiscoDomo(){ const v = new Vox(); v.ell(0, DISCO.domo, 0, 10.5, 10, 10.5, CDV.vidro, (x, y) => y > DISCO.domo); return v; }
// o ETzinho: cabeção verde, olhões pretos com brilho, anteninhas com bolinha rosa e um sorriso
function vDiscoEt(){
  const v = new Vox();
  v.ell(0, 3, 0, 2.6, 3, 2.2, CDV.et);
  for (const lado of [-1, 1]) v.ell(lado * 3.2, 3.5, 0.8, 1, 2.4, 1, CDV.etE);
  v.ell(0, 9, 0, 4.4, 3.8, 3.8, CDV.et);
  const frenteZ = (x, y) => { for (let z = 20; z >= -20; z--) if (v.has(x, y, z)) return z; return null; };
  for (const lado of [-1, 1]){
    for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1], [0, -1], [lado, 1]]){ const x = lado * 2 + dx * lado, y = 9 + dy, z = frenteZ(x, y); v.set(x, y, z + 1, CDV.olho); }
    v.set(lado * 2, 10, frenteZ(lado * 2, 10), 0xffffff);
    v.box(lado * 2, 12, 0, lado * 2, 15, 0, CDV.etE);
    v.ell(lado * 2.5, 16, 0, 1.2, 1.2, 1.2, CDV.antena);
  }
  for (const x of [-1, 0, 1]) v.frente(x, x ? 7 : 6, 0x2e5a2a);
  return v;
}
// monta o disco: o casco e as luzes giram (giro); o domo e o ET ficam parados, olhando para a frente
function montarDisco(comRaio){
  const s = 1 / 16, op = { origin: [0.5, 0, 0.5], jitter: 0.02 }, g = new THREE.Group(), giro = new THREE.Group();
  const peca = (vox, mat) => { const m = mat ? new THREE.Mesh(vox.build(s, op), mat) : malha(vox.build(s, op)); m.userData.cubos = vox.m.size; return m; };
  g.add(giro); giro.add(peca(vDiscoCasco()));
  const vidro = new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: 0.42, depthWrite: false });
  // o ET é pequenininho: cabe sentado dentro do domo
  const et = peca(vDiscoEt()); et.scale.setScalar(0.5); et.position.set(0, (DISCO.domo + 0.5) * s, 0); g.add(et);
  const domo = peca(vDiscoDomo(), vidro); domo.castShadow = false; g.add(domo);
  // as luzes da borda: acesas são de material sem sombra, que brilha; apagadas, mais escuras
  const luzes = [], acesa = CDV.luzes.map(c => new THREE.MeshBasicMaterial({ color: c })), apagada = CDV.luzes.map(c => new THREE.MeshLambertMaterial({ color: new THREE.Color(c).multiplyScalar(0.75) }));
  const geoLuz = new THREE.BoxGeometry(2.8 * s, 1.8 * s, 2.8 * s);
  for (let i = 0; i < DISCO.luzes; i++){
    const a = i / DISCO.luzes * Math.PI * 2, m = new THREE.Mesh(geoLuz, acesa[i % 3]);
    m.position.set(Math.cos(a) * (DISCO.borda + 0.6) * s, 7 * s, Math.sin(a) * (DISCO.borda + 0.6) * s); m.rotation.y = -a;
    m.userData = { cor: i % 3, cubos: 1 }; giro.add(m); luzes.push(m);
  }
  let raio = null;
  if (comRaio){
    raio = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 1.7, 4.2, 28, 1, true), new THREE.MeshBasicMaterial({ color: 0xfff6a0, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide }));
    raio.position.y = -2.1; g.add(raio);
  }
  return { g, giro, et, luzes, acesa, apagada, raio };
}
function animarDisco(D, t){
  D.giro.rotation.y = t * 1.3;
  // as luzes acendem em sequência, uma cor por vez
  const vez = Math.floor(t * 6) % 3;
  for (const m of D.luzes) m.material = m.userData.cor === vez ? D.acesa[m.userData.cor] : D.apagada[m.userData.cor];
  D.g.position.y = Math.sin(t * 1.6) * 0.08;
  D.g.rotation.z = Math.sin(t * 1.1) * 0.05; D.g.rotation.x = Math.sin(t * 0.9) * 0.04;
  D.et.rotation.y = Math.sin(t * 0.8) * 0.5;
  if (D.raio) D.raio.material.opacity = 0.22 + Math.sin(t * 5) * 0.07;
}
// ================= o disco voador na fazenda: de vez em quando aparece bem pequeno no céu, passeia pela tela parando
// em alguns pontos (um deles em cima do Ed, que leva um susto) e vai embora acelerando pelo outro lado.
// Não mexe no save: os tempos contam só com o jogo aberto e recomeçam ao abrir.
const DISCO_JOGO = { primeira: [240, 480], intervalo: [600, 1200], escala: 0.6, altura: 3, vel: 0.24, abducao: 0.35 };
let discoJogo = null;
function criarDiscoJogo(){
  const D = montarDisco(false), raiz = new THREE.Group();
  raiz.add(D.g); raiz.scale.setScalar(DISCO_JOGO.escala); raiz.visible = false;
  // lá no alto não faz sombra no chão
  raiz.traverse(o => { if (o.isMesh) o.castShadow = false; });
  scene.add(raiz);
  discoJogo = { D, g: raiz, prox: rnd(...DISCO_JOGO.primeira), t: -1, trechos: [], i: 0, tt: 0, reagiu: false };
}
// um ponto no céu a partir da tela: u vai de -1 (borda esquerda) a 1 (direita); v de 0 (topo) a 1 (pé da tela)
function pontoCeuDisco(u, v){
  const a = cam.az, direita = new THREE.Vector3(Math.cos(a), 0, -Math.sin(a)), longe = new THREE.Vector3(-Math.sin(a), 0, -Math.cos(a));
  const h = DISCO_JOGO.altura, fundo = ((0.5 - v) * cam.vista - h * Math.cos(cam.el)) / Math.sin(cam.el);
  const p = cam.alvo.clone().addScaledVector(longe, fundo).addScaledVector(direita, u * cam.vista * innerWidth / innerHeight / 2);
  p.y = h; return p;
}
// o passeio: entra por um lado, para em quatro pontos (o segundo em cima do Ed, se ele estiver na tela) e sai pelo outro
function passarDisco(){
  const P = discoJogo, lado = Math.random() < 0.5 ? 1 : -1;
  let eu = rnd(-0.2, 0.2), ev = rnd(0.2, 0.32);
  if (ed.g.visible){ const s = tela(ed.topo()), u = s.x / innerWidth * 2 - 1, v = s.y / innerHeight; if (Math.abs(u) < 0.85 && v > 0.15 && v < 0.9){ eu = u; ev = Math.max(0.08, v - 0.2); } }
  const pts = [pontoCeuDisco(-1.25 * lado, rnd(0.12, 0.22)), pontoCeuDisco(-rnd(0.35, 0.6) * lado, rnd(0.12, 0.3)), pontoCeuDisco(eu, ev),
    pontoCeuDisco(rnd(0.4, 0.65) * lado, rnd(0.25, 0.4)), pontoCeuDisco(rnd(-0.1, 0.25) * lado, rnd(0.1, 0.2)), pontoCeuDisco(1.3 * lado, rnd(0.02, 0.1))];
  const vel = DISCO_JOGO.vel * cam.vista * innerWidth / innerHeight;
  P.trechos = [];
  for (let k = 0; k < pts.length - 1; k++){
    const ultimo = k === pts.length - 2, dur = Math.max(0.9, pts[k].distanceTo(pts[k + 1]) / (ultimo ? vel * 1.8 : vel));
    P.trechos.push({ de: pts[k], ate: pts[k + 1], dur, para: ultimo ? 0 : k === 1 ? rnd(1.4, 1.8) : rnd(0.5, 0.9), susto: k === 1, sai: ultimo });
  }
  // já começa no ponto de entrada, fora da tela (sem isso aparece um quadro no lugar da passagem anterior)
  P.g.position.copy(pts[0]);
  P.i = 0; P.tt = 0; P.t = 0; P.reagiu = false; P.g.visible = true; Som.disco();
  // de vez em quando, no meio do passeio, ele desce no curral e leva uma vaca (a cena da abdução)
  P.querAbduzir = !!vacaParaAbduzir() && (P.forcarAbducao || Math.random() < DISCO_JOGO.abducao);
  P.forcarAbducao = false;
}
function sustoDoEd(){
  if (!ed.g.visible) return;
  ed.pulo = 0.45; Som.oinc();
  if (ed.estado === 'parado' && !tarefaAtual) ed.olhar(discoJogo.g.position.x, discoJogo.g.position.z);
  falar(ed, variar(FALAS_DISCO), 2.8);
  if (luma && luma.estado === 'fora') falar(luma, 'Au! Au! Au!', 1.6);
}
function atualizarDisco(dt, t){
  const P = discoJogo;
  if (!P) return;
  // na cena da abdução quem mexe no disco é a cena
  if (cine && cine.cena.abducao){ animarDisco(P.D, t); return; }
  if (P.t < 0){
    // só começa sem cena, janela ou menu na frente, para dar para ver
    if (!cine && S.viuCineInicio && !algumaJanela() && !menuAberto){ P.prox -= dt; if (P.prox <= 0) passarDisco(); }
    return;
  }
  P.t += dt; P.tt += dt;
  let T = P.trechos[P.i];
  if (T && P.tt > T.dur + T.para){ P.tt -= T.dur + T.para; P.i++; T = P.trechos[P.i]; }
  if (!T || cine){ P.g.visible = false; P.t = -1; P.prox = rnd(...DISCO_JOGO.intervalo); return; }
  if (P.tt < T.dur){
    // vai de um ponto ao outro suavemente; no último trecho, acelera para ir embora
    const k = P.tt / T.dur, e = T.sai ? k * k : k * k * (3 - 2 * k);
    P.g.position.lerpVectors(T.de, T.ate, e);
    P.g.position.y += Math.sin(k * Math.PI) * (T.sai ? 0.6 : 0.25);
  } else {
    // parado no ar, dando voltinhas
    const q = P.tt - T.dur;
    P.g.position.copy(T.ate);
    P.g.position.x += Math.sin(q * 3) * 0.12; P.g.position.z += Math.cos(q * 3) * 0.12; P.g.position.y += Math.sin(q * 4) * 0.06;
    if (T.susto && !P.reagiu){ P.reagiu = true; sustoDoEd(); }
  }
  animarDisco(P.D, t);
}
// ================= abdução: às vezes, no meio do passeio, o disco desce em cima do curral e leva uma vaca num raio de luz,
// com uma musiquinha de suspense em estilo midi. A vaca sai do save (o Ed tem que comprar outra). Na reprise da janela
// Cenas, uma vaca de mentira faz o papel e nada muda no save.
// alto e não muito grande: com a câmera de cima, um disco largo e baixo esconderia a vaca subindo
const ABDUCAO = { altura: 3, escala: 0.7 };
let abducao = null;
// uma vaca que pode ir: no curral, sem tarefa marcada para ela
function vacaParaAbduzir(){
  const vs = ANI.filter(a => a.d.tipo === 'vaca' && !a.res && !fila.some(t => t.alvo && t.alvo.k === 'animal' && t.alvo.a === a));
  return vs.length ? sorteia(vs) : null;
}
// a musiquinha da abdução: melodia de suspense em lá menor, com eco e um zumbido grave por baixo (cerca de 6 s)
function musicaAbducao(){
  const ctx = Som.ctx;
  if (!ctx || !S || !S.som) return null;
  const mestre = ctx.createGain(); mestre.gain.value = 1; mestre.connect(ctx.destination);
  const t0 = ctx.currentTime + 0.05, hz = n => 440 * Math.pow(2, (n - 69) / 12);
  const nota = (n, ini, dur, tipo, vol, f2) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), a = t0 + ini;
    o.type = tipo; o.frequency.setValueAtTime(hz(n), a); if (f2) o.frequency.linearRampToValueAtTime(hz(f2), a + dur);
    g.gain.setValueAtTime(0.0001, a); g.gain.exponentialRampToValueAtTime(vol, a + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, a + dur);
    o.connect(g).connect(mestre); o.start(a); o.stop(a + dur + 0.05);
  };
  const PASSO = 0.38, MEL = [64, 69, 72, 71, 64, 69, 74, 72, 65, 69, 76, 74, 72, 71, 68, 69];
  MEL.forEach((n, i) => {
    const dur = i === MEL.length - 1 ? 1.4 : PASSO * 0.9;
    nota(n, i * PASSO, dur, 'triangle', 0.05);
    nota(n + 12, i * PASSO + 0.19, dur * 0.8, 'square', 0.008);
  });
  // o baixo de cada compasso e o zumbido que oscila
  [[45, 0], [50, 4], [41, 8], [40, 12]].forEach(([n, i]) => nota(n, i * PASSO, PASSO * 4, 'square', 0.02));
  nota(33, 0, MEL.length * PASSO + 1.2, 'sine', 0.05); nota(33.1, 0, MEL.length * PASSO + 1.2, 'sine', 0.04);
  return { parar(){ const t = ctx.currentTime; mestre.gain.cancelScheduledValues(t); mestre.gain.setValueAtTime(mestre.gain.value, t); mestre.gain.linearRampToValueAtTime(0, t + 0.3); setTimeout(() => mestre.disconnect(), 600); } };
}
// o raio: um cone de luz aberto do disco até o chão
function raioAbducao(){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.7, 1, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0xfff6a0, transparent: true, opacity: 0.32, depthWrite: false, side: THREE.DoubleSide }));
  m.visible = false; scene.add(m); return m;
}
function limparAbducao(){
  const A = abducao;
  if (!A) return;
  if (A.musica) A.musica.parar();
  scene.remove(A.raio);
  if (A.duble) scene.remove(A.vacaG);
  if (A.escondida) A.escondida.g.visible = true;
  const P = discoJogo;
  P.g.visible = false; P.t = -1; P.g.scale.setScalar(DISCO_JOGO.escala); P.querAbduzir = false;
  abducao = null;
}
// a vaca vai mesmo: sai do save e do curral
function levarVaca(a){
  const i = ANI.indexOf(a); if (i >= 0) ANI.splice(i, 1);
  const j = S.animais.indexOf(a.d); if (j >= 0) S.animais.splice(j, 1);

}
// ================= bichos da mata (por enquanto só no catálogo de modelos): bugio, jaguatirica, tucano, papagaio e cobra-coral
// pinta o cubinho da frente (+z) e salta um para fora, para olhos e narizes
function olhoBicho(v, x, y, c, brilho){ x = Math.round(x); y = Math.round(y); for (let z = 40; z >= -40; z--) if (v.has(x, y, z)){ v.set(x, y, z + 1, c); if (brilho) v.set(x, y + 1, z + 1, brilho); return; } }
// o bugio-ruivo: sentado, pelo ruivo, cara preta, barbona no pescoço e o rabo comprido enrolado na ponta
function vBugio(){
  const v = new Vox(), pelo = (x, y, z) => hash(x, y >> 1, z) > 0.8 ? 0xb5582a : 0xa0471f, escuro = 0x7a3216, cara = 0x2b1b16;
  v.ell(0, 9, -1, 5, 6.5, 4.5, pelo);
  v.ell(0, 17, 1, 4.2, 4, 4, pelo);
  v.ell(0, 13.5, 3, 3.2, 2.6, 2.2, escuro);
  v.ell(0, 16, 4.4, 2.6, 2.6, 1.6, cara);
  v.ell(0, 15, 5.4, 1.8, 1.4, 1, cara);
  for (const x of [-1, 1]) v.set(x, 17, 6, 0x6b3a1c);
  for (const lado of [-1, 1]){
    v.ell(lado * 5.2, 9, 1.5, 1.6, 5.5, 1.7, pelo);
    v.ell(lado * 4.6, 3.6, 4, 1.4, 1, 1.6, cara);
    v.ell(lado * 3, 3, 2.5, 2.2, 2.2, 3.6, pelo);
    v.ell(lado * 2.6, 1, 5.5, 1.3, 1, 1.8, cara);
  }
  // rabo: sai de trás, sobe e enrola a ponta
  for (let i = 0; i <= 40; i++){
    const t = i / 40, a = t < 0.75 ? 0 : (t - 0.75) / 0.25 * Math.PI * 1.6;
    const y = 3 + t * 14 + (t > 0.75 ? Math.sin(a) * 2.5 : 0), z = -5 - Math.sin(t * Math.PI * 0.9) * 4 + (t > 0.75 ? (1 - Math.cos(a)) * 2.5 : 0);
    v.ell(0, y, z, 1.1, 1.1, 1.1, pelo);
  }
  return v;
}
// a jaguatirica: em pé, cor de mel com rosetas pretas, barriga creme, rabo listrado
function vJaguatirica(){
  const v = new Vox(), mel = 0xd9a35a, melE = 0xb7803e, creme = 0xf3e2c2, preto = 0x1d1714;
  v.ell(0, 9, 0, 4, 3.8, 9, (x, y) => y < 7 ? creme : mel);
  for (const [x, z] of [[-2.5, 6], [2.5, 6], [-2.5, -6], [2.5, -6]]) v.ell(x, 3.5, z, 1.4, 3.8, 1.5, (xx, y) => y < 1 ? creme : mel, (xx, y) => y >= 0);
  v.ell(0, 13, 9.5, 3.6, 3.2, 3.4, mel);
  v.ell(0, 11.8, 12.6, 2, 1.6, 1.4, creme);
  v.set(0, 13, 14, 0xd98a8a);
  for (const lado of [-1, 1]){
    v.ell(lado * 2.4, 16, 8.6, 1.3, 1.6, 0.8, preto); v.set(lado * 2, 16, 9, 0xf3f0e6);
    olhoBicho(v, lado * 1.6, 13.6, 0x9aa83a);
    for (let z = 9; z <= 11; z++) v.set(lado * 3.4, 12 + (z - 9) * 0.4 | 0, z, preto);
  }
  // rosetas: um anel preto com o meio mais escuro, numa grade torta pelo corpo
  for (const e of [...v.m.values()]){
    if (e.c !== mel || e.z > 8.5 || e.y < 6) continue;
    const gy = Math.floor((e.y + 1) / 3), gz = Math.floor((e.z + 9) / 3.2), lado = e.x >= 0 ? 1 : 0;
    if (hash(gy, gz, lado) < 0.35) continue;
    const cy = gy * 3 - 1 + 1.5, cz = gz * 3.2 - 9 + 1.6, d = Math.hypot(e.y - cy, e.z - cz);
    if (d >= 0.9 && d <= 1.6) e.c = preto; else if (d < 0.9) e.c = melE;
  }
  for (let i = 0; i <= 16; i++){ const z = -9 - i * 0.55, y = 8.5 - i * 0.32; v.ell(0, y, z, 1, 1, 0.8, (i % 4 < 2 && i > 3) ? preto : mel); }
  return v;
}
// galho onde o tucano e o papagaio ficam pousados
function galhoBicho(v){ for (let x = -7; x <= 7; x++) v.ell(x, 1, 0, 0.6, 1.1, 1.1, 0x7a5232); v.set(5, 2, 1, 0x6cbf47); v.set(-6, 2, -1, 0x6cbf47); }
// o tucano-toco: preto, papo branco, olho com anel azul e o bicão laranja com a ponta preta
function vTucano(semGalho){
  const v = new Vox(), preto = 0x161616, branco = 0xf5f0e0;

const naTelaBicho = p => { const s = tela(p); return s.x > innerWidth * 0.1 && s.x < innerWidth * 0.9 && s.y > innerHeight * 0.15 && s.y < innerHeight * 0.82; };

// ================= cena da mata (nível 20): o Ed sai da fazenda, vai até a beira da floresta e os bichos saem para comemorar
// em volta dele. Os que andam saem da mata e param do lado dele pulando; o tucano e o papagaio descem das copas e voam em
// roda da cabeça do Ed. Depois da última fala, todo mundo volta para a floresta. Nada disso fica no save.
const MATA_CINE = { ed: [11.5, 19.4], az: Math.PI * 5 / 4, saida: Z_MATA + 0.9 };
let mataCine = null;
function montarMataCine(){

    { tipo: 'bugio', para: ponto(-1.25, 0.15), atraso: 0, dur: 2.2, fala: 'Uuuuooo!' },
    { tipo: 'cobra', para: ponto(0.55, 0.75), atraso: 0.7, dur: 2.4 },
    { tipo: 'tucano', voa: true, raio: 0.85, alt: 1.3, fase: 0, atraso: 0.5, dur: 2 },
    { tipo: 'papagaio', voa: true, raio: 0.95, alt: 1.5, fase: Math.PI, atraso: 0.9, dur: 2, fala: 'Currupaco!' },
  ];
  mataCine = { t: 0, bichos: lista.map((b, i) => {
    const [fn, esc] = BICHOS_MATA.modelos[b.tipo], g = new THREE.Group();
    g.add(malha(geo('bichoMata' + b.tipo, () => fn().build(esc, { origin: [0.5, 0, 0.5], jitter: 0.03 }))));
    g.visible = false; scene.add(g);
    const de = b.voa ? V(Ex + (i % 2 ? 2.5 : -1.5), 3.2, Z_MATA + 1.5) : V(b.para.x + (i - 1) * 0.3, 0, MATA_CINE.saida);

// onde cada passarinho está na roda em volta da cabeça do Ed, no tempo t
function rodaMataCine(b, t){
  const [Ex, Ez] = MATA_CINE.ed, a = t * 2.2 + b.fase;

// os bichos vindo, comemorando e indo embora; roda em todo quadro da cena
function atualizarMataCine(dt){
  const M = mataCine;
  if (!M) return;
  M.t += dt;
  const t = M.t, ease = k => k * k * (3 - 2 * k);
  for (const b of M.bichos){

    b.tt += dt;

        else if (b.tipo === 'papagaio' || b.tipo === 'tucano') Som.tom(b.tipo === 'papagaio' ? 1300 : 900, 0.09, 'square', 0.02, 850);
        else Som.pop();
      }
    } else if (b.estado === 'festa'){
      // comemorando: os do chão pulam virados para a câmera, a cobra se remexe e os passarinhos voam em roda
      if (b.voa){ const r = rodaMataCine(b, t); g.position.copy(r.p); g.rotation.y = r.ang; g.rotation.z = Math.sin(t * 18) * 0.15; }

      if (!b.volta){ b.volta = { de: g.position.clone(), para: b.voa ? new THREE.Vector3(g.position.x + 1.5, 4.2, Z_MATA + 3) : new THREE.Vector3(g.position.x, 0, MATA_CINE.saida) }; b.dur2 = b.voa ? 2 : 1.8; }
      const k = Math.min(1, b.tt / b.dur2), e = k * k;

}

const NANO = { s: 1 / 40, sNano: 1 / 56, hostel: [15.35, 0.34], porta: [15.35, 0.02], metro: [13.95, -0.32], banco: [16.5, 0.22], rua: -0.2, vel: 0.3, max: 5 };

  if (!oc || oc.id !== alvo.id || !oc.pecas[alvo.j] || oc.pecas[alvo.j].ok) return null;
  const O = OCORRENCIAS[oc.tipo], r = { titulo: O.nome, icone: O.icone, itens: [], classe: 'ruim' };
  const resta = O.prazo ? O.prazo - oc.t : 0, faltam = oc.pecas.filter(q => !q.ok).length;
  r.estado = oc.tipo === 'fogo' ? `Se o Ed não apagar em ${tempo(resta)}, o fogo queima os frutos da árvore e a mata sofre.`
    : oc.tipo === 'lixo' ? `${faltam > 1 ? `Faltam ${faltam} pedaços` : 'Falta 1 pedaço'}. Se ficar mais ${tempo(resta)}, o lixo se espalha pela mata.`
    : 'O galho fechou a trilha: até tirar, não dá para coletar nessa parte da mata.';
  r.estado += ' ' + textoSaude();
  const naFila = fila.find(t => t.alvo.k === 'ocorrencia' && t.alvo.id === alvo.id && t.alvo.j === alvo.j);
  if (naFila){ r.estado = 'Na fila do Ed.'; r.itens.push({ rotulo: 'Cancelar', icone: 'ed', fn: () => cancelar(naFila) }); return r; }
  r.itens.push({ rotulo: NOMES_ACAO[O.acao], sub: `+${O.ganho} de saúde da mata · +${O.xp} xp`, icone: O.icone, fn: () => enfileirar(O.acao, alvo) });
  if (oc.tipo === 'lixo' && faltam > 1) r.itens.push({ rotulo: `Recolher tudo (${faltam})`, icone: 'cesta', leve: true, fn: () => oc.pecas.forEach((q, j) => { if (!q.ok) enfileirar('recolherLixo', { k: 'ocorrencia', id: oc.id, j }, undefined, true); }) });
  return r;
}

// ================= trilha ecológica: um mirante na beira da mata; de dia e de tarde chegam visitantes que sobem nele,
// fazem a trilha e deixam uma contribuição na caixinha. Quanto mais saudável a mata, maior a contribuição. Os nanos do
// Nano Hostel ganham um mirante do tamanho deles. Os visitantes não ficam no save.
const MIRANTE = { nivel: 21, preco: 12000, x0: 13, z0: 19, x1: 14, z1: 20, taxa: 70, primeira: [40, 90], intervalo: [240, 480], vel: 0.85, escada: 0.45, sV: 1 / 44 };

  for (let x = MIRANTE.x0; x <= MIRANTE.x1; x++) for (let z = MIRANTE.z0; z <= MIRANTE.z1; z++) setT(x, z, 'mirante');

}
function montarPlacaMirante(){

  if (bolhaMirante){ scene.remove(bolhaMirante); BOLHAS.splice(BOLHAS.indexOf(bolhaMirante), 1); bolhaMirante = null; }
  if (S.mirante || !parcelaComprada(0)) return;

  const tx = placaDeTexto(texturaTexto([['MIRANTE', 1, '#2f7a3a'], [`nível ${MIRANTE.nivel}`, 0.7, '#7a4a2a']], 256, 112, '#f3e3c3'), 13 / 16, 6 / 16);
  tx.position.set(0, 11 / 16, 1.1 / 16); pl.add(tx);
  pl.position.set(cx, 0, cz - 0.6);

  if (nivel() >= MIRANTE.nivel){ const b = novaBolha('mirante'); b.position.set(cx, 1.25, cz - 0.6); b.userData.base = 1.25; b.userData.fase = 3; scene.add(b); BOLHAS.push(b); bolhaMirante = b; }
}
function motivoMirante(){
  if (!parcelaComprada(0)) return 'compre antes a primeira parcela da mata';
  if (nivel() < MIRANTE.nivel) return `libera no nível ${MIRANTE.nivel}`;
  if (S.dinheiro < MIRANTE.preco) return 'dinheiro insuficiente';

}
function construirMirante(){
  const m = motivoMirante();

  if (m){ aviso(`O mirante: ${m}`, 'ruim'); Som.erro(); return false; }
  gastar(MIRANTE.preco); chipPulsa('chipDinheiro');
  S.mirante = true; montarPlacaMirante(); montarMirante();
  const [cx, cz] = centroMirante();
  for (let k = 0; k < 30; k++) particula(cx + rnd(-1, 1), rnd(0.3, 2.5), cz + rnd(-1, 1), [0xa47448, 0xc9a35a][k % 2], 1.1);
  Som.moeda(); aviso('Mirante pronto! De dia e de tarde chegam visitantes para fazer a trilha.', 'grande', 4.5);
  proxTrilha = rnd(20, 40);

}
function itensMirante(){

    const m = motivoMirante();
    return { titulo: 'Mirante da mata', icone: 'mirante', estado: `Uma torre de madeira na beira da mata. Visitantes sobem para ver a floresta, fazem a trilha e deixam uma contribuição, maior quanto mais saudável estiver a mata.`,
      itens: [{ rotulo: 'Construir o mirante', sub: m || `uns ${reais(MIRANTE.taxa)} por visitante`, icone: 'moeda', preco: reais(MIRANTE.preco), off: !!m, fn: construirMirante }] };

// o caminho de um visitante: chega pela beira da estrada, sobe no mirante, olha a mata, desce, faz a trilha até o fim da
// parte comprada, volta, deixa a contribuição na caixinha e vai embora; pontos [x, y, z] com pausa e fala opcionais
function caminhoTrilha(){
  const [cx, cz] = centroMirante(), lado = cx + 1.3, pe = [lado, 0, cz], topo = [cx + 1.1, 2.3, cz];
  const fim = parcelaComprada(2) ? PARCELAS[2].z1 + 0.4 : PARCELAS[0].z1 + 0.4, col = PARCELAS[0].col + 0.5, beira = Z_ORLA + 0.35;
  return [
    { p: [-1.5, 0, beira] }, { p: [lado, 0, beira] }, { p: pe }, { p: topo, escada: true },
    { p: [cx + 0.7, 2.3, cz + 0.72], pausa: 4, fala: FALAS_VISITANTE, olhar: [cx + 0.7, cz + 3] },
    { p: topo }, { p: pe, escada: true }, { p: [lado, 0, beira] }, { p: [col, 0, beira] }, { p: [col, 0, PARCELAS[0].z0 - 0.4] },
    { p: [col, 0, fim], pausa: 2.5, fala: FALAS_VISITANTE, olhar: [col, fim + 2] },
    { p: [col, 0, PARCELAS[0].z0 - 0.4] }, { p: [col, 0, beira] }, { p: [lado + 0.3, 0, beira] },
    { p: [lado + 0.3, 0, cz + 0.6], pausa: 1.2, paga: true, olhar: [cx, cz + 0.6] },
    { p: [lado + 0.3, 0, beira] }, { p: [-1.5, 0, beira] },

}
function soltarVisitantes(n){
  if (grupoTrilha || !S.mirante) return false;
  const pts = caminhoTrilha(), membros = [];
  for (let k = 0; k < n; k++){
    const tp = Math.floor(Math.random() * 12), g = new THREE.Group();
    g.add(malha(geo('visitante' + tp, () => vVisitante(tp).build(MIRANTE.sV, { origin: [0.5, 0, 0.5], jitter: 0.02 }))));
    g.position.set(...pts[0].p); g.visible = false; scene.add(g);
    membros.push({ g, i: 1, y: 0, espera: k * 1.3, pausa: 0, fase: rnd(0, 6), nome: 'visitante', topo(){ return this.g.position.clone().add(new THREE.Vector3(0, 1.25, 0)); } });
  }
  grupoTrilha = { pts, membros, pago: 0 };
  return true;
}
function tirarVisitantes(){
  if (!grupoTrilha) return;
  for (const m of grupoTrilha.membros){ m.g.visible = false; scene.remove(m.g); }
  if (grupoTrilha.pago){ S.visitasTrilha = (S.visitasTrilha || 0) + grupoTrilha.pago; salvar(); }
  grupoTrilha = null; proxTrilha = rnd(...MIRANTE.intervalo);
}
function atualizarTrilha(dt, t){
  if (!S.mirante) return;
  if (cine){ if (grupoTrilha) tirarVisitantes(); return; }
  if (proxTrilha == null) proxTrilha = rnd(...MIRANTE.primeira);
  if (!grupoTrilha){
    proxTrilha -= dt;
    if (proxTrilha <= 0){ if (periodo().id !== 'noite') soltarVisitantes(2 + Math.floor(Math.random() * 2)); else proxTrilha = rnd(30, 60); }
    return;
  }
  const G = grupoTrilha;
  for (const m of G.membros){
    if (m.espera > 0){ m.espera -= dt; if (m.espera <= 0) m.g.visible = true; continue; }
    if (m.pausa > 0){ m.pausa -= dt; continue; }
    const P = G.pts[m.i];
    if (!P){ m.g.visible = false; continue; }
    // m.y é a altura de verdade (escada e deque); o balanço da caminhada vai só no desenho, para não confundir a direção
    const g = m.g, [x, y, z] = P.p, dx = x - g.position.x, dy = y - m.y, dz = z - g.position.z, d = Math.hypot(dx, dy, dz);
    const vel = (P.escada ? MIRANTE.escada : MIRANTE.vel) * dt;
    if (d <= vel){
      g.position.set(x, y, z); m.y = y; m.i++;
      if (P.olhar) g.rotation.y = Math.atan2(P.olhar[0] - x, P.olhar[1] - z);
      if (P.pausa) m.pausa = P.pausa;
      if (P.fala && Math.random() < 0.6){ const f = variar(P.fala); falar(m, f, Math.min(P.pausa || 3, tempoDeLeitura(f))); }
      if (P.paga){
        const valor = Math.round(MIRANTE.taxa * estadoMata().taxa);
        S.dinheiro += valor; G.pago++; chipPulsa('chipDinheiro'); Som.moeda();
        flutuar(new THREE.Vector3(x, 1.2, z), '+' + reais(valor), '', 'moeda');
        if (m === G.membros[G.membros.length - 1]){ const f = variar(FALAS_VISITANTE_TCHAU); falar(m, f, tempoDeLeitura(f)); }
        hud();
      }
    } else {
      g.position.x += dx / d * vel; m.y += dy / d * vel; g.position.z += dz / d * vel;
      // na escada (subindo ou descendo) fica de frente para ela; andando, olha para onde vai
      const naEscada = Math.abs(dy) > 0.01 && Math.hypot(dx, dz) < 0.3;
      if (naEscada) g.rotation.y = -Math.PI / 2;
      else g.rotation.y = anguloPerto(g.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 10));
      g.position.y = m.y + (naEscada || m.y > 0.05 ? 0 : Math.abs(Math.sin(t * 9 + m.fase)) * 0.03);
    }
  }
  if (G.membros.every(m => m.espera <= 0 && !G.pts[m.i])) tirarVisitantes();
}

// o mirante dos nanos, do tamanho deles, ao lado do banco do Nano Hostel
function montarMiniMirante(){

// ================= créditos: a Carolina e o Lucas em voxel, com cabeção de boneco, para a janela de créditos
// base de uma pessoa: sapato, calça jeans, camiseta com mangas, braços, pescoço, cabeça com olhos, sobrancelhas, nariz,
// bochechas, orelhas e um sorriso mostrando os dentes; o cabelo e os detalhes ficam com cada um
function vPessoaBase(c){
  const v = new Vox(), pele = c.pele;
  for (const lado of [-1, 1]){
    v.box(lado * 1, 0, -2, lado * 5, 1, 3, c.sapato);
    v.box(lado * 1, 2, -2, lado * 5, 12, 2, (x, y) => y === 12 ? 0x2a2a3a : c.calca);
  }
  v.ell(0, 18.5, 0, 6.8, 6.5, 3.6, c.camisa, (x, y) => y >= 13 && y <= 24);
  if (!c.bracos) for (const lado of [-1, 1]){ v.box(lado * 7, 19, -1, lado * 8, 24, 1, c.camisa); v.box(lado * 7, 13, -1, lado * 8, 18, 1, pele); v.box(lado * 7, 11, -1, lado * 8, 12, 1, pele); }
  v.box(-2, 25, -1, 2, 25, 1, pele);
  v.ell(0, 33, 0.5, 8, 8, 7.5, pele);
  const frenteZ = (x, y) => { for (let z = 30; z >= -30; z--) if (v.has(x, y, z)) return z; return null; };
  for (const lado of [-1, 1]) v.box(lado * 8, 31, 0, lado * 9, 33, 1, pele);
  if (c.semRosto) return { v, frenteZ };
  for (const lado of [-1, 1]){
    for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1]]){ const x = lado * 3 + (dx ? lado : 0), y = 33 + dy, z = frenteZ(x, y); v.set(x, y, z + 1, 0x1a1414); }
    { const z = frenteZ(lado * 3, 34); v.set(lado * 3, 34, z, 0xffffff); }
    for (let dx = -1; dx <= 1; dx++){ const x = lado * 3 + dx, z = frenteZ(x, 36); v.set(x, 36, z + 1, c.sobrancelha); }
    for (const x of [lado * 5, lado * 6]) v.frente(x, 30, c.bochecha);
  }
  for (const y of [31, 32]) v.set(0, y, frenteZ(0, y) + 1, c.nariz);
  // sorriso: a boca aberta com os dentes de cima
  for (let x = -3; x <= 3; x++){ v.frente(x, 27, 0x6b2a2a); v.frente(x, 28, Math.abs(x) <= 2 ? 0xffffff : 0x6b2a2a); }
  v.frente(-3, 29, 0x6b2a2a); v.frente(3, 29, 0x6b2a2a);
  return { v, frenteZ };
}
function vLucas(){
  const pele = 0xf3d6c2;

  // estampa na camiseta preta: faixa azul-clara e um quadro claro embaixo, sem letras
  for (let x = -4; x <= 4; x++){ v.frente(x, 21, 0x8ed0ea); v.frente(x, 20, 0x8ed0ea); }
  for (let x = -4; x <= 4; x++) for (let y = 15; y <= 18; y++) v.frente(x, y, (x + y) % 3 ? 0xd6d0c4 : 0x8a7a6a);
  // barba escura mesclada de grisalho: queixo, mandíbula e costeletas até o cabelo
  const barba = (x, y, z) => { const h = hash(x, y, z + 5); return h > 0.86 ? 0x9a948e : h > 0.6 ? 0x6e6862 : h > 0.25 ? 0x3a2e28 : 0x2a201c; };
  const ehBarba = e => e.y <= 29 || (Math.abs(e.x) >= 5 && e.y <= 30) || (Math.abs(e.x) >= 6 && e.y <= 33 && e.z >= 2);
  for (const e of v.m.values()) if (e.c === pele && e.y >= 25 && e.y <= 33 && Math.abs(e.x) <= 8 && ehBarba(e)) e.c = barba(e.x, e.y, e.z);
  v.ell(0, 27, 2, 7, 3.4, 6, barba, (x, y, z) => y <= 28 && y >= 25 && !v.has(x, y, z));
  // cabelo curto e rente à cabeça, grisalho, sal e pimenta: mais escuro nos lados e na nuca, claro em cima
  const cabelo = (x, y, z) => { const h = hash(x, y, z + 9), alto = y >= 39; return h > (alto ? 0.62 : 0.78) ? 0xbdb9b2 : h > (alto ? 0.2 : 0.35) ? 0x9a9690 : h > (alto ? 0.07 : 0.12) || (z > 3 && y < 41) ? 0x6e6a66 : 0x3a3632; };
  for (const e of v.m.values()) if (e.c === pele && (e.y >= 38 || (e.z < -2 && e.y >= 30) || (Math.abs(e.x) >= 7 && e.y >= 34))) e.c = cabelo(e.x, e.y, e.z);
  // só uns fios um pouco acima do resto, no alto e na franja
  for (let x = -6; x <= 6; x++) for (let z = -4; z <= 5; z++){
    let y = 46; while (y > 36 && !v.has(x, y, z)) y--;
    if (y >= 40 && hash(x, z, 31) > 0.8) v.set(x, y + 1, z, cabelo(x, y + 1, z));
  }
  // olhos apertados de sorriso, sobrancelhas grisalhas escuras e bochechas coradas
  for (const lado of [-1, 1]){
    for (const [x, y] of [[lado * 2, 33], [lado * 3, 34], [lado * 4, 33]]) v.set(x, y, frenteZ(x, y), 0x1a1414);
    for (const [x, y] of [[lado * 2, 36], [lado * 3, 36], [lado * 4, 36], [lado * 5, 35]]) v.set(x, y, frenteZ(x, y) + 1, 0x5a544e);
    for (const x of [lado * 4, lado * 5]) v.frente(x, 31, 0xf0aea0);
  }
  // nariz um pouco maior
  for (const [x, y, c] of [[0, 32, 0xe9c4ab], [0, 31, 0xe9c4ab], [-1, 31, 0xdfb69c], [1, 31, 0xdfb69c]]) v.set(x, y, frenteZ(x, y) + 1, c);
  // bigode escuro caindo nos cantos, e o sorriso com os dentes de cima
  for (let x = -4; x <= 4; x++){ const z = frenteZ(x, 30); if (z != null) v.set(x, 30, z + 1, Math.abs(x) <= 3 ? 0x2a201c : 0x3a2e28); }
  for (const x of [-4, 4]){ const z = frenteZ(x, 29); v.set(x, 29, z + 1, 0x2a201c); }
  for (let x = -3; x <= 3; x++){ v.frente(x, 29, 0x2a201c); v.frente(x, 28, Math.abs(x) <= 2 ? 0xffffff : 0x6b2a2a); v.frente(x, 27, Math.abs(x) <= 2 ? 0x6b2a2a : 0x3a2e28); }
  return v;
}

    this.bE = new THREE.Group(); this.bE.position.set(-ox * s, oy * s, oz * s); this.bE.add(malha(gb)); this.corpo.add(this.bE);
    this.bD = new THREE.Group(); this.bD.position.set(ox * s, oy * s, oz * s); this.bD.add(malha(gb)); this.corpo.add(this.bD);
    this.pE = new THREE.Group(); this.pE.position.set(-qx * s, qy * s, 0); this.pE.add(malha(gp)); this.g.add(this.pE);
    this.pD = new THREE.Group(); this.pD.position.set(qx * s, qy * s, 0); this.pD.add(malha(gp)); this.g.add(this.pD);
    this.mao = new THREE.Group(); this.mao.position.set(0, M.mao[0] * s, M.mao[1] * s); this.bD.add(this.mao);
    this.altura = M.altura; this.aceno = 0; this.escala = s;
    this.ferramentas = {};
    this.pos = new THREE.Vector2(); this.pontos = []; this.vel = 2.7; this.turbo = 1; this.ang = 0; this.angAlvo = 0; this.fase = 0; this.estado = 'parado';
    this.trab = null; this.aoChegar = null; this.pulo = 0;
    this.sentado = 0; this.quadrilY = M.quadril[1] * s; // sentado: altura do quadril num banquinho (cena do cafezinho)
    if (nome !== 'ed'){ this.g.traverse(o => { o.userData.alvo = { k: nome }; }); pickaveis.push(this.g); }
  }
  colocar(x, z){ this.pos.set(x, z); this.g.position.set(x, 0, z); }
  ir(pontos, aoChegar){ this.pontos = pontos.slice(); this.aoChegar = aoChegar; this.estado = this.pontos.length ? 'andando' : 'parado'; if (!this.pontos.length && aoChegar) aoChegar(); }
  olhar(x, z){ if (Math.hypot(x - this.pos.x, z - this.pos.y) > 0.01) this.angAlvo = Math.atan2(x - this.pos.x, z - this.pos.y); }
  ferramenta(n){
    for (const k in this.ferramentas) this.ferramentas[k].visible = false;
    if (!n) return;
    if (!this.ferramentas[n]){
      const fn = { enxada: vEnxada, regador: vRegador, cesta: vCesta, saco: vSaco, caneca: vCaneca, maca: VI.maca }[n];
      if (!fn) return; // 'comer' e afins: só o gesto, sem ferramenta
      const mm = malha(geo('ferr' + n, () => fn().build(1 / 19, { origin: [0.5, 0, 0.5] })));
      this.mao.add(mm); this.ferramentas[n] = mm;
    }
    this.ferramentas[n].visible = true;
  }
  trabalhar(dur, ferr, aoFim){ this.estado = 'trabalhando'; this.trab = { t: 0, dur, ferr, aoFim }; this.ferramenta(ferr); }
  update(dt, t){
    if (this.estado === 'andando'){
      const p = this.pontos[0];
      const dx = p[0] - this.pos.x, dz = p[1] - this.pos.y, d = Math.hypot(dx, dz);
      // com as botas de chuva, o Ed anda mais rápido na chuva
      const passo = this.vel * this.turbo * dt * (this === ed && S.galochas && chovendo() ? 1.15 : 1);
      if (d <= passo){ this.pos.set(p[0], p[1]); this.pontos.shift(); if (!this.pontos.length){ this.estado = 'parado'; const cb = this.aoChegar; this.aoChegar = null; if (cb) cb(); } }
      else { this.pos.x += dx / d * passo; this.pos.y += dz / d * passo; if (this.turbo) this.angAlvo = Math.atan2(dx, dz); }
      this.fase += dt * 11 * this.turbo;
    }
    this.ang = anguloPerto(this.ang, this.angAlvo, Math.min(1, dt * 12));
    this.g.position.set(this.pos.x, 0, this.pos.y);
    this.g.rotation.y = this.ang;
    const andando = this.estado === 'andando';
    const sw = andando ? Math.sin(this.fase) : 0;
    this.pE.rotation.x = sw * 0.7; this.pD.rotation.x = -sw * 0.7;
    this.bE.rotation.set(-sw * 0.6, 0, -0.65); this.bD.rotation.set(sw * 0.6, 0, 0.65);
    if (this.sentado){ this.g.position.y = this.sentado; this.pE.rotation.x = this.pD.rotation.x = -1.3; }
    this.corpo.position.y = andando ? Math.abs(Math.sin(this.fase)) * 0.045 : 0;
    this.corpo.rotation.set(0, 0, andando ? Math.sin(this.fase) * 0.06 : 0);
    this.corpo.scale.set(1, 1 + (andando ? 0 : Math.sin(t * 2.4) * 0.015), 1);
    if (this.aceno > 0){ this.aceno -= dt; this.bD.rotation.set(-0.3, 0, 2.5 + Math.sin(t * 11) * 0.35); }
    if (this.pulo > 0){ this.pulo -= dt; this.corpo.position.y += Math.sin((1 - this.pulo / 0.45) * Math.PI) * 0.22; }
    if (this.estado === 'trabalhando'){
      const w = this.trab; w.t += dt;
      const k = w.t * 10;
      switch (w.ferr){
        case 'enxada': this.bD.rotation.set(-1.9 + Math.max(0, Math.sin(k)) * 1.6, 0, 0.25); this.corpo.rotation.x = 0.12 + Math.max(0, Math.sin(k)) * 0.12; break;
        case 'regador': this.bD.rotation.set(-1.1, 0, 0.35); this.mao.rotation.x = 0.5 + Math.sin(t * 6) * 0.15; break;
        case 'cesta': case null: this.corpo.rotation.x = 0.28 + Math.sin(k) * 0.08; this.bD.rotation.set(-1 + Math.sin(k) * 0.5, 0, 0.3); this.bE.rotation.set(-1 - Math.sin(k) * 0.5, 0, -0.3); break;
        case 'caneca': this.bD.rotation.set(-2.5, 0, 0.3); this.mao.rotation.x = 1.8; this.corpo.rotation.x = -0.05; break;
        case 'comer': case 'maca': this.bD.rotation.set(-2.4 + Math.sin(k * 0.6) * 0.1, 0, 0.3); this.corpo.rotation.x = -0.04; break;
        case 'saco': this.bD.rotation.set(-1.2 + Math.sin(k * 0.8) * 0.5, 0, 0.3); this.bE.rotation.set(-0.9, 0, -0.4); break;
      }
      if (w.t >= w.dur){ this.estado = 'parado'; this.mao.rotation.x = 0; this.ferramenta(null); const cb = w.aoFim; this.trab = null; if (cb) cb(); }
    } else this.mao.rotation.x = 0;
  }
  topo(){ return new THREE.Vector3(this.pos.x, this.altura, this.pos.y); }
  trocarPes(chave, fn){
    const g = geo(chave, () => fn().build(this.escala, { origin: [0.5, 0, 0.5], jitter: 0.015, ao: AO_SUAVE }));
    for (const pe of [this.pE, this.pD]){ pe.clear(); pe.add(malha(g)); }
  }
}

const ANI = [];
class Bicho {
  constructor(d){
    this.d = d;
    const s = d.tipo === 'galinha' ? 1 / 19 : 1 / 22;
    this.g = new THREE.Group();
    this.m = malha(geo(d.tipo, () => (d.tipo === 'galinha' ? vGalinha() : vVaca()).build(s, { origin: [0.5, 0, 0.5] })));
    this.g.add(this.m);
