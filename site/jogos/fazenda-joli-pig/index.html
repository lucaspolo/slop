    pickaveis.push(this.g);
    scene.add(this.g);
    this.pos = new THREE.Vector2(d.x, d.z); this.alvo = null; this.espera = rnd(0.5, 3); this.ang = rnd(0, 6); this.fase = rnd(0, 6); this.res = null; this.bica = 0;
    this.bolha = null; this.pulo = 0; this.atualizarBolha();
  }
  get pasto(){ return this.d.tipo === 'galinha' ? PASTO_G : PASTO_V; }
  atualizarBolha(){
    const n = this.d.e === 'fome' ? 'racao' : this.d.e === 'pronto' ? ANIMAIS[this.d.tipo].produto : '';
    if (n){
      if (!this.bolha){ this.bolha = novaBolha(n); this.bolha.userData.fase = rnd(0, 6); scene.add(this.bolha); BOLHAS.push(this.bolha); }
      else trocarBolha(this.bolha, n);
      this.bolha.userData.base = this.d.tipo === 'galinha' ? 1.05 : 1.45;
    } else if (this.bolha){ scene.remove(this.bolha); BOLHAS.splice(BOLHAS.indexOf(this.bolha), 1); this.bolha = null; }
  }
  update(dt, t){
    const vel = this.d.tipo === 'galinha' ? 0.9 : 0.45;
    if (!this.res){
      if (this.alvo){
        const dx = this.alvo[0] - this.pos.x, dz = this.alvo[1] - this.pos.y, d = Math.hypot(dx, dz);
        if (d < 0.05){ this.alvo = null; this.espera = rnd(1.2, this.d.tipo === 'galinha' ? 4 : 7); }
        else { const p = Math.min(d, vel * dt); this.pos.x += dx / d * p; this.pos.y += dz / d * p; this.ang = anguloPerto(this.ang, Math.atan2(dx, dz), Math.min(1, dt * 6)); this.fase += dt * (this.d.tipo === 'galinha' ? 16 : 7); }
      } else {
        this.espera -= dt;
        if (this.espera <= 0){
          const [tx, tz] = sorteia(this.pasto);
          this.alvo = [tx + rnd(0.2, 0.8), tz + rnd(0.2, 0.8)];
        }
        if (this.d.tipo === 'galinha' && Math.random() < dt * 0.4) this.bica = 0.5;
      }
    }
    this.bica = Math.max(0, this.bica - dt);
    const andando = !!this.alvo && !this.res;
    let salto = 0;
    if (this.pulo > 0){ this.pulo -= dt; salto = Math.sin(Math.max(0, 1 - this.pulo / 0.4) * Math.PI) * 0.22; }
    this.g.position.set(this.pos.x, (andando ? Math.abs(Math.sin(this.fase)) * (this.d.tipo === 'galinha' ? 0.04 : 0.02) : 0) + salto, this.pos.y);
    this.g.rotation.y = this.ang;
    this.m.rotation.x = this.bica > 0 ? Math.sin(this.bica * Math.PI * 4) * 0.25 + 0.2 : 0;
    if (this.bolha) this.bolha.position.set(this.pos.x, this.bolha.position.y, this.pos.y);
    this.d.x = this.pos.x; this.d.z = this.pos.y;
  }
  remover(){ scene.remove(this.g); if (this.bolha){ scene.remove(this.bolha); BOLHAS.splice(BOLHAS.indexOf(this.bolha), 1); } }
}
function novoAnimal(tipoA, x, z){
  const d = { id: ++S.nAnimal, tipo: tipoA, e: 'fome', pronto: 0, x, z };
  S.animais.push(d);
  const a = new Bicho(d); ANI.push(a); return a;
}
let avisoSemRacao = 0;
function simularAnimais(){
  const agora = Date.now();
  let comeu = 0, falta = false;
  const racao0 = S.racao;
  for (const a of ANI){
    const A0 = ANIMAIS[a.d.tipo];
    // com coletor, cada produção vai para a caixa (que guarda uma hora); com alimentador também, o ciclo se repete
    // pelo relógio (inclusive com o jogo fechado) enquanto houver ração e lugar na caixa
    const tp = a.d.tipo, col = S.coletor[tp];
    let voltas = 0, mudou = false;
    while (voltas++ < 500){
      const venceu = a.d.e === 'produzindo' && agora >= a.d.pronto, esperando = a.d.e === 'pronto' && col && !a.res;
      if (!venceu && !esperando) break;
      if (!col || a.res || naCaixa(tp) >= capCaixa(tp)){ if (a.d.e !== 'pronto'){ a.d.e = 'pronto'; mudou = true; } break; }
      caixa()[tp] = naCaixa(tp) + 1; mudou = true;
      // quem estava esperando a caixa recomeça agora; quem produziu no relógio continua de onde parou
      const base = esperando ? agora : a.d.pronto;
      if (S.alimentador[tp] && S.racao >= A0.racao){ S.racao -= A0.racao; a.d.e = 'produzindo'; a.d.pronto = base + A0.tempo * 1000; }
      else a.d.e = 'fome';
    }
    if (mudou) a.atualizarBolha();
    if (a.d.e === 'fome' && !a.res && S.alimentador[a.d.tipo]){
      const A = ANIMAIS[a.d.tipo];
      if (S.racao >= A.racao){
        S.racao -= A.racao; a.d.e = 'produzindo'; a.d.pronto = agora + A.tempo * 1000; a.atualizarBolha(); comeu++;
        const m = ALIM_MALHA[a.d.tipo];
        if (m) for (let i = 0; i < 5; i++) particula(m.position.x - 0.4 + rnd(-0.2, 0.2), 0.3, m.position.z + rnd(-0.2, 0.2), [0xf5d142, 0xe2cfa0][i % 2], 0.8);
      } else falta = true;
    }
  }
  if (comeu || S.racao !== racao0){ hud(); chipPulsa('chipRacao'); }
  for (const tp in COL_MALHA) atualizarBolhaColetor(tp);
  if (falta && agora - avisoSemRacao > 90000){ avisoSemRacao = agora; aviso('O alimentador automático ficou sem ração', 'ruim', 3.2); }
}
// a caixa do coletor guarda CAIXA_HORAS horas de produção do bando; cheia, os bichos esperam o Ed esvaziar
const CAIXA_HORAS = 1;
const horasCaixa = () => CAIXA_HORAS === 1 ? 'uma hora' : CAIXA_HORAS + ' horas';
const caixa = () => S.caixa || (S.caixa = {});
const naCaixa = tp => caixa()[tp] || 0;
const capCaixa = tp => Math.ceil(ANI.filter(a => a.d.tipo === tp).length * 3600 * CAIXA_HORAS / ANIMAIS[tp].tempo);
const COL_MALHA = {}, COL_BOLHA = {};
function atualizarBolhaColetor(tp){
  const m = COL_MALHA[tp];

  const n = naCaixa(tp);
  let b = COL_BOLHA[tp];
  if (!n){ if (b){ scene.remove(b); BOLHAS.splice(BOLHAS.indexOf(b), 1); delete COL_BOLHA[tp]; } return; }
  const cheia = n >= capCaixa(tp);
  if (!b){ b = COL_BOLHA[tp] = novaBolha(ANIMAIS[tp].produto); b.position.set(m.position.x, 1.2, m.position.z); b.userData.base = 1.2; b.userData.fase = tp === 'galinha' ? 1 : 2.5; scene.add(b); BOLHAS.push(b); }
  trocarBolha(b, ANIMAIS[tp].produto);
  // caixa cheia: a bolha cresce e fica avermelhada

function montarColetor(tp){

  // um enfeite que estivesse no lugar volta para a loja

function comprarColetor(tp){
  const C = COLETOR[tp];
  if (S.coletor[tp]) return;
  if (nivel() < C.nivel){ aviso(`${C.nome} libera no nível ${C.nivel}`, 'ruim'); Som.erro(); return; }

  gastar(C.preco); S.coletor[tp] = true;
  // o que estava pronto esperando entra na caixa
  for (const a of ANI) if (a.d.tipo === tp && a.d.e === 'pronto' && !a.res){ a.d.e = 'produzindo'; a.d.pronto = Date.now() - 1; }
  const m = montarColetor(tp);

function naEstrada(obj, d, sentido = 1){
  const ini = X_CURVA - R_CURVA, arco = R_CURVA * Math.PI / 2;
  let x = d, z = Z_ESTRADA, a = 0;
  if (d > ini + arco){ x = X_CURVA; z = Z_ESTRADA + R_CURVA + d - ini - arco; a = -Math.PI / 2; }
  else if (d > ini){ a = -(d - ini) / R_CURVA; x = ini + R_CURVA * Math.sin(-a); z = Z_ESTRADA + R_CURVA * (1 - Math.cos(a)); }
  obj.position.x = x; obj.position.z = z; obj.rotation.y = a + (sentido < 0 ? Math.PI : 0);
}

  const tex = texturaTexto([['JOLI', 1, '#a8324a'], ['BISTRÔ', 0.62, '#7a4a2a']], 512, 210, '#f6ead0');

    pl.position.set(-13.5 / 16, 15.5 / 16, lado * (6.6 / 16));

    c.add(pl);

function atualizarCaminhao(dt){
  if (caminhaoE.estado === 'cine') return;
  const c = caminhaoE;
  if (c.estado === 'chegando'){
    c.t += dt / 4.2;
    const e = 1 - Math.pow(1 - Math.min(1, c.t), 3);
    caminhao.position.x = lerp(-5, PARADA, e);
    caminhao.position.y = Math.abs(Math.sin(c.t * 40)) * 0.015;
    if (c.t >= 1){
      c.estado = 'descendo'; caminhao.position.y = 0; Som.buzina();
      const v = visita, D = dadosVisita();
      v.g.visible = true; v.colocar(PARADA, 16.85); v.ang = v.angAlvo = Math.PI;
      v.ir([[PARADA, 16.4], [PARADA, 15.4]], () => {
        c.estado = 'aqui'; v.angAlvo = Math.PI; v.aceno = 1.6;
        S.visitas = (S.visitas || 0) + 1;
        if (v === jaca){
          presenteJaca = darPresente();
          Som.jaca();
        } else Som.oinc();
        // o balão de chegada fica na tela o tempo de ler; a janela de venda só abre depois
        const txt = variar(D.chegada), dur = tempoDeLeitura(txt);
        falar(v, txt, dur + 0.3);
        hud(); salvar();
        setTimeout(() => { if (caminhaoE.estado === 'aqui' && visita === v && !algumaJanela()) abrirBeto(); }, dur * 1000);
      });
    }
  } else if (c.estado === 'despedindo'){
    // fica acenando até dar tempo de ler a despedida, e só então volta para o caminhão
    c.t -= dt;
    if (c.t <= 0){
      c.estado = 'voltando';
      const v = visita;
      v.ir([[PARADA, 16.4], [PARADA, 16.85]], () => { v.g.visible = false; caminhaoE.estado = 'saindo'; caminhaoE.t = 0; Som.buzina(); });
    }
  } else if (c.estado === 'saindo'){
    c.t += dt / 3.5;
    const e = Math.pow(Math.min(1, c.t), 2);
    naEstrada(caminhao, lerp(PARADA, FIM_ESTRADA, e));
    caminhao.position.y = Math.abs(Math.sin(c.t * 40)) * 0.015;
    if (c.t >= 1){ c.estado = 'longe'; caminhao.visible = false; hud(); }
  }
}

function vMinhoca(){
  const v = new Vox(), P = 0xf2a3b5, P2 = 0xea8ea6, CL = 0xf9cdd6;
  const dx = y => Math.round(Math.sin(y * 0.75) * 1.4);
  for (let y = 0; y <= 6; y++){ const x = dx(y); v.box(x - 1, y, -1, x, y, 0, y === 4 || y === 5 ? CL : (y % 2 ? P2 : P)); }
  const hx = dx(6);
  v.box(hx - 1, 7, -1, hx + 1, 9, 1, (x, y, z) => y === 9 && z < 1 ? P2 : P);
  v.set(hx - 1, 8, 1, 0x1a1414); v.set(hx + 1, 8, 1, 0x1a1414);
  v.set(hx - 1, 9, 1, 0xffffff); v.set(hx + 1, 9, 1, 0xffffff);
  v.set(hx - 1, 7, 1, 0xf08aa0); v.set(hx + 1, 7, 1, 0xf08aa0);
  v.set(hx, 7, 1, 0xb5546f);
  return v;
}
// o rosto da caixa de diálogo e do caderno: cabeça grande saindo da terra
function vRostoMinhoca(){
  const v = new Vox(), P = 0xf2a3b5;
  v.box(-8, -4, -5, 8, 0, 5, (x, y, z) => hash(x, y, z) < 0.3 ? 0x5b3a25 : 0x7a4e2e);
  v.ell(0, 5, 0, 6.2, 5.6, 5, (x, y) => y >= 9 ? 0xea8ea6 : P);
  v.box(-1, 3, 4, 1, 3, 5, 0xf9cdd6);
  for (const s of [-1, 1]){
    v.box(s * 3 - 1, 5, 4, s * 3, 8, 5, 0xffffff);
    v.box(s * 3 - (s > 0 ? 1 : 0), 5, 4, s * 3 - (s > 0 ? 1 : 0), 7, 5, 0x1a1414);
    v.box(s * 4 - (s > 0 ? 1 : 0), 4, 4, s * 4 - (s > 0 ? 1 : 0), 4, 5, 0xf08aa0);
  }
  v.box(-1, 2, 4, 1, 2, 5, 0xb5546f);
  v.set(-2, 3, 4, 0xb5546f); v.set(2, 3, 4, 0xb5546f);
  return v;
}
// caixa de madeira de 2×2 ladrilhos com terra escura, restos por cima e uma plaquinha
function vComposteira(icone){
  const v = new Vox(), M1 = 0x9c6a40, M2 = 0xb07a4a, MD = 0x7a4e2e;
  v.box(0, 0, 0, 15, 0, 15, MD);
  for (let y = 1; y <= 6; y++){
    const c = y % 2 ? M1 : M2;
    v.box(0, y, 0, 15, y, 0, c); v.box(0, y, 15, 15, y, 15, c); v.box(0, y, 0, 0, y, 15, c); v.box(15, y, 0, 15, y, 15, c);
  }
  for (const [x, z] of [[0, 0], [14, 0], [0, 14], [14, 14]]){ v.box(x, 1, z, x + 1, 7, z + 1, MD); v.box(x, 8, z, x + 1, 8, z + 1, M2); }
  v.box(1, 1, 1, 14, 5, 14, (x, y, z) => { const r = hash(x, y, z); return r < 0.2 ? 0x3a2416 : r < 0.55 ? 0x4a2f1e : 0x5b3a25; });
  const sobras = [0x6cbf47, 0xe2442f, 0xf08a2c, 0xf5d142, 0x8ad560];
  for (let x = 2; x <= 13; x++) for (let z = 2; z <= 13; z++) if (hash(x, 6, z) < 0.09) v.set(x, 6, z, sobras[Math.floor(hash(z, 9, x) * sobras.length)]);
  if (icone){ v.box(2, 7, 9, 3, 9, 10, 0xf2a3b5); v.box(10, 7, 4, 11, 10, 5, 0xf2a3b5); v.set(2, 9, 11, 0x1a1414); v.set(3, 9, 11, 0x1a1414); }
  return v;
}

// ---- o que aparece no mapa
const COMP_VIS = { mesh: null, bolha: null, surgeT: null };
const MINHOCAS = [];
// lugares das Minhoquinhas dentro da caixa (desvio do centro, em ladrilhos), na ordem em que aparecem
const REPOUSO = [[-0.45, -0.35], [0.4, -0.1], [-0.05, 0.4], [0.5, 0.45], [-0.55, 0.3], [0.1, -0.55], [0.55, -0.55]];
// de onde elas saem da terra na cena
const SOLO = [[31.5, 3.2], [34.5, 3.2], [34.1, 4.6]];
const easeOutBack = x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
function montarComposteira(animar){
  if (COMP_VIS.mesh) return;
  const [cx, cz] = centroComposteira();

  const tex = COMP_VIS.tex || (COMP_VIS.tex = texturaTexto([['MINHOCAS', 1, '#7a4a2a']], 256, 84, '#f3e3c3'));
  const pl = placaDeTexto(tex, 1.1, 0.36); pl.position.set(0, 0.36, 1.012); m.add(pl);
  colocar(m, cx, 0, cz);
  m.traverse(o => { o.userData.alvo = { k: 'composteira' }; }); pickaveis.push(m);
  COMP_VIS.mesh = m;
  if (animar){ m.scale.setScalar(0.01); COMP_VIS.surgeT = 0; }

}
function novaMinhoca(i, modo){
  const g = new THREE.Group();
  g.add(malha(geo('minhoca', () => vMinhoca().build(1 / 16))));
  g.traverse(o => { o.userData.alvo = { k: 'composteira' }; }); pickaveis.push(g); scene.add(g);
  const [cx, cz] = centroComposteira(), [dx, dz] = REPOUSO[i % REPOUSO.length];
  const w = { g, modo, t: 0, fase: hash(i, 3, 7) * 6.28, pulo: 0, nasce: 1, rest: [cx + dx, Y_TERRA - 0.3, cz + dz], solo: SOLO[i % SOLO.length] };
  g.visible = false;
  MINHOCAS.push(w);
  return w;
}
// as Minhoquinhas que moram na caixa; cada melhoria acrescenta algumas
function garantirMinhocas(pop){
  if (!S.composto) return;
  while (MINHOCAS.length < cfgComposteira().minhocas){
    const w = novaMinhoca(MINHOCAS.length, 'casa');
    if (pop){ w.nasce = 0; for (let k = 0; k < 8; k++) particula(w.rest[0], Y_TERRA, w.rest[2], [0xf2a3b5, 0x7a4e2e, 0xf9cdd6][k % 3], 1); }
  }
}
function minhocasSaemDaTerra(){
  for (let i = 0; i < 3; i++){
    const w = MINHOCAS[i] || novaMinhoca(i, 'solo');
    w.modo = 'solo'; w.t = -i * 0.45;
    setTimeout(() => { if (cine) { for (let k = 0; k < 14; k++) particula(w.solo[0] + rnd(-0.25, 0.25), 0.05, w.solo[1] + rnd(-0.25, 0.25), [0x7a4e2e, 0x5b3a25, 0x9a6a43][k % 3], 1.1); Som.pop(); } }, i * 450);
  }
}
function minhocasEntram(){
  MINHOCAS.filter(w => w.modo === 'solo').forEach((w, i) => { w.modo = 'indo'; w.t = -0.2 - i * 0.3; });
  Som.pop();
}
// na reprise da cena das Minhoquinhas: a composteira e a bolha somem e as Minhoquinhas ficam escondidas até a cena terminar
function esconderComposteira(){
  const m = COMP_VIS.mesh;
  if (m){ scene.remove(m); const i = pickaveis.indexOf(m); if (i >= 0) pickaveis.splice(i, 1); COMP_VIS.mesh = null; COMP_VIS.surgeT = null; }
  // a bolha só volta quando a reprise termina (restaurar)
  COMP_VIS.semBolha = true;
  atualizarBolhaComposteira();
  for (const w of MINHOCAS){ w.modo = 'oculta'; w.pulo = 0; }
}
function atualizarMinhocas(dt, t){
  for (const w of MINHOCAS){
    w.t += dt;
    let x = w.rest[0], y = w.rest[1], z = w.rest[2], vis = true;
    if (w.modo === 'casa'){
      y += Math.sin(t * 1.1 + w.fase) * 0.07;
      // de vez em quando mergulha na terra e volta
      y -= Math.max(0, Math.sin(t * 0.33 + w.fase * 2) - 0.8) / 0.2 * 0.3;
      w.nasce = Math.min(1, w.nasce + dt * 3);
    } else if (w.modo === 'oculta'){
      vis = false;
    } else if (w.modo === 'solo'){
      vis = w.t >= 0;
      const p = clamp(w.t / 0.9, 0, 1), e = 1 - Math.pow(1 - p, 3);
      x = w.solo[0]; z = w.solo[1]; y = lerp(-0.66, 0, e) + Math.sin(t * 1.3 + w.fase) * 0.03 * p;
    } else {
      const p = clamp(w.t / 1.1, 0, 1);
      x = lerp(w.solo[0], w.rest[0], p); z = lerp(w.solo[1], w.rest[2], p);
      y = lerp(0, w.rest[1], p) + Math.sin(Math.PI * p) * 0.55;
      if (w.t >= 1.1){ w.modo = 'casa'; w.nasce = 1; }
    }
    if (w.pulo > 0){ w.pulo -= dt; y += Math.sin((1 - w.pulo / 0.45) * Math.PI) * 0.15; }
    w.g.visible = vis && !!w.g.parent;
    w.g.position.set(x, y, z);
    w.g.rotation.set(Math.sin(t * 1.7 + w.fase) * 0.12, Math.PI / 4 + Math.sin(t * 0.6 + w.fase) * 0.5, Math.sin(t * 1.4 + w.fase) * 0.16);
    w.g.scale.setScalar(Math.max(0.01, w.nasce));
  }
}
function atualizarBolhaComposteira(){
  const quer = !!S.composto && S.composto.sacos > 0 && !!COMP_VIS.mesh && !COMP_VIS.semBolha;
  if (quer && !COMP_VIS.bolha){
    const [cx, cz] = centroComposteira();
    const b = COMP_VIS.bolha = novaBolha('adubo');
    b.position.set(cx, 1.45, cz); b.userData.base = 1.45; b.userData.fase = 2; scene.add(b); BOLHAS.push(b);
  } else if (!quer && COMP_VIS.bolha){
    scene.remove(COMP_VIS.bolha); BOLHAS.splice(BOLHAS.indexOf(COMP_VIS.bolha), 1); COMP_VIS.bolha = null;
  }
}
function atualizarComposteira(dt, t){
  if (COMP_VIS.surgeT != null){
    COMP_VIS.surgeT += dt / 0.8;
    const p = Math.min(1, COMP_VIS.surgeT);
    COMP_VIS.mesh.scale.setScalar(Math.max(0.01, easeOutBack(p)));
    if (p >= 1) COMP_VIS.surgeT = null;
  }
  atualizarMinhocas(dt, t);
  atualizarBolhaComposteira();
}
// enfeites que o jogador colocou no lugar da composteira (ou na frente da porta) voltam para a loja
function liberarLugarComposteira(){
  const [px, pz] = COMPOSTEIRA.porta;
  const dentro = e => dentroComposteira(e.x, e.z) || (e.x === px && e.z === pz);
  const fora = S.enfeites.filter(dentro);
  if (!fora.length) return;
  S.enfeites = S.enfeites.filter(e => !dentro(e));

}

// ---- restos, produção e caixa
function somarRestos(n){
  const c = S.composto;
  if (!c || !(n > 0)) return 0;
  const dar = Math.min(n, COMPOSTEIRA.restoMax - c.restos);
  c.restos += dar;
  return dar;
}
// cada 4 cerejas de café secas viram 1 resto
const restosDaSecagem = rid => (rid === 'secar' || rid === 'secarAntigo') ? Math.floor(RECEITAS[rid].entra.cereja / COMPOSTEIRA.cerejasPorResto) : 0;
// 3 restos viram 1 saco a cada intervalo, enquanto houver restos e lugar na caixa; usa o relógio, então vale com o jogo fechado
function simularComposteira(){
  const c = S.composto;
  if (!c) return;
  const cfg = cfgComposteira(), agora = Date.now(), passo = cfg.seg * 1000;
  const pode = () => c.restos >= COMPOSTEIRA.restosPorSaco && c.sacos < cfg.caixa;
  if (!pode()){ c.prox = 0; return; }
  if (!c.prox) c.prox = agora + passo;
  for (let guarda = 0; guarda < 200 && c.prox && c.prox <= agora; guarda++){
    const t = c.prox;
    c.restos -= COMPOSTEIRA.restosPorSaco; c.sacos++;
    c.prox = pode() ? t + passo : 0;
  }
}
function checarComposteira(tipoA, param){
  const c = S.composto;
  if (!c) return { ok: false };
  if (tipoA === 'recolherAdubo') return { ok: c.sacos > 0, custo: {} };
  if (tipoA === 'darComida'){
    const q = COMPOSTEIRA.lote;
    if (!COMPOSTEIRA.comida.includes(param)) return { ok: false };
    if ((S.celeiro[param] || 0) < q) return { ok: false, motivo: `${PRODUTOS[param].plural.endsWith('s') ? 'Faltam' : 'Falta'} ${PRODUTOS[param].plural} no celeiro (precisa de ${q})` };
    const emFila = fila.filter(t => t.tipo === 'darComida').length * q;
    if (c.restos + emFila + q > COMPOSTEIRA.restoMax) return { ok: false, motivo: 'A composteira não aguenta mais comida agora' };
    return { ok: true, custo: { itens: { [param]: q } } };
  }
  return { ok: false };
}
const pedirRecolherAdubo = () => { if (!fila.some(t => t.tipo === 'recolherAdubo')) enfileirar('recolherAdubo', { k: 'composteira' }); };
function executarComposteira(tarefa){
  const c = S.composto;
  if (!c) return;
  const [cx, cz] = centroComposteira(), pos = new THREE.Vector3(cx, 1.1, cz);
  if (tarefa.tipo === 'recolherAdubo'){
    const n = c.sacos;
    if (!n) return;
    c.sacos = 0;
    S.adubo = (S.adubo || 0) + n;
    for (let i = 0; i < 14; i++) particula(cx + rnd(-0.7, 0.7), Y_TERRA, cz + rnd(-0.7, 0.7), [0x7a4e2e, 0x5b3a25, 0xf2a3b5][i % 3], 1.3);
    flutuar(pos, '+' + n, '', 'adubo');
    Som.colher();
    falar(VOZ_MINHOCAS, variar(FALAS_ADUBO), 2.2);
    ganharXP(n * COMPOSTEIRA.xpSaco, pos.clone().add(new THREE.Vector3(0, 0.3, 0)));
  } else if (tarefa.tipo === 'darComida'){
    const k = tarefa.param, q = COMPOSTEIRA.lote, dar = somarRestos(q);
    // se os restos já encheram no meio tempo, o que sobrou volta para o celeiro
    if (dar < q) S.celeiro[k] = (S.celeiro[k] || 0) + (q - dar);
    for (let i = 0; i < 10; i++) particula(cx + rnd(-0.6, 0.6), 1, cz + rnd(-0.6, 0.6), [0x6cbf47, 0xf08a2c, 0xe2442f][i % 3], 0.5);
    if (dar) flutuar(pos, '-' + dar, '', k);
    Som.plantar();
    for (const w of MINHOCAS) w.pulo = 0.45;
  }
  simularComposteira(); atualizarBolhaComposteira(); hud(); salvar();
}
// quem fala quando as Minhoquinhas dizem alguma coisa fora da cena
const VOZ_MINHOCAS = { nome: 'minhoquinha', get g(){ return { visible: !!COMP_VIS.mesh }; }, topo: () => { const [cx, cz] = centroComposteira(); return new THREE.Vector3(cx, 1.2, cz); } };
function comprarMinhocas(){
  const c = S.composto, M = c && COMPOSTEIRA.melhorias[c.mel];
  if (!M) return;
  if (nivel() < M.nivel){ aviso(`${M.nome} libera no nível ${M.nivel}`, 'ruim'); Som.erro(); return; }
  if (S.dinheiro < M.preco){ aviso('Dinheiro insuficiente', 'ruim'); Som.erro(); return; }
  gastar(M.preco); chipPulsa('chipDinheiro'); Som.moeda();
  const antes = cfgComposteira().seg; c.mel++;
  // o que falta do ciclo em andamento acompanha o novo intervalo
  if (c.prox){ const agora = Date.now(); c.prox = agora + (c.prox - agora) * M.seg / antes; }
  garantirMinhocas(true);
  simularComposteira();
  aviso(`Mais Minhoquinhas na composteira! Um saco a cada ${tempo(M.seg)} e caixa de ${M.caixa}.`, 'grande', 3.5);
  hud(); salvar();
}
function itensComposteira(){
  const c = S.composto;
  if (!c) return null;
  const cfg = cfgComposteira(), per = COMPOSTEIRA.restosPorSaco;
  const r = { titulo: 'Composteira', icone: 'composteira', itens: [] };
  let e = `Restos: ${c.restos} de ${COMPOSTEIRA.restoMax}. Sacos na caixa: ${c.sacos} de ${cfg.caixa}.`;
  if (c.sacos >= cfg.caixa){ e += ' Caixa cheia! As Minhoquinhas pararam até o Ed recolher.'; r.classe = 'alerta'; }
  else if (c.restos < per){ e += ' As Minhoquinhas estão sem comida.'; r.classe = 'alerta'; }
  else {
    const falta = c.prox ? Math.max(0, (c.prox - Date.now()) / 1000) : cfg.seg;
    e += ` Próximo saco em ${tempo(falta)}.`; r.classe = 'bom';
    r.prog = 1 - falta / cfg.seg;
  }
  if (c.restos >= COMPOSTEIRA.restoMax) e += ' Os restos estão no máximo: o que passar disso se perde.';
  if (!COMPOSTEIRA.comida.some(k => (S.celeiro[k] || 0) >= COMPOSTEIRA.lote)) e += ` Elas comem o mato tirado, a casca do café da secagem e sobras da horta (${COMPOSTEIRA.comida.map(k => PRODUTOS[k].nome.toLowerCase()).join(', ')}), de ${COMPOSTEIRA.lote} em ${COMPOSTEIRA.lote}.`;
  r.estado = e;
  const indo = fila.some(t => t.tipo === 'recolherAdubo');
  r.itens.push({ rotulo: `Recolher adubo (${c.sacos})`, sub: indo ? 'o Ed já vai' : `+${c.sacos * COMPOSTEIRA.xpSaco} xp`, icone: 'adubo', off: !c.sacos || indo, fn: pedirRecolherAdubo });
  for (const k of COMPOSTEIRA.comida){
    const tem = S.celeiro[k] || 0, q = COMPOSTEIRA.lote;
    if (tem < q) continue;
    const cheio = c.restos + fila.filter(t => t.tipo === 'darComida').length * q + q > COMPOSTEIRA.restoMax;
    r.itens.push({ rotulo: `Dar ${q} ${PRODUTOS[k].plural}`, sub: `tem ${tem} · vira ${q} restos`, icone: k, leve: true, off: cheio, fn: () => enfileirar('darComida', { k: 'composteira' }, k) });
  }
  const M = COMPOSTEIRA.melhorias[c.mel];
  if (M) r.itens.push({ rotulo: M.nome, sub: nivel() < M.nivel ? `nível ${M.nivel}` : `um saco a cada ${tempo(M.seg)} · caixa de ${M.caixa}`, icone: 'minhoquinha', preco: reais(M.preco), off: nivel() < M.nivel || S.dinheiro < M.preco, fn: comprarMinhocas });
  return r;
}
function lembretesComposteira(){
  const c = S.composto, out = [];
  if (!c) return out;
  if (c.sacos > 0) out.push(['adubo', `recolher o adubo da composteira (${c.sacos})`]);
  if (c.restos < COMPOSTEIRA.restosPorSaco && c.sacos < cfgComposteira().caixa) out.push(['minhoquinha', 'as Minhoquinhas estão sem comida']);
  return out;
}

// ================= enfeites: comprados na loja, colocados em qualquer gramado livre

  poste:        { nome: 'Poste de luz', art: 'o', preco: 300, nivel: 6, xp: 2 },

};
const RAIO_ESPANTALHO = 3;

// o Ed precisa chegar ao coletor: os ladrilhos em volta dele (diagonais também) ficam livres
const perto1 = (a, x, z) => Math.max(Math.abs(a.x - x), Math.abs(a.z - z)) <= 1;
const pertoDoColetor = (x, z) => Object.values(COLETOR).some(C => perto1(C, x, z));
// as regras de sempre, sem a do coletor
function livreSemColetor(x, z){
  const t = tipo(x, z);
  if (t !== 'grama' && t !== 'pastoV') return false;
  if (loteDe(x, z) >= 0 || campo(x, z) || blocoEm(x, z) > 0) return false;
  if (S.enfeites.some(e => e.x === x && e.z === z)) return false;
  if (Math.hypot(ed.pos.x - x - 0.5, ed.pos.y - z - 0.5) < 0.6) return false;
  return t === 'grama';
}
const livreParaEnfeite = (x, z) => livreSemColetor(x, z) && !pertoDoColetor(x, z);
let brilhoPoste = null;
const geoBrilhoPoste = () => { if (!brilhoPoste) brilhoPoste = brilhoDe(vPoste(), 1 / 16, { origin: [8, 0, 8] }, [0xfff1a8]); return brilhoPoste.clone(); };
function montarEnfeite(e){

  if (ENF_VIS[k]){ scene.remove(ENF_VIS[k]); const i = pickaveis.indexOf(ENF_VIS[k]); if (i >= 0) pickaveis.splice(i, 1); }
  const modelos = { canteiroFlor: () => vCanteiroFlor(), banco: vBanco, espantalho: vEspantalho, poste: vPoste, fonte: vFonte, estatua: vEstatua };
  const escala = e.tipo === 'estatua' ? 1 / 40 : 1 / 16;

function chamarMilton(){ if (voo.estado === 'fora'){ voo = { estado: 'chegando', t: 0 }; aviao.visible = true; motor(true); } }
function atualizarPista(dt){
  if (!aviao) return;
  const v = voo, y = PISTA.y;
  if (v.estado === 'fora'){
    // o primeiro pouso é a cena do Milton (depois da primeira venda); os outros vêm pelo relógio
    if (!cine && !cenaPedida && S.conheceuMilton && Date.now() >= S.proxMilton) chamarMilton();
    return;
  }
  v.t += dt;
  helice.rotation.x += dt * (v.estado === 'parado' ? 4 : 40);
  if (motorSom) motorSom.o.frequency.value = v.estado === 'parado' ? 48 : 72 + Math.min(20, v.t * 4);
  if (v.estado === 'rasante'){
    // na cena: passa baixo por cima da fazenda, sai da tela e volta para pousar
    const k = Math.min(1, v.t / 4.8);
    aviao.position.set(lerp(-8, W + 8, k), 2.1, -1.1); aviao.rotation.set(Math.sin(k * 6) * 0.1, 0, 0);
    if (k >= 1){ v.estado = 'chegando'; v.t = 0; aviao.rotation.set(0, 0, 0); }
  } else if (v.estado === 'chegando'){
    // planeia descendo até tocar a pista e roda freando até parar
    const T1 = 5, T2 = 3.2;
    if (v.t < T1){ const k = v.t / T1; aviao.position.set(lerp(-14, PISTA.toque, k), lerp(5, 0, k * k * (3 - 2 * k)), y); aviao.rotation.z = -0.08 * (1 - k); }
    else if (v.t < T1 + T2){ const k = (v.t - T1) / T2, e = 1 - (1 - k) * (1 - k); aviao.position.set(lerp(PISTA.toque, PISTA.para, e), 0, y); aviao.rotation.z = 0; }
    else { v.estado = 'parado'; v.t = 0; motor(false); if (!v.cena) desembarcar(); }
  } else if (v.estado === 'decolando'){
    const T1 = 3.2, T2 = 4;
    if (v.t < T1){ const k = v.t / T1; aviao.position.set(lerp(PISTA.para, W + 2, k * k), 0, y); aviao.rotation.z = 0.04 * k; }
    else if (v.t < T1 + T2){ const k = (v.t - T1) / T2; aviao.position.set(W + 2 + k * 18, k * 7, y); aviao.rotation.z = 0.15; }
    else { v.estado = 'fora'; aviao.visible = false; motor(false); if (!v.reprise) S.proxMilton = Date.now() + rnd(...PISTA.intervalo) * 60000; salvar(); }
  }
}

const HUD = { nivel: 9, preco: 500, minutos: 15 };

function chamarHud(){

  if (nivel() < HUD.nivel){ aviso(`O Hud ajuda a partir do nível ${HUD.nivel}`, 'ruim'); Som.erro(); return; }

function alvosHud(){

    const t = S.campo[k];

    const tipo = t.p === 'sede' ? 'regar' : t.p === 'mato' ? 'capinar' : t.prog >= 1 ? 'colher' : null;
    if (!tipo) continue;
    const [x, z] = k.split(',').map(Number), alvo = { k: 'tile', x, z };
    if (!reservado(alvo)) out.push([tipo, alvo, x + 0.5, z + 0.5]);
  }
  S.pomar.forEach((d, i) => { const alvo = { k: 'pomar', i }; if (d && d.pronto && !reservado(alvo)){ const [x, z] = POMAR_SLOTS[i]; out.push(['colherFruta', alvo, x + 0.5, z + 1.5]); } });
  S.colmeias.forEach((d, i) => { const alvo = { k: 'colmeia', i }; if (d && d.pronto && !reservado(alvo)){ const [x, z] = COLMEIA_SLOTS[i]; out.push(['coletarMel', alvo, x + 0.5, z + 1.5]); } });

}
function atualizarHudIrmao(dt, t){
  const Hd = irmaoHud;

    if (hudAtivo() && !cine){ Hd.g.visible = true; Hd.colocar(5.5, 5.6); Hd.estado = 'parado'; }
    return;
  }
  Hd.update(dt, t);
  // chegou em casa neste quadro: já sumiu, não repete a saída
  if (!Hd.g.visible) return;
  if (tarefaHud || Hd.estado !== 'parado' || cine) return;
  if (!hudAtivo()){
    if (!Hd.saindo){
      Hd.saindo = true;
      falar(Hd, variar(FALAS_HUD_CANSOU), 3);
      const pts = rota(clamp(Math.floor(Hd.pos.x), 0, W - 1), clamp(Math.floor(Hd.pos.y), 0, H - 1), 5, 5);

    }
    return;
  }
  const alvos = alvosHud();
  if (!alvos.length) return;
  alvos.sort((a, b) => Math.hypot(a[2] - Hd.pos.x, a[3] - Hd.pos.y) - Math.hypot(b[2] - Hd.pos.x, b[3] - Hd.pos.y));

  const tarefa = { tipo, alvo, hud: true };
  let pts = rota(clamp(Math.floor(Hd.pos.x), 0, W - 1), clamp(Math.floor(Hd.pos.y), 0, H - 1), Math.floor(tx), Math.floor(tz));
  if (!pts){ ignoradosHud.set(tipo + JSON.stringify(alvo), Date.now() + 20000); return; }
  if (pts.length){
    const ant = pts.length > 1 ? pts[pts.length - 2] : [Hd.pos.x, Hd.pos.y];
    const dx = tx - ant[0], dz = tz - ant[1], d = Math.hypot(dx, dz);
    if (d > 0.01 && alvo.k === 'tile') pts[pts.length - 1] = [tx - dx / d * 0.32, tz - dz / d * 0.32];
  }
  tarefaHud = tarefa; setReserva(alvo, tarefa);
  Hd.ir(pts, () => {
    const sl = alvo.k === 'pomar' ? POMAR_SLOTS[alvo.i] : alvo.k === 'colmeia' ? COLMEIA_SLOTS[alvo.i] : alvo.k === 'mata' ? MATA_XZ[alvo.i] : null;

    efeitoDuranteTrabalho(tarefa);

      setReserva(alvo, null); tarefaHud = null;
      if (checar(tipo, alvo).ok) executar(tarefa);
    });
  });
}

// ================= tarefas do Ed
const fila = [];
const NOMES_ACAO = { apagarFogo:'Apagar o fogo', recolherLixo:'Recolher o lixo', tirarGalho:'Tirar o galho', pegarAluguel:'Pegar o aluguel', tirarCerca:'Tirar a cerca', colherFruta:'Colher frutas', coletarMel:'Coletar mel', produzir:'Produzir', recolher:'Recolher', arar:'Arar', plantar:'Plantar', regar:'Regar', capinar:'Tirar o mato', colher:'Colher', alimentar:'Alimentar', coletar:'Coletar', arrancar:'Arrancar', esvaziar:'Esvaziar a caixa', adubar:'Adubar', andar:'Andar', recolherAdubo:'Recolher adubo', darComida:'Dar comida', comerMaca:'Comer a maçã', coletarMata:'Coletar', cavarTrufa:'Cavar a trufa' };
const DUR = { apagarFogo: 2.2, recolherLixo: 0.8, tirarGalho: 2.4, pegarAluguel: 0.6, tirarCerca: 2.4, colherFruta: 1.0, coletarMel: 1.0, produzir: 1.0, recolher: 0.8, arar: 1.1, plantar: 0.7, regar: 1.0, capinar: 0.9, colher: 0.7, alimentar: 0.9, coletar: 0.6, arrancar: 0.8, esvaziar: 0.8, adubar: 0.8, andar: 0, recolherAdubo: 0.9, darComida: 0.9, comerMaca: 1.2, coletarMata: 1.0, cavarTrufa: 1.6 };
const FERR = { apagarFogo: 'regador', recolherLixo: 'cesta', tirarGalho: null, pegarAluguel: null, tirarCerca: 'enxada', colherFruta: 'cesta', coletarMel: 'cesta', produzir: 'saco', recolher: 'cesta', arar: 'enxada', plantar: null, regar: 'regador', capinar: null, colher: 'cesta', alimentar: 'saco', coletar: 'cesta', arrancar: null, esvaziar: 'cesta', adubar: 'saco', andar: null, recolherAdubo: 'cesta', darComida: 'saco', comerMaca: 'maca', coletarMata: 'cesta', cavarTrufa: 'enxada' };
const mesmoAlvo = (a, b) => a.k === b.k && (a.k === 'animal' ? a.a === b.a : a.x === b.x && a.z === b.z);
function reservado(alvo){ if (alvo.k === 'ocorrencia') return fila.some(t => t.alvo.k === 'ocorrencia' && t.alvo.id === alvo.id && t.alvo.j === alvo.j); if (alvo.k === 'aluguel') return fila.some(t => t.tipo === 'pegarAluguel'); if (alvo.k === 'cercaCanto') return fila.some(t => t.tipo === 'tirarCerca'); if (alvo.k === 'trufa') return fila.some(t => t.tipo === 'cavarTrufa' && t.alvo.x === alvo.x && t.alvo.z === alvo.z); if (alvo.k === 'maca') return fila.some(t => t.tipo === 'comerMaca'); if (alvo.k === 'composteira') return false; if (alvo.k === 'coletor') return fila.some(t => t.tipo === 'esvaziar' && t.alvo.tp === alvo.tp); if (alvo.k === 'fabrica') return false; if (alvo.k === 'pomar' || alvo.k === 'colmeia' || alvo.k === 'mata') return !!visSlot(alvo).res; return alvo.k === 'animal' ? !!alvo.a.res : !!(VIS[chave(alvo.x, alvo.z)] && VIS[chave(alvo.x, alvo.z)].res); }
const visSlot = alvo => { const L = alvo.k === 'pomar' ? POMAR_VIS : alvo.k === 'mata' ? MATA_VIS : COLMEIA_VIS; return L[alvo.i] || (L[alvo.i] = {}); };
function setReserva(alvo, v){ if (alvo.k === 'ocorrencia' || alvo.k === 'aluguel' || alvo.k === 'cercaCanto' || alvo.k === 'trufa' || alvo.k === 'maca' || alvo.k === 'fabrica' || alvo.k === 'coletor' || alvo.k === 'composteira') return; if (alvo.k === 'pomar' || alvo.k === 'colmeia' || alvo.k === 'mata'){ visSlot(alvo).res = v; return; } if (alvo.k === 'animal') alvo.a.res = v; else { const k = chave(alvo.x, alvo.z); (VIS[k] || (VIS[k] = { cs: '', cp: '' })).res = v; } }
// diz se a ação vale para o alvo; devolve o custo ou um motivo
function checar(tipoA, alvo, param){
  if (alvo.k === 'ocorrencia') return checarOcorrencia(tipoA, alvo);
  if (alvo.k === 'cercaCanto') return { ok: tipoA === 'tirarCerca' && S.canto === 1, custo: {} };
  if (alvo.k === 'aluguel') return { ok: tipoA === 'pegarAluguel' && !!S.aluguel, custo: {} };
  if (alvo.k === 'maca') return { ok: tipoA === 'comerMaca' && !!S.maca, custo: {} };
  if (alvo.k === 'trufa') return { ok: tipoA === 'cavarTrufa' && S.trufas.some(t => t.x === alvo.x && t.z === alvo.z), custo: {} };
  if (alvo.k === 'composteira') return checarComposteira(tipoA, param);
  if (alvo.k === 'coletor') return { ok: tipoA === 'esvaziar' && !!S.coletor[alvo.tp] && naCaixa(alvo.tp) > 0, custo: {} };
  if (alvo.k === 'mata'){
    if (galhoFecha(MATA_SLOTS[alvo.i].p)) return { ok: false, motivo: 'Um galho caído fecha a trilha. Tire ele primeiro.' };
    return { ok: tipoA === 'coletarMata' && !!S.mata[alvo.i] && S.mata[alvo.i].pronto, custo: {} };
  }
  if (alvo.k === 'pomar') return { ok: tipoA === 'colherFruta' && !!S.pomar[alvo.i] && S.pomar[alvo.i].pronto, custo: {} };
  if (alvo.k === 'colmeia') return { ok: tipoA === 'coletarMel' && !!S.colmeias[alvo.i] && S.colmeias[alvo.i].pronto, custo: {} };
  if (alvo.k === 'fabrica'){
    const st = estFab(alvo.id);
    if (!st.feita) return { ok: false };
    if (tipoA === 'recolher') return { ok: st.feitos.length > 0, custo: {} };
    if (tipoA === 'produzir'){
      const R = RECEITAS[param], trava = travaReceita(param);
      if (trava) return { ok: false, motivo: `${R.nome}: ${trava}` };
      if (!temItens(R.entra)) return { ok: false, motivo: `Falta ${textoItens(R.entra)}` };
      const naFila = fila.filter(t => t.tipo === 'produzir' && t.alvo.id === alvo.id).length;
      if (st.fila.length + naFila >= VAGAS_FAB) return { ok: false, motivo: `${FABRICAS[alvo.id].nome}: a fila está cheia` };
      return { ok: true, custo: { itens: { ...R.entra } } };
    }
    return { ok: false };
  }
  if (alvo.k === 'animal'){
    const a = alvo.a, A = ANIMAIS[a.d.tipo];
    if (tipoA === 'alimentar'){ if (a.d.e !== 'fome') return { ok: false }; if (S.racao < A.racao) return { ok: false, motivo: `Falta ração (precisa de ${A.racao})` }; return { ok: true, custo: { racao: A.racao } }; }
    if (tipoA === 'coletar') return { ok: a.d.e === 'pronto', custo: {} };
    return { ok: false };
  }
  if (tipoA === 'andar') return { ok: true, custo: {} };
  const t = campo(alvo.x, alvo.z);
  if (!t) return { ok: false };
  switch (tipoA){
    case 'arar': return { ok: t.e === 'grama', custo: {} };
    case 'plantar': {
      if (t.e !== 'arado') return { ok: false };
      const c = CULTURAS[param];
      if (nivel() < c.nivel) return { ok: false, motivo: `${c.nome} libera no nível ${c.nivel}` };
      if ((S.bolsa[param] || 0) > 0) return { ok: true, custo: { semente: param } };
      if (S.dinheiro >= c.semente) return { ok: true, custo: { dinheiro: c.semente } };
      return { ok: false, motivo: 'Sem sementes e sem dinheiro para comprar' };
    }
    case 'regar': return { ok: t.e === 'plantado' && t.p === 'sede', custo: {} };
    case 'capinar': return { ok: t.e === 'plantado' && t.p === 'mato', custo: {} };
    case 'colher': return { ok: t.e === 'plantado' && t.prog >= 1 && !t.p, custo: {} };
    case 'arrancar': return { ok: t.e === 'plantado', custo: {} };
    case 'adubar':
      if (!adubavel(t)) return { ok: false };
      if (!(S.adubo > 0)) return { ok: false, motivo: 'Falta adubo. Tem na loja.' };
      return { ok: true, custo: { adubo: 1 } };
  }

const REDEMOINHO = { espera: [5, 12], depois: [12, 25], vaga: [10, 18], vel: 1.8, perto: 1.3 };

let rd = null, rdEspera = Infinity, rdMesh, rdPoeira = 0;
// durante a conversa o Ed fica parado onde estiver, mesmo no meio de um caminho
const emEncontroSaci = () => !!rd && rd.estado !== 'vagando' && rd.estado !== 'foge';
function montarRedemoinho(){
  rdMesh = malha(geo('redemoinho', () => vRedemoinho().build(1 / 16, { origin: [0.5, 0, 0.5] })), false);
  rdMesh.visible = false; scene.add(rdMesh);
  rdEspera = rnd(...REDEMOINHO.espera) * 60;
}
const pontoDaFazenda = () => [rnd(1, 34), rnd(0.5, 15.5)];
function iniciarRedemoinho(){
  const portao = PARADA;
  rd = { estado: 'vagando', x: rnd(8, X_FIM_MATA), z: rnd(Z_MATA + 1, Z_MATA + 3), caminho: [[portao, Z_ORLA + 1], [portao, 16.5], [portao, 14.5]], alvo: pontoDaFazenda(), t: 0, vagaAte: rnd(...REDEMOINHO.vaga), esc: 0, escAlvo: 1 };
  rdMesh.visible = true;
  aviso('Um redemoinho de vento saiu da floresta!', '', 3);
}
// pelo catálogo de cenas: a câmera acompanha o redemoinho, e ele passeia pouco antes de ir atrás do Ed
function chamarRedemoinho(){
  if (rd) return;
  iniciarRedemoinho();
  rd.vagaAte = 3; rd.seguir = true;
  cam.alvo.set(rd.x, 0, rd.z);
}
function encerrarRedemoinho(){
  rd = null; rdMesh.visible = false; saci.g.visible = false;
  rdEspera = rnd(...REDEMOINHO.depois) * 60;
}
// chão livre ao lado do Ed na tela: na linha da câmera, um esconderia o outro
function lugarDoSaci(){
  const dirs = Array.from({ length: 8 }, (_, i) => [Math.sin(i * Math.PI / 4), Math.cos(i * Math.PI / 4)]);
  const naLinha = d => Math.abs(d[0] * Math.sin(cam.az) + d[1] * Math.cos(cam.az));
  dirs.sort((a, b) => naLinha(a) - naLinha(b));
  for (const [dx, dz] of dirs){
    const x = ed.pos.x + dx * 1.25, z = ed.pos.y + dz * 1.25;
    if (andavel(Math.floor(x), Math.floor(z))) return [x, z];
  }
  return [rd.x, rd.z];
}
function andarRedemoinho(xa, za, vel, dt){
  const dx = xa - rd.x, dz = za - rd.z, d = Math.hypot(dx, dz), passo = vel * dt;
  if (d <= passo){ rd.x = xa; rd.z = za; return true; }
  rd.x += dx / d * passo; rd.z += dz / d * passo;
  return false;
}
function atualizarRedemoinho(dt, t){
  if (!rd){
    if (S.viuCineInicio && !cine && !cenaPedida && (rdEspera -= dt) <= 0) iniciarRedemoinho();
    return;
  }
  // uma cena tira o Ed do lugar: o vento passa e volta outro dia
  if (rd.estado === 'vagando' && cine){ encerrarRedemoinho(); return; }
  rd.t += dt;
  if (rd.seguir){ const k = Math.min(1, dt * 4); cam.alvo.x += (rd.x - cam.alvo.x) * k; cam.alvo.z += (rd.z - cam.alvo.z) * k; }
  switch (rd.estado){
    case 'vagando': {
      // só depois de passar pela porteira ele pode encontrar o Ed
      if (rd.caminho.length){
        if (andarRedemoinho(rd.caminho[0][0], rd.caminho[0][1], REDEMOINHO.vel * 1.4, dt)) rd.caminho.shift();
        if (!rd.caminho.length) rd.t = 0;
        break;
      }
      if (rd.t < rd.vagaAte){ if (andarRedemoinho(rd.alvo[0], rd.alvo[1], REDEMOINHO.vel, dt)) rd.alvo = pontoDaFazenda(); }
      // mais rápido que o Ed, mesmo com botas e maçã: o encontro sempre acontece
      else andarRedemoinho(ed.pos.x, ed.pos.y, Math.max(3.4, ed.vel * ed.turbo * 1.15), dt);
      if (Math.hypot(rd.x - ed.pos.x, rd.z - ed.pos.y) < REDEMOINHO.perto && ed.g.visible && !algumaJanela() && !menuAberto){
        rd.estado = 'susto'; rd.t = 0; rd.fala = variar(FALAS_SUSTO); rd.dur = tempoDeLeitura(rd.fala); rd.lugar = lugarDoSaci();
        ed.olhar(rd.lugar[0], rd.lugar[1]); ed.pulo = 0.45; Som.oinc();
        falar(ed, rd.fala, rd.dur);
      }
      break;
    }
    case 'susto':
      andarRedemoinho(rd.lugar[0], rd.lugar[1], 2.4, dt);
      if (rd.t >= rd.dur){
        rd.estado = 'desfaz'; rd.t = 0; rd.escAlvo = 0;
        for (let i = 0; i < 34; i++) particula(rd.x + rnd(-0.5, 0.5), rnd(0.2, 1.4), rd.z + rnd(-0.5, 0.5), [0xd9c9a6, 0xe9dfc7, 0x6cbf52][i % 3], 1.1);
        Som.ruido(0.5, 0.14, 1400);
      }
      break;
    case 'desfaz':
      if (rd.t >= 0.75){
        rdMesh.visible = false;
        saci.g.visible = true; saci.colocar(rd.x, rd.z); saci.olhar(ed.pos.x, ed.pos.y); saci.ang = saci.angAlvo; saci.pulo = 0.45; saci.aceno = 3;
        ed.olhar(rd.x, rd.z);
        rd.estado = 'oi'; rd.t = 0; rd.fala = variar(FALAS_SACI); rd.dur = tempoDeLeitura(rd.fala);
        falar(saci, rd.fala, rd.dur); Som.oinc(); Musica.vinheta('saci');
      }
      break;
    case 'oi':
      if (rd.t >= rd.dur){
        rd.estado = 'responde'; rd.t = 0; rd.fala = variar(FALAS_ED_SACI); rd.dur = tempoDeLeitura(rd.fala) + 0.4;
        falar(ed, rd.fala, rd.dur); ed.aceno = 1.6; Som.oinc();
      }
      break;
    case 'responde':
      if (rd.t >= rd.dur){ rd.estado = 'volta'; rd.t = 0; rd.esc = 0; rd.escAlvo = 1; rdMesh.visible = true; }
      break;
    case 'volta':
      if (rd.t >= 0.6){
        saci.g.visible = false;
        const a = Math.atan2(rd.x - ed.pos.x, rd.z - ed.pos.y);
        rd.estado = 'foge'; rd.t = 0; rd.alvo = [rd.x + Math.sin(a) * 9, rd.z + Math.cos(a) * 9]; rd.escAlvo = 0;
      }
      break;
    case 'foge':
      andarRedemoinho(rd.alvo[0], rd.alvo[1], 6, dt);
      if (rd.t >= 1.5){ encerrarRedemoinho(); return; }
      break;
  }
  rd.esc += (rd.escAlvo - rd.esc) * Math.min(1, dt * (rd.estado === 'foge' ? 2 : 6));
  const e = rd.esc * (1 + Math.sin(t * 7) * 0.05);
  rdMesh.position.set(rd.x, 0, rd.z); rdMesh.rotation.y = -t * 9; rdMesh.rotation.z = Math.sin(t * 3) * 0.05; rdMesh.scale.setScalar(Math.max(0.001, e));
  if (rdMesh.visible && (rdPoeira -= dt) <= 0){ rdPoeira = 0.09; particula(rd.x + rnd(-0.4, 0.4), 0.08, rd.z + rnd(-0.4, 0.4), sorteia([0xd9c9a6, 0xc4b18a, 0xe9dfc7]), 0.5); }
}

// ================= trânsito na estrada: de vez em quando passa um veículo, e o Ed cumprimenta quem passa perto
const TRANSITO = { espera: [30, 90], perto: 4 };
// [cor da bicicleta, cor da roupa do porquinho, cor do bolso]
const ROUPA_VERMELHA = [0xd9483c, 0xf2b632], ROUPA_VERDE = [0x46a352, 0xbfe59a], ROUPA_ROXA = [0x8a4fc4, 0xd7b8f0];
const CICLISTAS = [[0xd9483c, ...ROUPA_VERDE], [0x3f8fd0, ...ROUPA_VERMELHA], [0xf0b432, ...ROUPA_ROXA]];
let TRAFEGO = [], carroRua = null, transitoEspera = Infinity;
function saudacaoDoEd(){
  return variar(SAUDACOES[periodo().id]);
}
function montarTransito(){
  // o Porco se registra para receber toque, mas quem passa na estrada não abre menu
  const piloto = (nome, args, x, y, esc, pedala) => { const p = new Porco(...args); pickaveis.pop(); p.g.scale.setScalar(esc); return { p, x, y, pedala, nome }; };
  const veiculo = (g, vel, pilotos) => { pilotos.forEach(q => g.add(q.p.g)); g.visible = false; return { g, vel, pilotos }; };
  const criado = g => { pickaveis.pop(); return g; };
  const novoMesh = (fn, ori, chave) => { const m = malha(geo(chave, () => fn().build(1 / 16, { origin: ori }))); scene.add(m); return m; };
  TRAFEGO = [
    veiculo(criado(criarCaminhao(...CAMINHAO_MARKET)), 5.5, []),
    veiculo(criado(criarCaminhao(...CAMINHAO_CAFE)), 5.5, []),
    veiculo(criado(criarLambreta()), 4.5, [piloto('moto', [0, 0, 'patrinho', MODELO_PATRINHO], -0.2, 0.84, 1)]),
    veiculo(novoMesh(vTrator, [10, 0, 0.5], 'trator'), 2.2, [piloto('trator', [...ROUPA_VERMELHA, 'tratorista'], -0.34, 0.68, 0.72)]),
    ...CICLISTAS.map((c, i) => veiculo(novoMesh(() => vBicicleta(c[0]), [9, 0, 0.5], 'bicicleta' + i), 3 + i * 0.5, [piloto('bike', [c[1], c[2], 'ciclista' + i], -0.05, 0.56, 0.5, true)])),
  ];
  TRAFEGO.forEach((v, i) => acenderFarois(v.g, i === 2 ? { um: true, h: 0.4, comp: 2 } : i === 3 ? { h: 0.45, comp: 2.2 } : i > 3 ? { um: true, h: 0.32, comp: 1.4 } : {}));
  transitoEspera = rnd(...TRANSITO.espera);
}
function soltarVeiculo(i){
  if (carroRua) return false;
  const v = TRAFEGO[i], sentido = Math.random() < 0.5 ? 1 : -1;
  carroRua = { v, sentido, x: sentido > 0 ? -9 : FIM_ESTRADA + 2, saudou: false };
  v.g.visible = true; naEstrada(v.g, carroRua.x, sentido);
  return true;
}
function tirarVeiculo(){
  carroRua.v.g.visible = false; carroRua = null;
  transitoEspera = rnd(...TRANSITO.espera);
}
function atualizarTransito(dt, t){
  if (!carroRua){
    if (!cine && !cenaPedida && caminhaoE.estado === 'longe' && (transitoEspera -= dt) <= 0) soltarVeiculo(Math.floor(Math.random() * TRAFEGO.length));
    return;
  }
  // visita e cena usam a mesma pista, e os veículos se atravessariam
  if (cine || caminhaoE.estado !== 'longe'){ tirarVeiculo(); return; }
  const c = carroRua;
  c.x += c.sentido * c.v.vel * dt;
  naEstrada(c.v.g, c.x, c.sentido); c.v.g.position.y = Math.abs(Math.sin(t * 18)) * 0.012;
  for (const q of c.v.pilotos){
    const p = q.p;
    if (q.pedala){ p.estado = 'andando'; p.pontos = [[1e6, 0]]; }
    p.update(dt, t);
    p.pos.set(q.x, 0); p.g.position.set(q.x, q.y, 0); p.g.rotation.y = Math.PI / 2;
    if (!q.pedala) p.pE.rotation.x = p.pD.rotation.x = -1.3;
    p.bE.rotation.set(-1.25, 0, -0.35); p.bD.rotation.set(-1.25, 0, 0.35);
  }
  if (!c.saudou && ed.g.visible && !emEncontroSaci() && !FALAS.some(f => f.quem === ed) && Math.hypot(c.v.g.position.x - ed.pos.x, c.v.g.position.z - ed.pos.y) <= TRANSITO.perto){
    c.saudou = true;
    const fala = saudacaoDoEd();
    falar(ed, fala, tempoDeLeitura(fala)); ed.aceno = 1.6; Som.oinc();
    if (ed.estado === 'parado') ed.olhar(c.v.g.position.x, c.v.g.position.z);
  }
  if (c.sentido > 0 ? c.x > FIM_ESTRADA + 2 : c.x < -9) tirarVeiculo();
}

// ================= a maçã das árvores
const MACA = { minutos: 10, fator: 2, esperaMin: 5, esperaMax: 12, queda: 0.7, quique: 0.35 };
const FALAS_MACA = ['Obrigado, árvore!', 'Valeu, árvore! Estava uma delícia.', 'Brigadão, árvore! Agora eu corro!', 'Valeu, macieira! Que maçã crocante.', 'Obrigado, árvore! Agora vou voando.', 'Hmm, que maçã docinha! Brigado, árvore!', 'Que energia! Obrigado, árvore!', 'Maçã boa! Agora ninguém me alcança.', 'Valeu, árvore! Até deu vontade de correr.', 'Obrigado pela maçã, amiga árvore!', 'Crocante e suculenta! Valeu, árvore!', 'Brigado, árvore! Bora trabalhar rapidinho.', 'Que delícia! Obrigado, macieira querida.'];
const ARV_VIS = {};
const macaAtiva = () => !!S.macaAte && Date.now() < S.macaAte;
const sorteioMaca = () => rnd(MACA.esperaMin, MACA.esperaMax) * 60;
const alvoMaca = () => ({ k: 'maca', x: S.maca.x, z: S.maca.z });
let macaEspera = Infinity, macaLigada = false, macaQueda = null, macaRastro = 0, macaMesh, macaHit, macaBolha;
function montarMaca(){
  macaMesh = malha(geo('maca', () => VI.maca().build(1 / 19, { origin: [0.5, 0, 0.5] })));
  scene.add(macaMesh);
  // a maçã é pequena e a copa pode ficar na frente dela: a área de toque cobre o ladrilho inteiro
  macaHit = new THREE.Mesh(new THREE.BoxGeometry(1, 1.1, 1), new THREE.MeshBasicMaterial({ visible: false }));
  macaHit.userData.alvo = { k: 'maca' };
  scene.add(macaHit); pickaveis.push(macaHit);
  macaBolha = novaBolha('maca'); macaBolha.userData.base = 0.8; macaBolha.userData.fase = 0;
  scene.add(macaBolha); BOLHAS.push(macaBolha);
  macaEspera = sorteioMaca();
  posicionarMaca();
}
function posicionarMaca(){
  if (!S.maca) return;
  const x = S.maca.x + 0.5, z = S.maca.z + 0.5;
  macaMesh.position.set(x, 0, z); macaHit.position.set(x, 0.55, z); macaBolha.position.x = x; macaBolha.position.z = z;
  macaHit.userData.alvo = alvoMaca();
}
function lugarPertoDeArvore(){
  const sx = clamp(Math.floor(ed.pos.x), 0, W - 1), sz = clamp(Math.floor(ed.pos.y), 0, H - 1), ops = [];
  for (const [ax, az] of ARVORES) for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
    const x = ax + dx, z = az + dz;
    if (livreParaEnfeite(x, z) && !(S.maca && S.maca.x === x && S.maca.z === z) && !S.trufas.some(t => t.x === x && t.z === z) && rota(sx, sz, x, z)) ops.push({ x, z, ax, az });
  }
  return ops.length ? sorteia(ops) : null;
}
function derrubarMaca(){
  const l = lugarPertoDeArvore();
  if (!l){ macaEspera = 30; return false; }
  S.maca = l; macaQueda = { t: 0 };
  posicionarMaca();
  for (let i = 0; i < 8; i++) particula(l.ax + 0.5 + rnd(-0.4, 0.4), 1.5, l.az + 0.5 + rnd(-0.4, 0.4), [0x5aa845, 0x66b54f][i % 2], -0.5);
  Som.pop(); aviso('Caiu uma maçã de uma árvore!');
  salvar();
  return true;
}
function comerMaca(){
  if (!S.maca) return;
  const { ax, az } = S.maca;
  S.maca = null; S.macaAte = Date.now() + MACA.minutos * 60000; macaEspera = sorteioMaca();
  const fala = variar(FALAS_MACA), dur = tempoDeLeitura(fala);
  ed.olhar(ax + 0.5, az + 0.5); ed.aceno = dur; ed.pulo = 0.45;
  falar(ed, fala, dur);
  // sem esta pausa a próxima tarefa da fila vira o Ed de costas no meio do agradecimento; o aviso espera porque cobriria o balão
  ed.trabalhar(dur, 'agradecer', () => aviso(`O Ed está ${MACA.fator}× mais rápido por ${MACA.minutos} minutos!`));
  Som.colher();
  hud(); salvar();
}
function atualizarMaca(dt, t){
  const ativa = macaAtiva();
  ed.turbo = emEncontroSaci() ? 0 : ativa && !cine ? MACA.fator : 1;
  // nas cenas o Ed anda no passo normal, então o efeito não gasta
  if (ativa && cine) S.macaAte += dt * 1000;
  if (macaLigada && !ativa){ aviso('O efeito da maçã acabou.'); const f = variar(FALAS_FIM_MACA); falar(ed, f, tempoDeLeitura(f)); }
  macaLigada = ativa;
  $('macaPill').hidden = !ativa;
  if (ativa) $('macaTexto').textContent = `Ed veloz · ${tempo((S.macaAte - Date.now()) / 1000)}`;
  if (ed.turbo > 1 && ed.estado === 'andando' && (macaRastro -= dt) <= 0){
    macaRastro = 0.08;
    particula(ed.pos.x + rnd(-0.15, 0.15), 0.1, ed.pos.y + rnd(-0.15, 0.15), sorteia([0xffe066, 0xffffff]), 0.35);
  }
  if (!S.maca && !ativa && !cine && (macaEspera -= dt) <= 0) derrubarMaca();
  const comendo = !!tarefaAtual && tarefaAtual.tipo === 'comerMaca' && ed.estado === 'trabalhando';
  macaMesh.visible = !!S.maca && !comendo;
  macaHit.visible = !!S.maca;
  macaBolha.visible = !!S.maca && !macaQueda && !fila.some(f => f.tipo === 'comerMaca');
  if (macaQueda && S.maca) animarQueda(dt, t);
}
function animarQueda(dt, t){
  const q = macaQueda, M = S.maca, arv = ARV_VIS[chave(M.ax, M.az)];
  q.t += dt;
  const k = Math.min(1, q.t / MACA.queda), b = clamp((q.t - MACA.queda) / MACA.quique, 0, 1);
  macaMesh.position.x = lerp(M.ax, M.x, k) + 0.5;
  macaMesh.position.z = lerp(M.az, M.z, k) + 0.5;
  macaMesh.position.y = k < 1 ? lerp(1.5, 0, k * k) : Math.sin(b * Math.PI) * 0.16;
  if (arv) arv.rotation.z = k < 1 ? Math.sin(t * 30) * 0.035 * (1 - k) : 0;
  if (b >= 1) macaQueda = null;
}

// ================= progresso
function ganharXP(n, pos){
  const antes = nivel();
  S.xp += n;
  if (pos) setTimeout(() => flutuar(pos.clone().add(new THREE.Vector3(0, 0.3, 0)), '+' + n + ' xp', 'xp'), 150);
  const depois = nivel();
  if (depois > antes) subiuNivel(depois);
  hud();
}
function subiuNivel(n){
  Som.nivel(); if (ed) ed.pulo = 0.45;
  const libs = [];
  for (const k of ORDEM_CULTURAS) if (CULTURAS[k].nivel === n) libs.push(CULTURAS[k].nome);
  for (const k in ANIMAIS) if (ANIMAIS[k].nivel === n) libs.push(ANIMAIS[k].nome);
  if (n > 1 && NIVEL_LOTE.includes(n)) libs.push('mais um terreno');
  for (const tp in COLETOR) if (COLETOR[tp].nivel === n) libs.push(COLETOR[tp].nome.toLowerCase());
  for (const tp in ALIMENTADOR) if (ALIMENTADOR[tp].nivel === n) libs.push(`alimentador automático do ${ALIMENTADOR[tp].lugar}`);
  for (const id in FABRICAS) if (FABRICAS[id].nivel === n && FABRICAS[id].preco) libs.push(FABRICAS[id].nome.toLowerCase());
  for (const tipo in FRUTIFERAS) if (FRUTIFERAS[tipo].nivel === n) libs.push(FRUTIFERAS[tipo].nome.toLowerCase());
  for (const id in ENFEITES) if (ENFEITES[id].nivel === n) libs.push(ENFEITES[id].nome.toLowerCase());
  if (VARAL.nivel === n) libs.push('varal de luzes');
  if (n === COLMEIA.nivel) libs.push('colmeias');
  if (n === ADUBO.nivel) libs.push('adubo na loja');
  if (POMAR_BLOCOS.some(B => B.nivel === n)) libs.push('mais um terreno de pomar');
  if (PARCELAS.some(P => P.nivel === n)){ libs.push('mata nativa do outro lado da estrada'); montarPlacasMata(); }
  if (n === MIRANTE.nivel && parcelaComprada(0)){ libs.push('mirante da mata'); montarPlacaMirante(); }
  if (n === ARRENDAMENTO.nivel){ libs.push('o terreno abandonado, para arrendar'); montarPlacaCanto(); }
  if (n === HUD.nivel){ libs.push('a ajuda do Hud'); setTimeout(() => aviso('O Hud, irmão caçula do Ed, pode regar, tirar o mato e colher por você. Toque na casa para chamar.', '', 6), 4200); }
  if (n === IRRIGADOR.nivel) libs.push('irrigador automático');
  for (const id in MELHORIAS) for (const d of MELHORIAS[id].degraus) if (d.nivel === n) libs.push(d.nome.toLowerCase());
  if (n === COMPOSTEIRA.nivel) libs.push('a composteira das Minhoquinhas');
  if (COMPOSTEIRA.melhorias.some(m => m.nivel === n)) libs.push('mais minhocas');
  aviso(`Nível ${n}!` + (libs.length ? ` Liberou: ${libs.join(', ')}` : ''), 'grande', 4);
  if (ed) falar(ed, variar(FALAS_NIVEL), 2.2);
}
function gastar(v){ S.dinheiro -= v; hud(); }
function chipPulsa(id){ const e = $(id); e.classList.remove('pulsa'); void e.offsetWidth; e.classList.add('pulsa'); }

// pedidos e oferta do dia
const temNativa = prod => { const t = PRODUTOS[prod].nativa; return !t || (S.mata || []).some((d, i) => d && MATA_SLOTS[i].tipo === t); };
function produtosLiberados(){ const n = nivel(); return ORDEM_PRODUTOS.filter(p => PRODUTOS[p].nivel <= n && !PRODUTOS[p].so && (!PRODUTOS[p].fab || estFab(PRODUTOS[p].fab).feita) && (!PRODUTOS[p].precisa || estFab(PRODUTOS[p].precisa).feita) && temNativa(p) && (PRODUTOS[p].requer || []).every(temNativa)); }
// ================= mural de pedidos

const vagasPedido = () => (nivel() < 5 ? 1 : nivel() < 10 ? 2 : 3) + (S.viuCinePelucio ? 1 : 0);
const MAX_ITEM_PEDIDO = 30, BASE_MAX_PEDIDO = 40;

function gerarPedido(quem){
  const n = nivel();
  let disp = quem === 'pelucio' ? ['cafe', ...(estFab('torrador').feita ? ['torrado'] : [])] : produtosLiberados();
  // metade das vezes o Pelúcio pede também cacau ou chocolate, para o mocha
  if (quem === 'pelucio'){ const mata = COMPRA_DA_MATA.pelucio.filter(p => produtosLiberados().includes(p)); if (mata.length && Math.random() < 0.5) disp.push(sorteia(mata)); }

  // o tamanho do pedido acompanha o nível e quanta terra o Ed tem
  const escala = (22 + n * 14) * (1 + 0.35 * (S.lotes.filter(Boolean).length - 1));
  // Beto e Jaca não pedem item barato demais (centenas de cenouras): sorteiam entre os de quantidade-base até 40
  // e, se faltarem, completam com os de maior preço
  if (quem !== 'pelucio'){
    const razoaveis = disp.filter(p => escala / PRODUTOS[p].venda <= BASE_MAX_PEDIDO);
    if (razoaveis.length >= k) disp = razoaveis;
    else disp = [...razoaveis, ...disp.filter(p => !razoaveis.includes(p)).sort((a, b) => PRODUTOS[b].venda - PRODUTOS[a].venda).slice(0, k - razoaveis.length)];
  }
  const escolhidos = [];
  while (escolhidos.length < k){ const p = sorteia(disp); if (!escolhidos.includes(p)) escolhidos.push(p); }

  const itens = escolhidos.map(p => { const q = Math.min(MAX_ITEM_PEDIDO, Math.max(1, Math.round(escala / PRODUTOS[p].venda * rnd(0.6, 1)))); valor += q * PRODUTOS[p].venda; return [p, q]; });
  const ped = { quem, itens, dinheiro: Math.round(valor * 1.5 / 5) * 5, xp: Math.round(valor / 6) + 3, prazo: Date.now() + PRAZO_PEDIDO };

  if (Math.random() < 0.3){
    const culturas = ORDEM_CULTURAS.filter(c => CULTURAS[c].nivel <= n);

  }
  return ped;
}

function atualizarPedidos(){

  const p2 = S.pedidos[2], p3 = S.pedidos[3];
  if (p2 && p2.quem === 'pelucio'){
    if (!p3 || p3.espera){ S.pedidos[3] = p2; S.pedidos[2] = null; mudou = true; }
    else if (p3.quem === 'pelucio'){ S.pedidos[2] = { espera: agora }; mudou = true; }
  }
  for (let i = 0; i < 4; i++){
    let p = S.pedidos[i];
    if (i >= vagas){ continue; }
    if (!p){ S.pedidos[i] = gerarPedido(quemPede(i)); mudou = true; continue; }
    if (p.espera && agora >= p.espera){ S.pedidos[i] = gerarPedido(quemPede(i)); mudou = true; continue; }

    if (p.prazo && agora > p.prazo){ S.pedidos[i] = { espera: agora + 2 * 60 * 1000, venceu: true }; mudou = true; }
  }

}

function canteirosPorCultura(){

function faltaPedidos(cont){
  const pede = {}, falta = {};
  for (const p of S.pedidos || []) if (p && p.itens) for (const [k, q] of p.itens) if (CULTURAS[k]) pede[k] = (pede[k] || 0) + q;
  for (const k in pede){ const f = pede[k] - (S.celeiro[k] || 0) - (cont[k] || 0) * rendCultura(k); if (f > 0) falta[k] = f; }
  return falta;
}
// o mesmo para qualquer produto, descontando o que já está a caminho (fila de construção, árvores plantadas)
function faltaNoPedido(k, aCaminho = 0){
  let pede = 0;
  for (const p of S.pedidos || []) if (p && p.itens) for (const [k2, q] of p.itens) if (k2 === k) pede += q;

const FALAS = [];
function falar(quem, txt, dur = 2){

  const e = document.createElement('div');
  e.className = 'fala ' + (quem.nome || ''); e.textContent = txt;

function atualizarFalas(){
  const agora = performance.now();
  for (let i = FALAS.length - 1; i >= 0; i--){

    f.el.style.left = p.x + 'px'; f.el.style.top = (p.y - 8) + 'px';

const PART = [];
const geoPart = new THREE.BoxGeometry(0.06, 0.06, 0.06);
const matsPart = {};
function particula(x, y, z, cor, sobe = 1){
  const mat = matsPart[cor] || (matsPart[cor] = new THREE.MeshLambertMaterial({ color: cor }));
  const m = new THREE.Mesh(geoPart, mat);
  m.position.set(x, y, z); scene.add(m);
  PART.push({ m, v: new THREE.Vector3(rnd(-0.6, 0.6), sobe > 0 ? rnd(1.2, 2.4) * sobe : rnd(-0.3, 0.2), rnd(-0.6, 0.6)), vida: 0.7 });
}
function atualizarParticulas(dt){
  for (let i = PART.length - 1; i >= 0; i--){
    const p = PART[i];
    p.vida -= dt; p.v.y -= (p.g == null ? 6 : p.g) * dt; p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += dt * 8;
    if (p.cresce) p.m.scale.multiplyScalar(1 + p.cresce * dt);
    if (p.vida <= 0 || p.m.position.y < 0){ scene.remove(p.m); PART.splice(i, 1); }
  }
}

function lembretes(){
  const out = [];
  let sede = 0, mato = 0, prontas = 0, vazios = 0;
  for (const k in S.campo){ const t = S.campo[k]; if (t.e === 'arado') vazios++; if (t.e !== 'plantado') continue; if (t.p === 'sede') sede++; else if (t.p === 'mato') mato++; else if (t.prog >= 1) prontas++; }
  const plural = (n, um, varios) => `${n} ${n > 1 ? varios : um}`;
  if (prontas) out.push(['cesta', `colher ${plural(prontas, 'canteiro pronto', 'canteiros prontos')}`]);
  if (sede) out.push(['gota', `regar ${plural(sede, 'plantinha com sede', 'plantinhas com sede')}`]);
  if (mato) out.push(['mato', `tirar o mato de ${plural(mato, 'canteiro', 'canteiros')}`]);
  if (vazios) out.push(['semente', `plantar em ${plural(vazios, 'canteiro vazio', 'canteiros vazios')}`]);
  for (const tp in ANIMAIS){
    const A = ANIMAIS[tp];
    const fome = ANI.filter(a => a.d.tipo === tp && a.d.e === 'fome').length, prontos = ANI.filter(a => a.d.tipo === tp && a.d.e === 'pronto').length;
    if (fome) out.push(['racao', `dar ração para ${plural(fome, tp === 'galinha' ? 'galinha' : 'vaca', A.plural)}`]);
    if (prontos && !S.coletor[tp]) out.push([A.produto, tp === 'galinha' ? `pegar ${plural(prontos, 'ovo', 'ovos')}` : `tirar leite de ${plural(prontos, 'vaca', 'vacas')}`]);
  }
  for (const tp in COLETOR){
    if (!S.coletor[tp] || !naCaixa(tp)) continue;
    const cheia = naCaixa(tp) >= capCaixa(tp);
    out.push([ANIMAIS[tp].produto, `esvaziar a caixa d${tp === 'galinha' ? 'o coletor de ovos' : 'a ordenhadeira'}` + (cheia ? ' (cheia, os bichos pararam)' : '')]);
  }
  if (S.racao < 4 && ANI.length) out.push(['racao', `comprar ração (só tem ${S.racao})`]);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), planoChao = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ptChao = new THREE.Vector3();
const FUNDO_DE_CANTEIRO = ['irrigador', 'enfeite', 'arvore', 'alimentador', 'coletor', 'maca', 'trufa'];
const planoCanteiro = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.12), ptCanteiro = new THREE.Vector3();
function canteiroAtras(obj){
  if (!ray.ray.intersectPlane(planoCanteiro, ptCanteiro)) return null;
  const x = Math.floor(ptCanteiro.x), z = Math.floor(ptCanteiro.z);
  if (!campo(x, z) && loteDe(x, z) < 0) return null;
  let raiz = obj; while (raiz.parent && raiz.parent !== scene) raiz = raiz.parent;
  // perto da base do objeto, o toque continua sendo nele
  if (Math.hypot(ptCanteiro.x - raiz.position.x, ptCanteiro.z - raiz.position.z) < 0.38) return null;
  return { k: 'tile', x, z };
}
function alvoNaTela(cx, cy){
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickaveis.filter(o => o.visible !== false), true);
  // fogo, lixo e galho na frente de tudo: são urgentes e pequenos
  const hitOc = hits.find(h => h.object.userData.alvo && h.object.userData.alvo.k === 'ocorrencia');
  if (hitOc) return hitOc.object.userData.alvo;
  const hitTrufa = hits.find(h => h.object.userData.alvo && h.object.userData.alvo.k === 'trufa');
  if (hitTrufa && !canteiroAtras(hitTrufa.object)) return hitTrufa.object.userData.alvo;
  // a copa de uma árvore na frente não pode esconder a maçã, mas um canteiro atrás dela continua valendo
  if (hits.some(h => h.object === macaHit) && !canteiroAtras(macaHit)) return macaHit.userData.alvo;
  for (const h of hits){
    let o = h.object, vis = true;
    for (let p = o; p; p = p.parent) if (p.visible === false) vis = false;
    if (!vis || !o.userData.alvo) continue;
    // objetos altos (irrigador, enfeites, árvores, alimentador) não podem esconder os canteiros atrás deles:
    // se o toque passa por cima do objeto e cai num canteiro, vale o canteiro; o objeto só é escolhido tocando na base dele
    if (FUNDO_DE_CANTEIRO.includes(o.userData.alvo.k)){
      const atras = canteiroAtras(o);
      if (atras) return atras;
    }
    return o.userData.alvo;
  }
  if (ray.ray.intersectPlane(planoChao, ptChao)){
    const x = Math.floor(ptChao.x), z = Math.floor(ptChao.z);
    if (x >= 0 && z >= 0 && x < W && z < H){
      const p = PREDIO_EM[iT(x, z)];
      if (p) return { k: 'predio', p };
      const t = tipo(x, z);
      if (t === 'mata' || t === 'orlaF') return { k: 'floresta', x, z };
      if (t === 'canto') return { k: 'canto' };
      if (t === 'arvore') return { k: 'arvore', x, z, arbusto: ARBUSTOS.some(([a, b]) => a === x && b === z) };
      for (const tp in COLETOR) if (S.coletor[tp] && COLETOR[tp].x === x && COLETOR[tp].z === z) return { k: 'coletor', tp };
      for (const tp in ALIMENTADOR) if (S.alimentador[tp] && ALIMENTADOR[tp].x === x && ALIMENTADOR[tp].z === z) return { k: 'alimentador', tp };
      if (dentroComposteira(x, z)) return { k: 'composteira' };
      { const i = POMAR_SLOTS.findIndex(([a, b]) => a === x && b === z); if (i >= 0 && blocoComprado(blocoDoSlot(i))) return { k: 'pomar', i }; }
      { const b = blocoEm(x, z); if (b > 0 && !blocoComprado(b)) return { k: 'pomarLote', b }; }
      { const i = COLMEIA_SLOTS.findIndex(([a, b]) => a === x && b === z); if (i >= 0) return { k: 'colmeia', i }; }
      return { k: 'tile', x, z };
    }
  }
  return null;
}

const ponteiros = new Map();
let arrastou = false, pinca = 0, inicio = null;
function eventos(){

    canvas.setPointerCapture(e.pointerId);
    ponteiros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ponteiros.size === 1){ arrastou = false; inicio = { x: e.clientX, y: e.clientY }; }
    if (ponteiros.size === 2){ const [a, b] = [...ponteiros.values()]; pinca = Math.hypot(a.x - b.x, a.y - b.y); arrastou = true; }
    if (e.pointerType !== 'mouse') marcaHover.visible = false;
  });
  canvas.addEventListener('pointermove', e => {
    const p = ponteiros.get(e.pointerId);
    if (!p){
      if (e.pointerType === 'mouse'){
        const a = alvoNaTela(e.clientX, e.clientY);
        if (a && a.k === 'tile') marcar(marcaHover, a.x, a.z); else marcaHover.visible = false;
      }
      return;
    }
    if (ponteiros.size === 1){
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (!arrastou && Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 7) arrastou = true;
      if (arrastou && !cine){ arrastar(dx, dy); marcaHover.visible = false; }
    } else if (ponteiros.size === 2){
      p.x = e.clientX; p.y = e.clientY;
      const [a, b] = [...ponteiros.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinca > 0) zoom(pinca / d);
      pinca = d; return;
    }
    p.x = e.clientX; p.y = e.clientY;
  });
  const solta = e => {
    if (!ponteiros.has(e.pointerId)) return;
    ponteiros.delete(e.pointerId);
    if (e.type === 'pointerup' && !arrastou && ponteiros.size === 0) tocou(e.clientX, e.clientY);
    if (ponteiros.size === 0) pinca = 0;
  };
  canvas.addEventListener('pointerup', solta);
  canvas.addEventListener('pointercancel', solta);
