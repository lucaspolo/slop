<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fazenda Joli Pig · slop</title>
<meta name="description" content="Jogo de fazenda em voxel com mapa isométrico: o porquinho Ed planta, cuida das galinhas e das vacas e chama o irmão Beto para vender tudo no Joli Market.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gochi+Hand&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: fazenda em voxel em tela cheia, vista isométrica. Placa com nível no canto superior esquerdo, dinheiro e ração no direito,
   barra de ações embaixo, controles de câmera à direita. Menus de ação abrem perto de onde se tocou. */
[hidden]{display:none !important}
:root{
  --ceu-1:#9fd8f2;
  --ceu-2:#dff3ea;
  --papel:#fff8e9;
  --papel-2:#f6ead0;
  --tinta:#3b2a20;
  --tinta-suave:#7a6352;
  --borda:#3b2a20;
  --sombra:rgba(59,42,32,.32);
  --amarelo:#f7e17a;
  --amarelo-forte:#efc93e;
  --azul:#b5d6f0;
  --azul-forte:#6aa7da;
  --rosa:#e0408a;
  --rosa-claro:#f7c3d6;
  --verde:#5aa83c;
  --verde-escuro:#3e7f2b;
  --vermelho:#d24a3c;
  --madeira:#b8834f;
  --f-titulo:"Bagel Fat One","Arial Black",Impact,sans-serif;
  --f-texto:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--ceu-1),var(--ceu-2));color:var(--tinta);font-family:var(--f-texto);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#jogo{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#tela{display:block;width:100%;height:100%;cursor:pointer}

/* painéis */
.painel{background:var(--papel);border:3px solid var(--borda);border-radius:14px;box-shadow:0 4px 0 var(--sombra)}
.hud-topo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.placa{padding:7px 12px 8px;min-width:0;pointer-events:auto}
.marca{font-family:var(--f-titulo);font-size:clamp(17px,4.4vw,24px);line-height:1;color:var(--rosa);white-space:nowrap;letter-spacing:.01em}
.nivel{display:flex;align-items:center;gap:7px;margin-top:6px}
.selo-nivel{flex:none;display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--amarelo);border:2px solid var(--borda);font-family:var(--f-titulo);font-size:15px;line-height:1}
.barra-xp{flex:1;min-width:70px;height:10px;border:2px solid var(--borda);border-radius:999px;background:var(--papel-2);overflow:hidden}
.barra-xp i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.xp-texto{font-size:12px;font-weight:700;color:var(--tinta-suave);white-space:nowrap;font-variant-numeric:tabular-nums}
.recursos{display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;font-family:var(--f-titulo);font-size:clamp(16px,4vw,21px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip img{width:30px;height:30px}
.chip.pulsa{animation:pulsa .35s ease-out}
@keyframes pulsa{40%{transform:scale(1.12)}}

/* barra de baixo */
.hud-base{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:grid;justify-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.acoes{display:flex;gap:8px;pointer-events:auto;padding:6px;flex-wrap:nowrap;max-width:100%}
.acao{all:unset;box-sizing:border-box;display:grid;justify-items:center;gap:2px;min-width:66px;padding:6px 8px 5px;border-radius:10px;cursor:pointer;font-weight:800;font-size:12px;line-height:1.1;text-align:center;white-space:nowrap}
.acao img,.acao svg{width:38px;height:38px;display:block}
.acao:hover{background:var(--papel-2)}
.acao:focus-visible{outline:3px solid var(--rosa);outline-offset:1px}
.acao.destaque{background:var(--azul);animation:chama 1.2s ease-in-out infinite}
@keyframes chama{50%{background:#d8eaf8}}
.acao .bolinha{position:absolute;margin:-4px 0 0 30px;background:var(--rosa);color:#fff;border:2px solid var(--borda);border-radius:999px;font-size:11px;padding:1px 5px}
.acao{position:relative}

.dica{max-width:min(560px,calc(100vw - 32px));padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;line-height:1.3;pointer-events:auto;animation:sobe .3s ease-out}
.dica img{width:34px;height:34px;flex:none}
.dica .x{all:unset;cursor:pointer;flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;font-weight:800;color:var(--tinta-suave)}
.dica .x:hover{background:var(--papel-2)}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}
.modo{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;background:var(--amarelo);font-weight:800;font-size:14px;pointer-events:auto;max-width:calc(100vw - 32px)}
.modo img{width:28px;height:28px;flex:none}
.modo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fila{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.fila img{width:26px;height:26px}

/* câmera */
.camera-ctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:6px;pointer-events:auto}
.cam{all:unset;box-sizing:border-box;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;background:var(--papel);border:3px solid var(--borda);border-radius:12px;box-shadow:0 3px 0 var(--sombra)}
.cam svg{width:22px;height:22px}
.cam:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sombra)}
.cam:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}

/* botões */
.botao{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--amarelo);border:3px solid var(--borda);box-shadow:0 3px 0 var(--sombra);font-weight:800;font-size:15px;cursor:pointer;text-align:center;line-height:1.15}
.botao:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sombra)}
.botao:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.botao.azul{background:var(--azul)}
.botao.verde{background:#bfe39a}
.botao.rosa{background:var(--rosa-claro)}
.botao.claro{background:var(--papel)}
.botao[disabled],.botao.off{opacity:.45;cursor:default;pointer-events:none}
.botao.mini{padding:5px 10px;font-size:13px;border-width:2px;border-radius:9px;box-shadow:0 2px 0 var(--sombra)}
.botao img{width:24px;height:24px}

/* menu de ação */
.menu{position:absolute;z-index:20;width:250px;max-width:calc(100vw - 24px);padding:10px;pointer-events:auto;animation:abre .14s ease-out;transform-origin:top left}
@keyframes abre{from{transform:scale(.9);opacity:0}}
.menu h3{margin:0 0 2px;font-family:var(--f-titulo);font-weight:400;font-size:19px;line-height:1.1;display:flex;align-items:center;gap:8px}
.menu h3 img{width:32px;height:32px}
.menu .estado{font-size:13px;font-weight:700;color:var(--tinta-suave);margin:2px 0 6px;line-height:1.3}
.menu .estado.alerta{color:var(--vermelho)}
.menu .estado.bom{color:var(--verde-escuro)}
.menu .prog{height:9px;border:2px solid var(--borda);border-radius:999px;background:var(--papel-2);overflow:hidden;margin:0 0 8px}
.menu .prog i{display:block;height:100%;background:var(--verde)}
.menu .itens{display:grid;gap:5px}
.item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:2px solid var(--borda);background:var(--papel-2);cursor:pointer;font-weight:800;font-size:14px;line-height:1.15}
.item img{width:30px;height:30px;flex:none}
.item span{flex:1;min-width:0}
.item small{display:block;font-weight:700;font-size:12px;color:var(--tinta-suave)}
.item b{flex:none;font-size:13px;white-space:nowrap}
.item:hover{background:var(--amarelo)}
.item:focus-visible{outline:3px solid var(--rosa);outline-offset:1px}
.item.off{opacity:.45;cursor:default;pointer-events:none}
.item.leve{background:transparent;border-style:dashed}

/* falas e números flutuantes */
.fala{position:absolute;left:0;top:0;z-index:5;max-width:220px;padding:7px 11px;background:#fff;border:3px solid var(--borda);border-radius:14px;font-weight:700;font-size:13px;line-height:1.25;pointer-events:none;transform:translate(-50%,-100%);box-shadow:0 3px 0 var(--sombra);text-align:center}
.fala::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--borda);border-bottom:0}
.fala.beto{background:#e6f1fb}
.fala.jaca{background:#e8f6dc}
.janela-topo.verde{background:#cdeab0}
.flutua{position:absolute;left:0;top:0;z-index:6;font-family:var(--f-titulo);font-size:17px;color:#fff;-webkit-text-stroke:5px var(--borda);paint-order:stroke fill;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:3px;animation:flutua 1.3s ease-out forwards}
.flutua img{width:24px;height:24px}
.flutua.ouro{color:#ffd84a}
.flutua.xp{color:#9be36a}
@keyframes flutua{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-56px);opacity:0}}

.avisos{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);display:grid;justify-items:center;gap:6px;pointer-events:none;padding:0 16px;z-index:15}
.aviso{padding:7px 14px;font-weight:800;font-size:14px;text-align:center;animation:sobe .25s ease-out;transition:opacity .4s,transform .4s;max-width:min(480px,100%)}
.aviso.grande{font-family:var(--f-titulo);font-weight:400;font-size:clamp(20px,5vw,28px);background:var(--amarelo)}
.aviso.ruim{background:#f8d2c9}
.aviso.sai{opacity:0;transform:translateY(-8px)}

/* janelas */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(40,28,20,.38);pointer-events:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.janela{width:min(560px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;overflow:hidden;animation:abre .16s ease-out;transform-origin:center}
.janela-topo{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;border-bottom:3px solid var(--borda);background:var(--amarelo)}
.janela-topo.azul{background:var(--azul)}
.janela-topo.rosa{background:var(--rosa-claro)}
.janela-topo img{width:46px;height:46px;flex:none}
.janela-topo h2{margin:0;font-family:var(--f-titulo);font-weight:400;font-size:clamp(21px,5vw,27px);line-height:1}
.janela-topo .sub{font-weight:700;font-size:13px;color:var(--tinta-suave);margin-top:3px}
.janela-topo .fechar{all:unset;margin-left:auto;align-self:flex-start;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:2px solid var(--borda);background:var(--papel);font-weight:800;font-size:18px;cursor:pointer;flex:none}
.janela-topo .fechar:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.janela-corpo{padding:12px 14px 16px;overflow:auto;-webkit-overflow-scrolling:touch}
.janela-corpo p{margin:0 0 10px;line-height:1.45;font-weight:500}
.abas{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.aba{all:unset;padding:6px 12px;border-radius:999px;border:2px solid var(--borda);font-weight:800;font-size:14px;cursor:pointer;background:var(--papel)}
.aba[aria-selected="true"]{background:var(--rosa-claro)}
.aba:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cartao{border:2px solid var(--borda);border-radius:12px;background:var(--papel-2);padding:8px;display:grid;gap:4px;align-content:start}
.cartao .cab{display:flex;align-items:center;gap:6px}
.cartao .cab img{width:42px;height:42px;flex:none}
.cartao h4{margin:0;font-weight:800;font-size:15px;line-height:1.1}
.cartao .info{font-size:12px;font-weight:700;color:var(--tinta-suave);line-height:1.35}
.cartao .botoes{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.cartao.bloq{opacity:.55}
.cartao.oferta{background:#fff1b8}
.linhas{display:grid;gap:6px}
.linha{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid var(--borda);border-radius:12px;background:var(--papel-2)}
.linha img{width:36px;height:36px;flex:none}
.linha .nome{flex:1;min-width:0;font-weight:800;font-size:14px;line-height:1.2}
.linha .nome small{display:block;font-weight:700;font-size:12px;color:var(--tinta-suave)}
.linha .qtd{font-family:var(--f-titulo);font-size:19px;min-width:34px;text-align:right}
.linha.oferta{background:#fff1b8}
.selo{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--rosa);color:#fff;font-size:11px;font-weight:800;vertical-align:1px;margin-left:4px}
.pedido{border:3px dashed var(--borda);border-radius:14px;padding:10px 12px;background:#fffdf6;margin-bottom:12px}
.pedido h4{margin:0 0 6px;font-family:var(--f-titulo);font-weight:400;font-size:18px}
.pedido ul{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pedido li{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;border:2px solid var(--borda);border-radius:999px;background:var(--papel);font-weight:800;font-size:13px}
.pedido li img{width:24px;height:24px}
.pedido li.ok{background:#d8f0c0}
.pedido .rec{font-weight:800;font-size:14px;margin-bottom:8px}
.rodape-janela{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:12px}
.total{font-family:var(--f-titulo);font-size:20px}
.vazio{padding:14px;text-align:center;font-weight:700;color:var(--tinta-suave);border:2px dashed var(--tinta-suave);border-radius:12px}
.fala-janela{position:relative;background:#fff;border:3px solid var(--borda);border-radius:14px;padding:9px 12px;font-weight:700;margin:0 0 12px;line-height:1.35}
.passos{margin:0 0 12px;padding-left:20px;line-height:1.5;font-weight:500}
.passos li{margin-bottom:4px}
.ajuste{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--papel-2);font-weight:800}
a{color:var(--rosa)}

.erro{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:800;font-size:18px;z-index:40}
.carregando{font-family:var(--f-titulo);font-weight:400;font-size:26px;color:var(--rosa)}

/* caderno do Ed: folha pautada, margem vermelha, espiral e letra de criança */
.caderno{position:relative;background:#fffdf4;border:2px solid var(--borda);border-radius:12px;padding:12px 16px 18px 58px;font-family:"Gochi Hand","Comic Sans MS",cursive;font-size:21px;line-height:30px;color:#3b3a7a;
  background-image:linear-gradient(90deg,transparent 44px,#f2a1a1 44px,#f2a1a1 46px,transparent 46px),repeating-linear-gradient(180deg,transparent 0 29px,#c6dbef 29px 30px);background-position:0 0,0 12px;overflow:hidden}
.caderno::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:18px;background:radial-gradient(circle at 9px 15px,#3b2a20 0 4px,#fffdf4 4.5px 5.5px,transparent 6px) 0 0/18px 30px repeat-y}
.caderno h2,.caderno h3{font-family:inherit;font-weight:400;margin:0;line-height:30px}
.caderno h2{font-size:32px;color:#c2365f;line-height:60px}
.caderno h3{font-size:25px;color:#2f6fb3;margin-top:30px}
.caderno p{margin:0;font-weight:400;line-height:30px}
.caderno ul{list-style:none;margin:0;padding:0}
.caderno li{line-height:30px;display:flex;align-items:center;gap:8px}
.caderno li img{width:26px;height:26px}
.caderno .caixa{flex:none;width:20px;height:20px;border:2.5px solid #3b3a7a;border-radius:4px;display:grid;place-items:center;font-size:20px;line-height:1;color:#2e9e3c;transform:rotate(-4deg)}
.caderno li.feito .texto{text-decoration:line-through;text-decoration-color:#2e9e3c;text-decoration-thickness:2px}
.caderno small{font-size:17px;color:#7a7aa8}
.caderno .grifo{background:linear-gradient(transparent 55%,#fff07a 55% 90%,transparent 90%)}
.caderno .botao{font-family:var(--f-texto);margin-top:6px}
.rabiscos{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:0 0 0 -8px;height:120px}
.rabisco{display:block;transform:rotate(var(--r,0deg))}
.rabisco figcaption{text-align:center;font-size:20px;line-height:20px;margin-top:-4px}
.rabisco-canto{position:absolute;pointer-events:none}
@media (max-width:560px){
  .modal{place-items:end center;padding:0}
  .janela{width:100%;max-height:86vh;border-radius:18px 18px 0 0;border-bottom:0}
  /* no celular a barra ocupa a largura toda e os rótulos quebram em duas linhas em vez de vazar */
  .hud-base{padding:0 10px}
  .acoes{width:100%;gap:2px;padding:5px 4px}
  .acao{flex:1 1 0;min-width:0;padding:5px 2px 4px;font-size:11px;white-space:normal;overflow-wrap:anywhere;align-content:start}
  .acao img,.acao svg{width:30px;height:30px}
  .acao .bolinha{margin-left:22px}
  .camera-ctl{top:calc(env(safe-area-inset-top,0px) + 118px);transform:none;grid-template-columns:1fr}
  .cam{width:38px;height:38px}
  .xp-texto{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="jogo">
  <canvas id="tela" aria-label="A fazenda vista de cima"></canvas>

  <div class="hud-topo">
    <div class="placa painel">
      <div class="marca">Fazenda Joli Pig</div>
      <div class="nivel"><span class="selo-nivel" id="nivel" title="Nível">1</span><div class="barra-xp" aria-hidden="true"><i id="xpBarra"></i></div><span class="xp-texto" id="xpTexto"></span></div>
    </div>
    <div class="recursos">
      <div class="chip painel" id="chipDinheiro" title="Dinheiro"><img data-icone="moeda" alt=""><span id="dinheiro">R$ 0</span></div>
      <div class="chip painel" id="chipRacao" title="Ração para os bichos"><img data-icone="racao" alt=""><span id="racao">0</span></div>
    </div>
  </div>

  <div class="fila painel" id="fila" hidden><img data-icone="ed" alt=""><span id="filaTexto"></span><button class="botao mini claro" id="filaLimpar" type="button">limpar</button></div>

  <div class="avisos" id="avisos" aria-live="polite"></div>

  <div class="camera-ctl">

PRODUTOS.ovo = { nome:'Ovo', plural:'ovos', venda:9, nivel:1 };

  { id:'curral',     nome:'Curral',              x0:20, z0:11, x1:21, z1:11, porta:[19, 12] },

const PREDIO = {}; PREDIOS.forEach(p => { PREDIO[p.id] = p; });
const ARVORES = [[0,1,0],[1,5,1],[0,9,2],[1,13,0],[11,1,1],[19,2,0],[21,1,2],[23,4,1],[23,8,0],[23,13,2],[2,0,1],[8,0,0],[23,0,1],[0,15,1]];

function montarMapa(){
  for (let x = 0; x < W; x++){ setT(x, 17, 'estrada'); setT(x, 16, 'cerca'); }
  setT(15, 16, 'portao');
  for (let z = 5; z <= 15; z++) setT(15, z, 'caminho');
  for (let x = 4; x <= 15; x++) setT(x, 5, 'caminho');
  setT(9, 4, 'caminho'); setT(16, 8, 'caminho'); setT(16, 13, 'caminho');

  for (const [x, z] of ARBUSTOS) setT(x, z, 'arvore');

const andavel = (x, z) => { const t = tipo(x, z); return !!t && t !== 'cerca' && t !== 'predio' && t !== 'arvore' && t !== 'feno'; };

function rota(sx, sz, gx, gz){
  if (!andavel(gx, gz)) return null;
  const N = W * H, g = new Float32Array(N).fill(Infinity), de = new Int32Array(N).fill(-1), fechado = new Uint8Array(N);

  const aberto = [ini];
  const h = i => { const dx = Math.abs(i % W - gx), dz = Math.abs(((i / W) | 0) - gz); return Math.max(dx, dz) + 0.414 * Math.min(dx, dz); };
  while (aberto.length){
    let bi = 0, bf = Infinity;
    for (let k = 0; k < aberto.length; k++){ const f = g[aberto[k]] + h(aberto[k]); if (f < bf){ bf = f; bi = k; } }
    const cur = aberto.splice(bi, 1)[0];
    if (cur === fim) break;
    if (fechado[cur]) continue;
    fechado[cur] = 1;
    const cx = cur % W, cz = (cur / W) | 0;
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
      if (!dx && !dz) continue;
      const nx = cx + dx, nz = cz + dz;
      if (!andavel(nx, nz)) continue;
      if (dx && dz && (!andavel(cx + dx, cz) || !andavel(cx, cz + dz))) continue;
      const ni = iT(nx, nz), ng = g[cur] + (dx && dz ? 1.414 : 1);
      if (ng < g[ni]){ g[ni] = ng; de[ni] = cur; aberto.push(ni); }
    }
  }
  if (de[fim] === -1 && fim !== ini) return null;
  const pts = [];
  for (let i = fim; i !== -1 && i !== ini; i = de[i]) pts.push([i % W + 0.5, ((i / W) | 0) + 0.5]);
  return pts.reverse();
}

function vPorco(cor, bolso, soCabeca){

    for (const lado of [-1, 1]) for (let x = 6; x <= 9; x++) for (let y = 22; y <= 36; y++) for (let z = -14; z <= 14; z++){
      const X = lado * x, d = (X / 15.3) ** 2 + ((y - 27) / 7.6) ** 2 + (z / 12.9) ** 2;
      if (d <= 1 && d >= 0.7) v.set(X, y, z, (x === 6 || x === 9) ? costura : cor);
    }
    for (const lado of [-1, 1]) for (const [x, y] of [[7, 29], [8, 29], [7, 30], [8, 30]]){ const z = frenteZ(lado * x, y); v.set(lado * x, y, z + 1, botao); }
    const zb = {};
    for (let x = -6; x <= 6; x++) for (let y = 9; y <= 20; y++){
      const z = frenteZ(x, y) + 1; zb[x + ',' + y] = z;
      v.set(x, y, z, (Math.abs(x) === 6 || y === 9 || y === 20) ? borda : bolso);
    }

  camera.position.copy(cam.alvo).addScaledVector(d, 60);

// ================= texturas de texto e bolhas
// linhas: [[texto, peso, cor]]. O tamanho de cada linha encolhe até caber na largura, com margem.
function texturaTexto(linhas, w, h, fundo, moldura){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = fundo; g.fillRect(0, 0, w, h);
  if (moldura){ const m = h * 0.07; g.strokeStyle = moldura; g.lineWidth = h * 0.045; g.strokeRect(m, m, w - 2 * m, h - 2 * m); }
  const fonte = px => `${px}px "Bagel Fat One", "Arial Black", Impact, sans-serif`;
  const pesoTotal = linhas.reduce((a, l) => a + l[1], 0);
  const base = h * 0.74 / pesoTotal;
  const tams = linhas.map(([t, peso]) => {
    let px = base * peso;
    g.font = fonte(px);
    const larg = g.measureText(t).width, max = w * 0.84;
    if (larg > max) px *= max / larg;
    return px;
  });
  const alturaTotal = tams.reduce((a, b) => a + b, 0) + (linhas.length - 1) * h * 0.03;
  let y = (h - alturaTotal) / 2;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  linhas.forEach(([t, , cor], i) => {
    g.font = fonte(tams[i]); g.fillStyle = cor;
    g.fillText(t, w / 2, y + tams[i] / 2 + tams[i] * 0.05);
    y += tams[i] + h * 0.03;
  });
  const tx = new THREE.CanvasTexture(c); tx.anisotropy = 4; return tx;
}
function placaDeTexto(textura, larg, alt){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(larg, alt), new THREE.MeshLambertMaterial({ map: textura }));
  m.receiveShadow = true; return m;
}
const TEX_BOLHA = {};
function texBolha(nome){

  const g = c.getContext('2d');

  g.beginPath(); g.moveTo(16, 6); g.lineTo(80, 6); g.quadraticCurveTo(90, 6, 90, 16); g.lineTo(90, 76); g.quadraticCurveTo(90, 86, 80, 86);

  g.fill(); g.stroke();
  if (ICONE[nome]) g.drawImage(ICONE[nome].canvas, 12, 10, 72, 72);

function texMarca(cor){

// ================= cena: chão e enfeites
const pickaveis = [];
function corChao(t, gx, gz){
  const r = hash(gx, 1, gz), r2 = hash(gx >> 1, 2, gz >> 1);
  switch (t){
    case 'caminho': return r < 0.5 ? 0xdcc08a : 0xd2b47c;
    case 'estrada': { const lz = gz % 4; return (lz === 1 || lz === 2) && r < 0.6 ? 0xae8a5e : (r < 0.5 ? 0xc49e6c : 0xbb9564); }
    case 'pastoG': return r < 0.5 ? 0xd9c27d : 0xcfb56c;
    case 'pastoV': return r2 < 0.5 ? (r < 0.5 ? 0x6db24a : 0x67a945) : (r < 0.5 ? 0x75b94f : 0x6fb14b);
    case 'campo': return r2 < 0.5 ? (r < 0.5 ? 0x8fcb5f : 0x88c45a) : (r < 0.5 ? 0x94cf63 : 0x8cc85d);
    default: return r2 < 0.5 ? (r < 0.5 ? 0x7cc657 : 0x76bf52) : (r < 0.5 ? 0x84cc5d : 0x7fc458);
  }
}
let chao;
function construirChao(){
  const v = new Vox();
  for (let z = 0; z < H; z++) for (let x = 0; x < W; x++){
    const t = tipo(x, z);
    for (let i = 0; i < 4; i++) for (let k = 0; k < 4; k++){
      const gx = x * 4 + i, gz = z * 4 + k;
      v.set(gx, -1, gz, corChao(t, gx, gz));
      v.set(gx, -2, gz, 0x9a6a43); v.set(gx, -3, gz, 0x8a5c3a);
    }
  }
  const GW = W * 4, GH = H * 4;
  for (let gz = 0; gz < GH; gz++) for (let gx = 0; gx < GW; gx++){
    const b = Math.min(gx, gz, GW - 1 - gx, GH - 1 - gz), n = hash(gx, 0, gz), n2 = hash(gx >> 2, 9, gz >> 2);
    if (b >= 1 + (n < 0.5 ? 0 : 1)) v.set(gx, -4, gz, 0x7a4e33);
    if (b >= 3 + Math.floor(n2 * 3)) v.set(gx, -5, gz, 0x6c4430);
    if (b >= 6 + Math.floor(n2 * 4)) v.set(gx, -6, gz, 0x5e3b2a);
    if (b >= 11 + Math.floor(n2 * 5)) v.set(gx, -7, gz, 0x53342a);
  }
  chao = new THREE.Mesh(v.build(1 / 4, { origin: [0, 0, 0], semFundo: true, jitter: 0 }), MAT);
  chao.receiveShadow = true;
  scene.add(chao);
  // tufinhos de grama e flores espalhados
  const tf = new Vox();
  for (let gz = 0; gz < H * 16; gz++) for (let gx = 0; gx < W * 16; gx++){
    const t = tipo(gx >> 4, gz >> 4);
    if (t !== 'grama' && t !== 'pastoV') continue;
    const r = hash(gx, 5, gz);
    if (r < 0.012){ const h = 1 + (r < 0.005 ? 1 : 0); tf.box(gx, 0, gz, gx, h - 1, gz, r < 0.006 ? 0x5ea341 : 0x6db74a); if (r < 0.0012) tf.set(gx, h, gz, sorteiaH([0xf2d14a, 0xffffff, 0xf27fa4], gx, gz)); }
  }
  const mt = new THREE.Mesh(tf.build(1 / 16, { origin: [0, 0, 0], jitter: 0.02 }), MAT); mt.receiveShadow = true; scene.add(mt);
}
function colocar(m, x, y, z, ry = 0){ m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m; }
function construirCenario(){

    m.userData.alvo = { k: 'predio', p };

  }
  for (const [x, z, t] of ARVORES){
    const m = colocar(malha(geo('arvore' + t, () => vArvore(t).build(1 / 8, { origin: [4, 0, 4] }))), x + 0.5, 0, z + 0.5, Math.floor(hash(x, 4, z) * 4) * Math.PI / 2);
    m.userData.alvo = { k: 'arvore', x, z }; pickaveis.push(m);
  }
  for (const [x, z] of ARBUSTOS){ const m = colocar(malha(geo('arbusto', () => vArbusto().build(1 / 8, { origin: [4, 0, 4] }))), x + 0.5, 0, z + 0.5); m.userData.alvo = { k: 'arvore', x, z, arbusto: true }; pickaveis.push(m); }
  for (const [x, z] of FENOS) colocar(malha(geo('feno', () => vFeno().build(1 / 16, { origin: [8, 0, 8] }))), x + 0.5, 0, z + 0.5, Math.PI / 2 * (z % 2));
  FLORES.forEach(([x, z], i) => colocar(malha(geo('flor' + i, () => vFlores(i + 3).build(1 / 16, { origin: [8, 0, 8] })), false), x + 0.5, 0, z + 0.5));
  // cercas
  const ehCerca = (x, z) => { const t = tipo(x, z); return t === 'cerca' || t === 'portao'; };
  for (let z = 0; z < H; z++) for (let x = 0; x < W; x++){
    const t = tipo(x, z);
    if (t === 'cerca'){
      const m = (ehCerca(x + 1, z) ? 1 : 0) | (ehCerca(x - 1, z) ? 2 : 0) | (ehCerca(x, z + 1) ? 4 : 0) | (ehCerca(x, z - 1) ? 8 : 0);
      colocar(malha(geo('cerca' + m, () => vCerca(m).build(1 / 16, { origin: [8, 0, 8] }))), x + 0.5, 0, z + 0.5);
    } else if (t === 'portao'){
      const arco = x === 15 && z === 16;
      const aoLongoX = ehCerca(x + 1, z) || ehCerca(x - 1, z);
      const m = colocar(malha(geo('portao' + arco, () => vPortao(arco).build(1 / 16, { origin: [8, 0, 8] }))), x + 0.5, 0, z + 0.5, aoLongoX ? 0 : Math.PI / 2);
      if (arco){
        const tex = texturaTexto([['FAZENDA', 0.62, '#7a4a2a'], ['JOLI PIG', 1, '#c2365f']], 768, 256, '#f3e3c3');
        for (const lado of [1, -1]){
          const pl = placaDeTexto(tex, 26 / 16, 9 / 16);
          pl.position.set(0, 26.5 / 16, lado > 0 ? 3.06 / 16 : -3.06 / 16);
          if (lado < 0) pl.rotation.y = Math.PI;
          m.add(pl);
        }
      }
    }
  }
}

const VIS = {};
function estagio(t){ if (t.e !== 'plantado') return -1; if (t.prog >= 1) return 3; if (t.prog >= 0.55) return 2; if (t.prog >= 0.2) return 1; return 0; }
function avancar(t, dt){
  const c = CULTURAS[t.c];
  let resta = dt;
  while (resta > 0 && !t.p && t.prog < 1){
    const prox = t.ev < t.evs.length ? t.evs[t.ev] : null;
    const alvo = prox ? prox[0] : 1;
    if (prox && t.prog >= alvo){ t.p = prox[1]; break; }
    const precisa = (alvo - t.prog) * c.tempo;
    if (resta >= precisa){ t.prog = alvo; resta -= precisa; if (prox) t.p = prox[1]; }
    else { t.prog += resta / c.tempo; resta = 0; }
  }
  if (t.prog >= 1) t.prog = 1;
  if (!t.p && t.ev < t.evs.length && t.prog >= t.evs[t.ev][0]) t.p = t.evs[t.ev][1];
}
function faltaSegundos(t){ return (1 - t.prog) * CULTURAS[t.c].tempo; }
function atualizarCampo(x, z){
  const t = campo(x, z), k = chave(x, z);
  const vis = VIS[k] || (VIS[k] = { solo: null, planta: null, mato: null, bolha: null, cs: '', cp: '' });
  const px = x + 0.5, pz = z + 0.5;
  const cs = !t || t.e === 'grama' ? '' : (t.e === 'plantado' && t.p !== 'sede' ? 'molhado' : 'seco');
  if (cs !== vis.cs){
    if (vis.solo) scene.remove(vis.solo);
    vis.solo = cs ? colocar(malha(geo('solo' + cs, () => vSolo(cs === 'molhado').build(1 / 16, { origin: [8, 0, 8] })), false), px, 0, pz) : null;
    vis.cs = cs;
  }
  const est = t ? estagio(t) : -1;
  const cp = est >= 0 ? t.c + est : '';
  if (cp !== vis.cp){
    if (vis.planta){ scene.remove(vis.planta); const i = pickaveis.indexOf(vis.planta); if (i >= 0) pickaveis.splice(i, 1); }
    vis.planta = null;
    if (cp){
      vis.planta = colocar(malha(geo('planta' + cp, () => vPlanta(t.c, est).build(1 / 16, { origin: [8, 0, 8] }))), px, 2 / 16, pz);
      vis.planta.userData.alvo = { k: 'tile', x, z }; pickaveis.push(vis.planta);
      if (vis.cp && est > 0) vis.planta.scale.setScalar(0.6);
    }
    vis.cp = cp;
  }
  const temMato = t && t.e === 'plantado' && t.p === 'mato';
  if (temMato && !vis.mato) vis.mato = colocar(malha(geo('mato', () => vMato().build(1 / 16, { origin: [8, 0, 8] }))), px, 2 / 16, pz);
  if (!temMato && vis.mato){ scene.remove(vis.mato); vis.mato = null; }
  let b = '';
  if (t && t.e === 'plantado'){ if (t.p === 'sede') b = 'gota'; else if (t.p === 'mato') b = 'mato'; else if (t.prog >= 1) b = t.c; }
  if (b){
    if (!vis.bolha){ vis.bolha = novaBolha(b); vis.bolha.position.set(px, 1.0, pz); vis.bolha.userData.base = 1.0; vis.bolha.userData.fase = hash(x, z, 3) * 6; scene.add(vis.bolha); BOLHAS.push(vis.bolha); }
    else trocarBolha(vis.bolha, b);
    const alto = { milho: 1.2, tomate: 1.1 }[t.c] || 0.95;
    vis.bolha.userData.base = est >= 2 ? alto : 0.7;
  } else if (vis.bolha){ scene.remove(vis.bolha); BOLHAS.splice(BOLHAS.indexOf(vis.bolha), 1); vis.bolha = null; }
}

    const s = 1 / 57;
    const M = modelo || { corpo: () => vPorco(cor, bolso), braco: vBraco, pe: vPe, ombro: [15.5, 28.5, 1], quadril: [7, 9], mao: [-16, 1.5], altura: 1.32 };
    const op = { origin: [0.5, 0, 0.5], jitter: 0.015, ao: AO_SUAVE };
    this.g = new THREE.Group(); this.corpo = new THREE.Group(); this.g.add(this.corpo);
    const m = malha(geo('corpo' + nome, () => M.corpo().build(s, op)));
    this.corpo.add(m);
    const gb = geo('braco' + (modelo ? nome : ''), () => M.braco().build(s, op)), gp = geo('pe' + (modelo ? nome : ''), () => M.pe().build(s, op));
    const [ox, oy, oz] = M.ombro, [qx, qy] = M.quadril;
    this.bE = new THREE.Group(); this.bE.position.set(-ox * s, oy * s, oz * s); this.bE.add(malha(gb)); this.corpo.add(this.bE);
    this.bD = new THREE.Group(); this.bD.position.set(ox * s, oy * s, oz * s); this.bD.add(malha(gb)); this.corpo.add(this.bD);
    this.pE = new THREE.Group(); this.pE.position.set(-qx * s, qy * s, 0); this.pE.add(malha(gp)); this.g.add(this.pE);
    this.pD = new THREE.Group(); this.pD.position.set(qx * s, qy * s, 0); this.pD.add(malha(gp)); this.g.add(this.pD);
    this.mao = new THREE.Group(); this.mao.position.set(0, M.mao[0] * s, M.mao[1] * s); this.bD.add(this.mao);
    this.altura = M.altura; this.aceno = 0;
    this.ferramentas = {};
    this.pos = new THREE.Vector2(); this.pontos = []; this.vel = 2.7; this.ang = 0; this.angAlvo = 0; this.fase = 0; this.estado = 'parado';
    this.trab = null; this.aoChegar = null; this.pulo = 0;
    if (nome !== 'ed'){ this.g.traverse(o => { o.userData.alvo = { k: nome }; }); pickaveis.push(this.g); }
  }
  colocar(x, z){ this.pos.set(x, z); this.g.position.set(x, 0, z); }
  ir(pontos, aoChegar){ this.pontos = pontos.slice(); this.aoChegar = aoChegar; this.estado = this.pontos.length ? 'andando' : 'parado'; if (!this.pontos.length && aoChegar) aoChegar(); }
  olhar(x, z){ if (Math.hypot(x - this.pos.x, z - this.pos.y) > 0.01) this.angAlvo = Math.atan2(x - this.pos.x, z - this.pos.y); }
  ferramenta(n){
    for (const k in this.ferramentas) this.ferramentas[k].visible = false;
    if (!n) return;
    if (!this.ferramentas[n]){
      const fn = { enxada: vEnxada, regador: vRegador, cesta: vCesta, saco: vSaco }[n];
      const mm = malha(geo('ferr' + n, () => fn().build(1 / 19, { origin: [0.5, 0, 0.5] })));
      this.mao.add(mm); this.ferramentas[n] = mm;
    }
    this.ferramentas[n].visible = true;
  }
  trabalhar(dur, ferr, aoFim){ this.estado = 'trabalhando'; this.trab = { t: 0, dur, ferr, aoFim }; this.ferramenta(ferr); }
  update(dt, t){
    if (this.estado === 'andando'){
      const p = this.pontos[0];
      const dx = p[0] - this.pos.x, dz = p[1] - this.pos.y, d = Math.hypot(dx, dz);
      const passo = this.vel * dt;
      if (d <= passo){ this.pos.set(p[0], p[1]); this.pontos.shift(); if (!this.pontos.length){ this.estado = 'parado'; const cb = this.aoChegar; this.aoChegar = null; if (cb) cb(); } }
      else { this.pos.x += dx / d * passo; this.pos.y += dz / d * passo; this.angAlvo = Math.atan2(dx, dz); }
      this.fase += dt * 11;
    }
    this.ang = anguloPerto(this.ang, this.angAlvo, Math.min(1, dt * 12));
    this.g.position.set(this.pos.x, 0, this.pos.y);
    this.g.rotation.y = this.ang;
    const andando = this.estado === 'andando';
    const sw = andando ? Math.sin(this.fase) : 0;
    this.pE.rotation.x = sw * 0.7; this.pD.rotation.x = -sw * 0.7;
    this.bE.rotation.set(-sw * 0.6, 0, -0.65); this.bD.rotation.set(sw * 0.6, 0, 0.65);
    this.corpo.position.y = andando ? Math.abs(Math.sin(this.fase)) * 0.045 : 0;
    this.corpo.rotation.set(0, 0, andando ? Math.sin(this.fase) * 0.06 : 0);
    this.corpo.scale.set(1, 1 + (andando ? 0 : Math.sin(t * 2.4) * 0.015), 1);
    if (this.aceno > 0){ this.aceno -= dt; this.bD.rotation.set(-0.3, 0, 2.5 + Math.sin(t * 11) * 0.35); }
    if (this.pulo > 0){ this.pulo -= dt; this.corpo.position.y += Math.sin((1 - this.pulo / 0.45) * Math.PI) * 0.22; }
    if (this.estado === 'trabalhando'){
      const w = this.trab; w.t += dt;
      const k = w.t * 10;
      switch (w.ferr){
        case 'enxada': this.bD.rotation.set(-1.9 + Math.max(0, Math.sin(k)) * 1.6, 0, 0.25); this.corpo.rotation.x = 0.12 + Math.max(0, Math.sin(k)) * 0.12; break;
        case 'regador': this.bD.rotation.set(-1.1, 0, 0.35); this.mao.rotation.x = 0.5 + Math.sin(t * 6) * 0.15; break;
        case 'cesta': case null: this.corpo.rotation.x = 0.28 + Math.sin(k) * 0.08; this.bD.rotation.set(-1 + Math.sin(k) * 0.5, 0, 0.3); this.bE.rotation.set(-1 - Math.sin(k) * 0.5, 0, -0.3); break;
        case 'saco': this.bD.rotation.set(-1.2 + Math.sin(k * 0.8) * 0.5, 0, 0.3); this.bE.rotation.set(-0.9, 0, -0.4); break;
      }
      if (w.t >= w.dur){ this.estado = 'parado'; this.mao.rotation.x = 0; this.ferramenta(null); const cb = w.aoFim; this.trab = null; if (cb) cb(); }
    } else this.mao.rotation.x = 0;
  }
  topo(){ return new THREE.Vector3(this.pos.x, this.altura, this.pos.y); }
}

// animais
const ANI = [];
class Bicho {
  constructor(d){
    this.d = d;
    const s = d.tipo === 'galinha' ? 1 / 19 : 1 / 22;
    this.g = new THREE.Group();
    this.m = malha(geo(d.tipo, () => (d.tipo === 'galinha' ? vGalinha() : vVaca()).build(s, { origin: [0.5, 0, 0.5] })));
    this.g.add(this.m);
    this.g.traverse(o => { o.userData.alvo = { k: 'animal', a: this }; });
    pickaveis.push(this.g);
    scene.add(this.g);
    this.pos = new THREE.Vector2(d.x, d.z); this.alvo = null; this.espera = rnd(0.5, 3); this.ang = rnd(0, 6); this.fase = rnd(0, 6); this.res = null; this.bica = 0;
    this.bolha = null; this.atualizarBolha();
  }
  get pasto(){ return this.d.tipo === 'galinha' ? PASTO_G : PASTO_V; }
  atualizarBolha(){
    const n = this.d.e === 'fome' ? 'racao' : this.d.e === 'pronto' ? ANIMAIS[this.d.tipo].produto : '';
    if (n){
      if (!this.bolha){ this.bolha = novaBolha(n); this.bolha.userData.fase = rnd(0, 6); scene.add(this.bolha); BOLHAS.push(this.bolha); }
      else trocarBolha(this.bolha, n);
      this.bolha.userData.base = this.d.tipo === 'galinha' ? 1.05 : 1.45;
    } else if (this.bolha){ scene.remove(this.bolha); BOLHAS.splice(BOLHAS.indexOf(this.bolha), 1); this.bolha = null; }
  }
  update(dt, t){
    const vel = this.d.tipo === 'galinha' ? 0.9 : 0.45;
    if (!this.res){
      if (this.alvo){
        const dx = this.alvo[0] - this.pos.x, dz = this.alvo[1] - this.pos.y, d = Math.hypot(dx, dz);
        if (d < 0.05){ this.alvo = null; this.espera = rnd(1.2, this.d.tipo === 'galinha' ? 4 : 7); }
        else { const p = Math.min(d, vel * dt); this.pos.x += dx / d * p; this.pos.y += dz / d * p; this.ang = anguloPerto(this.ang, Math.atan2(dx, dz), Math.min(1, dt * 6)); this.fase += dt * (this.d.tipo === 'galinha' ? 16 : 7); }
      } else {
        this.espera -= dt;
        if (this.espera <= 0){
          const [tx, tz] = sorteia(this.pasto);
          this.alvo = [tx + rnd(0.2, 0.8), tz + rnd(0.2, 0.8)];
        }
        if (this.d.tipo === 'galinha' && Math.random() < dt * 0.4) this.bica = 0.5;
      }
    }
    this.bica = Math.max(0, this.bica - dt);
    const andando = !!this.alvo && !this.res;
    this.g.position.set(this.pos.x, andando ? Math.abs(Math.sin(this.fase)) * (this.d.tipo === 'galinha' ? 0.04 : 0.02) : 0, this.pos.y);
    this.g.rotation.y = this.ang;
    this.m.rotation.x = this.bica > 0 ? Math.sin(this.bica * Math.PI * 4) * 0.25 + 0.2 : 0;
    if (this.bolha) this.bolha.position.set(this.pos.x, this.bolha.position.y, this.pos.y);
    this.d.x = this.pos.x; this.d.z = this.pos.y;
  }
  remover(){ scene.remove(this.g); if (this.bolha){ scene.remove(this.bolha); BOLHAS.splice(BOLHAS.indexOf(this.bolha), 1); } }
}
function novoAnimal(tipoA, x, z){
  const d = { id: ++S.nAnimal, tipo: tipoA, e: 'fome', pronto: 0, x, z };
  S.animais.push(d);
  const a = new Bicho(d); ANI.push(a); return a;
}
let avisoSemRacao = 0;
function simularAnimais(){
  const agora = Date.now();
  let comeu = 0, falta = false;
  for (const a of ANI){
    if (a.d.e === 'produzindo' && agora >= a.d.pronto){ a.d.e = 'pronto'; a.atualizarBolha(); }
    if (a.d.e === 'fome' && !a.res && S.alimentador[a.d.tipo]){
      const A = ANIMAIS[a.d.tipo];
      if (S.racao >= A.racao){
        S.racao -= A.racao; a.d.e = 'produzindo'; a.d.pronto = agora + A.tempo * 1000; a.atualizarBolha(); comeu++;
        const m = ALIM_MALHA[a.d.tipo];
        if (m) for (let i = 0; i < 5; i++) particula(m.position.x - 0.4 + rnd(-0.2, 0.2), 0.3, m.position.z + rnd(-0.2, 0.2), [0xf5d142, 0xe2cfa0][i % 2], 0.8);
      } else falta = true;
    }
  }
  if (comeu){ hud(); chipPulsa('chipRacao'); }
  if (falta && agora - avisoSemRacao > 90000){ avisoSemRacao = agora; aviso('O alimentador automático ficou sem ração', 'ruim', 3.2); }
}
const ALIM_MALHA = {};
function montarAlimentador(tp){
  if (ALIM_MALHA[tp]) return;
  const A = ALIMENTADOR[tp];
  const m = colocar(malha(geo('alim' + tp, () => vAlimentador(tp === 'vaca').build(1 / 16, { origin: [8, 0, 8] }))), A.x + 0.5, 0, A.z + 0.5);
  m.userData.alvo = { k: 'alimentador', tp }; pickaveis.push(m); ALIM_MALHA[tp] = m;
  setT(A.x, A.z, 'feno');
  return m;
}
function comprarAlimentador(tp){
  const A = ALIMENTADOR[tp];
  if (S.alimentador[tp]) return;
  if (nivel() < A.nivel){ aviso(`O alimentador libera no nível ${A.nivel}`, 'ruim'); Som.erro(); return; }
  if (S.dinheiro < A.preco){ aviso('Dinheiro insuficiente', 'ruim'); Som.erro(); return; }
  gastar(A.preco); S.alimentador[tp] = true;
  const m = montarAlimentador(tp);
  for (let i = 0; i < 24; i++) particula(m.position.x + rnd(-0.5, 0.5), 0.4, m.position.z + rnd(-0.5, 0.5), [0xffffff, 0xffe066, 0xbac3cb][i % 3], 1.2);
  Som.moeda(); chipPulsa('chipDinheiro');
  aviso(`Alimentador automático no ${A.lugar}! Ele usa a ração do estoque.`, 'grande', 3.5);
  simularAnimais(); hud(); salvar();
}

let ed, beto, jaca, visita, caminhao;

const VISITA = {

const dadosVisita = () => VISITA[visita && visita === jaca ? 'jaca' : 'beto'];
let presenteJaca = '';
const caminhaoE = { estado: 'longe', x: -5, t: 0 };
const PARADA = 15.5, Z_ESTRADA = 17.5;
function construirPersonagens(){
  ed = new Porco(COR.ed, COR.edBolso, 'ed'); ed.colocar(6.5, 5.5); ed.ang = ed.angAlvo = 0.6; scene.add(ed.g);
  beto = new Porco(COR.beto, COR.betoBolso, 'beto'); beto.g.visible = false; scene.add(beto.g);
  jaca = new Porco(0, 0, 'jaca', { corpo: () => vJaca(false), braco: vBracoJaca, pe: vPeJaca, ombro: [11.5, 22, 2], quadril: [5.5, 7], mao: [-12, 1], altura: 1.1 });
  jaca.g.visible = false; jaca.vel = 2.3; scene.add(jaca.g);
  visita = beto;
  caminhao = malha(vCaminhao().build(1 / 16, { origin: [20, 0, 8.5] }));

  const tex = texturaTexto([['JOLI', 1, '#2f6fb3'], ['MARKET', 0.62, '#e0408a']], 512, 210, '#fdf8ef');
  for (const lado of [1, -1]){
    const pl = placaDeTexto(tex, 22 / 16, 9 / 16);
    pl.position.set((13.5 - 20) / 16, 16.5 / 16, lado * (8.6 / 16));
    if (lado < 0) pl.rotation.y = Math.PI;
    caminhao.add(pl);
  }
  caminhao.traverse(o => { o.userData.alvo = { k: 'caminhao' }; });

function chamarBeto(){
  if (caminhaoE.estado === 'aqui'){ abrirBeto(); return; }
  if (caminhaoE.estado !== 'longe'){ aviso('O caminhão do Joli Market já está a caminho!'); return; }
  visita = (S.visitas || 0) >= 1 && Math.random() < 0.3 ? jaca : beto;
  caminhaoE.estado = 'chegando'; caminhaoE.t = 0; caminhao.visible = true; caminhao.position.x = -5;
  Som.buzina(); aviso('Você ligou pro Joli Market. O caminhão já vem!'); hud();
  avancarTut(4);
}
function atualizarCaminhao(dt){
  const c = caminhaoE;
  if (c.estado === 'chegando'){
    c.t += dt / 4.2;
    const e = 1 - Math.pow(1 - Math.min(1, c.t), 3);
    caminhao.position.x = lerp(-5, PARADA, e);
    caminhao.position.y = Math.abs(Math.sin(c.t * 40)) * 0.015;
    if (c.t >= 1){
      c.estado = 'descendo'; caminhao.position.y = 0; Som.buzina();
      const v = visita, D = dadosVisita();
      v.g.visible = true; v.colocar(PARADA, 16.85); v.ang = v.angAlvo = Math.PI;
      v.ir([[PARADA, 16.4], [PARADA, 15.4]], () => {
        c.estado = 'aqui'; v.angAlvo = Math.PI; v.aceno = 1.6;
        S.visitas = (S.visitas || 0) + 1;
        if (v === jaca){
          if (!S.conheceuJaca){ S.conheceuJaca = true; aviso('Quem veio foi o Jaca, o melhor amigo e sócio do Beto!', 'grande', 3.5); }
          presenteJaca = darPresente();
          Som.jaca();
        } else Som.oinc();
        // o balão de chegada fica na tela o tempo de ler; a janela de venda só abre depois
        const txt = sorteia(D.chegada), dur = tempoDeLeitura(txt);
        falar(v, txt, dur + 0.3);
        hud(); salvar();
        setTimeout(() => { if (caminhaoE.estado === 'aqui' && visita === v && !algumaJanela()) abrirBeto(); }, dur * 1000);
      });
    }
  } else if (c.estado === 'despedindo'){
    // fica acenando até dar tempo de ler a despedida, e só então volta para o caminhão
    c.t -= dt;
    if (c.t <= 0){
      c.estado = 'voltando';
      const v = visita;
      v.ir([[PARADA, 16.4], [PARADA, 16.85]], () => { v.g.visible = false; caminhaoE.estado = 'saindo'; caminhaoE.t = 0; Som.buzina(); });
    }
  } else if (c.estado === 'saindo'){
    c.t += dt / 3.5;
    const e = Math.pow(Math.min(1, c.t), 2);
    caminhao.position.x = lerp(PARADA, 31, e);
    caminhao.position.y = Math.abs(Math.sin(c.t * 40)) * 0.015;
    if (c.t >= 1){ c.estado = 'longe'; caminhao.visible = false; hud(); }
  }
}
// segundos para ler um balão: uns 15 caracteres por segundo, entre 3 e 5,5 s
const tempoDeLeitura = txt => clamp(1.8 + txt.length * 0.065, 3, 5.5);
function despedirBeto(){
  if (caminhaoE.estado !== 'aqui') return;
  const txt = sorteia(dadosVisita().tchau);
  const dur = tempoDeLeitura(txt);
  caminhaoE.estado = 'despedindo'; caminhaoE.t = dur; hud();
  visita.angAlvo = Math.PI; visita.aceno = dur;
  falar(visita, txt, dur + 0.4);
}
// o Jaca sempre traz um presentinho: sementes de algo que o Ed já pode plantar, ou ração
function darPresente(){
  const n = nivel();
  if (ANI.length && Math.random() < 0.35){ S.racao += 5; chipPulsa('chipRacao'); flutuar(jaca.topo(), '+5', '', 'racao'); return 'Trouxe 5 rações de presente pros bichos!'; }
  const opc = ORDEM_CULTURAS.filter(k => CULTURAS[k].nivel <= n);
  const k = opc[Math.min(opc.length - 1, Math.floor(Math.random() * opc.length))], q = 3;
  S.bolsa[k] = (S.bolsa[k] || 0) + q;
  flutuar(jaca.topo(), '+' + q, '', k);
  return `Trouxe ${q} sementes de ${CULTURAS[k].nome.toLowerCase()} de presente pra você!`;
}

const DUR = { arar: 1.1, plantar: 0.7, regar: 1.0, capinar: 0.9, colher: 0.7, alimentar: 0.9, coletar: 0.6, arrancar: 0.8, andar: 0 };
const FERR = { arar: 'enxada', plantar: null, regar: 'regador', capinar: null, colher: 'cesta', alimentar: 'saco', coletar: 'cesta', arrancar: null, andar: null };

// diz se a ação vale para o alvo; devolve o custo ou um motivo
function checar(tipoA, alvo, param){
  if (alvo.k === 'animal'){
    const a = alvo.a, A = ANIMAIS[a.d.tipo];
    if (tipoA === 'alimentar'){ if (a.d.e !== 'fome') return { ok: false }; if (S.racao < A.racao) return { ok: false, motivo: `Falta ração (precisa de ${A.racao})` }; return { ok: true, custo: { racao: A.racao } }; }
    if (tipoA === 'coletar') return { ok: a.d.e === 'pronto', custo: {} };
    return { ok: false };
  }
  if (tipoA === 'andar') return { ok: true, custo: {} };

  switch (tipoA){
    case 'arar': return { ok: t.e === 'grama', custo: {} };
    case 'plantar': {

const marcadores = [];

function alvoMundo(alvo){ return alvo.k === 'animal' ? [alvo.a.pos.x, alvo.a.pos.y] : [alvo.x + 0.5, alvo.z + 0.5]; }

  tarefaAtual = tarefa;
  const [tx, tz] = alvoMundo(tarefa.alvo);
  const sx = clamp(Math.floor(ed.pos.x), 0, W - 1), sz = clamp(Math.floor(ed.pos.y), 0, H - 1);
  let gx = Math.floor(tx), gz = Math.floor(tz);

  const cor = { arar: [0x8a5c3a, 0xa47448], regar: [0x6fc3f5, 0xa8dcfa], capinar: [0x3f7a2a, 0x5a9e3c], colher: [0xffe066, 0xffffff], plantar: [0x5e3a22], alimentar: [0xf5d142, 0xe2cfa0], arrancar: [0x6cbf47, 0x8a5c3a] }[tarefa.tipo] || [0xffffff];
  for (let i = 0; i < n; i++) setTimeout(() => particula(x + rnd(-0.3, 0.3), tarefa.tipo === 'regar' ? 0.7 : 0.15, z + rnd(-0.3, 0.3), cor[i % cor.length], tarefa.tipo === 'regar' ? -0.5 : 1.4), i * 45);

function executar(tarefa){
  const alvo = tarefa.alvo, tp = tarefa.tipo;

    const a = alvo.a, A = ANIMAIS[a.d.tipo], pos = new THREE.Vector3(a.pos.x, 0.9, a.pos.y);
    if (tp === 'alimentar'){ a.d.e = 'produzindo'; a.d.pronto = Date.now() + A.tempo * 1000; ganharXP(1, pos); a.d.tipo === 'galinha' ? Som.co() : Som.muu(); avancarTut(2); }

function produtosLiberados(){ const n = nivel(); return ORDEM_PRODUTOS.filter(p => PRODUTOS[p].nivel <= n); }
function novoPedido(){
  const n = nivel(), disp = produtosLiberados();

  let valor = 0;
  const itens = escolhidos.map(p => { const q = Math.max(1, Math.round((22 + n * 14) / PRODUTOS[p].venda * rnd(0.6, 1))); valor += q * PRODUTOS[p].venda; return [p, q]; });

  addEventListener('keydown', e => {
    if (e.key === 'Escape'){ if (algumaJanela()) fecharJanela(); else if (menuAberto) fecharMenu(); else if (modo) desligarModo(); return; }
    if (algumaJanela() || e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase(), passo = 30;
    if (k === 'q') girar(-1); else if (k === 'e') girar(1);
    else if (k === '+' || k === '=') zoom(0.85); else if (k === '-') zoom(1.18);
    else if (k === 'arrowleft' || k === 'a') arrastar(passo, 0); else if (k === 'arrowright' || k === 'd') arrastar(-passo, 0);
    else if (k === 'arrowup' || k === 'w') arrastar(0, passo); else if (k === 'arrowdown' || k === 's') arrastar(0, -passo);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) salvar(); });
  addEventListener('pagehide', salvar);
}
function arrastar(dx, dy){
  const k = cam.vista / innerHeight;
  const rx = Math.cos(cam.az), rz = -Math.sin(cam.az), fx = -Math.sin(cam.az), fz = -Math.cos(cam.az);
  cam.alvo.x += -rx * dx * k + fx * dy * k / Math.sin(cam.el);
  cam.alvo.z += -rz * dx * k + fz * dy * k / Math.sin(cam.el);
  cam.alvo.x = clamp(cam.alvo.x, 0, W); cam.alvo.z = clamp(cam.alvo.z, 0, H);
  if (menuAberto) fecharMenu();
}
function zoom(f){ cam.vista = clamp(cam.vista * f, 5, 26); }
function girar(s){ cam.azAlvo += s * Math.PI / 2; fecharMenu(); Som.clique(); }

// ================= laço principal
let ultimoReal = Date.now(), ultimoQuadro = performance.now(), tSalvo = 0;
function simular(dt){
  for (const k in S.campo){
    const t = S.campo[k];
    if (t.e !== 'plantado') continue;
    const ep = estagio(t), pp = t.p;
    avancar(t, dt);
    if (estagio(t) !== ep || t.p !== pp){ const [x, z] = k.split(',').map(Number); atualizarCampo(x, z); }
  }
  simularAnimais();
}
function quadro(agoraP){
  requestAnimationFrame(quadro);
  const agora = Date.now();
  const real = Math.max(0, (agora - ultimoReal) / 1000); ultimoReal = agora;
  simular(real);
  const dt = Math.min(0.1, (agoraP - ultimoQuadro) / 1000); ultimoQuadro = agoraP;
  const t = agoraP / 1000;
  cam.az = lerp(cam.az, cam.azAlvo, Math.min(1, dt * 9));
  posicionarCamera();
  proximaTarefa();
  ed.update(dt, t);
  if (beto.g.visible) beto.update(dt, t);
  if (jaca.g.visible) jaca.update(dt, t);
  atualizarCaminhao(dt);
  for (const a of ANI) a.update(dt, t);
  for (const b of BOLHAS){ b.position.y = b.userData.base + Math.sin(t * 3 + (b.userData.fase || 0)) * 0.04; }
  marcadores.forEach((m, i) => { const tf = fila.find(f => f.marca === m); if (!tf) return; const [x, z] = alvoMundo(tf.alvo); m.position.set(x, 1.15 + Math.sin(t * 5 + i) * 0.05, z); m.rotation.y = t * 2; });
  for (const k in VIS){ const p = VIS[k].planta; if (p && p.scale.x < 1) p.scale.setScalar(Math.min(1, p.scale.x + dt * 2.5)); }
  atualizarParticulas(dt);
  atualizarFalas();
  if (menuAberto && (menuAberto.alvo.k === 'tile' || menuAberto.alvo.k === 'animal') && Math.floor(t * 2) !== Math.floor((t - dt) * 2)) atualizarEstadoMenu();
  tSalvo += dt; if (tSalvo > 6){ tSalvo = 0; salvar(); }
  renderer.render(scene, camera);
}
function atualizarEstadoMenu(){
  const r = itensDoAlvo(menuAberto.alvo);
  if (!r) return;
  const e = $('menu').querySelector('.estado'), p = $('menu').querySelector('.prog i');
  if (e && r.estado && e.textContent !== r.estado){
    if (r.itens.length !== menuAberto.r.itens.length){ const m = $('menu'); abrirMenu(menuAberto.alvo, parseFloat(m.style.left) - 14, parseFloat(m.style.top) + 20); return; }
    e.textContent = r.estado;
  }
  if (p && r.prog != null) p.style.width = Math.round(clamp(r.prog, 0, 1) * 100) + '%';
}

// ================= início
async function iniciar(){
  try {
    if (document.fonts && document.fonts.load) await Promise.race([Promise.all([document.fonts.load('40px "Bagel Fat One"'), document.fonts.load('700 14px Rubik')]), new Promise(r => setTimeout(r, 1500))]);
  } catch (e){}
  try { iniciarRender(); }
  catch (e){ $('carregando').hidden = true; $('erro').textContent = 'Seu navegador não conseguiu abrir o WebGL, que o jogo usa para desenhar a fazenda.'; $('erro').hidden = false; return; }
  gerarIcones();
  document.querySelectorAll('img[data-icone]').forEach(i => { i.src = icone(i.dataset.icone); });
  montarMapa();
  const novo = carregar();
  scene.add(marcaSel); scene.add(marcaHover);
  construirChao();
  construirCenario();
  montarLotes();
  construirPersonagens();
  for (const tp in ALIMENTADOR) if (S.alimentador[tp]) montarAlimentador(tp);
  for (const d of S.animais){ if (d.x < 17 || d.x > 22){ const [x, z] = sorteia(d.tipo === 'galinha' ? PASTO_G : PASTO_V); d.x = x + 0.5; d.z = z + 0.5; } ANI.push(new Bicho(d)); }
  if (novo){ novoAnimal('galinha', 18.6, 8.4); novoAnimal('galinha', 19.4, 7.6); novoPedido(); }
  // o tempo que passou com a página fechada
  const fora = novo ? 0 : Math.max(0, (Date.now() - (S.salvoEm || Date.now())) / 1000);
  for (const k in S.campo){ const t = S.campo[k]; if (t.e === 'plantado') avancar(t, fora); }
  simularAnimais();
  for (const k in S.campo){ const [x, z] = k.split(',').map(Number); atualizarCampo(x, z); }
  for (const a of ANI) a.atualizarBolha();
  eventos();
  hud(); atualizarDica();
  $('carregando').hidden = true;
  ultimoReal = Date.now();
  requestAnimationFrame(quadro);
  if (novo) setTimeout(() => mostrarAjuda(true), 300);
  else if (fora > 60) setTimeout(() => aviso('A fazenda continuou crescendo enquanto você estava fora!'), 400);
  window.__fazenda = { jaca: () => jaca, visita: () => visita, despedirBeto, cam, alvoNaTela, comprarAlimentador, abrirCaderno, simularAnimais, S: () => S, ed: () => ed, fila, ANI, chamarBeto, abrirBeto, tela, campo, executar, simular, caminhaoE };
}
iniciar();
})();
